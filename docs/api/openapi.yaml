      tags: [consult-requests]
      summary: 내 상담 신청 상세
      description: |
        본인 상담이 아니면 `404` (남의 상담 존재 여부를 흘리지 않는다).

        🚧 **지금 이 오퍼레이션을 읽는 화면이 없다.** 2026-10-13(요청 08)에 상담 알림의 이동 대상이
        **마이페이지 상담 내역 목록**(`GET /me/consult-requests` + `relatedId` 로 그 행을 강조)으로
        정해졌다 — 목록 화면이 이미 한 상담에 필요한 것을 모두 그리므로 상세 조회가 한 번 더 필요하지
        않다. 상담 **상세 화면**이 생기는 날 이 오퍼레이션이 그 화면의 것이 된다.
        (처음 이 오퍼레이션을 둔 근거는 "알림이 병원 상세로 가는 결함" 이었는데, 그 결함은
