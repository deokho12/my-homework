      🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안).** 파일 업로드 (사업자등록증).
      반영 전까지 확정 계약이 아니다 — `docs/api/README.md` §20 참고

security: []

paths:
  # =========================================================================
  # auth
  # =========================================================================
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: 회원가입
      description: |
        가입 성공 시 곧바로 로그인 상태가 된다 (액세스/리프레시 토큰을 함께 내려준다).
        현재 화면 동작을 그대로 유지한 것이다 — `docs/features/signup.md`.

        서버가 다듬는 값:
        - `email` — 앞뒤 공백 제거 + 소문자 변환 후 저장·비교
        - `name` — 앞뒤 공백 제거

        현재 프론트엔드가 검사하지 않는 것을 서버가 검사한다: 이메일 형식(RFC 5322 완화형),
        비밀번호 6자 이상. 형식 위반은 `422 VALIDATION_FAILED`, 중복 이메일은 `409 EMAIL_ALREADY_REGISTERED`.
      x-screens: [signup.md]
      x-screen-status: "✅"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: 가입 완료 + 로그인 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '409':
          description: 이미 가입된 이메일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: EMAIL_ALREADY_REGISTERED
                  message: 이미 가입된 이메일이에요
                  requestId: 01J9X8V0Q3
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/signup/hospital-admin:
    post:
      operationId: signUpAsHospitalAdmin
      tags: [auth]
      summary: '🚧 [제안] 병원 관리자 직접 가입'
      x-proposal: 제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안)
      description: |
        > 🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안).**
        > **이것은 확정 계약이 아니다.** `docs/decisions/0001-roles-and-pii.md` **결정 2**
        > (지금은 "병원 관리자 계정은 운영자가 만든다")가 개정되어야 성립한다. 그 문서의
        > `변경 제안` 소절이 합의되기 전까지 **구현을 시작하지 않는다.**
        > 데이터 설계는 `docs/database/README.md` **§14**, 계약 판단은 `docs/api/README.md` **§20**.

        회원가입 화면의 `치과 관계자이신가요?` 토글을 켠 제출
        (`docs/features/requests/2026-10-12-06-병원관리자-직접가입.md`).
        가입 한 번으로 **계정 · 병원 · 담당자 연결 · 서류 주인 확정 · 약관 동의 4종**이 생기고,
        성공 시 곧바로 로그인 상태가 된다 (일반 가입과 같다).

        **`POST /auth/signup` 을 확장하지 않고 오퍼레이션을 나눈 이유** (판단, §20):

        1. **토글에 따라 required 가 달라진다.** 한 스키마에 담으면 `oneOf` + discriminator 가
           필요하고, 그 순간 `422` 의 `details[].field` 경로가 **어느 가지의 경로인지** 흐려진다.
           이 폼은 필드가 10개가 넘고 화면이 칸마다 오류를 붙여야 한다 (§11 의 `details` 규약).
        2. **일반 가입 흐름을 한 글자도 건드리지 않는다** — 요청서가 지킨 것이다
           ("토글을 끈 상태에서 지금과 똑같이 동작").
        3. **일어날 수 없는 에러가 계약에 섞이지 않는다.** `UPLOAD_NOT_FOUND`·`AGREEMENT_*` 는
           일반 가입에서 영원히 발생하지 않는다. 한 오퍼레이션에 모아 두면 클라이언트가
           "이 코드가 내게 올 수 있는가" 를 계약에서 읽어낼 수 없다.
        4. 요청 한도도 다르다 (서류 업로드가 선행하는 경로라 더 조인다).

        비용은 `name`/`email`/`password` 세 필드의 중복이다. 그 값이면 싸다 —
        둘은 **같은 폼의 두 제출 경로**이고, 클라이언트는 제출 시점에 토글 값을 이미 안다.

        **`operator` 계정은 이 경로를 쓸 수 없다** (애초에 비인증 경로이고, 가입은 항상
        `role='hospital_admin'` 인 **새 계정**을 만든다). 이미 가입된 이메일이면 `409` 다 —
        기존 계정을 이 경로로 승격시키지 않는다. 승격은 `POST /hospitals/{id}/admins` 그대로다.

        **서버가 정하는 값** (요청으로 넘길 수 없다):
        - `user.role = 'hospital_admin'`, `user.provider = 'email'`
        - `hospital.approvalStatus` — 설정 플래그 `HOSPITAL_AUTO_APPROVE` 가 정한다
          (dev 기본 `approved`, prod 기본 `pending` — DB §14.11). **요청이 고를 수 없다.**
        - `hospital.region` — **요청 본문에 없다.** 가입 폼에 지역 칸이 없고 `region` 은 NOT NULL 이라,
          서버가 주소에서 파생한다 (`GET /geo/address-search` 의 `region` → 없으면 주소 문자열 파싱).
          ⚠️ **열린 질문** — 주소 검색 응답에 지역이 실리는지 확인해야 한다 (DB §14.17-7, §20).
        - 집계·광고 필드 전부 (`POST /hospitals` 와 같다)

        **한 트랜잭션이다** (DB §14.5). 중간 실패는 "담당 병원 0곳인 `hospital_admin`",
        "주인 없는 병원 행", "동의 없이 가입된 계정" 을 만든다. **파일 바이트만 트랜잭션 밖**이고
        (객체 저장소 쓰기는 롤백되지 않는다), 트랜잭션 안에서는 메타행을 **조건부 UPDATE 로 claim**
        한다 — 깨지는 방향이 한쪽(주인 없는 파일이 남는 쪽)으로만 고정된다.

        **약관은 4종 필수**다 — `terms`·`privacy`·`location`·`partner-terms`
        (`requiredAgreementSlugs('hospital_admin')`, DB §14.8). 하나라도 빠지면 `422`.
        **`POST /auth/signup`(일반)에 `partner-terms` 가 섞여 오면 그쪽도 `422`** 다 —
        동의할 이유가 없는 약관에 동의한 기록을 만들지 않는다. 그래서 두 오퍼레이션의
        `slug` enum 이 서로 다르다.

        **승인 전에도 관리자 화면을 쓴다. 환자 앱에는 병원이 보이지 않는다** (`isPubliclyListed`,
        DB §14.4). 그 판정이 걸리는 공개 오퍼레이션 목록은 §20 에 있다.
      x-screens: [signup.md, login.md]
      x-screen-status: "🚧"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HospitalAdminSignUpRequest'
            example:
              name: 김원장
              email: director@smile-dental.kr
              password: s3cret!
              position: director
              businessRegistrationFileId: up_01J9X8V0Q3
              hospital:
                name: 강남 스마일 치과
                phone: 02-1234-5678
                address: 서울 강남구 테헤란로 152
                addressDetail: 3층 301호
                latitude: 37.500613
                longitude: 127.036431
              agreedTermsVersions:
                - slug: terms
                  version: '1.0'
                - slug: privacy
                  version: '1.0'
                - slug: location
                  version: '1.0'
                - slug: partner-terms
                  version: '1.0'
      responses:
        '201':
          description: |
            가입 완료 + 로그인 상태. 기존 `AuthSession`(토큰 + 사용자) 에 **만들어진 병원 한 조각**이
            붙는다 — 완료 화면이 `병원 정보 입력하기`(`hospital.id` 로 이동)와 상태 안내
            (`approvalStatus`)를 **추가 조회 없이** 그려야 하기 때문이다.
            병원 전체(`Hospital`)를 내려보내지 않는 이유: 그 값은 방금 보낸 입력이고,
            화면이 필요한 것은 id 와 상태 둘뿐이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalAdminAuthSession'
        '409':
          description: |
            이미 가입된 이메일. **코드는 일반 가입과 같은 `EMAIL_ALREADY_REGISTERED` 다** —
            db-master 가 넘긴 목록은 `EMAIL_TAKEN` 이었으나, 같은 사실에 코드를 둘 두면
            화면이 두 문구 사전을 들게 된다 (§11 의 "`message` 를 그대로 보여준다" 가 깨진다).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: EMAIL_ALREADY_REGISTERED
                  message: 이미 가입된 이메일이에요
                  requestId: 01J9X8V0Q3
        '422':
          description: |
            검증 실패. 네 종류가 같은 `422` 안에서 `code` 로 갈린다 — 화면이 어디를 가리킬지
            알아야 해서 `details[].field` 로 자리를 짚어 준다.

            | `code` | 언제 |
            |---|---|
            | `VALIDATION_FAILED` | 형식·길이·좌표 누락 등 일반 검증 |
            | `UPLOAD_NOT_FOUND` | `businessRegistrationFileId` 가 없거나, 이미 주인이 있거나, 용도가 `business_registration` 이 아니거나, 파기된 파일 |
            | `AGREEMENT_REQUIRED` | 필수 약관 4종 중 누락. 또는 목록에 없는 slug 가 섞임 |
            | `AGREEMENT_VERSION_NOT_FOUND` | slug 는 맞는데 서버가 모르는 버전 |

            **`UPLOAD_NOT_FOUND` 가 `404` 가 아닌 이유**: 없는 리소스를 요청한 것이 아니라
            **요청 본문의 한 필드 값이 규칙을 어긴 것**이다. 화면은 업로드 칸에 오류를 붙이고
            다시 올리게 해야 한다 (§11 의 `400` vs `422` 구분과 같은 기준).
            네 경우를 한 코드로 합친 것도 의도다 — "남의 업로드 id 를 찍었다" 와 "만료됐다" 를
            구분해 주면 id 대입으로 **다른 사람이 서류를 올렸는지** 알 수 있다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                uploadNotFound:
                  summary: 사업자등록증 파일을 찾을 수 없음
                  value:
                    error:
                      code: UPLOAD_NOT_FOUND
                      message: 사업자등록증을 다시 첨부해주세요
                      details:
                        - field: businessRegistrationFileId
                          code: UPLOAD_NOT_FOUND
                          message: 사업자등록증을 다시 첨부해주세요
                      requestId: 01J9X8V0Q3
                agreementRequired:
                  summary: 파트너 약관 미동의
                  value:
                    error:
                      code: AGREEMENT_REQUIRED
                      message: 필수 약관에 모두 동의해야 가입할 수 있어요
                      details:
                        - field: agreedTermsVersions
                          code: AGREEMENT_REQUIRED
                          message: '[필수] 병원 파트너 이용약관에 동의해주세요'
                      requestId: 01J9X8V0Q3
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: 로그인
      description: |
        이메일·비밀번호 중 무엇이 틀렸는지 구분하지 않는다. 두 경우 모두 `401 INVALID_CREDENTIALS` +
        동일 문구(`이메일 또는 비밀번호가 올바르지 않아요`)를 반환한다. 계정 존재 여부가 새는 것을 막기 위한 것이고,
        현재 화면 문구와도 일치한다 — `docs/features/login.md`.
      x-screens: [login.md, mypage.md]
      x-screen-status: "✅"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: 이메일 또는 비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: 이메일 또는 비밀번호가 올바르지 않아요
                  requestId: 01J9X8V0Q3
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      operationId: refreshTokens
      tags: [auth]
      summary: 액세스 토큰 재발급
      description: |
        리프레시 토큰을 **본문으로** 받는다. 쿠키를 쓰지 않으므로 Flutter 앱도 같은 흐름을 쓴다.

        회전(rotation)한다: 호출마다 새 리프레시 토큰을 발급하고 기존 것을 폐기한다.
        폐기된 토큰이 다시 오면 그 계정의 리프레시 토큰 계열 전체를 무효화하고 `401 REFRESH_TOKEN_REUSED` 를 반환한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 재발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: 리프레시 토큰이 유효하지 않거나 폐기됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      summary: 로그아웃
      description: 전달한 리프레시 토큰을 폐기한다. 액세스 토큰은 만료까지 유효하므로 클라이언트가 즉시 폐기한다.
      x-screens: [mypage.md]
      x-screen-status: "✅"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '204':
          description: 로그아웃 완료
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: 내 정보
      description: |
        앱 부팅 시 세션 복원용. `role` 과 `managedHospitalIds` 가 여기서 온다 —
        관리자 화면 진입 가드가 클라이언트 추측이 아니라 이 응답을 근거로 동작해야 한다.

        화면 분기에 그대로 쓸 수 있다:
        - `role=operator` → `/admin/specialists`, `/admin/hospital/new` 노출, `/admin` 은 전 병원
        - `role=hospital_admin` → 위 두 화면 숨김, `/admin` 은 `managedHospitalIds` 만
        - `role=user` → 마이페이지의 `병원 담당자이신가요? 관리자 페이지` 링크 자체를 숨긴다
          (지금은 로그인 여부와 무관하게 노출되어 우연히 들어가는 것이 가능하다)

        `managedHospitalIds` 를 JWT 클레임에 넣지 않는 이유: 담당 병원이 바뀌었을 때 토큰이 만료될 때까지
        낡은 값이 살아 있게 된다. 토큰에는 `sub` 와 `role` 만 넣고, 담당 검사는 서버가 매 요청
        `hospital_admins` 조회로 판단한다. `role` 자체는 승격·해제 시 리프레시 토큰을 폐기해 즉시 반영한다.
      x-screens: [mypage.md, admin-home.md]
      x-screen-status: "✅"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 현재 로그인한 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/social/{provider}:
    post:
      operationId: logInWithSocialProvider
      tags: [auth]
      summary: 간편 로그인 (구글·카카오)
      description: |
        🚧 **아직 화면이 버튼만 있는 상태다** (`준비중이에요` 알림창). 엔드포인트를 미리 설계해 둔다.

        클라이언트가 provider SDK 로 받은 인가 코드를 넘기고, 서버가 provider 에 교환 요청한 뒤
        이메일 기준으로 기존 계정과 연결하거나 새 계정을 만든다. 같은 이메일이 다른 provider 로
        이미 가입돼 있으면 `409 PROVIDER_MISMATCH` — 계정 탈취 경로를 막기 위해 자동 병합하지 않는다.
      x-screens: [login.md]
      x-screen-status: "🚧"
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, kakao]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorizationCode, redirectUri]
              properties:
                authorizationCode:
                  type: string
                redirectUri:
                  type: string
                  format: uri
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '409':
          description: 같은 이메일이 다른 방식으로 이미 가입됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: provider 응답 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =========================================================================
  # procedures
  # =========================================================================
  /procedures:
    get:
      operationId: listProcedures
      tags: [procedures]
      summary: 시술 목록 (13종)
      description: |
        홈의 `시술로 찾기` 격자, 병원 탐색의 시술 칩, 커뮤니티 질문 작성의 시술 선택,
        상담 신청의 희망 시술이 **모두 이 하나의 목록**을 쓴다 (화면 문서 3곳이 명시적으로 같은 목록이라고 못박고 있다).

        정렬 순서는 서버가 고정한다: `implant → orthodontics → laminate → inlay → crown → whitening →
        wisdom-tooth → cavity → gum-disease → splint → snoring-device → tmj → botox`.
        병원 탐색의 `추천`·`기타` 칩은 시술이 아니라 특수 탭이므로 여기 포함되지 않는다.

        거의 변하지 않는 마스터 데이터라 `Cache-Control: public, max-age=3600` + ETag 를 붙인다.
      x-screens: [home.md, explore.md, community-new.md, consult-request.md, tip-detail.md]
      x-screen-status: "✅"
      responses:
        '200':
          description: 시술 목록
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Procedure'

  # =========================================================================
  # hospitals
  # =========================================================================
  /hospitals:
    get:
      operationId: listHospitals
      tags: [hospitals]
      summary: 병원 목록 (필터·정렬·페이지네이션)
      description: |
        병원 탐색 화면의 **필터·정렬 전체가 이 엔드포인트 하나로 표현된다.**
        `docs/features/explore.md` 의 모드 2 / 시술 칩 15 / 정렬 3 / 조건 칩 5 / 지도 반경 4 대응:

        | 화면 요소 | 파라미터 |
        |---|---|
        | 모드 `병원` | 이 엔드포인트 (모드 `의사` 는 `GET /doctors`) |
        | 시술 칩 `추천` | `recommended=true` |
        | 시술 칩 13개 | `procedureId=implant` |
        | 시술 칩 `기타` (= 전체) | 아무 것도 안 보냄 |
        | 정렬 `인기순` | `sort=rating` (기본값) |
        | 정렬 `후기순` | `sort=reviewCount` |
        | 정렬 `상담많은순` | `sort=consultCount` |
        | 조건 `상담가능` | `consultAvailable=true` |
        | 조건 `원데이` | `oneDay=true` |
        | 조건 `전문의` | `hasVerifiedSpecialist=true` |
        | 조건 `진료시간` (실제로는 야간상담) | `nightConsult=true` |
        | 조건 `경력` | `minDoctorYearsOfExperience=10` |
        | 지도 반경 500m/1km/3km/5km | `latitude` + `longitude` + `radiusKm` |
        | 보기 `리스트`/`지도`/`가격 비교표` | 순수 클라이언트 표현. 파라미터 없음 |

        **스폰서(광고) 노출 순서는 서버가 계산해서 이미 정렬된 배열로 내려준다.** 클라이언트가 다시 정렬하면 안 된다.
        규칙(`backend/src/hospital/sponsorship.ts` 에 있다. 예전 `frontend/src/utils/sponsorship.ts`
        의 규칙을 그대로 옮긴 것이고, 그 파일은 삭제됐다):

        1. `procedureId` 지정 시: 광고 기간 중 && `sponsoredCategories` 에 그 시술 포함 && `rating >= 3.5`
        2. `recommended=true` 시: 광고 기간 중 && `rating >= 3.5`
        3. 위 대상들을 `sponsoredRank` 오름차순으로 맨 앞에 배치, 나머지는 `sort` 기준
        4. **필터가 없을 때(`기타`)는 광고 우선 노출을 적용하지 않는다**

        `광고` 배지 조건과 상단 노출 조건은 다르다. 배지는 `sponsorship.isActive`(기간만),
        상단 노출은 `sponsorship.isPlacementEligible`(기간 + 평점 3.5 + 카테고리). 두 값을 각각 내려준다 —
        클라이언트가 오늘 날짜로 기간을 계산하면 기기 시계가 틀린 사용자에게 광고가 잘못 노출된다.

        `sponsoredRank` / `sponsoredStartDate` / `sponsoredEndDate` 원본 필드도 함께 유지한다
        (기존 `Hospital` 타입 보존). 다만 정렬 판단에는 `sponsorship` 계산 필드를 쓴다.
      x-screens: [explore.md, home.md, mypage.md, tip-detail.md, admin-home.md]
      x-screen-status: "✅ 🟡"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: procedureId
          in: query
          description: 이 시술을 취급하는 병원만. 병원 탐색의 시술 칩 13개.
          schema:
            $ref: '#/components/schemas/ProcedureId'
        - name: recommended
          in: query
          description: 운영자가 추천으로 표시한 병원만. 시술 칩 `추천`.
          schema:
            type: boolean
        - name: consultAvailable
          in: query
          description: 조건 칩 `상담가능`.
          schema:
            type: boolean
        - name: oneDay
          in: query
          description: 조건 칩 `원데이` (당일 보철 가능).
          schema:
            type: boolean
        - name: hasVerifiedSpecialist
          in: query
          description: |
            조건 칩 `전문의`. 인증 완료(`approved`)이고 `일반의` 가 아닌 전문의가 1명 이상 있는 병원만.
            병원↔전문의 조인이 필요해 클라이언트에서 처리할 수 없다.
          schema:
            type: boolean
        - name: nightConsult
          in: query
          description: 조건 칩 `진료시간`. 이름과 달리 실제로는 야간상담 가능 여부다 (`features.nightConsult`).
          schema:
            type: boolean
        - name: minDoctorYearsOfExperience
          in: query
          description: 조건 칩 `경력`. 이 연차 이상인 전문의가 1명 이상 있는 병원만. 화면은 항상 `10` 을 보낸다.
          schema:
            type: integer
            minimum: 0
        - name: sort
          in: query
          description: |
            전부 내림차순이다. `rating` 이 화면의 `인기순` — 별도 인기 지표가 없어 평점을 쓴다.
          schema:
            type: string
            enum: [rating, reviewCount, consultCount]
            default: rating
        - name: latitude
          in: query
          description: 지도 보기의 기준 위도. `longitude`·`radiusKm` 와 함께 보내야 한다.
          schema:
            type: number
            format: double
        - name: longitude
          in: query
          schema:
            type: number
            format: double
        - name: radiusKm
          in: query
          description: 지도 반경 버튼 (`500m`=0.5, `1km`, `3km` 기본, `5km`).
          schema:
            type: number
            format: double
            enum: [0.5, 1, 3, 5]
        - name: q
          in: query
          description: |
            병원명 부분 일치. 관리자 홈의 병원 목록 검색(🚧)과 검색 화면이 쓴다.
            대소문자를 구분하지 않고 공백을 정규화한다.
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: |
            조건에 맞는 병원. 스폰서 우선 노출이 이미 적용된 순서다.
