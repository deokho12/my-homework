  # =========================================================================
  # favorites
  # =========================================================================
  /me/favorites:
    get:
      operationId: listMyFavorites
      tags: [favorites]
      summary: 내 찜 목록
      description: |
        **계정별 찜 목록이다.** 지금은 브라우저 하나에 목록이 하나뿐이라
        A 계정으로 찜 → 로그아웃 → B 계정 로그인 하면 A 의 찜이 B 에게 그대로 보인다.
        토큰 주체로 스코프하는 것이 그 결함의 해결책이다.

        기본 응답은 `hospitalIds` 뿐이다. 마이페이지가 병원 카드를 그리려면 병원 데이터가 필요하지만,
        `?expand=hospital` 로 선택하게 두었다. 하트 표시(찜 여부)만 필요한 화면(병원 상세, 꿀팁 상세)이
        병원 객체를 통째로 다시 받는 것을 피하기 위한 것이다.

        찜한 병원이 삭제되면 그 id 는 응답에서 조용히 빠진다.
      x-screens: [mypage.md, hospital-detail.md, tip-detail.md]
      x-screen-status: "✅ 🔒"
      x-role: user
      security:
        - bearerAuth: []
      parameters:
        - name: expand
          in: query
          description: '`hospital` 을 주면 `hospitals` 배열이 함께 내려간다 (마이페이지 카드 목록용).'
          schema:
            type: string
            enum: [hospital]
      responses:
        '200':
          description: 찜 목록. 최근에 찜한 것이 먼저.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteList'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/favorites/{hospitalId}:
    parameters:
      - $ref: '#/components/parameters/HospitalId'
    put:
      operationId: addFavorite
      tags: [favorites]
      summary: 찜하기
      description: |
        멱등이다. 이미 찜한 병원에 다시 호출해도 `204` 다.
        `POST /me/favorites` 대신 `PUT /me/favorites/{hospitalId}` 를 쓴 이유가 이 멱등성이다 —
        하트는 오탭이 잦고, 클라이언트가 낙관적 갱신을 하면 같은 요청이 두 번 갈 수 있다.
      x-screens: [hospital-detail.md, tip-detail.md]
      x-screen-status: "✅ 🔒"
      x-role: user
      security:
        - bearerAuth: []
      responses:
        '204':
          description: 찜 완료 (이미 찜한 상태여도 동일)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/HospitalNotFound'
    delete:
      operationId: removeFavorite
      tags: [favorites]
      summary: 찜 해제
      description: 멱등이다. 찜하지 않은 병원에 호출해도 `204` 다.
      x-screens: [mypage.md, hospital-detail.md, tip-detail.md]
      x-screen-status: "✅ 🔒"
      x-role: user
      security:
        - bearerAuth: []
      responses:
        '204':
          description: 해제 완료
        '401':
          $ref: '#/components/responses/Unauthenticated'

  # =========================================================================
  # notifications
  # =========================================================================
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: 알림 목록
      description: |
        `audience` 로 사용자용/관리자용을 나눈다. 화면 문서가 두 알림함을 명확히 분리하고 있고
        (`/notifications` vs `/admin/notifications`), 프론트엔드 캐시 키도
        `queryKeys.notifications.byAudience(audience)` 로 나뉘어 있다. 파라미터로 두면 그 캐시 단위와 그대로 맞는다.

        **`audience` 는 역할이 아니라 알림함(mailbox)이다.** 역할은 셋(`user`/`hospital_admin`/`operator`)이지만
        알림함은 둘이다 — 화면이 `/notifications` 와 `/admin/notifications` 두 개뿐이기 때문이다.

        **수신자 스코프:**
        - `audience=user` → 토큰 주체 **본인에게 발송된** 알림만. **세 역할 모두 호출할 수 있다.**
          병원 담당자도 개인으로서 상담을 신청하므로 본인 알림함이 필요하다.
        - `audience=admin` → **`hospital_admin` 또는 `operator` 필수.** 요청자를 수신자로 지정한 알림만.
          `user` 가 호출하면 `403 FORBIDDEN` (관리자 알림 문구에 고객 이름이 들어 있다).

        `hospital_admin` 의 `audience=admin` 목록은 **담당 병원에 들어온 알림**이다. 담당 병원이 여러 개면
        합쳐서 보인다. `operator` 는 현재 어떤 알림도 운영자를 수신자로 지정하지 않으므로 **빈 목록**이 정상이다
        (새 상담 알림과 검수 결과 알림 둘 다 담당자에게만 간다). 운영자용 알림이 필요해지면
        수신자 지정만 추가하면 되고 이 계약은 바뀌지 않는다.

        지금은 로그인하지 않아도 `/notifications` 주소로 알림 목록이 보인다. 이 엔드포인트는 인증을 요구한다.

        최신순. 알림을 생성하는 공개 엔드포인트는 **없다** — 알림은 상담 접수·상태 변경·인증 검수의
        부수효과로만 생긴다. 프론트엔드의 `notifyUser`/`notifyAdmin` 헬퍼는 서버로 이동해 사라진다.

        **항목에 `consultStatus` 가 함께 내려간다** (2026-10-13, 요청 08). **파라미터·정렬·페이지네이션은
        바뀌지 않았다** — 응답 항목에 필드 하나가 늘었을 뿐이다(§15 의 additive). 소비자는 알림함의
        종류 아이콘 다섯(예약 / 상담 / 문의 / 이벤트 / 안내)이고, `consultStatus` 로 필터하는 질의는
        없다 (`?type=` 은 그대로 `NotificationType` 이다).

        **사용자 알림함에서 상담 알림을 누르면 마이페이지 상담 내역으로 간다** —
        `relatedResource=consultRequest` + `relatedId` = **상담 id** 한 값이면 충분하고, 화면이
        병원 id 를 먼저 조회하지 않는다. 관리자 알림함(`audience=admin`)의 겉모습과 이동은
        **바뀌지 않는다** (요청 08 은 사용자 화면만 말한다).
      x-screens: [notifications.md, admin-notifications.md, mypage.md, admin-home.md]
      x-screen-status: "✅ 🟡"
      security:
        - bearerAuth: []
      parameters:
        - name: audience
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/NotificationAudience'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: isRead
          in: query
          description: 읽음/안읽음 필터. 현재 화면에는 없다 (🚧 대비).
          schema:
            type: boolean
        - name: type
          in: query
          description: 종류별 필터. 현재 화면에는 없다 (🚧 대비).
          schema:
            $ref: '#/components/schemas/NotificationType'
      responses:
        '200':
          description: 알림 목록
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [items, meta, unreadCount]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppNotification'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  unreadCount:
                    type: integer
                    description: 이 `audience` 의 안 읽은 총 개수. 페이지네이션과 무관한 전체 값이다.
                    example: 1
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [notifications]
      summary: 안 읽은 알림 개수
      description: |
        마이페이지 `🔔 알림함` 줄의 빨간 배지, 넓은 화면 상단 `🔔`, 관리자 홈의 종 배지가 이 값을 쓴다.
        세 곳이 같은 숫자를 보여야 한다고 화면 문서가 명시한다.

        목록과 분리한 이유: 배지는 거의 모든 화면에서 필요하고, 그때마다 알림 목록 전체를 받아오는 것은 낭비다.
        관리자 알림 내용에는 고객 이름이 들어 있어서(`김민준님이 상담을 신청했어요`) 배지 하나 때문에
        개인정보를 받아오는 것도 피해야 한다.
      x-screens: [mypage.md, admin-home.md, notifications.md, admin-notifications.md]
      x-screen-status: "✅"
      security:
        - bearerAuth: []
      parameters:
        - name: audience
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/NotificationAudience'
      responses:
        '200':
          description: 안 읽은 개수
          content:
            application/json:
              schema:
                type: object
                required: [audience, unreadCount]
                properties:
                  audience:
                    $ref: '#/components/schemas/NotificationAudience'
                  unreadCount:
                    type: integer
                    example: 2
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

