      summary: 내 상담 신청 상세
      description: |
        사용자 알림함의 `상담 상태 변경` 알림이 지금은 병원 상세로 보낸다. 이 엔드포인트가 생기면
        알림을 눌렀을 때 그 상담 자체로 들어갈 수 있다.

        본인 상담이 아니면 `404` (남의 상담 존재 여부를 흘리지 않는다).
      x-screens: [mypage.md, notifications.md]
      x-screen-status: "🚧"
      x-role: user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 내 상담 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyConsultRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ConsultRequestNotFound'

  # =========================================================================
  # favorites
  # =========================================================================
  /me/favorites:
    get:
      operationId: listMyFavorites
      tags: [favorites]
      summary: 내 찜 목록
      description: |
        **계정별 찜 목록이다.** 지금은 브라우저 하나에 목록이 하나뿐이라
        A 계정으로 찜 → 로그아웃 → B 계정 로그인 하면 A 의 찜이 B 에게 그대로 보인다.
        토큰 주체로 스코프하는 것이 그 결함의 해결책이다.

        기본 응답은 `hospitalIds` 뿐이다. 마이페이지가 병원 카드를 그리려면 병원 데이터가 필요하지만,
        `?expand=hospital` 로 선택하게 두었다. 하트 표시(찜 여부)만 필요한 화면(병원 상세, 꿀팁 상세)이
        병원 객체를 통째로 다시 받는 것을 피하기 위한 것이다.

        찜한 병원이 삭제되면 그 id 는 응답에서 조용히 빠진다.
      x-screens: [mypage.md, hospital-detail.md, tip-detail.md]
      x-screen-status: "✅ 🔒"
      x-role: user
      security:
        - bearerAuth: []
      parameters:
        - name: expand
          in: query
          description: '`hospital` 을 주면 `hospitals` 배열이 함께 내려간다 (마이페이지 카드 목록용).'
          schema:
            type: string
            enum: [hospital]
      responses:
        '200':
          description: 찜 목록. 최근에 찜한 것이 먼저.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteList'
        '401':
          $ref: '#/components/responses/Unauthenticated'

