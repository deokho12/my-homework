  /admin/hospitals:
    get:
      operationId: listManagedHospitals
      tags: [hospitals]
      summary: 관리자 홈의 병원 목록
      description: |
        `/admin` 의 병원 목록. **역할에 따라 범위가 다르다:**

        - `hospital_admin` → `managedHospitalIds` 에 걸린 병원만
        - `operator` → 전 병원

        `GET /hospitals` 와 분리한 이유: 현재 관리자 홈은 **등록된 모든 병원**을 보여주고 전부 수정할 수
        있다 (확인된 결함). 공개 목록과 경로를 분리해 두면 "관리자 화면이 공개 목록을 그대로 쓰다가
        스코프를 잃는" 회귀가 구조적으로 불가능해진다.

        응답에 `scope` 를 함께 내려준다. 화면이 "내 병원" 과 "전체" 를 구분해 표시하고,
        `hospital_admin` 의 목록이 0건일 때 "담당 병원이 아직 지정되지 않았어요" 와
        "등록된 병원이 없어요" 를 구분한다 (`scope` 로 갈린다. 예전에는 둘 다 그냥 빈 화면이었다).

        응답 항목은 공개 `Hospital` 과 같지만 광고 현황 표시용 `sponsorship` 계산 필드가 항상 포함된다
        (병원 수정 화면의 `광고 현황 (읽기 전용)` 카드).

        **이 목록은 노출 판정(`isPubliclyListed`)을 적용하지 않는다 — 관리 시야다.**
        승인 대기·반려 병원도 담당자와 운영자에게는 보여야 한다 (DB §14.4 의 "판정을 적용하지
        않는 자리"). 공개 목록 `GET /hospitals` 는 반대로 **반드시** 적용한다.

        > 🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안).** 아래 `approvalStatus` 파라미터와
        > 응답 항목의 `ManagedHospital` 두 필드(`approvalStatus`·`position`)는 **제안**이다.
        > 합의 전에는 이 오퍼레이션을 **지금 그대로**(`Hospital` 항목, 파라미터 2개) 읽어라.
        > 근거: `docs/database/README.md` §14, `docs/api/README.md` §20.
      x-screens: [admin-home.md, admin-hospital-edit.md]
      x-screen-status: "✅"
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: 병원명 부분 일치. 현재 화면에는 검색이 없다 (🚧 대비).
          schema:
            type: string
            maxLength: 100
        - name: approvalStatus
          in: query
          description: |
            🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안).**
            승인 상태 필터. **`operator` 의 검수 대기 목록**(`?approvalStatus=pending`)이 유일한
            소비자다 — DB §14.14 가 그 질의 하나를 위해 인덱스 `(approval_status)` 를 둔다.

            `hospital_admin` 이 보내면 무시하지 않고 그냥 담당 병원 안에서 걸러진다
            (담당 병원이 1~2곳이라 필터의 의미가 거의 없지만, 역할마다 파라미터를 거절하는
            규칙을 새로 만들 이유도 없다).

            **별도 오퍼레이션(`GET /admin/hospitals/pending`)을 만들지 않은 이유**: 같은 목록의
            부분집합이고, 응답 모양도 `scope` 도 같다. 경로를 나누면 운영자 콘솔이 두 캐시 키를
            들고 같은 화면을 그리게 된다.
          schema:
            $ref: '#/components/schemas/HospitalApprovalStatus'
      responses:
        '200':
          description: 병원 목록
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [items, meta, scope]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagedHospital'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  scope:
                    type: string
                    enum: [managed, all]
                    description: |
                      `managed` = 담당 병원만 (`hospital_admin`), `all` = 전 병원 (`operator`).
                      화면이 빈 목록의 안내 문구를 구분하는 근거다.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

