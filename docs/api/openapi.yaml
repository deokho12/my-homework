      description: |
        멱등이다. 이미 찜한 병원에 다시 호출해도 `204` 다.
        `POST /me/favorites` 대신 `PUT /me/favorites/{hospitalId}` 를 쓴 이유가 이 멱등성이다 —
        하트는 오탭이 잦고, 클라이언트가 낙관적 갱신을 하면 같은 요청이 두 번 갈 수 있다.
      x-screens: [hospital-detail.md, tip-detail.md]
