  /admin/hospitals:
    get:
      operationId: listManagedHospitals
      tags: [hospitals]
      summary: 관리자 홈의 병원 목록
      description: |
        `/admin` 의 병원 목록. **역할에 따라 범위가 다르다:**

        - `hospital_admin` → `managedHospitalIds` 에 걸린 병원만
        - `operator` → 전 병원

        `GET /hospitals` 와 분리한 이유: 현재 관리자 홈은 **등록된 모든 병원**을 보여주고 전부 수정할 수
        있다 (확인된 결함). 공개 목록과 경로를 분리해 두면 "관리자 화면이 공개 목록을 그대로 쓰다가
        스코프를 잃는" 회귀가 구조적으로 불가능해진다.

        응답에 `scope` 를 함께 내려준다. 화면이 "내 병원" 과 "전체" 를 구분해 표시하고,
        `hospital_admin` 의 목록이 0건일 때 "담당 병원이 아직 지정되지 않았어요" 와
        "등록된 병원이 없어요" 를 구분한다 (`scope` 로 갈린다. 예전에는 둘 다 그냥 빈 화면이었다).

        응답 항목은 공개 `Hospital` 과 같지만 광고 현황 표시용 `sponsorship` 계산 필드가 항상 포함된다
        (병원 수정 화면의 `광고 현황 (읽기 전용)` 카드).
      x-screens: [admin-home.md, admin-hospital-edit.md]
      x-screen-status: "✅"
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: 병원명 부분 일치. 현재 화면에는 검색이 없다 (🚧 대비).
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: 병원 목록
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [items, meta, scope]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Hospital'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  scope:
                    type: string
                    enum: [managed, all]
                    description: |
                      `managed` = 담당 병원만 (`hospital_admin`), `all` = 전 병원 (`operator`).
                      화면이 빈 목록의 안내 문구를 구분하는 근거다.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /hospitals/{hospitalId}/admins:
    parameters:
      - $ref: '#/components/parameters/HospitalId'
    get:
      operationId: listHospitalAdmins
      tags: [operator]
      summary: 병원 담당자 목록
      description: |
        그 병원을 담당하는 계정 목록. **`operator` 전용.**

        담당자 본인이 "나 말고 누가 이 병원을 담당하나" 를 보는 화면은 아직 없으므로 `hospital_admin` 에게
        열지 않았다. 다른 담당자의 이메일이 노출되는 것을 피하는 쪽이 기본값으로 안전하다.
      x-screens: []
      x-screen-status: "🚧"
      x-role: operator
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 담당자 목록
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HospitalAdminAssignment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/HospitalNotFound'
    post:
      operationId: assignHospitalAdmin
      tags: [operator]
      summary: 병원 담당자 지정
      description: |
        **`operator` 전용.** 입점 심사가 끝난 뒤 담당자를 붙이는 오퍼레이션이다.

        **`email` 로 기존 계정을 찾아 승격한다. 운영자가 계정을 새로 만들지 않는다.** 근거:

        1. **운영자가 계정을 만들면 초기 비밀번호를 전달할 방법이 없다.** 이 서비스에는 이메일 발송
           인프라가 없고 비밀번호 찾기·이메일 인증도 없다. 운영자가 평문 비밀번호를 알게 되는 구조는
           지금 고치려는 결함(브라우저 평문 저장)과 같은 종류다.
        2. **병원 담당자도 일반 사용자로 앱을 쓴다.** 개인으로서 상담을 신청할 수 있고, 알림 설계가
           이미 그것을 전제한다 (`audience=user` 는 `hospital_admin` 도 조회한다).
           별도 계정 체계를 만들면 같은 사람이 계정 두 개를 갖게 된다.
        3. **`hospital_admins` 가 M:N 이라 승격은 "행 추가" 다.** 되돌리기가 쉽고 감사도 단순하다.
        4. 계정 생성 엔드포인트를 두면 운영자가 임의 계정을 만들 수 있어 감사 부담이 커진다.

        따라서 흐름은 **병원 담당자가 먼저 일반 회원가입(`POST /auth/signup`) → 운영자가 이메일로 지정**이다.
        해당 이메일의 계정이 없으면 `404 USER_NOT_FOUND` 로 "먼저 가입시켜 달라" 는 신호를 준다.
        이메일 존재 여부가 노출되지만, 이 오퍼레이션은 `operator` 전용이라 열거 위험이 없다.

        **부수효과:**
        1. `hospital_admins` 에 `(userId, hospitalId)` 행 추가 (멱등 — 이미 있으면 `200`)
        2. 대상 계정의 `role` 이 `user` 면 **`hospital_admin` 으로 승격**
        3. 대상 계정의 **리프레시 토큰을 전부 폐기**한다. `role` 이 액세스 토큰 클레임에 있으므로,
           폐기하지 않으면 최대 15분 동안 낡은 `role` 로 동작한다
        4. 감사 로그 기록 (누가·누구를·어느 병원에)

        `role=operator` 인 계정은 지정할 수 없다 (`422 CANNOT_ASSIGN_OPERATOR`) — 운영자가 특정 병원의
        담당자를 겸하면 그 병원 전문의를 스스로 검수할 수 있게 되어 역할 분리가 무너진다.
      x-screens: [partner-inquiry.md]
      x-screen-status: "🚧"
      x-role: operator
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: 이미 가입된 계정의 이메일. 앞뒤 공백 제거 + 소문자 변환 후 조회.
      responses:
        '200':
          description: 지정 완료 (이미 담당자였던 경우도 동일)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalAdminAssignment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 병원 또는 계정 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userNotFound:
                  value:
                    error:
                      code: USER_NOT_FOUND
                      message: 그 이메일로 가입된 계정이 없어요. 먼저 회원가입을 안내해주세요
                      requestId: 01J9X8V0Q3
                hospitalNotFound:
                  value:
                    error:
                      code: HOSPITAL_NOT_FOUND
                      message: 병원 정보를 찾을 수 없어요
                      requestId: 01J9X8V0Q3
        '422':
          description: 운영자 계정을 담당자로 지정하려 함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CANNOT_ASSIGN_OPERATOR
                  message: 운영자 계정은 병원 담당자로 지정할 수 없어요
                  requestId: 01J9X8V0Q3

  /hospitals/{hospitalId}/admins/{userId}:
    parameters:
      - $ref: '#/components/parameters/HospitalId'
      - name: userId
