        (`hospitalId` 가 응답에 있다).

        **평점 잠금은 클라이언트 표현이 아니라 서버 응답으로 구현한다.** 비로그인 요청에는
        `rating` 이 `null` 로 내려간다. 현재는 반투명 흰 막을 덮는 방식이라 숫자가 뒤에 비쳐 보이고,
        응답을 직접 보면 그냥 노출된다. `reviewCount` 는 잠금 대상이 아니다 (화면이 비로그인에도 `후기 180` 을 보여준다).

