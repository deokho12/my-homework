    get:
      operationId: getHospital
      tags: [hospitals]
      summary: 병원 상세
      description: |
        병원 상세 화면의 본체. 의료진·후기·이벤트는 각각 별도 엔드포인트로 나눴다 —
        `frontend/src/lib/queryKeys.ts` 가 `hospitals.detail(id)` 와 `doctors.byHospital(hospitalId)` 를
        서로 다른 캐시 단위로 두고 있어, 하나의 응답에 합치면 전문의 수정이 병원 캐시까지 깨게 된다.

        - 의료진 → `GET /hospitals/{hospitalId}/doctors`
        - 후기 → `GET /hospitals/{hospitalId}/reviews`
        - 진행중인 이벤트 → `GET /promotions?hospitalId={hospitalId}`
      x-screens: [hospital-detail.md, consult-request.md, doctor-detail.md, events.md, notifications.md]
      x-screen-status: "✅"
      responses:
        '200':
          description: 병원 상세
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hospital'
        '404':
          description: 병원 없음 (화면 문구 `병원 정보를 찾을 수 없어요`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: HOSPITAL_NOT_FOUND
                  message: 병원 정보를 찾을 수 없어요
                  requestId: 01J9X8V0Q3
    patch:
      operationId: updateHospital
      tags: [hospitals]
      summary: 병원 정보 수정
      description: |
        부분 수정. 보낸 필드만 바뀐다.

        **인가:**
        - `hospital_admin` → `managedHospitalIds` 에 `hospitalId` 가 없으면 `403 HOSPITAL_NOT_MANAGED`.
          **지금은 병원 id 만 주소에 바꿔 넣으면 남의 병원을 고칠 수 있다.** 그것을 막는 것이 이 검사다.
        - `operator` → 전 병원.

        `404` 가 아니라 `403` 을 쓰는 이유: **병원은 공개 리소스다.** `GET /hospitals/{id}` 로 누구나
        존재를 확인할 수 있으므로 존재를 숨겨서 얻는 것이 없다. 반면 `403 HOSPITAL_NOT_MANAGED` 는
        "담당 병원이 아니다" 라는 정확한 원인을 알려주어, 담당자가 병원 id 를 잘못 넣은 경우를 구분할 수 있다.
        (비공개 리소스인 상담·입점 문의는 반대로 `404` 를 쓴다 — `docs/api/README.md` §3 참고)

        광고 관련 필드(`isSponsored`, `sponsoredCategories`, `sponsoredRank`, `sponsoredStartDate`,
        `sponsoredEndDate`)와 집계 필드(`rating`, `reviewCount`, `consultCount`)는 누구도 이 엔드포인트로
        바꿀 수 없다. `isRecommended` 는 **`operator` 만** 바꿀 수 있고 `hospital_admin` 요청에서는 거절된다.
        보내면 무시하지 않고 `422 FIELD_NOT_WRITABLE` 로 거절한다 — 조용히 무시하면 관리자 화면이
        "저장했는데 안 바뀐다" 는 상태가 된다 (현재 `대표 이미지 URL` 에서 실제로 겪고 있는 증상이다).
      x-screens: [admin-hospital-edit.md]
      x-screen-status: "✅"
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HospitalUpdateRequest'
      responses:
        '200':
          description: 수정된 병원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hospital'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/HospitalNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /hospitals/{hospitalId}/doctors:
