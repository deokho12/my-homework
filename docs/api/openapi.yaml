            고른 적 없는 병원의 할 일이 보이고 화면 드롭다운의 값과 숫자가 갈린다.
            화면은 드롭다운에서 하나를 고르게 하고 다시 호출한다. 담당 병원 목록은
            `GET /auth/me` 와 `GET /admin/hospitals` 가 준다.

