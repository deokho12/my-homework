        **`operator` 전용.** 입점 심사가 끝난 뒤 담당자를 붙이는 오퍼레이션이다.

        **`email` 로 기존 계정을 찾아 승격한다. 운영자가 계정을 새로 만들지 않는다.** 근거:

        1. **운영자가 계정을 만들면 초기 비밀번호를 전달할 방법이 없다.** 이 서비스에는 이메일 발송
           인프라가 없고 비밀번호 찾기·이메일 인증도 없다. 운영자가 평문 비밀번호를 알게 되는 구조는
           지금 고치려는 결함(브라우저 평문 저장)과 같은 종류다.
        2. **병원 담당자도 일반 사용자로 앱을 쓴다.** 개인으로서 상담을 신청할 수 있고, 알림 설계가
           이미 그것을 전제한다 (`audience=user` 는 `hospital_admin` 도 조회한다).
           별도 계정 체계를 만들면 같은 사람이 계정 두 개를 갖게 된다.
        3. **`hospital_admins` 가 M:N 이라 승격은 "행 추가" 다.** 되돌리기가 쉽고 감사도 단순하다.
        4. 계정 생성 엔드포인트를 두면 운영자가 임의 계정을 만들 수 있어 감사 부담이 커진다.

        따라서 흐름은 **병원 담당자가 먼저 일반 회원가입(`POST /auth/signup`) → 운영자가 이메일로 지정**이다.
        해당 이메일의 계정이 없으면 `404 USER_NOT_FOUND` 로 "먼저 가입시켜 달라" 는 신호를 준다.
        이메일 존재 여부가 노출되지만, 이 오퍼레이션은 `operator` 전용이라 열거 위험이 없다.

        **부수효과:**
        1. `hospital_admins` 에 `(userId, hospitalId)` 행 추가 (멱등 — 이미 있으면 `200`)
        2. 대상 계정의 `role` 이 `user` 면 **`hospital_admin` 으로 승격**
        3. 대상 계정의 **리프레시 토큰을 전부 폐기**한다. `role` 이 액세스 토큰 클레임에 있으므로,
           폐기하지 않으면 최대 15분 동안 낡은 `role` 로 동작한다
        4. 감사 로그 기록 (누가·누구를·어느 병원에)

        `role=operator` 인 계정은 지정할 수 없다 (`422 CANNOT_ASSIGN_OPERATOR`) — 운영자가 특정 병원의
        담당자를 겸하면 그 병원 전문의를 스스로 검수할 수 있게 되어 역할 분리가 무너진다.
      x-screens: [partner-inquiry.md]
      x-screen-status: "🚧"
      x-role: operator
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: 이미 가입된 계정의 이메일. 앞뒤 공백 제거 + 소문자 변환 후 조회.
      responses:
        '200':
          description: 지정 완료 (이미 담당자였던 경우도 동일)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalAdminAssignment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 병원 또는 계정 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userNotFound:
                  value:
                    error:
                      code: USER_NOT_FOUND
                      message: 그 이메일로 가입된 계정이 없어요. 먼저 회원가입을 안내해주세요
                      requestId: 01J9X8V0Q3
                hospitalNotFound:
                  value:
                    error:
                      code: HOSPITAL_NOT_FOUND
                      message: 병원 정보를 찾을 수 없어요
                      requestId: 01J9X8V0Q3
        '422':
          description: 운영자 계정을 담당자로 지정하려 함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CANNOT_ASSIGN_OPERATOR
                  message: 운영자 계정은 병원 담당자로 지정할 수 없어요
                  requestId: 01J9X8V0Q3

