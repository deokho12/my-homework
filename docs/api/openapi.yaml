      x-role: hospital_admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '201':
          description: 메모가 추가된 상담
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ConsultRequestNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /me/consult-requests:
    get:
      operationId: listMyConsultRequests
      tags: [consult-requests]
      summary: 내 상담 신청 내역
      description: |
        **지금 존재하지 않는 조회 경로다.** 마이페이지와 로그인 화면이
        `상담 신청 내역을 확인할 수 있어요` 라고 안내하는데, 신청 내용은 관리자 화면에만 나타난다.

        응답은 `MyConsultRequest` 로, 관리자용 `ConsultRequest` 와 **다른 투영(projection)** 이다:
        `memos` 를 담지 않고, 병원 이름·전문의 이름을 함께 내려준다 (신청자는 병원 id 를 모른다).
        같은 저장 구조에서 두 개의 응답 형태가 나오는 것이 의도된 설계다.

        **확정 내원 일시(`visitAt`)가 여기로 내려간다** (2026-10-13) — 병원이 `예약확정` 으로 바꾸면서
        넣은 일시를 신청자가 `10/9(금) 14:00` 으로 본다. 취소 사유와 일시 변경 이력은 내려가지 않는다
        (`MyConsultRequest` 설명).

        최신순.
      x-screens: [mypage.md, login.md, notifications.md]
      x-screen-status: "🚧"
      x-role: user
      security:
        - bearerAuth: []
      parameters:
