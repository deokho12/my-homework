      x-proposal: 제안 — 요청자 답 반영 대기 → 요청서 18·19 (2026-10-13 제안). **보안 결정이 열려 있었다** — 비인증 업로드를 받을지가 핵심 질문이고, 요청자의 답은 요청서 18 의 표에 있다. `purpose=hospital_photo` 는 요청 07 (§21 → 요청서 19)
      description: |
        > 🚧 **제안 — 요청자 답 반영 대기 → 요청서 18·19 (2026-10-13 제안). 이것은 확정 계약이 아니다.**
        > **그중에서도 이 오퍼레이션이 가장 확정도가 낮다** — `docs/database/README.md` §14.17-2 가
        > "보안 표면을 늘리는 결정이라 확인이 필요하다" 고 명시한다
        > (2026-10-13 에는 그 확인이 협업자 몫이었다. **2026-10-21 개정 — 혼자 개발 체제**:
        > 제품 결정은 요청자에게 묻고, 이 질문의 답은 **요청서 18** 의 표에 있다).
        > 반영 전에는 **구현하지 않는다.**
        >
        > **이 오퍼레이션에는 제안이 둘 겹쳐 있다**: `purpose=business_registration` 은
        > 요청 06(§20 → **요청서 18**), `purpose=hospital_photo` 는 **요청 07(§21 → 요청서 19)** 이다.
        > 둘은 따로 반영될 수 있고, 규칙이
        > 거의 모든 항목에서 반대다 (아래 표).

        회원가입 폼의 `사업자등록증 업로드`. **가입 전이라 토큰이 없다** — 그것이 이 설계의 전부다.

        **세 안 중 ⓑ 를 제안한다** (DB §14.17-2):

        | 안 | 모양 | 판단 |
        |---|---|---|
        | ⓐ | 가입 요청 자체를 `multipart/form-data` 로 | **기각** — JSON 계약이 깨진다. 중첩된 `hospital` 객체와 약관 배열을 multipart 필드로 평탄화해야 하고, `422 details[].field` 경로가 폼 필드명과 어긋난다 |
        | **ⓑ** | **비인증 사전 업로드 → 가입 요청이 `fileId` 참조** | **제안.** 가입 요청은 JSON 그대로이고, 업로드 실패와 가입 실패가 화면에서 분리된다 (파일을 다시 고르지 않고 재시도할 수 있다) |
        | ⓒ | 계정부터 만들고 두 번째 요청에서 병원 등록 | **기각** — 요청서의 "가입 한 번" 이 깨지고, **담당 병원 0곳인 `hospital_admin`** 이라는 어중간한 상태가 정상 경로가 된다 (DB §14.5 가 트랜잭션으로 막으려던 바로 그 상태다) |

        **ⓑ 가 만드는 것은 인증 없이 바이트를 받는 자리 하나다.** 받아들인다면 아래 넷이
        **같이 와야** 한다 — 하나라도 빠지면 저장소 오남용 표면이 된다:

        1. **크기 상한 10 MiB** (`413`). 사업자등록증 스캔 한 장이면 충분하고, 요청 07 의
           병원 사진이 같은 테이블을 쓰게 되면 그쪽 상한을 따로 정한다
        2. **실제 타입 판정** (`415`). `image/jpeg` · `image/png` · `application/pdf` 셋뿐이고
           **확장자나 `Content-Type` 헤더가 아니라 바이트 앞머리(magic number)로 판정한다** —
           둘 다 보내는 쪽이 고를 수 있는 값이다
        3. **IP 당 요청 한도** (`429`). 계정이 없으므로 한도의 축이 IP 다. 제안: **시간당 10회**
        4. **고아 파일 정리 배치.** 가입이 완료되지 않은 파일은 주인이 없다
           (`hospital_id IS NULL`). 제안: **24시간 후 파기** (DB §14.7)

        **응답에 URL 이 없다.** `fileId` 만 돌려준다 — URL 문자열을 한 번이라도 발급하면
        그것을 아는 사람 전부가 열람자가 되고, 요청서의 "열람 권한을 운영자로 제한" 이 무너진다.
        읽기는 `GET /uploads/{uploadId}/content` **하나뿐**이고 `operator` 전용이다.

        ## 🚧 `purpose` 별 규칙 — **값이 규칙을 정한다** (요청 07, §21)

        | | `business_registration` (06) | `hospital_photo` (**07**) |
        |---|---|---|
        | 올리는 사람 | 가입 중인 사람 — **토큰이 없다** | **로그인한 담당 `hospital_admin` / `operator`** |
        | 인증 | **없음** | **필수.** 없으면 `401`, 담당 병원이 없는 `user` 면 `403` |
        | 허용 타입 | jpeg · png · **pdf** | **jpeg · png** (이미지 전용 — 사진 캐러셀에 pdf 를 그릴 수 없다) |
        | 크기 상한 | 10 MiB | **10 MiB (같은 값)** — 두 값을 다르게 두면 `413` 문구가 둘이 된다 |
        | 요청 한도 | IP 당 시간당 10회 | **계정당 시간당 60회** (사진 11장을 연달아 올린다 — IP 10회로는 폼 하나를 못 채운다) |
        | 응답의 `publicUrl` | **`null`** (URL 을 발급하지 않는다) | **공개 URL.** 이 값을 `images[]` 에 넣어 저장한다 |
        | 읽는 법 | `GET /uploads/{id}/content` — **운영자 전용 · 감사 대상** | 공개 URL 하나. **그 경로를 쓰지 않는다** |
        | 고아 파기 | 24시간 (제안) | **7일** (제안 — 실수 복구 여지. 열린 질문 8) |
        | 감사 로그 | 열람 1행 | **없음** — 환자에게 보이는 공개물이다 |

        **사진에 URL 을 발급해도 되는 이유**(서류와 다른 점): **그 URL 을 아는 사람 전부가 열람자여도
        되는 파일**이다. §20.3 이 URL 을 금지한 것은 열람자를 운영자로 좁혀야 하는 파일이었기
        때문이고, 판정은 지금도 `canReadFile(purpose, role)` **한 함수**에 있다 (DB §16.5).

        **업로드만으로는 아무 데도 보이지 않는다.** 사진이 병원 상세에 뜨려면 `PATCH /hospitals/{id}`
        의 `images[]` 에 그 `publicUrl` 이 들어가야 하고, 그 저장 트랜잭션이 파일을 이 병원 것으로
        **조건부 claim** 한다. 끝내 쓰이지 않은 파일은 주인이 없고 정리 배치가 치운다 —
        깨지는 방향이 "주인 없는 파일이 남는 쪽" 으로만 고정된다 (§20.3 과 같은 구조).

        **`purpose` 를 요청에서 받는 이유**: 접근 통제와 보관 기간이 전부 이 값에서 파생된다
        (`canReadFile(purpose, role)`, DB §14.7). **비인증으로 허용하는 값은
        `business_registration` 하나**이고, `hospital_photo` 는 **인증 필수**다 (위 표).

        > 🚧 **요청 07 에서 한 가지를 뒤집었다**(§21): 06 은 "`security` 를 조건부로 두지 말고
        > 값별 규칙을 설명에만 적는다" 고 했지만, 지금 `security` 는 **두 줄**이다
        > (`{}` = 비인증 허용, `bearerAuth` = 토큰 허용). 그대로 `security: []` 만 두면
        > 계약이 "토큰을 **보내면 안 된다**" 고 말하게 되는데, 사진 업로드는 토큰이 **있어야** 한다 —
        > 생성기와 게이트웨이가 그 한 줄을 읽는다. **값별 세부 규칙은 여전히 설명이 못 박는다**
        > (어느 `purpose` 에 토큰이 필수인지는 스키마로 표현할 수 없다).
      x-screens: [signup.md, admin-hospital-edit.md]
      x-screen-status: "🚧"
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [purpose, file]
              properties:
                purpose:
                  $ref: '#/components/schemas/FilePurpose'
                file:
                  type: string
                  format: binary
                  description: |
                    최대 10 MiB. **바이트 앞머리로 판정한다** (확장자·`Content-Type` 헤더가 아니다).
                    허용 타입은 `purpose` 가 정한다 — `business_registration`: jpeg · png · pdf /
                    🚧 `hospital_photo`(07): **jpeg · png**.
      responses:
        '201':
          description: |
            업로드된 파일의 메타데이터. **아직 주인이 없다** — 가입 트랜잭션이 `fileId` 로
            claim 할 때 병원·업로더가 채워진다 (DB §14.5).
            화면은 `originalName` 으로 `사업자등록증.pdf 제출 완료` 를 그린다.

            🚧 **요청 07(§21)**: `purpose=hospital_photo` 면 `publicUrl` 이 함께 온다. 폼은 그 값을
            미리보기에 걸고, **저장을 눌러 `PATCH /hospitals/{id}` 의 `images[]` 에 들어가야**
            병원의 사진이 된다 (그 전까지는 주인 없는 파일이다).
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFileRef'
        '413':
          description: 파일이 너무 큼. `code` 는 `FILE_TOO_LARGE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: FILE_TOO_LARGE
                  message: 파일은 10MB까지 올릴 수 있어요
                  requestId: 01J9X8V0Q3
        '401':
          description: |
            🚧 **요청 07(§21)**: `purpose=hospital_photo` 를 토큰 없이 보냈다.
            `purpose=business_registration` 은 **이 응답이 나오지 않는다** (가입 전이라 토큰이 없다).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: 로그인이 필요해요
                  requestId: 01J9X8V0Q3
        '403':
          description: |
            🚧 **요청 07(§21)**: 토큰은 있지만 병원 사진을 올릴 역할이 아니다
            (`user`). 담당 병원 검사는 **업로드 시점이 아니라 저장 시점**에 한다 —
            업로드 요청에는 아직 병원 id 가 없다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: FORBIDDEN
                  message: 이 작업을 수행할 권한이 없어요
                  requestId: 01J9X8V0Q3
        '415':
          description: |
            허용되지 않는 파일 형식 (`code: UNSUPPORTED_FILE_TYPE`).
            **확장자가 아니라 실제 바이트로 판정한 결과다** — `.pdf` 로 이름만 바꾼 실행 파일이
            여기서 걸린다.

            🚧 **요청 07(§21)**: 허용 타입이 `purpose` 마다 다르므로 **문구도 다르다** —
            `hospital_photo` 는 `JPG, PNG 파일만 올릴 수 있어요`.
            (`message` 를 그대로 화면에 보여주는 규약이라, 하나로 합치면 사진 칸에 `PDF` 가 안내된다.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNSUPPORTED_FILE_TYPE
                  message: JPG, PNG, PDF 파일만 올릴 수 있어요
                  requestId: 01J9X8V0Q3
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /uploads/{uploadId}/content:
    parameters:
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getUploadContent
      tags: [uploads]
      summary: '🚧 [제안] 업로드 파일 원본 열람 (운영자 전용)'
      x-proposal: 제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안)
      description: |
        > 🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안).** 확정 계약이 아니다.

        운영자 검수 화면이 사업자등록증을 여는 **유일한 경로**다. **`operator` 전용.**

        **올린 본인(담당 `hospital_admin`)도 다시 내려받을 수 없다** — 요청서의
        "저장·열람 권한을 운영자로 제한" 그대로다. 관리자 화면은 파일명과 `제출 완료` 만
        보여주고 링크를 걸지 않는다. 판정은 순수 함수 한 줄이다:
        `canReadFile('business_registration', role) === (role === 'operator')` (DB §14.7).

        **서명된 임시 URL 을 발급하지 않는다.** URL 이 생기는 순간 그것을 가진 사람이 열람자가
        되고 감사 로그가 비어 버린다 — 이 오퍼레이션이 존재하는 이유가 **열람을 한 자리로
        모으는 것**이다.

        - `Cache-Control: no-store` — 공유 캐시·브라우저 디스크에 개인정보가 남지 않게 한다
        - `Content-Disposition: inline` + 원본 파일명
        - **열람은 감사 대상이다** — `audit_logs.action='hospital_document.view'`,
          `target_type='uploaded_file'`, `pii_masked=false`
          (마스킹하지 않은 개인정보를 봤다). `partner_inquiry.view` 와 같은 취급이다 (§4)
        - 파기된 파일(`purged_at` 이 채워짐)은 **`404`** 다. 행은 남아 있지만 바이트가 없다 —
          행을 지우지 않는 이유는 감사 로그가 `target_id` 로 이 파일을 가리키기 때문이다
      x-screens: []
      x-screen-status: "🚧"
      x-role: operator
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 파일 원본
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Content-Disposition:
              schema:
                type: string
                example: inline; filename="business-registration.pdf"
            X-Audit-Logged:
              schema:
                type: boolean
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 없는 파일 또는 이미 파기된 파일. `code` 는 `UPLOAD_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /legal-documents/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          enum: [terms, privacy, location, about, partner-terms]
        description: |
          🚧 `partner-terms` 는 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안)** 로
          추가된 값이다 (`[필수] 병원 파트너 이용약관`, DB §14.8). 반영 전에는 이 slug 의 문서가 없다.
    get:
      operationId: getLegalDocument
      tags: [content]
      summary: 약관·정책·소개 문서
      description: |
        🚧 **네 화면 모두 지금 `준비중입니다` 한 줄뿐이고, 약관 전문이 이 저장소 어디에도 없다.**

        서버에서 내려주는 것으로 설계한 이유: 약관은 개정 이력과 시행일이 있어야 하고,
        회원가입 시 "어떤 버전에 동의했는지" 를 기록하려면 버전이 서버에 있어야 한다.
        클라이언트 정적 파일로 두면 앱 배포와 약관 개정이 묶인다 (Flutter 앱이 붙으면 더 심해진다).

        `content` 는 마크다운이다. 회원가입 동의 절차 자체는 아직 없다 — 미결 사항에 올려 두었다.
      x-screens: [legal-terms.md, legal-privacy.md, legal-location.md, about.md, home.md]
      x-screen-status: "🚧"
      responses:
        '200':
          description: 문서
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocument'
        '404':
          description: 아직 등록되지 않은 문서
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /partner-inquiries:
    post:
      operationId: createPartnerInquiry
      tags: [support]
      summary: 병원 입점 문의 접수
      description: |
        🚧 **화면에 입력칸도 제출 버튼도 없다** (`문의 폼은 준비중입니다`). 이 엔드포인트가 그 폼의 상대편이다.

        인증이 필요하지 않다 (아직 계정이 없는 병원이 문의한다). 그래서 스팸에 노출되므로
        IP 당 분당 3회로 제한하고 `429` 를 반환한다.

        **이것이 병원 입점 흐름의 시작점이다** (`docs/decisions/0001-roles-and-pii.md` 결정 2):

        ```
        POST /partner-inquiries        (병원이 문의)
          → GET /partner-inquiries     (운영자가 목록 확인)
          → PATCH /partner-inquiries/{id}  (심사 결과 기록)
          → POST /hospitals            (운영자가 병원 생성)
          → POST /hospitals/{id}/admins  (운영자가 담당자 지정)
        ```

        접수 응답에 `id` 를 주지만 **제출자가 진행 상황을 조회할 경로는 없다.** 문의자는 계정이 없어
        인증할 수단이 없고, `id` 만으로 조회를 열면 남의 문의(병원명·담당자명·연락처)를 열거할 수 있다.
        진행 안내는 운영자가 별도 수단(전화·메일)으로 한다 — 미결 사항이다.
      x-screens: [partner-inquiry.md, home.md]
      x-screen-status: "🚧"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerInquiryCreateRequest'
      responses:
        '202':
          description: 접수됨
          content:
            application/json:
              schema:
                type: object
                required: [id, receivedAt]
                properties:
                  id:
                    type: string
                  receivedAt:
                    type: string
                    format: date-time
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: listPartnerInquiries
      tags: [support]
      summary: 입점 문의 목록 (운영자 심사)
      description: |
        **`operator` 전용.** 초안에서 "제출된 문의를 어디서 볼 것인가" 를 미결로 남겼던 것의 답이다.
        입점 심사가 병원 생성의 전제가 되면서 조회 경로가 필수가 됐다.

        문의에는 병원명·담당자 실명·연락처가 들어 있다. 상담 신청자 PII 와 같은 급으로 다룬다:
        `Cache-Control: no-store`, `operator` 전용, 열람 로그 대상.

        접수 최신순. 대응 화면은 아직 없다 (🚧) — 운영자 콘솔이 필요하다.
      x-screens: [partner-inquiry.md]
      x-screen-status: "🚧"
      x-role: operator
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PartnerInquiryStatus'
      responses:
        '200':
          description: 문의 목록
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartnerInquiry'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /partner-inquiries/{inquiryId}:
    parameters:
      - name: inquiryId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPartnerInquiry
      tags: [support]
      summary: 입점 문의 상세
      description: |
        **`operator` 전용.** 열람 로그 대상 (담당자 실명·연락처를 담는다).
      x-screens: [partner-inquiry.md]
      x-screen-status: "🚧"
      x-role: operator
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 문의 상세
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            X-Audit-Logged:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerInquiry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PartnerInquiryNotFound'
    patch:
      operationId: reviewPartnerInquiry
      tags: [support]
      summary: 입점 문의 심사 결과 기록
      description: |
        **`operator` 전용.** 심사 진행 상태와 메모를 남긴다.

        상태 전이: `received → reviewing → approved | rejected`.
        `approved`/`rejected` 에서 되돌아갈 수 없다 (`422 INVALID_INQUIRY_STATUS_TRANSITION`) —
        심사 결과가 왔다 갔다 하면 감사 기록의 의미가 없어진다.

        **`approved` 로 바꾸는 것이 병원을 만들지는 않는다.** 병원 생성(`POST /hospitals`)은 별도 오퍼레이션이다.
        문의 본문의 항목(병원명·지역만)으로는 병원 등록 필수 항목(주소·좌표·가격대·취급 시술)을 채울 수 없어서,
        승인이 곧 생성이 되게 만들면 반쪽짜리 병원 레코드가 생긴다.
        대신 `linkedHospitalId` 를 기록해 문의와 생성된 병원을 잇는다.

        `rejected` 는 `reviewNote` 가 필수다 (1자 이상). 사유 없는 반려를 남기지 않게 한다 —
        전문의 검수의 `rejectionReason` 과 같은 규칙이다.
      x-screens: [partner-inquiry.md]
      x-screen-status: "🚧"
      x-role: operator
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/PartnerInquiryStatus'
                reviewNote:
                  type: string
                  maxLength: 1000
                  description: '`status=rejected` 일 때 필수.'
                linkedHospitalId:
                  type: string
                  description: 이 문의로 만들어진 병원 id. `approved` 이후 연결용.
      responses:
        '200':
          description: 갱신된 문의
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerInquiry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PartnerInquiryNotFound'
        '422':
          description: 허용되지 않는 상태 전이 또는 `reviewNote` 누락
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_INQUIRY_STATUS_TRANSITION
                  message: 이미 심사가 끝난 문의예요
                  requestId: 01J9X8V0Q3

  # =========================================================================
  # search
  # =========================================================================
  /search:
    get:
      operationId: search
      tags: [search]
      summary: 통합 검색 (결과 목록)
      description: |
        시술·병원·전문의를 한 번에 찾아 **종류별로 묶어** 반환한다.

        현재 검색 화면은 결과 목록을 만들지 않고 일치하는 하나로 이동시킨다. 그 동작은
        `GET /search/resolve` 가 담당한다. 이 엔드포인트는 "여러 결과를 나란히 보여주는 검색 결과 화면이
        필요하면 새로 만들어야 합니다" 라고 화면 문서가 적어 둔 그 화면을 위한 것이다.
        지금 프론트엔드는 이걸 호출하지 않아도 된다.

        매칭 규칙은 `resolve` 와 동일하다 (아래 참고).
      x-screens: [search.md]
      x-screen-status: "🚧"
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: type
          in: query
          description: 특정 종류만 받고 싶을 때. 생략하면 세 종류 모두.
          schema:
            type: string
            enum: [procedure, hospital, doctor]
        - name: limit
          in: query
          description: 종류별 최대 개수.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 종류별 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /search/resolve:
    get:
      operationId: resolveSearch
      tags: [search]
      summary: 검색어를 이동 대상 하나로 해석
      description: |
        **현재 검색 화면의 동작을 그대로 서버로 옮긴 것이다.** 입력한 글자와 맞는 것 하나를 찾아
        어디로 보낼지 알려준다.

        우선순위 (먼저 맞으면 멈춘다):
        1. **시술 이름** — 병원 탐색으로 (`kind=procedure`, 그 시술 탭 선택 상태)
        2. **병원 이름** — 그 병원 상세로 (`kind=hospital`)
        3. **전문의 이름** — `kind=doctor`

        매칭 방식도 현재와 같다: 입력한 글자가 이름 **안에 포함**되어야 한다
        (`임플` → `임플란트` ✅, `임플란트 가격` ❌). 전문의만 예외로, 이름 뒤에 직함이 붙은 경우
        (`김민준 원장`)도 찾는다.

        같은 글자가 여러 곳에 걸리면 시술이 이긴다 — `라미네이트` 는 시술과 병원명
        (`더화이트 라미네이트클리닉`)에 모두 있지만 병원 탐색으로 간다.

        **현재 동작과 다르게 만든 한 가지:** 전문의 매칭 결과가 `kind=doctor` + `doctorId` 다.
        지금 화면은 전문의를 찾고도 소속 병원 상세로 보낸다 — 전문의 상세 화면(`/doctor/:id`)이 있는데도
        쓰지 않는 확인된 결함이다. 서버는 전문의를 가리키고, 어디로 보낼지는 클라이언트가 정한다.
        `hospitalId` 도 함께 주므로 현재 동작(병원으로 보내기)을 유지하는 것도 가능하다.

        일치하는 것이 없으면 `200` + `target: null` 이다. 404 가 아닌 이유: "검색 결과가 없다" 는
        정상적인 검색 결과이고, 화면은 회색 안내 상자를 보여줄 뿐 에러 처리를 하지 않는다.
      x-screens: [search.md, home.md]
      x-screen-status: "✅ 🟡"
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: |
            해석 결과. `target` 이 `null` 이면 화면이
            `"OO"에 대한 검색 결과가 없어요. 아래 인기 검색어를 살펴보세요` 를 보여준다.
          content:
            application/json:
              schema:
                type: object
                required: [query, target]
                properties:
                  query:
                    type: string
                  target:
                    oneOf:
                      - $ref: '#/components/schemas/SearchTarget'
                      - type: 'null'
              examples:
                procedure:
                  summary: 시술이 먼저 맞은 경우
                  value:
                    query: 임플
                    target:
                      kind: procedure
                      procedureId: implant
                      label: 임플란트
                hospital:
                  summary: 병원 이름
                  value:
                    query: 더화이트
                    target:
                      kind: hospital
                      hospitalId: h6
                      label: 더화이트 라미네이트클리닉
                doctor:
                  summary: 전문의 이름 + 직함
                  value:
                    query: 김민준 원장
                    target:
                      kind: doctor
                      doctorId: d1
                      hospitalId: h1
                      label: 김민준
                none:
                  summary: 결과 없음
                  value:
                    query: 존재하지않는이름
                    target: null
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /search/trending:
    get:
      operationId: getTrendingSearches
      tags: [search]
      summary: 인기 검색어
      description: |
        검색 화면의 `전체`/`시술`/`병원`/`의사` 탭 순위 목록, 그리고 홈 화면의 인기 검색어 알약
        (= `전체` 탭 상위 6개. 화면 문서가 같은 목록이라고 명시한다).

        항목마다 `target` 이 붙는다. 검색창을 거치지 않고 곧바로 정해진 화면으로 이동하는
        현재 동작을 유지하기 위한 것이다. `target` 이 없으면 문구로 다시 검색해야 하고,
        문구가 이름과 안 맞으면 결과가 없는 상태가 된다 (지금 추천 검색어 알약에서 실제로 벌어지는 일이다).

        `calculatedAt` 을 함께 내려준다. 지금 화면의 `14:32 기준` 은 **집계 시각이 아니라 화면을 연 시각**이라
        언제 봐도 같은 순위인데도 시각만 계속 바뀐다. 서버가 실제 집계 시각을 주면 그 문구가 정직해진다.

        `trend`(순위 변동)도 서버가 계산한다. 지금은 코드에 적어둔 고정 값이다.
      x-screens: [search.md, home.md]
      x-screen-status: "🟡"
      parameters:
        - name: tab
          in: query
          description: 생략하면 `all`.
          schema:
            type: string
            enum: [all, procedure, hospital, doctor]
            default: all
        - name: limit
          in: query
          description: |
            현재 화면의 탭별 개수는 `전체` 10 · `시술` 10 · `병원` 6 · `의사` 8 이다.
            개수를 클라이언트가 정하게 두어 홈(6개)이 같은 엔드포인트를 쓸 수 있게 한다.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: 순위 목록
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                type: object
                required: [tab, calculatedAt, items]
                properties:
                  tab:
                    type: string
                    enum: [all, procedure, hospital, doctor]
                  calculatedAt:
                    type: string
                    format: date-time
                    description: 실제 집계 시각. 화면의 `OO:OO 기준` 문구가 이 값을 써야 한다.
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrendingSearchTerm'

  /search/suggestions:
    get:
      operationId: getSearchSuggestions
      tags: [search]
      summary: 추천(광고) 검색어 알약
      description: |
        검색창 바로 아래의 `✦` 알약들. **광고 지면이다.**

        **각 항목에 `target` 을 함께 내려주는 것이 핵심이다.** 지금 6개 중 5개는 눌러도 아무 일이 없다:
        문구가 시술·병원 이름보다 길어서(`몰라몰라 PICK 인기 임플란트` 등) 그 문구로 검색하면
        `검색 결과가 없어요` 로 떨어진다. 광고 지면이 실질적으로 죽어 있는 상태다.
        서버가 문구와 이동 대상을 분리해서 주면, 클라이언트는 문구를 검색창에 넣는 대신
        `target` 으로 바로 이동할 수 있다.

        `target` 이 `null` 인 항목은 검색어 채우기만 하는 순수 문구다.
        노출 기간이 지난 항목은 응답에서 빠진다 (`sponsorship` 과 같은 서버 판단).
      x-screens: [search.md]
      x-screen-status: "🟡"
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 6
      responses:
        '200':
          description: 추천 검색어 알약. 노출 순서대로.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchSuggestion'

  # =========================================================================
  # geo
  # =========================================================================
  /geo/address-search:
    get:
      operationId: searchAddress
      tags: [geo]
      summary: 주소 검색 (카카오 로컬 프록시)
      description: |
        **카카오 REST 키를 브라우저에서 없애기 위한 엔드포인트다.**

        지금은 `frontend/src/services/geocoding.ts` 가 `VITE_KAKAO_REST_API_KEY` 를 들고
        `dapi.kakao.com` 을 직접 호출한다. `VITE_` 접두사 변수는 번들에 그대로 인라인되므로
        **키가 브라우저에 노출된다.** 카카오 REST 키는 JS 키와 달리 도메인 제한을 걸 수 없어서,
        누가 꺼내가면 우리 계정의 할당량과 과금으로 아무 곳에서나 쓸 수 있다. Flutter 앱이 붙으면
        같은 키를 앱 바이너리에도 심어야 해서 노출면이 더 넓어진다.

        지도 표시용 **JS 키(`VITE_KAKAO_MAP_JS_KEY`)는 브라우저에 남겨 둔다.** 그쪽은 origin 제한이
        가능하고 애초에 클라이언트용으로 발급되는 키다. 즉 **지도는 클라이언트, 주소 검색은 서버**로 나눈다.

        **인증을 요구하고 `hospital_admin` / `operator` 로 제한한다.** 주소 검색은 병원 등록·수정 폼에서만
        쓰인다 (등록은 `operator`, 수정은 담당 `hospital_admin`). 공개로 두면 우리 서버가 누구나 쓰는
        무료 지오코딩 프록시가 된다.

        추가로 서버가 얻는 것:
        - 같은 질의 캐시 (폼이 0.3초 디바운스로 타이핑마다 호출한다)
        - 계정당 분당 30회 제한
        - 카카오 장애 시 `502` 로 명확히 알려주기. 지금은 실패를 삼키고 빈 배열을 반환해서
          "검색 결과가 없다" 와 "카카오가 죽었다" 가 구분되지 않는다.
        - 키가 없을 때 가짜 결과를 만들어내는 목 폴백을 제거. 지금은 키가 없으면 입력 글자에
          `로 12` 같은 꼬리를 붙인 가짜 주소와 서울시청 근처 임의 좌표가 저장된다.
      x-screens: [admin-hospital-new.md, admin-hospital-edit.md]
      x-screen-status: "🟡"
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          description: 도로명 또는 지번 주소.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: 주소 후보. 빈 배열은 "일치하는 주소 없음" 을 뜻한다.
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=600
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeocodeResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: 카카오 로컬 API 호출 실패. "결과 없음" 과 구분된다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: GEOCODING_UPSTREAM_ERROR
                  message: 주소 검색 서비스가 일시적으로 응답하지 않아요. 잠시 후 다시 시도해주세요
                  requestId: 01J9X8V0Q3

# ===========================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer {accessToken}`.

        액세스 토큰 클레임: `sub`(사용자 id), `role`(`user`|`hospital_admin`|`operator`),
        `iat`, `exp`, `iss`, `aud`, `jti`. 수명 15분.

        **`managedHospitalIds` 는 클레임에 넣지 않는다** — 담당 병원이 바뀌었을 때 토큰이 만료될 때까지
        낡은 권한이 유효해진다. 담당 검사는 서버가 매 요청 `hospital_admins` 조회로 판단한다.

        `role` 은 클레임에 있으므로 승격·해제 시 **그 계정의 리프레시 토큰을 전부 폐기**한다.
        폐기하지 않으면 최대 15분 동안 낡은 역할로 동작한다.

        리프레시 토큰은 수명 30일이며 `POST /auth/refresh` 의 **본문**으로 보낸다.
        쿠키를 쓰지 않는 이유는 `mobile/` 의 Flutter 앱이 같은 API 를 쓰기 때문이다.

  parameters:
    Page:
      name: page
      in: query
      description: 1부터 시작.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 최대 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    HospitalId:
      name: hospitalId
      in: path
      required: true
      schema:
        type: string
      example: h1
    DoctorId:
      name: doctorId
      in: path
      required: true
      schema:
        type: string
      example: d1
    ConsultRequestId:
      name: consultRequestId
      in: path
      required: true
      schema:
        type: string
      example: cr1
    HospitalInquiryId:
      name: inquiryId
      in: path
      required: true
      description: |
        병원 문의 id. 입점 문의(`/partner-inquiries/{inquiryId}`)와 경로 변수 이름이 같지만
        **다른 리소스다** — 경로 접두사가 둘을 가른다.
      schema:
        type: string
      example: hi1
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
      example: q1

  responses:
    Unauthenticated:
      description: 액세스 토큰이 없거나 만료됨
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              value:
                error:
                  code: UNAUTHENTICATED
                  message: 로그인이 필요해요
                  requestId: 01J9X8V0Q3
            expired:
              value:
                error:
                  code: ACCESS_TOKEN_EXPIRED
                  message: 로그인이 만료되었어요. 다시 로그인해주세요
                  requestId: 01J9X8V0Q3
    Forbidden:
      description: |
        역할 부족 또는 담당 병원 아님.

        비공개 리소스(상담·입점 문의)의 담당 범위 밖 접근은 `403` 이 아니라 `404` 다 — 열거 방지.
        공개 리소스(병원·전문의)는 존재를 숨겨서 얻는 것이 없으므로 `403` 으로 정확한 원인을 알려준다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            role:
              summary: 역할 부족
              value:
                error:
                  code: FORBIDDEN
                  message: 이 작업을 수행할 권한이 없어요
                  requestId: 01J9X8V0Q3
            ownership:
              summary: 담당 병원 아님 (공개 리소스)
              value:
                error:
                  code: HOSPITAL_NOT_MANAGED
                  message: 담당하지 않는 병원이에요
                  requestId: 01J9X8V0Q3
    ValidationFailed:
      description: 입력값 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_FAILED
              message: 입력값을 확인해주세요
              details:
                - field: phone
                  code: INVALID_PHONE_FORMAT
                  message: 휴대폰 번호 형식이 아니에요. 010-1234-5678 처럼 입력해주세요
                - field: priceRange.min
                  code: NOT_A_NUMBER
                  message: 숫자만 입력해주세요
              requestId: 01J9X8V0Q3
    RateLimited:
      description: 요청 한도 초과
      headers:
        Retry-After:
          schema:
            type: integer
          description: 초 단위.
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
          description: 창이 초기화되는 UNIX epoch(초).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMITED
              message: 요청이 너무 많아요. 잠시 후 다시 시도해주세요
              requestId: 01J9X8V0Q3
    HospitalNotFound:
      description: 병원 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: HOSPITAL_NOT_FOUND
              message: 병원 정보를 찾을 수 없어요
              requestId: 01J9X8V0Q3
    DoctorNotFound:
      description: 전문의 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: DOCTOR_NOT_FOUND
              message: 전문의 정보를 찾을 수 없어요
              requestId: 01J9X8V0Q3
    ConsultRequestNotFound:
      description: 상담 없음 또는 담당 병원의 상담이 아님 (두 경우를 구분하지 않는다)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CONSULT_REQUEST_NOT_FOUND
              message: 상담 정보를 찾을 수 없어요
              requestId: 01J9X8V0Q3
    HospitalInquiryNotFound:
      description: |
        병원 문의가 없거나 **담당 병원의 문의가 아님.** 두 경우를 구분하지 않는다 (열거 방지 — README §3).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: HOSPITAL_INQUIRY_NOT_FOUND
              message: 문의를 찾을 수 없어요
              requestId: 01J9X8V0Q3
    PartnerInquiryNotFound:
      description: 입점 문의 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: PARTNER_INQUIRY_NOT_FOUND
              message: 입점 문의를 찾을 수 없어요
              requestId: 01J9X8V0Q3
    PostNotFound:
      description: 질문 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: POST_NOT_FOUND
              message: 질문을 찾을 수 없어요
              requestId: 01J9X8V0Q3

  schemas:
    # ---------------------------------------------------------------- 공통
    Error:
      type: object
      description: |
        모든 4xx/5xx 응답의 본문. `message` 는 사용자에게 그대로 보여줄 수 있는 한국어 문구다 —
        프론트엔드가 코드별 문구 사전을 따로 들고 있지 않게 하려는 의도다.
        문구를 바꿀 때는 화면 문서의 문구와 어긋나지 않는지 확인해야 한다.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              description: 기계 판독용 코드. 대문자 SNAKE_CASE.
              example: HOSPITAL_NOT_FOUND
            message:
              type: string
              description: 사용자에게 보여줄 한국어 문구.
              example: 병원 정보를 찾을 수 없어요
            details:
              type: array
              description: 필드 단위 오류. `VALIDATION_FAILED` 에서만 채워진다.
              items:
                $ref: '#/components/schemas/ErrorDetail'
            requestId:
              type: string
              description: 로그 추적용. 응답 헤더 `X-Request-Id` 와 같은 값.
              example: 01J9X8V0Q3

    ErrorDetail:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: 점 표기 경로. 배열은 `doctors[2].name` 형태.
          example: doctors[2].name
        code:
          type: string
          example: REQUIRED
        message:
          type: string
          example: 이름을 입력해주세요

    PageMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalItems:
          type: integer
          description: 필터 적용 후 전체 건수. 화면의 `총 11곳` / `총 14명` 이 이 값이다.
          example: 11
        totalPages:
          type: integer
          example: 1

    # ---------------------------------------------------------------- 시술
    ProcedureId:
      type: string
      description: |
        시술 13종. 병원 탐색의 시술 칩 15개 중 `추천`·`기타` 는 시술이 아니라 특수 탭이라 여기 없다.
      enum:
        - implant
        - orthodontics
        - laminate
        - inlay
        - crown
        - whitening
        - wisdom-tooth
        - cavity
        - gum-disease
        - splint
        - snoring-device
        - tmj
        - botox

    Procedure:
      type: object
      required: [id, name, emoji, shortDescription, description]
      properties:
        id:
          $ref: '#/components/schemas/ProcedureId'
        name:
          type: string
          example: 임플란트
        emoji:
          type: string
          example: 🦷
        shortDescription:
          type: string
          example: 자연치아처럼 튼튼하게
        description:
          type: string

    # ---------------------------------------------------------------- 병원
    PriceRange:
      type: object
      required: [min, max]
      properties:
        min:
          type: integer
          description: 원. 정수.
          example: 900000
        max:
          type: integer
          example: 3500000

    BusinessHourEntry:
      type: object
      required: [day, hours]
      properties:
        day:
          type: string
          example: 월
        hours:
          type: string
          description: 자유 문자열. 점심시간 칸이 따로 없어 필요하면 여기 함께 적는다.
          example: 09:30 - 18:30
        isClosed:
          type: boolean
          default: false

    HospitalFeatures:
      type: object
      description: |
        관리자 폼의 `병원 특징` 체크박스 6개. `⚡ 원데이가능` 배지는 여기가 아니라 `isOneDay` 에서 온다 —
        화면 문서가 출처가 다르다고 명시하는 지점이다.

        > 🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안). 확정 계약이 아니다** — 요청 07
        > (`docs/api/README.md` §21, 데이터 설계 `docs/database/README.md` §16.6).
        > **키가 4개 늘고 기존 6개는 한 글자도 바뀌지 않는다** (`required` 도 그대로다).
        >
        > | 요청서 07 의 칩 9개 | 이 스키마 | 쓰기 |
        > |---|---|---|
        > | 원데이 보철 | `Hospital.isOneDay` (**여기 아님** — 시술이 아니라 병원 속성) | 가능 |
        > | 디지털 진료(구강스캐너) | `digitalCare` | 가능 |
        > | **야간 진료** | **`nightCare` — 읽기 전용 파생** | **불가 — `422 FEATURE_NOT_WRITABLE`** |
        > | **주말 진료** | **`weekend` — 읽기 전용 파생** | **불가 — `422 FEATURE_NOT_WRITABLE`** |
        > | 주차 가능 | `parking` | 가능 |
        > | **수면 진료** | **`sedation` (신규)** | 가능 |
        > | 무통 마취 | `painlessAnesthesia` | 가능 |
        > | 전담 코디네이터 | `coordinator` | 가능 |
        > | **장애인 편의시설** | **`accessibility` (신규)** | 가능 |
        > | (요청서 9개에 없음) | `cctv` · `nightConsult` | 가능 — **열린 질문 1·2** |
        >
        > **`cctv` 를 계약에서 빼지 않았다.** 폼에서만 내리면 **이미 켜져 있는 병원이 끌 수 없는 값**이
        > 된다 — 값은 남고 수정 수단만 사라지는 상태다. 칩 10개로 남길지는 제품 결정이다 (열린 질문 1).
        >
        > **배열 테이블(`hospital_features`)로 바꾸지 않는다.** 이 스키마는 **키 고정 객체**이고,
        > 라벨·아이콘·필터 파라미터가 전부 코드에 있다. 값으로 늘릴 수 있는 종류가 아니다 (DB §16.6).
      required: [coordinator, painlessAnesthesia, digitalCare, parking, nightConsult, cctv]
      properties:
        coordinator:
          type: boolean
          description: 전담코디네이터
        painlessAnesthesia:
          type: boolean
          description: 무통마취
        digitalCare:
          type: boolean
          description: 디지털진료
        parking:
          type: boolean
          description: 주차가능
        nightConsult:
          type: boolean
          description: |
            야간상담. 병원 탐색의 `진료시간` 조건 칩이 실제로 거르는 값.

            🚧 **[제안] 요청 07 (§21):** 아래 `nightCare`(야간 **진료**)와 **다른 사실**이다 —
            늦게까지 상담 전화를 받는 것과 늦게까지 진료하는 것은 같지 않다. 그런데 환자가
            `진료시간` 칩을 누르고 기대하는 것은 `nightCare` 쪽에 가깝다. **칩의 기준을 옮길지는
            열린 질문 2**이고, 이번 범위에서는 **둘 다 그대로 두고 배지 문구만 구분**하기를 권한다
            (옮기면 필터가 컬럼이 아니라 `businessHours` 파싱이 되어 질의가 무거워진다).
        cctv:
          type: boolean
          description: CCTV설치
        sedation:
          type: boolean
          x-proposal: 제안 — 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)
          description: |
            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)** — 요청 07 (§21). 수면 진료(진정 요법).
            기존 병원 11곳은 `false` 다 — **백필하지 않는다. 없는 사실을 지어내지 않는다** (DB §16.10).
            `required` 에 넣지 않은 것이 "아직 제안" 의 기계적 표현이다. 합의되면 required 가 된다.
        accessibility:
          type: boolean
          x-proposal: 제안 — 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)
          description: |
            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)** — 요청 07 (§21).
            장애인 편의시설(경사로·휠체어 동선·장애인 화장실 등). **세부 항목은 받지 않는다** —
            화면이 칩 하나로 묻는다. 기존 병원은 `false` 다(백필 없음).
        nightCare:
          type: boolean
          readOnly: true
          x-proposal: 제안 — 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)
          description: |
            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)** — 요청 07 (§21, DB §16.6).
            **읽기 전용 파생값이다. 저장하지 않는다.**

            `businessHours` 중 `isClosed=false` 인 요일의 **종료 시각이 18:00 이상**인 요일이
            하나라도 있으면 `true` (`derivedHourFeatures`). 요청 본문에 오면
            **`422 FEATURE_NOT_WRITABLE`** — 조용히 무시하면 "껐는데 다시 켜진다" 가 된다.

            **저장값이 아닌 이유**: 같은 사실이 두 곳에 있으면 어긋난다. 저장값이면
            "수요일을 21시까지로 바꿨는데 야간 칩은 꺼져 있는 병원" 이 생기고, 그것이 요청서 07 의
            확인 항목(`수요일 진료를 21:00까지로 바꾸면 야간 진료가 자동으로 켜진다`)이다.

            ⚠ **`businessHours[].hours` 가 자유 문자열이라 파싱에 의존한다** (`10:00 - 19:00`,
            `휴진`, `09:00-13:00 / 14:00-18:00`). **읽을 수 없으면 `false`** 다 — 거짓 광고가 되지
            않는 쪽으로 깨뜨린다. 진료시간 구조화는 07 보다 큰 작업이라 미결이다 (열린 질문 3).
        weekend:
          type: boolean
          readOnly: true
          x-proposal: 제안 — 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)
          description: |
            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)** — 요청 07 (§21, DB §16.6).
            **읽기 전용 파생값이다.** 토·일 중 `isClosed=false` 이고 `hours` 가 공백이 아닌 요일이
            하나라도 있으면 `true`. **문자열을 파싱하지 않아 `nightCare` 와 달리 견고하다.**
            요청 본문에 오면 `422 FEATURE_NOT_WRITABLE`.

    HospitalProcedurePrice:
      type: object
      x-proposal: 제안 — 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)
      description: |
        > 🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안). 확정 계약이 아니다** — 요청 07
        > (`docs/api/README.md` §21, 데이터 설계 `docs/database/README.md` §16.1).
        > 합의 전까지 구현하지 않는다.

        병원이 취급하는 시술 한 줄과 **그 시술의 비급여 가격 범위**. `Hospital.procedures[]` 의 항목이고,
        병원 상세의 `시술·가격` 섹션이 읽는 값이다.

        **상태가 셋이고 셋 다 다른 사실이다** (DB §16.1):

        | # | `priceOnRequest` | `priceMin`/`priceMax` | 뜻 | 병원 상세에서 |
        |---|---|---|---|---|
        | ① | `false` | 값 | 가격 범위를 적었다 | `120만원 ~ 180만원` |
        | ② | `true` | `null` | **`상담 후 안내` 를 골랐다** | `상담 후 안내` |
        | ③ | `false` | `null` | 체크만 하고 아직 안 적었다 | **가격 줄 없음** (시술 이름만) |

        **②와 ③을 한 값으로 합치지 않은 이유는 완성도다.** 합치면 시술 체크만으로 `시술별 가격`
        항목이 충족되어 **아무도 채운 적 없는데 항상 100%인 칸**이 된다. 환자 화면에서 둘이 거의
        같아 보이는 것은 사실이지만 담당자에게는 다른 사실이다 — ②는 결정이고 ③은 미입력이다.
        ③을 환자에게 `상담 후 안내` 로 보여줄지는 **화면 결정**이고(기본 제안은 "그리지 않는다"),
        계약이 둘을 구분해 내려주므로 어느 쪽으로 정해도 응답은 바뀌지 않는다.

        **금액은 원(정수)다.** 화면의 `최소 ~ 최대 만원` 칸은 표시 단위이고 변환(×10,000)은
        클라이언트가 한다 (info 의 공통 규약 `금액`, DB §16.3). 한 응답 안에서 이 값만 만원이면
        `priceRange` 와 단위가 다른 두 금액이 섞인다.

        **시술 이름을 함께 내려주지 않는다.** 이름의 출처는 `GET /procedures`(캐시되는 마스터)와
        프런트 `taxonomy.ts` 하나이고, 여기에 또 실으면 같은 라벨이 두 곳에서 갈린다.
        **대분류 묶음·`준비중` 배지·`원데이` 표시도 화면의 몫**이다 (요청서 07 이 "노출 규칙은
        그대로" 라고 못 박은 자리다).
      required: [procedureId, priceMin, priceMax, priceOnRequest]
      properties:
        procedureId:
          $ref: '#/components/schemas/ProcedureId'
        priceMin:
          type: [integer, 'null']
          description: |
            원(정수). `priceMax` 와 **둘 다 값이거나 둘 다 `null`** 이다 — 한쪽만 채워진 행은 없다.
          example: 1200000
        priceMax:
          type: [integer, 'null']
          description: '원(정수). `priceMin === priceMax` 는 정상이다 (정찰제).'
          example: 1800000
        priceOnRequest:
          type: boolean
          description: |
            `상담 후 안내` 를 고른 시술. `true` 면 `priceMin`·`priceMax` 는 **반드시 둘 다 `null`** 이다.
          example: false

    HospitalProcedureInput:
      type: object
      x-proposal: 제안 — 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)
      description: |
        > 🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안). 확정 계약이 아니다** — 요청 07
        > (`docs/api/README.md` §21, 데이터 설계 `docs/database/README.md` §16.12).

        병원 저장 요청(`HospitalCreateRequest.procedures` · `HospitalUpdateRequest.procedures`)의
        시술 한 줄. **체크된 시술만 보낸다** — 목록에 없는 시술은 체크 해제로 읽혀 가격과 함께 사라진다.

        **`procedureIds` 와 `prices` 두 배열로 나누지 않은 이유**: 그러면 "체크는 됐는데 가격 배열에
        없는 시술"·"가격은 있는데 체크 안 된 시술" 을 계약이 허용하게 된다. 저장소에서 없앤 상태를
        계약이 되살리는 모양이다 (DB §16.1).

        **검증** — 어긋난 조합은 전부 `422 VALIDATION_FAILED` 의 `details[]` 로 내려가고,
        `field` 는 **인덱스 경로**(`procedures[2].priceMin`)다. 그래야 폼이 그 줄의 그 칸을 짚는다.

        | 어긋난 조합 | `details[].code` |
        |---|---|
        | `priceOnRequest=true` 인데 금액이 왔다 | `PRICE_NOT_ALLOWED_ON_REQUEST` |
        | `priceMin`/`priceMax` 중 **한쪽만** 왔다 | `PRICE_INCOMPLETE` |
        | `priceMin > priceMax` | `PRICE_RANGE_INVERTED` |
        | `0` 이하이거나 상한(**제안: 1억원**) 초과 | `PRICE_OUT_OF_RANGE` |
        | 같은 `procedureId` 가 배열에 두 번 | `PROCEDURE_DUPLICATED` |

        **서버가 우선순위로 자동 해결하지 않고 거절하는 이유**: 화면에서 `상담 후 안내` 와 금액 입력은
        동시에 켤 수 없다. 그 조합이 오면 클라이언트 버그이고, 조용히 한쪽을 이기게 하면 담당자는
        "저장했는데 다르게 들어갔다" 를 보게 된다.

        **`0` 을 금지하는 이유**: `0원 ~ 50만원` 은 "무료" 로 읽힌다. 미입력은 `null` 이 표현하므로
        `0` 을 센티널로 쓸 자리도 없다. **만원 배수를 강제하지 않는다** — 입력 UI 가 만원 칸인 것은
        화면 사정이고, 천원 단위 입력이 생기는 날 계약부터 막힌다. 상한값은 **제안**이다 (열린 질문 4).

        **가격을 붙일 수 있는 단위는 서버 시술 13종(`ProcedureId`)뿐이다.** 세부 시술 31개 중 18개는
        서버에 마스터가 없고 화면에서도 체크가 막혀 있다(`준비중`). 나머지 13개는 서버 id 와 1:1 이라
        "세부 시술별 가격" 과 "서버 시술별 가격" 이 **지금은 같은 것**이다 (DB §16.2).
      required: [procedureId]
      properties:
        procedureId:
          $ref: '#/components/schemas/ProcedureId'
        priceMin:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000000
          description: 원(정수). 생략·`null` 이면 "아직 적지 않음"(③)이다.
          example: 1200000
        priceMax:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000000
          example: 1800000
        priceOnRequest:
          type: boolean
          default: false
          description: '`상담 후 안내` 체크. `true` 로 보내면서 금액을 함께 보내면 `422 PRICE_NOT_ALLOWED_ON_REQUEST`.'

    Sponsorship:
      type: object
      description: |
        광고 상태를 **서버가 계산한** 결과. 클라이언트가 기기 시계로 기간을 판단하지 않게 하려고 둔다.
        원본 필드(`isSponsored`, `sponsoredRank`, `sponsoredStartDate`, `sponsoredEndDate`)도 함께 유지된다.
      required: [isActive, isPlacementEligible]
      properties:
        isActive:
          type: boolean
          description: |
            광고 계약이 있고 오늘이 기간 안. **`광고` 배지 노출 조건이다.** 평점을 보지 않는다.
        isPlacementEligible:
          type: boolean
          description: |
            `isActive` && `rating >= 3.5` && (요청한 `procedureId` 가 `sponsoredCategories` 에 포함
            또는 `recommended=true` 요청). **목록 상단 노출 조건이다.**
            평점 3.5 미만이면 배지는 붙지만 위로 올라가지 않는다.
        placementRank:
          type: [integer, 'null']
          description: 상단 노출 슬롯 안에서의 순서 (작은 값이 먼저). `isPlacementEligible=false` 면 null.
          example: 1
        activeUntil:
          type: [string, 'null']
          format: date
          description: 노출 종료일. 병원 수정 화면의 `광고 현황` 카드가 쓴다.
          example: '2026-09-30'

    Hospital:
      type: object
      description: |
        `frontend/src/types/domain.ts` 의 `Hospital` 을 그대로 보존하고 계산 필드만 덧붙였다.
        기존 필드를 지우거나 이름을 바꾸지 않았으므로 프론트엔드 타입은 수정 없이 통과한다.

        덧붙인 것: `sponsorship`, `representativeSpecialty`, `distanceKm`.

        > 🚧 **제안 — 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안), 요청 07 (§21):** `procedures`·`tagline` 두 필드가
        > 더 늘고, **기존 필드는 하나도 지워지지 않는다.** `procedureIds` 는 `procedures` 에서
        > **파생되는 읽기 전용 값**으로 남고(두 출처가 아니다), `priceRange` 는 **역할만** 바뀐다
        > (시술별 가격이 하나도 없을 때의 대체값 — 아래 `priceRange` 설명). 그래서 **병원 카드·검색·
        > 찜 목록·지도 투영은 한 글자도 바뀌지 않는다.** 새 두 필드를 `required` 에 넣지 않은 것이
        > "아직 제안" 의 기계적 표현이다.

        > 🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안), 요청 06 (§20).** `phone`·`addressDetail` 두 필드가 늘고,
        > `approvalStatus` 는 여기에 **들어오지 않는다.**
        > 공개 응답에 승인 상태를 싣지 않는 이유는 단순하다 — **공개 응답에 실리는 병원은
        > 전부 `approved` 다**(`isPubliclyListed`). 값이 하나뿐인 필드는 정보가 아니고,
        > 클라이언트가 그 값을 보고 다시 거르기 시작하면 **같은 판정이 두 곳**에 생긴다.
        > 관리 시야의 승인 상태는 `ManagedHospital` 이 가진다.
      required:
        - id
        - name
        - specialty
        - region
        - latitude
        - longitude
        - thumbnail
        - images
        - procedureIds
        - priceRange
        - rating
        - reviewCount
        - consultCount
        - consultAvailable
        - businessHours
        - directions
        - features
        - isOneDay
        - isRecommended
        - isSponsored
        - sponsoredCategories
        - sponsoredRank
        - sponsoredStartDate
        - sponsoredEndDate
        - tags
        - address
        - introduction
        - events
        - sponsorship
      properties:
        id:
          type: string
          example: h1
        name:
          type: string
          example: 강남 스마일 치과
        specialty:
          type: string
          description: '`전문 분야` 자유 문자열. 예: `임플란트 전문의원`. 전문의의 `specialty` 와 다른 개념이다.'
          example: 임플란트 전문의원
        region:
          type: string
          example: 서울 강남구
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        thumbnail:
          type: string
          format: uri
          description: 대표 이미지. 관리자가 비워 두면 서버가 기본 이미지를 넣는다.
        images:
          type: array
          description: |
            병원 상세의 사진 캐러셀. 관리자 폼에는 이 배열을 직접 편집하는 칸이 없다.
            **등록** 화면은 `대표 이미지 URL` 값을 `[thumbnail]` 로 넣어 우회한다(캐러셀이
            비어 보이는 문제만 막는다). **수정** 화면은 여전히 이 키를 보내지 않는다 —
            `대표 이미지 URL` 을 바꿔도 캐러셀이 안 바뀌는 증상이 수정 화면에만 남아 있다
            (`docs/features/known-issues.md`).

            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)** — 요청 07 (§21, DB §16.5):
            **모양은 그대로 `string[]` 이다.** 바뀌는 것은 ① 수정 화면이 이 배열을 **보내게 되고**
            (`HospitalUpdateRequest.images`), ② 값이 **파일 업로드로 발급된 공개 URL** 일 수 있다는 것
            (`POST /uploads`, `purpose=hospital_photo` → `UploadedFileRef.publicUrl`)뿐이다.
            외부 URL 사진(기존 11곳)도 그대로 쓸 수 있다.

            **순서가 계약이다 — 첫 항목이 대표 사진**이고, 저장 트랜잭션이 `thumbnail` 을 그 값으로
            함께 갱신한다. `is_primary` 같은 두 번째 판정을 만들지 않는 이유이고, 위에 적힌
            known-issue(`대표 이미지를 바꿔도 캐러셀이 그대로`)가 **그 동기화로 사라진다.**
            최대 **11장**(대표 1 + 내부 10) — 초과는 `422 TOO_MANY_IMAGES`.
            3장 이상은 **권장일 뿐 저장을 막지 않는다** — 막으면 사진 2장인 병원이 다른 칸도 저장할 수
            없게 된다. 권장은 완성도 항목 `photos` 로 말한다.
          items:
            type: string
            format: uri
        procedureIds:
          type: array
          minItems: 1
          description: |
            이 병원이 취급하는 시술. 병원 카드·상세·검색·전문의 화면이 전부 쓰는 값이다.

            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)** — 요청 07 (§21, DB §16.12):
            **모양도 소비자도 바뀌지 않는다. 바뀌는 것은 출처뿐이다** — 합의되면 이 배열은
            `procedures[].procedureId` 에서 **파생되는 읽기 전용 값**이 된다(두 출처가 아니다).
            **바뀌는 쪽은 요청이다**: 저장은 `procedures` 배열 하나로 하고, 요청에
            `procedureIds` 와 `procedures` 가 **둘 다 오면 `422`** 다.
          items:
            $ref: '#/components/schemas/ProcedureId'
        procedures:
          type: array
          x-proposal: 제안 — 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)
          description: |
            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안). 확정 계약이 아니다** — 요청 07
            (§21, DB §16.1). 합의 전까지 구현하지 않는다.

            시술과 **시술별 가격**. `procedureIds` 와 **같은 목록이고 순서도 같다** —
            `procedureIds` 가 이 배열에서 파생된다. 병원 상세의 `시술·가격` 섹션이 읽는 값이고,
            전체 가격대(`priceRange`)와의 우선순위는 `priceRange` 설명의 표 하나로 정해진다.

            **대분류 9개로 묶는 것·`준비중` 배지·`원데이` 표시는 화면의 몫이다** — 서버는 시술 13종의
            평면 목록만 내려준다 (요청서 07: "세부 시술 → 카테고리 노출 규칙은 그대로",
            "원데이는 시술이 아니라 병원 특징").

            **지금은 목록 응답(`GET /hospitals`)에도 실린다고 가정하지 마라** — 상세
            (`GET /hospitals/{id}`)가 유일한 소비자다. 탐색 `가격 비교표` 를 시술별 가격으로
            바꾸기로 하면 목록 응답에도 필요해지고 **응답 크기가 늘어난다** (열린 질문 9).

            `required` 에 넣지 않은 것이 "아직 제안" 의 기계적 표현이다. 합의되면 required 가 되고
            `minItems: 1` 이 붙는다 (`procedureIds` 의 제약이 그대로 옮겨온다).
          items:
            $ref: '#/components/schemas/HospitalProcedurePrice'
        priceRange:
          $ref: '#/components/schemas/PriceRange'
          description: |
            병원 전체 가격대.

            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)** — 요청 07 (§21, DB §16.4):
            **값도 모양도 그대로고 역할만 바뀐다.** 요청서 07 이 "기존 전체 가격대 값은 바로 지우지
            말고, 시술별 가격이 없을 때 대신 보여주는 값으로 남겨 두기" 라고 지시한 자리다.

            **고르는 규칙은 한 곳이다** (`hospitalPriceSection` — 응답에 둘 다 싣고 화면이 고른다):

            | 조건 | 병원 상세 `시술·가격` 섹션 |
            |---|---|
            | `procedures` 에 ① 또는 ② 가 **1개 이상** | 시술별 목록 (`perProcedure`) |
            | 전부 ③ 이고 `min`·`max` 가 **둘 다 0 초과** | 전체 가격대 한 줄 (`hospitalRange`) |
            | 전부 ③ 이고 가격대도 `0` | **아무것도 그리지 않는다** (`none`) |

            **섞지 않는다** — 시술별 목록을 그릴 때 가격이 없는(③) 시술 줄에 전체 가격대를 내려 적지
            않는다. 적는 순간 **"그 시술의 가격" 이라는 거짓말**이 된다. 비교하려고 만든 기능이 비교를
            망치는 자리다.

            **다른 소비자는 지금 그대로다**: 병원 카드의 가격 줄은 한 줄이라 시술 13개를 담을 자리가
            없고, 탐색 `가격 비교표` 도 이 값을 쓴다 (바꿀지는 열린 질문 9).
            **마이그레이션 직후 기존 11곳은 전부 ③ 이라 화면이 지금과 똑같다** (백필이 없다).
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
          description: 신규 등록 병원은 0. 후기로부터 집계되지 않는다 (후기 작성 기능이 없다).
          example: 4.8
        reviewCount:
          type: integer
          example: 312
        consultCount:
          type: integer
          example: 90
        consultAvailable:
          type: boolean
          description: |
            false 면 `POST /consult-requests` 가 `409 CONSULT_CLOSED` 를 반환한다.
            화면 버튼도 `상담 마감` 으로 잠긴다.
        businessHours:
          type: array
          items:
            $ref: '#/components/schemas/BusinessHourEntry'
        directions:
          type: string
          description: '`찾아오시는 길` 자유 텍스트. 빈 문자열 가능.'
        features:
          $ref: '#/components/schemas/HospitalFeatures'
        isOneDay:
          type: boolean
          description: 당일 보철 가능 여부. 병원 속성이며 시술 분류가 아니다.
        isRecommended:
          type: boolean
          description: 에디터 추천. 시술 칩 `추천` 과 `🌟 추천` 배지의 출처.
        isSponsored:
          type: boolean
        sponsoredCategories:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureId'
        sponsoredRank:
          type: [integer, 'null']
        sponsoredStartDate:
          type: [string, 'null']
          format: date
        sponsoredEndDate:
          type: [string, 'null']
          format: date
        tags:
          type: array
          items:
            type: string
        address:
          type: string
        phone:
          type: [string, 'null']
          description: |
            🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안).** 치과 대표번호. 표시용 원본.

            **`hospitals` 에 전화번호 칸이 아예 없었다** (fixture 에도 없다 — 병원 상세에
            전화번호가 보이지 않는 이유다). 직접 가입 폼의 `치과 대표번호` 가 이 값을 만든다.

            **공개 응답에 내릴 것인가는 제품 결정이다 (열린 질문, §20).**
            내리는 쪽을 권한다 — 요청 08 이 확정한 알림 문구가 `변경이 필요하면 **병원에 전화해
            주세요**` 인데, 지금 그 번호가 앱 어디에도 없다. 계약에 필드만 두고 공개 시야에서
            `null` 로 가리는 것도 가능하지만, 그러면 "입력 안 함" 과 "가려짐" 이 같은 값이 된다.
            합의 전까지는 **관리 시야(`ManagedHospital`)에서만 채워진다고 읽어라.**

            기존 11곳에는 값이 없어 `null` 이다 (백필할 값이 없다).
          example: 02-1234-5678
        addressDetail:
          type: [string, 'null']
          description: |
            🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안).** 상세 주소 (`3층 301호`).

            `address` 를 쪼개지 않고 칸을 더한 이유: 주소 검색 UI 가 돌려주는 것은 한 덩어리이고,
            다시 검색하면 그 값이 **통째로 교체된다.** 상세 주소를 같은 칸에 이어 붙이면
            재검색 때 사라진다. 표시용 합치기는 클라이언트의 `formatAddress(address, addressDetail)`
            한 줄이다 (DB §14.2).

            공개 노출 여부는 `phone` 과 같은 열린 질문이다. 찾아가는 데 필요한 정보라
            공개하는 쪽이 자연스럽지만 제품 결정이다.
          example: 3층 301호
        introduction:
          type: string
        tagline:
          type: string
          maxLength: 40
          x-proposal: 제안 — 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)
          description: |
            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안). 확정 계약이 아니다** — 요청 07
            (§21, DB §16.7). 리스트 카드에 노출되는 **한 줄 소개** (최대 40자).

            **`introduction` 과 다른 필드다** — 카드 한 줄 vs 상세 문단. 합치지 않은 이유는 완성도
            항목 `introduction`(30자 이상)이 **긴 소개**를 묻고 있어서다. 한 줄 소개를 같은 칸에 넣으면
            그 판정이 무엇을 묻는지 알 수 없게 된다.

            **빈 문자열이 정상값이다**(`null` 이 아니다) — 카드가 묻는 것은 "그릴 줄이 있는가" 하나뿐이고,
            안 보이게 하려면 비우면 된다. 노출 on/off 플래그를 따로 두지 않는 이유다.
            기존 11곳은 `''` 다 (백필할 값이 없다).

            **40자를 넘기면 서버가 자르지 않고 `422 TAGLINE_TOO_LONG`** 이다 —
            말없이 자르면 병원이 쓴 문장이 바뀐다.
          example: 20년 경력 보철 전담 · 당일 보철 가능
        events:
          type: array
          description: |
            병원 상세의 `진행중인 이벤트` 문구 배열. `Promotion`(할인가 있는 이벤트 카드)과 **다른 것**이다.
            이름이 겹쳐 혼동을 부르는 지점이라 `docs/api/README.md` 에 적어 두었다.
          items:
            type: string
        sponsorship:
          $ref: '#/components/schemas/Sponsorship'
        representativeSpecialty:
          type: [string, 'null']
          description: |
            병원 카드의 `OO전문의 상주` 배지용. 그 병원의 인증된 전문의 중 첫 번째 사람의 전공.
            없으면 null.

            **계산해서 내려주는 이유:** 지금 카드는 이 값을 얻으려고 전문의 전체 목록을 클라이언트에서 뒤진다.
            병원 목록 화면에서 병원마다 전문의를 조회하면 N+1 이 되고, 목록 한 번에 전문의 전량을
            내려받아야 한다.
          example: 치과보철전문의
        distanceKm:
          type: [number, 'null']
          format: double
          description: |
            `latitude`/`longitude`/`radiusKm` 를 함께 보낸 요청(지도 보기)에서만 채워진다.
            그 밖에는 null. 지도 아래 병원 카드의 `시술 · 거리 · 후기 수` 표시가 쓴다.
          example: 1.2

    HospitalApprovalStatus:
      type: string
      enum: [pending, approved, rejected]
      description: |
        🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안).** 병원 승인 상태
        (`docs/database/README.md` §14.1).

        | 값 | 뜻 |
        |---|---|
        | `pending` | 가입했고 서류 검수 전. **관리자 화면은 쓰고 환자 앱에는 보이지 않는다** |
        | `approved` | 검수 통과. 환자 앱에 보인다. 운영자가 만든 병원과 기존 11곳도 이 값이다 |
        | `rejected` | 반려. 사유가 `approvalNote` 에 남는다 |

        **노출 판정은 이 값 단독이 아니다** — `deletedAt === null && approvalStatus === 'approved'`
        둘을 함께 본다(`isPubliclyListed`). soft delete 된 병원이 `approved` 이면
        배지가 `앱 노출 중` 이라고 **거짓말을 한다** (DB §14.4 의 경고).

        **판정을 부정형(`!== 'rejected'`)으로 쓰지 않는다.** 값이 늘어날 때 긍정형은 저절로
        안전한 쪽(안 보임)으로 떨어지고 부정형은 그 반대다.

        `suspended`(노출 중단)를 만들지 않았다 — 요구한 화면이 없고, 운영상 내리는 수단은
        `deleted_at` 이 이미 있다.

    AdminPosition:
      type: string
      enum: [director, manager, coordinator, etc]
      description: |
        🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안).** 담당자의 **그 병원에서의** 직책
        (DB §14.6).

        | 코드 | 화면 라벨 |
        |---|---|
        | `director` | `대표원장` |
        | `manager` | `실장` |
        | `coordinator` | `코디네이터` |
        | `etc` | `기타` |

        **라벨이 아니라 코드를 값으로 쓴다** — 표시 문구가 바뀔 수 있고(`대표원장`→`원장`),
        그때 과거 행을 UPDATE 하면 "그때 뭐라고 적었는가" 가 사라진다
        (`ConsultCancelReason`·`InquiryTopic` 과 같은 처리).

        **사람의 속성이 아니라 연결의 속성이다.** `hospital_admins` 가 M:N 이라 한 사람이
        A 병원 대표원장이면서 B 병원 코디네이터일 수 있다.

        **`null` 이 정상값이다** — 운영자가 지정한 담당자
        (`POST /hospitals/{id}/admins` 에는 직책 입력이 없다). 화면은 그 경우 직책 줄을
        **생략한다**(지어내지 않는다).

    ManagedHospital:
      description: |
        🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안).** 관리 시야의 병원 —
        공개 `Hospital` + 관리 화면만 쓰는 두 필드.

        **두 필드를 `Hospital` 에 넣지 않은 이유**: `Hospital` 은 비로그인 응답에도 쓰인다.
        승인 상태와 "내 직책" 은 공개 자원의 속성이 아니다. 스키마를 나누면 공개 응답에
        새어 나갈 길 자체가 없다 (`piiMasked` 를 플래그로 둔 것과 달리, 여기서는
        **필드가 존재하지 않는 것**이 가장 싼 보장이다).

        **합의 전에는 이 스키마를 `Hospital` 과 같다고 읽어라** — 추가된 두 필드를
        `required` 에 넣지 않은 것이 그 뜻이다. 합의되면 `approvalStatus` 는 required 가 된다
        (사이드 메뉴 배지가 매 행에 그 값을 필요로 한다).
      allOf:
        - $ref: '#/components/schemas/Hospital'
        - type: object
          properties:
            approvalStatus:
              $ref: '#/components/schemas/HospitalApprovalStatus'
            position:
              oneOf:
                - $ref: '#/components/schemas/AdminPosition'
                - type: 'null'
              description: |
                🚧 제안. **요청자 본인의** 이 병원에서의 직책이다 — 담당자 전원의 직책이 아니다.
                관리자 사이드 메뉴 하단이 `{직책 라벨} · {승인 완료 · 앱 노출 중 | 승인 대기}` 를
                그리는 데 쓴다 (요청 05 에서 **저장될 곳이 없어 미뤄진** 줄이다 —
                `docs/features/known-issues.md`).

                `operator` 가 보는 목록에서는 **항상 `null`** 이다. 운영자는 담당자가 아니다
                (`CANNOT_ASSIGN_OPERATOR` 와 같은 선). 담당자 전원의 직책이 필요하면
                `GET /hospitals/{id}/admins` 가 그 질문의 자리다.

    HospitalCreateRequest:
      type: object
      description: |
        관리자 병원 등록 폼. 필수 항목은 화면 문서의 `필수` 표시와 일치한다.
        `id`·집계 필드·광고 필드·`isRecommended` 는 받지 않는다.
      required: [name, region, address, latitude, longitude, priceRange, procedureIds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        specialty:
          type: string
          maxLength: 100
          default: ''
        region:
          type: string
          minLength: 1
          maxLength: 50
        address:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            `GET /geo/address-search` 결과에서 고른 값이어야 한다. `latitude`/`longitude` 도 그 결과의 값이다.
            직접 타이핑한 주소는 좌표가 없어 지도에 찍히지 않는다.
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        thumbnail:
          type: string
          format: uri
          description: 생략하면 서버가 기본 이미지를 넣는다.
        images:
          type: array
          description: |
            병원 상세 사진 캐러셀. 순서가 그대로 저장된다.

            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)** — 요청 07 (§21, DB §16.5):
            **첫 항목이 대표 사진**이고 서버가 `thumbnail` 을 그 값으로 함께 채운다
            (둘을 따로 보내 어긋나게 둘 수 없다). 값은 외부 URL 이거나
            `POST /uploads`(`purpose=hospital_photo`)가 돌려준 `publicUrl` 이다.
            **최대 11장**(대표 1 + 내부 10) — 초과는 `422 TOO_MANY_IMAGES`.
            합의되면 이 필드에 `maxItems: 11` 이 붙는다. **지금 붙이지 않은 것은
            확정 계약의 제약을 제안이 조용히 바꾸지 않기 위해서다.**
          items:
            type: string
            format: uri
        introduction:
          type: string
          maxLength: 2000
          default: ''
        tagline:
          type: string
          maxLength: 40
          default: ''
          x-proposal: 제안 — 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)
          description: |
            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)** — 요청 07 (§21).
            한 줄 소개(`Hospital.tagline`). 40자 초과는 `422 TAGLINE_TOO_LONG` —
            **서버가 자르지 않는다.**
        priceRange:
          $ref: '#/components/schemas/PriceRange'
        tags:
          type: array
          items:
            type: string
            maxLength: 30
        procedureIds:
          type: array
          minItems: 1
          description: |
            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)** — 요청 07 (§21, DB §16.12):
            합의되면 이 필드는 **요청에서 사라지고 `procedures` 가 대신한다**
            (`required` 도 `procedureIds` → `procedures` 로 바뀐다). 둘 다 보내면 `422` 다 —
            우선순위 규칙을 만들면 "둘 다 보내도 된다" 는 신호가 된다.
            **지금 required 를 바꾸지 않은 것은 확정 계약을 제안이 깨지 않게 하기 위해서다.**
          items:
            $ref: '#/components/schemas/ProcedureId'
        procedures:
          type: array
          minItems: 1
          x-proposal: 제안 — 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)
          description: |
            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안). 확정 계약이 아니다** — 요청 07
            (§21, DB §16.12). 시술 체크 + **시술별 가격**을 한 배열로 받는다.
            `procedureIds` 를 대체하며 둘 다 오면 `422`.
          items:
            $ref: '#/components/schemas/HospitalProcedureInput'
        consultAvailable:
          type: boolean
          default: true
          description: 폼 기본값이 켜짐이다.
        isOneDay:
          type: boolean
          default: false
        businessHours:
          type: array
          description: 생략하면 서버 기본 스케줄 (월~금 `09:30 - 18:30`, 토 `09:30 - 14:00`, 일 휴진).
          items:
            $ref: '#/components/schemas/BusinessHourEntry'
        directions:
          type: string
          maxLength: 500
          default: ''
        features:
          $ref: '#/components/schemas/HospitalFeatures'
        isRecommended:
          type: boolean
          default: false
          description: |
            에디터 추천. **`operator` 만 설정할 수 있다** (이 오퍼레이션 자체가 `operator` 전용이다).
            `PATCH /hospitals/{id}` 에서 `hospital_admin` 이 보내면 `422 FIELD_NOT_WRITABLE`.
        doctors:
          type: array
          description: |
            등록과 동시에 소속 전문의를 넣을 수 있다. 폼이 병원과 전문의를 한 번에 저장하기 때문에
            두 요청으로 나누면 중간 실패 시 전문의 없는 병원이 남는다. 전부 `pending` 으로 들어간다.
          items:
            $ref: '#/components/schemas/DoctorUpsert'
        adminEmails:
          type: array
          description: |
            담당자로 지정할 **이미 가입된** 계정의 이메일. 생략하면 담당자 없는 병원이 만들어지고
            나중에 `POST /hospitals/{id}/admins` 로 붙인다.

            **운영자 자신은 담당자가 되지 않는다.** 등록자가 자동으로 관리자가 되는 초안 설계는 폐기했다.
            가입되지 않은 이메일이 있으면 병원을 만들지 않고 `404 USER_NOT_FOUND` 로 전체를 되돌린다 —
            "병원은 생겼는데 담당자 지정만 실패" 라는 어중간한 상태를 막는다.
          items:
            type: string
            format: email

    HospitalUpdateRequest:
      type: object
      description: |
        부분 수정. 보낸 필드만 바뀐다. `HospitalCreateRequest` 와 같은 필드에 필수 제약만 없다.

        광고·집계 필드는 누구도 보낼 수 없다 (`422 FIELD_NOT_WRITABLE`).
        `isRecommended` 는 **`operator` 만** 보낼 수 있고 `hospital_admin` 이 보내면 거절된다.

        > 🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안). 확정 계약이 아니다** — 요청 07
        > (§21, DB §16.12). 필드 셋이 는다: `procedures`·`tagline`·(기존)`images` 의 실제 사용.
        >
        > ⚠️ **이 스키마에서 가장 조용한 사고 지점**: 지금 서버는 `procedureIds` 배열을 받아
        > 조인 행을 **전체 교체**한다(delete all → insert). 그 테이블에 가격 컬럼이 생기는데
        > 교체 방식을 그대로 두면 **병원 이름만 고쳐 저장해도 시술별 가격이 전부 사라진다.**
        > 그래서 `procedures` 는 **교체가 아니라 머지**다 (아래 필드 설명 · `PATCH /hospitals/{id}` 설명).
        >
        > **파생 특징(`features.nightCare`·`features.weekend`)을 보내면 `422 FEATURE_NOT_WRITABLE`** 이다.
        > 조용히 무시하지 않는 이유는 `isRecommended` 와 같다 — "저장했는데 안 바뀐다" 가 된다.
      properties:
        isRecommended:
          type: boolean
          description: '`operator` 전용. `hospital_admin` 요청에 포함되면 `422 FIELD_NOT_WRITABLE`.'
        name:
          type: string
          minLength: 1
          maxLength: 100
        specialty:
          type: string
          maxLength: 100
        region:
          type: string
          minLength: 1
          maxLength: 50
        address:
          type: string
          minLength: 1
          maxLength: 200
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          description: |
            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)** — 요청 07 (§21, DB §16.5·16.12).
            **수정 화면이 드디어 이 키를 보낸다** (지금은 보내지 않아서 `대표 이미지 URL` 을 바꿔도
            캐러셀이 안 바뀐다 — `docs/features/known-issues.md`).

            - **전체 교체다** (`procedures` 와 다르다). 사진 행에는 "그 행에만 붙은 입력값" 이 없고
              순서가 곧 전부라 교체가 머지보다 단순하다. 서버가 `sort_order` 를 **0..n-1 로 다시
              매긴다** — 같은 순서값이 여럿이면 캐러셀 순서가 DB 반환 순서가 되고, 대표 사진이
              날마다 바뀌는 버그가 거기서 나온다
            - **생략하면 사진을 건드리지 않는다.** 빈 배열(`[]`)은 "전부 지운다" 는 뜻이고, 그때
              `thumbnail` 은 **지우지 않고 그대로 둔다**
            - **첫 항목이 대표**이고 서버가 `thumbnail` 을 그 값으로 동기화한다. 같은 요청에
              `thumbnail` 을 따로 보내 서로 다른 값을 지정하면 `422` (판정이 두 곳이 되지 않게)
            - 값은 외부 URL 이거나 `POST /uploads`(`purpose=hospital_photo`)의 `publicUrl` 이다.
              서버는 **발급한 값 그대로 역조회**해 그 파일을 이 병원 것으로 claim 한다 —
              URL 을 파싱하지 않는다 (URL 형태는 열린 질문 7·11)
            - 남의 파일·없는 파일·파기된 파일을 가리키면 **`422 UPLOAD_NOT_FOUND`**
              (네 경우를 한 코드로 합치는 것은 §20.3 과 같은 판단이다 — 구분해 주면
              "그 자리에 남의 파일이 있다" 가 샌다)
            - 최대 **11장** → 초과는 `422 TOO_MANY_IMAGES`. 같은 URL 이 두 번 오면 `422`
          items:
            type: string
            format: uri
        introduction:
          type: string
          maxLength: 2000
        tagline:
          type: string
          maxLength: 40
          x-proposal: 제안 — 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)
          description: |
            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)** — 요청 07 (§21).
            한 줄 소개. 40자 초과는 `422 TAGLINE_TOO_LONG` — **서버가 자르지 않는다.**
            지우려면 빈 문자열을 보낸다.
        priceRange:
          $ref: '#/components/schemas/PriceRange'
          description: |
            전체 가격대. 🚧 **[제안] 요청 07 (§21):** 계속 보낼 수 있다 — **지우지 않는다.**
            시술별 가격이 하나도 정해지지 않은 병원의 상세가 이 값으로 그려진다
            (폴백 규칙은 `Hospital.priceRange` 설명의 표).
        tags:
          type: array
          items:
            type: string
            maxLength: 30
        procedureIds:
          type: array
          minItems: 1
          description: |
            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)** — 요청 07 (§21, DB §16.12):
            합의되면 이 필드는 **요청에서 사라지고 `procedures` 가 대신한다.** 둘 다 보내면 `422`.

            ⚠️ **합의 전의 동작을 분명히 해 둔다**: 지금 이 배열은 조인 행을 **전체 교체**한다.
            가격 컬럼이 들어간 뒤에도 이 필드를 계속 받아 교체한다면 **가격이 함께 지워진다** —
            그래서 `procedures` 와 **같은 요청에 섞을 수 없고**, 전환이 끝나면 이 필드를 내린다.
          items:
            $ref: '#/components/schemas/ProcedureId'
        procedures:
          type: array
          minItems: 1
          x-proposal: 제안 — 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)
          description: |
            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안). 확정 계약이 아니다** — 요청 07
            (§21, DB §16.12). 시술 체크와 **시술별 가격**을 한 배열로 받는다.

            **저장 규칙은 머지다 — 교체가 아니다:**

            | 요청의 상태 | 서버가 하는 일 |
            |---|---|
            | 필드를 **생략** | 시술도 가격도 **건드리지 않는다** (부분 수정의 뜻 그대로) |
            | 배열에 있는 시술 | **upsert** — 보낸 가격 값으로 덮는다 |
            | 배열에 **없는** 기존 시술 | **delete** (체크 해제 = 행 삭제 = 가격도 함께 사라짐) |
            | 빈 배열 `[]` | `422` (`minItems: 1`) — 시술 0개 병원은 환자가 시술로 찾을 수 없다 |

            **"가격 칸을 비워서 보내면 가격만 지운다"** 가 성립한다 —
            `{ procedureId, priceMin: null, priceMax: null, priceOnRequest: false }` 가
            ③(미입력)이고, 그것은 정상 상태다.

            **한 요청 = 한 트랜잭션**이다. 시술 머지 · 진료시간 · 사진 교체 · `thumbnail` 동기화 ·
            업로드 파일 claim 이 전부 같은 트랜잭션 안에서 일어난다. 파일 **바이트**만 그 밖이다
            (업로드가 저장보다 먼저 끝난다 — §20.3 과 같은 구조).
          items:
            $ref: '#/components/schemas/HospitalProcedureInput'
        consultAvailable:
          type: boolean
        isOneDay:
          type: boolean
        businessHours:
          type: array
          items:
            $ref: '#/components/schemas/BusinessHourEntry'
        directions:
          type: string
          maxLength: 500
        features:
          $ref: '#/components/schemas/HospitalFeatures'

    # ---------------------------------------------------------------- 전문의
    DentalSpecialty:
      type: string
      enum:
        - 치과보철전문의
        - 치과교정전문의
        - 구강악안면외과전문의
        - 치주과전문의
        - 소아치과전문의
        - 통합치의학과전문의
        - 구강악안면방사선과전문의
        - 일반의

    VerificationStatus:
      type: string
      enum: [pending, approved, rejected]
      description: '화면 표기: `대기` / `승인` / `반려`.'

    Doctor:
      type: object
      description: |
        **공개 응답.** `certificateUrl` 과 `rejectionReason` 을 담지 않는다 —
        제출된 자격증 이미지와 반려 사유가 공개 API 로 새면 안 된다.
        관리자 응답은 `DoctorAdminView` 다.
      required:
        - id
        - name
        - title
        - hospitalId
        - photo
        - procedureIds
        - reviewCount
        - consultCount
        - verificationStatus
        - isRecommended
        - yearsOfExperience
        - career
        - visibleSpecialty
        - isVerifiedSpecialist
      properties:
        id:
          type: string
          example: d1
        name:
          type: string
          example: 김민준
        title:
          type: string
          example: 대표원장
        hospitalId:
          type: string
          example: h1
        photo:
          type: string
          format: uri
        procedureIds:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureId'
        rating:
          type: [number, 'null']
          format: float
          description: |
            **비로그인 요청에는 `null` 이다.** 전문의 상세의 평점 잠금을 서버에서 구현한 것이다.
            지금은 반투명 막을 덮는 방식이라 숫자가 비쳐 보이고 응답에는 그대로 실려 있다.
          example: 4.9
        reviewCount:
          type: integer
          description: 잠금 대상이 아니다. 비로그인에도 `후기 180` 이 보인다.
          example: 180
        consultCount:
          type: integer
          example: 90
        specialty:
          $ref: '#/components/schemas/DentalSpecialty'
        visibleSpecialty:
          type: [string, 'null']
          description: |
            화면에 표시해도 되는 전공. 규칙:
            `일반의` → 항상 그대로 표시. 그 밖의 전공 → `approved` 일 때만 표시, 아니면 `null`.

            **`specialty` 원본은 승인 전에는 응답에 포함되지 않는다.** 검수 대기·반려 상태의
            전공 주장이 공개되면 검수의 의미가 없어진다.
          example: 치과보철전문의
        isVerifiedSpecialist:
          type: boolean
          description: '`approved` && `specialty !== 일반의`. `전문의` 배지 조건.'
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
        isRecommended:
          type: boolean
        yearsOfExperience:
          type: integer
          example: 15
        career:
          type: array
          description: '`경력 및 활동` 목록. 빈 배열이면 화면이 `등록된 경력 정보가 없어요` 를 보여준다.'
          items:
            type: string

    DoctorAdminView:
      allOf:
        - $ref: '#/components/schemas/Doctor'
        - type: object
          description: '관리자 전용 확장. `Cache-Control: no-store`.'
          required: [certificateUrl, rejectionReason]
          properties:
            specialty:
              $ref: '#/components/schemas/DentalSpecialty'
            certificateUrl:
              type: [string, 'null']
              format: uri
              description: 제출된 자격증/인증서. null 이면 화면에 `미제출`.
            rejectionReason:
              type: [string, 'null']
              description: '`rejected` 일 때만 값이 있다. 승인하면 지워진다.'

    VerificationQueueItem:
      allOf:
        - $ref: '#/components/schemas/DoctorAdminView'
        - type: object
          required: [hospitalName]
          properties:
            hospitalName:
              type: string
              description: |
                검수 화면이 소속 병원 이름을 보여준다. 병원을 찾지 못하면 `알 수 없는 병원`.
                여기서 조인해 주지 않으면 검수 목록이 병원 전체 목록을 함께 받아야 한다.
              example: 강남 스마일 치과
            submittedAt:
              type: [string, 'null']
              format: date-time
              description: |
                자격증이 제출된 시각. 검수 대기 순서 판단에 쓴다.

                **미구현 — 화면 미사용.** 선택 필드이고(`required` 는 `hospitalName` 뿐),
                `docs/features/admin-specialists.md` 의 검수 화면이 제출 시각을 표시하지 않는다
                (정렬은 상태 → 등록 순). 소비자가 생기면 그때 구현한다.

    DoctorUpsert:
      type: object
      description: |
        병원 폼의 전문의 한 명. `id` 가 있으면 갱신, 없으면 신규.
        **`name` 이 필수다** — 명시적으로 빈 문자열을 보내는 경로를 막기 위한 것이다. 폼이 이름
        없는 행을 아예 빼고 보내는 경로는 `docs/features/known-issues.md` 참고.
      required: [name, specialty]
      properties:
        id:
          type: string
          description: 기존 전문의를 갱신할 때만.
        name:
          type: string
          minLength: 1
          maxLength: 50
        title:
          type: string
          maxLength: 50
          default: 원장
        specialty:
          $ref: '#/components/schemas/DentalSpecialty'
        certificateUrl:
          type: [string, 'null']
          format: uri
        photo:
          type: string
          format: uri
          description: 폼에 이 칸이 없다. 신규는 서버 기본 이미지, 기존은 기존 값 유지.
        yearsOfExperience:
          type: integer
          minimum: 0
          description: 폼에 이 칸이 없다. 신규는 0, 기존은 기존 값 유지.
        career:
          type: array
          description: 폼에 이 칸이 없다. 신규는 빈 배열, 기존은 기존 값 유지.
          items:
            type: string
        procedureIds:
          type: array
          description: |
            생략하면 서버가 전공에서 유도한다. `일반의` 는 병원이 취급하는 시술 전체가 된다
            (현재 동작과 동일).
          items:
            $ref: '#/components/schemas/ProcedureId'

    DoctorUpdateRequest:
      type: object
      description: 단건 부분 수정. `verificationStatus` 는 여기서 바꿀 수 없다.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        title:
          type: string
          maxLength: 50
        specialty:
          $ref: '#/components/schemas/DentalSpecialty'
        certificateUrl:
          type: [string, 'null']
          format: uri
        photo:
          type: string
          format: uri
        yearsOfExperience:
          type: integer
          minimum: 0
        career:
          type: array
          items:
            type: string
        procedureIds:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureId'
        isRecommended:
          type: boolean
          description: |
            **미구현 — 권한 정의 필요.** 병원의 동명 필드(`Hospital.isRecommended`)와 달리
            여기는 역할 제한 표기가 없다. 어느 화면도 이 값을 쓰지 않고(`DoctorCard` 는 읽기만
            한다), 계약이 침묵하는 권한 문제(허용하면 병원 담당자가 자기 병원 전문의를 스스로
            추천 노출시킬 수 있다)를 추측으로 정할 수 없어 `PATCH /doctors/{doctorId}` 는 이
            키를 받지 않는다. 필드 자체는 지우지 않는다 — 권한이 정해지면 구현한다.

    VerificationDecisionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]
          description: '`pending` 으로 되돌릴 수는 없다. 화면에도 그 버튼이 없다.'
        rejectionReason:
          type: string
          minLength: 1
          maxLength: 500
          description: '`status=rejected` 일 때 필수. `approved` 면 무시되고 기존 사유가 지워진다.'

    # ---------------------------------------------------------------- 후기
    Review:
      type: object
      required: [id, hospitalId, procedureId, authorName, rating, content, createdAt]
      properties:
        id:
          type: string
        hospitalId:
          type: string
        procedureId:
          $ref: '#/components/schemas/ProcedureId'
        authorName:
          type: string
          description: 서버가 마스킹해서 내려준다 (`김**`). 원본 이름을 공개 응답에 담지 않는다.
          example: 김**
        rating:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
        createdAt:
          type: string
          format: date
          description: '날짜만. 기존 도메인 타입 보존 (`2026-06-02`).'
          example: '2026-06-02'
        photos:
          type: array
          items:
            type: string
            format: uri

    # ---------------------------------------------------------------- 이벤트
    Promotion:
      type: object
      required: [id, hospitalId, procedureId, title, originalPrice, salePrice, discountRate, badge]
      properties:
        id:
          type: string
        hospitalId:
          type: string
        procedureId:
          $ref: '#/components/schemas/ProcedureId'
        title:
          type: string
          example: 임플란트 1개 진단+식립 패키지
        originalPrice:
          type: integer
          example: 1800000
        salePrice:
          type: integer
          example: 1290000
        discountRate:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            서버가 계산한 할인율(%). 네 화면이 같은 숫자를 보여야 해서 계산을 서버에 둔다.
            반올림 규칙도 여기서 하나로 고정된다.
          example: 28
        badge:
          type: string
          description: '화면에 `🔥 얼리버드` 처럼 표시된다. 🔥 는 화면이 붙이는 것이고 값에는 없다.'
          example: 얼리버드
        startsAt:
          type: [string, 'null']
          format: date-time
          description: |
            **현재 데이터에 기간 정보가 없어 null 이다.** 이벤트 화면이 `기간 한정` 이라고 안내하는데
            남은 기간·D-day·마감일이 표시되지 않는 원인이다.
        endsAt:
          type: [string, 'null']
          format: date-time

    # ---------------------------------------------------------------- 꿀팁
    GuideSummary:
      type: object
      description: 목록용. 본문(`content`)이 없다.
      required: [id, title, summary, thumbnail, procedureId, author, createdAt]
      properties:
        id:
          type: string
          example: g1
        title:
          type: string
        summary:
          type: string
        thumbnail:
          type: string
          format: uri
        procedureId:
          $ref: '#/components/schemas/ProcedureId'
        author:
          type: string
          example: 몰라몰라 편집팀
        createdAt:
          type: string
          format: date
          description: 날짜만. 기존 도메인 타입 보존.

    GuideContent:
      allOf:
        - $ref: '#/components/schemas/GuideSummary'
        - type: object
          required: [content, relatedHospitalIds]
          properties:
            content:
              type: string
              description: |
                빈 줄(`\n\n`)로 문단을 나눈 평문. 제목·목록·표·이미지 서식은 지원하지 않는다.
            relatedHospitalIds:
              type: array
              description: |
                `관련 병원 보기` 카드용. 삭제된 병원의 id 는 응답에서 빠진다.
                도메인 타입의 `relatedHospitals` 를 이름만 명확히 한 것이다 (id 배열임이 드러나게).
              items:
                type: string

    # ---------------------------------------------------------------- 상담
    ConsultStatus:
      type: string
      enum: [new, contacted, booked, cancelled, visited]
      description: |
        상담 처리 상태. **2026-10-13 에 `visited` 가 더해져 5개가 되었다.**

        | 코드 | 화면 라벨 |
        |---|---|
        | `new` | `신규` |
        | `contacted` | `연락중` |
        | `booked` | **`예약확정`** |
        | `visited` | **`내원완료`** (신규 값) |
        | `cancelled` | `취소` |

        **`booked` 는 라벨만 `예약완료` → `예약확정` 으로 바뀌었고 값은 그대로다.**
        `confirmed` 로 개명하지 않은 이유: enum 값 제거는 **breaking**(§15 의 `v2` 사유)이고 얻는 것은
        이름뿐이다. 두 테이블의 과거 행과 시드 fixture 를 함께 고쳐야 하고, 이미 나간 알림 문구
        (`'예약완료'(으)로 변경되었어요`)는 소급 수정이 불가능하다. **`예약완료` 와 `예약확정` 은 같은
        사실을 가리키는 두 라벨이지 두 상태가 아니다.** 반대로 `내원완료` 는 **새로운 사실**(실제로
        왔는가)이라 값이 필요했다 — 상담 → 내원 전환을 세려면 그 구분이 있어야 한다.

        보통 `new → contacted → booked → visited` 로 가고 어느 단계에서든 `cancelled` 로 갈 수 있지만,
        **서버는 전이를 제한하지 않는다** (`PATCH /consult-requests/{id}/status` 참고).

        라벨 매핑은 클라이언트가 들고 있는다. **모르는 코드를 만나면 죽지 말고 원문 코드를 그대로
        보여준다** (§15 의 enum 방어 규칙) — 이번처럼 값이 늘 수 있다.

    ConsultCancelReason:
      type: string
      enum: [no_answer, patient_request, procedure_unavailable, duplicate, etc]
      description: |
        **취소 사유** (2026-10-13 신규). `status: cancelled` 로 바꿀 때 **필수**이며,
        취소 이벤트 이력 행에 스냅샷으로 저장된다.

        | 코드 | 화면 라벨 |
        |---|---|
        | `no_answer` | `연락이 안 됨` |
        | `patient_request` | `환자 요청` |
        | `procedure_unavailable` | `진료 불가 시술` |
        | `duplicate` | `중복 신청` |
        | `etc` | `기타` |

        **라벨이 아니라 코드를 값으로 쓴 이유는 `InquiryTopic` 과 같다** — 보존할 과거 데이터가 없는
        새 값이고, 라벨을 저장하면 문구를 다듬는 순간 저장값이 깨진다.

        **`기타` 에 자유 텍스트 칸을 두지 않았다.** 메모(`POST /consult-requests/{id}/memos`)가 그
        자리다. `기타` 비율이 높게 나오면 설명 칸을 더하는 것보다 **사유 코드를 늘리는 것이 먼저**다.

        **신청자에게는 내려가지 않는다** (`MyConsultRequest` 에 이 필드가 없다) — 병원의 내부 처리
        분류이고, `연락이 안 됨` 은 환자에게 비난으로 읽힌다.

    ConsultPreferredTime:
      type: string
      enum: [평일 오전, 평일 오후, 평일 저녁, 주말]
      description: |
        희망 상담 시간. 현재 화면의 고정 4지선다를 그대로 값으로 쓴다 (기존 데이터·타입 보존).
        `평일 저녁` 은 2026-10-12 요청서로 늘어난 값이라 **그 이전에 접수된 건에는 나타나지 않는다.**
        병원별 진료시간과 연결되어 있지 않다 — 그 병원이 실제로 그 시간에 진료하는지는 보지 않는다.

        세 투영(`ConsultRequest` · `MyConsultRequest` · `ConsultRequestCreateRequest`)이 같은 선택지를
        써야 해서 `ConsultStatus` 처럼 한 곳에 모았다. 셋에 enum 을 복사해 두면 선택지가 늘어날 때
        한쪽만 고쳐져 신청 화면과 관리자 목록이 조용히 어긋난다 (이번 `평일 저녁` 추가가 그 경우였다).

        코드 기반 enum(`WEEKDAY_MORNING` 등)으로 바꾸는 것은 여전히 미결 사항이다.

    ConsultThirdPartyConsent:
      type: object
      description: |
        기록된 **개인정보 제3자 제공 동의**. 접수 시점에 서버가 남기고 이후 바뀌지 않는다.
        동의하지 않은 접수는 애초에 거절되므로(`422 THIRD_PARTY_CONSENT_REQUIRED`)
        "동의함/동의 안 함" 을 구분하는 boolean 이 따로 없다 — **기록의 존재 자체가 동의다.**
      required: [agreedAt, noticeVersion]
      properties:
        agreedAt:
          type: string
          format: date-time
          description: |
            **서버가 접수를 받아들인 시각(서버 시계)이다.** 클라이언트가 보낸 시각을 쓰지 않는 이유는
            기기 시계는 사용자가 바꿀 수 있어 증빙이 되지 않기 때문이다. 이 값은 분쟁 시
            "언제 동의를 받았는가" 의 근거라서 서버만 쓸 수 있어야 한다.
            체크박스를 누른 시각과 접수 시각의 차이는 같은 화면 안의 수 초이고, 그 차이로 갈리는 판단이 없다.
          example: '2026-10-12T04:21:00.000Z'
        noticeVersion:
          type: string
          description: |
            동의한 제3자 제공 안내문의 버전. `SignUpRequest.agreedTermsVersions[].version` 과 같은 성격이다 —
            문구가 개정되면 "무엇에 동의했는지" 가 달라지므로 버전을 함께 남긴다.
            서버가 받은 문자열을 그대로 보존한다 (검증하지 않는 이유는 `POST /consult-requests` 설명 참고).
          example: '2026-10-12'

    ConsultThirdPartyConsentInput:
      type: object
      description: |
        상담 신청 시 클라이언트가 보내는 **개인정보 제3자 제공 동의**.
        기록 투영(`ConsultThirdPartyConsent`)과 스키마를 나눈 이유는 **보내는 것과 남는 것이 다르기**
        때문이다 — 클라이언트는 `agreed` 를 보내고 시각은 보내지 않으며, 서버는 `agreedAt` 을 찍어
        남긴다. 한 스키마로 묶으면 "클라이언트가 `agreedAt` 을 보내도 되는가" 가 계약에서 모호해진다.
      required: [agreed, noticeVersion]
      properties:
        agreed:
          type: boolean
          description: |
            체크박스를 켠 상태로 제출했는지. **`true` 만 접수된다** —
            `false` 나 누락은 `422 THIRD_PARTY_CONSENT_REQUIRED` 이고, 동의하지 않은 상담은 저장되지 않는다.
            (화면은 체크 전까지 `상담 신청하기` 버튼을 잠그므로 `false` 는 보통 다른 클라이언트에서 온다)
          example: true
        noticeVersion:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            사용자에게 **실제로 보여준** 안내문의 버전. 화면에 띄운 문구와 저장되는 동의가 어긋나면
            동의 기록이 증빙이 되지 않으므로, 클라이언트가 자기가 그린 문구의 버전을 같이 보낸다.

            현재 형식은 **안내문 개정일 `YYYY-MM-DD`** 이고 유효한 값은 `2026-10-12` 하나다
            (프론트엔드 상수의 문구 개정일). 안내문이 `GET /legal-documents/{slug}` 로 옮겨가면
            이 자리에 `LegalDocument.version`(예: `1.0`)이 들어오므로 날짜 형식을 강제하지 않았다.
          example: '2026-10-12'

    ConsultStatusChange:
      type: object
      description: |
        **처리 이력 한 줄 (관리자 시야).** 이름은 `StatusChange` 지만 2026-10-13 부터 담는 것은
        상태 변경이 아니라 **처리 이벤트**다 — 예약확정 상태에서 일시만 바꾸는 "일시 변경" 도 이력에
        남고 환자에게 알림이 나가기 때문이다. 스키마 이름을 바꾸지 않은 이유는 `booked` 를 개명하지
        않은 것과 같다 (얻는 것이 이름뿐이고, 소비자 타입이 전부 바뀐다). `event` 가 행의 성격을 말한다.

        화면은 `누가 · 언제 · 무엇으로 바꿨는지 · 환자 알림 발송` 한 줄로 그린다.
        신청자 투영(`MyConsultRequest.statusHistory`)은 **다른 모양**이다 — `changedByName`·
        `cancelReason`·`notified` 가 없고 `reschedule` 행도 내려가지 않는다.
      required: [event, status, changedAt, visitAt, cancelReason, notified]
      properties:
        event:
          type: string
          enum: [status_change, reschedule]
          default: status_change
          description: |
            이 행이 무엇인가 (2026-10-13 신규).

            | 값 | 화면 문구 | 언제 |
            |---|---|---|
            | `status_change` | `{라벨}(으)로 변경` | `status` 가 바뀜 |
            | `reschedule` | **`일시 변경`** | 상태는 `booked` 그대로이고 `visitAt` 만 바뀜 |

            **`reschedule` 행의 `status` 에는 그 시점의 상태(`booked`)가 그대로 들어간다.** 행이 스스로를
            설명하고, `status` 를 nullable 로 만드는 breaking 변경도 피한다. 화면은 `event` 로 문구를 가른다.

            계약 확장 이전에 쌓인 이력 행은 전부 `status_change` 다.
        status:
          $ref: '#/components/schemas/ConsultStatus'
        changedAt:
          type: string
          format: date-time
        changedByName:
          type: [string, 'null']
          description: |
            누가 바꿨는지. 현재 이력에는 상태와 시각만 남아 누가 처리했는지 알 수 없다.
            관리자 응답에서만 채워진다.
        visitAt:
          type: [string, 'null']
          format: date-time
          description: |
            **이 이벤트 직후의 확정 일시 스냅샷** (2026-10-13 신규). 현재 값이 아니라 그때의 결과다 —
            `취소` 로 지워진 약속도 직전 `booked`/`reschedule` 행에 남아 "무슨 약속이 있었나" 를 답한다.
            `booked`/`visited` 가 아닌 행에서는 `null` 이다.
          example: '2026-10-09T05:00:00.000Z'
        cancelReason:
          oneOf:
            - $ref: '#/components/schemas/ConsultCancelReason'
            - type: 'null'
          description: |
            **`status: cancelled` 인 행에만** 값이 있다 (2026-10-13 신규). 나머지는 `null`.
            현재 상담의 `ConsultRequest.cancelReason` 은 이 값들에서 파생된다.
        notified:
          type: boolean
          description: |
            이 이벤트로 **환자에게 알림이 나갔는지** (2026-10-13 신규). 화면의 `환자 알림 발송` 배지다.

            **규칙("모든 변경은 알림을 보낸다")으로 파생하지 않고 저장된 사실을 그대로 내려준다** —
            억제 규칙이 생기면 이미 알림을 받은 과거 이력이 소급해 `발송 안 함` 으로 보이고, 발송은
            실패하거나 생략될 수도 있다(수신자 탈퇴 등). `false` 의 뜻은 **발송하지 않음 또는 발송 실패**다
            (계약 확장 이전 이력 행도 전부 `false`).

            **알림 id 는 내려주지 않는다.** 알림 상세로 가는 화면이 없는데 id 를 내리면 그 자리가
            "갈 수 있다" 는 약속이 된다.
          example: true

    ConsultMemo:
      type: object
      required: [id, content, createdAt]
      properties:
        id:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        authorName:
          type: [string, 'null']
          description: 현재 메모에는 작성자 표시가 없다. 서버가 함께 저장한다.

    ConsultRequest:
      type: object
      description: |
        **관리자 시야** (`hospital_admin` / `operator` 공용). `Cache-Control: no-store`.
        신청자에게 내려가는 형태는 `MyConsultRequest` 이며 `memos` 가 없다.

        ### 개인정보 마스킹을 같은 스키마 안에서 표현한다

        `name` / `phone` 은 **역할과 투영(목록/상세)에 따라 값이 달라진다** (2026-10-13 에 투영 축이
        하나 붙었다 — §4):

        | 투영 | 역할 | `name` | `phone` | `piiMasked` |
        |---|---|---|---|---|
        | 목록 (`GET /consult-requests`) | `hospital_admin` (담당 병원) | `박서영` | **`010-****-4411`** | **`true`** |
        | 목록 | `operator` | `박*영` | `010-****-4411` | `true` |
        | 상세 (`GET /consult-requests/{id}`) | `hospital_admin` (담당 병원) | `박서영` | **`010-1234-4411`** | `false` |
        | 상세 | `operator` | `박*영` | `010-****-4411` | `true` |

        **목록은 담당자에게도 번호를 가린다.** 목록은 건별 열람 기록을 남기지 않는 자원이라 전체
        번호가 실리면 무기록 대량 반출이 성립한다. 전체 번호를 보는 경로를 **기록이 남는 상세 한 곳**
        으로 모은 것이고, `전화 걸기` 는 상세에만 있으므로 잃는 업무가 없다.

        **별도 투영 스키마(`ConsultRequestMaskedView`)를 만들지 않은 이유:**

        1. **필드 집합이 같다.** 마스킹은 값 변환이고 구조 변화가 아니다. 스키마를 둘로 나누면
           `oneOf` 두 갈래를 만들 뿐이고, 클라이언트는 어차피 같은 카드 컴포넌트로 그린다.
           (반대로 `MyConsultRequest` 는 `memos`·`changedByName` 이 **없어서** 별도 스키마다 —
           구조가 다를 때만 투영을 나눈다는 기준을 일관되게 적용했다)
        2. **관리자 화면 하나가 두 역할을 함께 쓴다.** `/admin/consultations` 는 담당자와 운영자가
           같은 화면을 보는 구조다. 스키마가 갈리면 화면이 응답 형태로 분기해야 한다.
        3. **엔드포인트가 같다.** 경로가 같은데 응답 스키마가 다르면 생성되는 클라이언트 타입이
           유니온이 되어 모든 접근에 좁히기(narrowing)가 필요해진다.

        **`piiMasked` 를 명시적으로 내려주는 이유 (클라이언트가 알아야 한다):**

        - 화면이 `전체 번호는 상세에서 확인할 수 있어요` / "연락처는 담당 병원에서만 확인할 수 있어요"
          안내를 띄워야 한다. 값만 보고는 `010-****-5678` 이 마스킹인지 잘못 저장된 데이터인지
          구분할 수 없다.
        - 마스킹된 값으로 전화 걸기·복사 버튼을 활성화하면 안 된다.
        - 마스킹된 값을 검색어로 넣어도 결과가 없는 것이 정상임을 화면이 설명할 수 있다.
        - `role` 로 추론하지 않는 이유: 추론은 클라이언트에 인가 규칙을 복제하는 것이다. 마스킹 정책이
          바뀌면(예: 운영자에게 전체 공개) 서버 한 곳만 고치면 되게 둔다.
          **역할과 투영 두 축이 생긴 지금은 추론이 더 틀리기 쉽다** — 담당자인데도 목록에서는
          가려진다.
      required:
        - id
        - hospitalId
        - hospitalName
        - procedureId
        - name
        - phone
        - piiMasked
        - preferredTime
        - message
        - createdAt
        - status
        - visitAt
        - cancelReason
        - statusHistory
        - thirdPartyConsent
        - memos
      properties:
        id:
          type: string
          example: cr1
        hospitalId:
          type: string
        hospitalName:
          type: string
          description: 병원을 찾지 못하면 `알 수 없는 병원`. 관리자 목록 카드가 `병원명 · 시술명` 을 보여준다.
          example: 강남 스마일 치과
        doctorId:
          type: [string, 'null']
          description: |
            지정된 전문의. **지금은 저장되지 않아 관리자가 어느 전문의를 지목했는지 알 수 없다.**
          example: d1
        doctorName:
          type: [string, 'null']
          example: 김민준
        procedureId:
          oneOf:
            - $ref: '#/components/schemas/ProcedureId'
            - type: 'null'
          description: null 이면 화면에 `시술 미지정`.
        procedureName:
          type: [string, 'null']
          example: 임플란트
        name:
          type: string
          description: |
            고객 이름. **`operator` 에게는 마스킹된다** — 가운데 글자를 `*` 로 (`박서영` → `박*영`).
            두 글자 이름은 `박*`, 네 글자 이상은 첫 글자와 마지막 글자만 남긴다 (`남궁민수` → `남**수`).
          example: 김민준
        phone:
          type: string
          description: |
            서버가 `010-1234-5678` 형태로 정규화해 저장한다.

            **가운데 블록이 마스킹되는 경우** (`010-****-5678`): `operator` 의 모든 응답,
            그리고 **역할과 무관하게 목록(`GET /consult-requests`) 전부** (2026-10-13).
            전체 번호는 **담당 `hospital_admin` 의 상세 응답**에만 있다.

            뒤 4자리를 남기는 이유: 운영자가 고객 문의를 받았을 때 어떤 상담 건인지 대조할 수 있어야 하고,
            그것만으로 연락은 불가능하다. `전화 걸기`(`tel:` 링크)는 마스킹되지 않은 값에서만 활성화한다 —
            판정은 값이 아니라 `piiMasked` 로 한다.
          example: 010-1234-5601
        piiMasked:
          type: boolean
          description: |
            **이 응답에 마스킹된 개인정보 필드가 있는지.** 2026-10-13 에 뜻을 넓혔다 — 예전에는
            "역할 때문에 마스킹됐는가" 였는데, 담당자 목록 응답(이름은 전체·번호는 마스킹)에서
            `false` 를 주면 화면이 `010-****-4411` 을 **잘못 저장된 데이터**로 읽는다.
            플래그를 둔 이유가 정확히 그 구분이므로 뜻을 넓히는 쪽이 맞다.

            `false` 인 경우는 **담당 `hospital_admin` 의 상세 응답 하나뿐**이고, 나머지는 전부 `true` 다
            (목록은 두 역할 모두 `true`).

            **클라이언트 규칙은 한 줄이다:** `piiMasked === true` 면 전화 걸기·복사를 잠그고
            `전체 번호는 상세에서 확인할 수 있어요` 를 띄운다. 마스킹된 값을 검색어로 넣어 0건이 나오는
            것도 이 값으로 설명한다.

            **`phoneMasked` 같은 두 번째 플래그를 두지 않는다.** 어느 필드가 가려졌는지는 위 표가
            말하고, 화면이 묻는 질문은 "전화를 걸 수 있나" 하나뿐이다 — 소비자 없는 플래그는
            두 값이 어긋날 자리만 만든다.
          example: false
        preferredTime:
          $ref: '#/components/schemas/ConsultPreferredTime'
        message:
          type: string
          description: 빈 문자열 가능. 화면은 비어 있으면 `남긴 메시지가 없어요`.
        createdAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ConsultStatus'
        visitAt:
          type: [string, 'null']
          format: date-time
          description: |
            **확정 내원 일시** (2026-10-13 신규). UTC 시각이며 화면이 `Asia/Seoul` 로 변환해
            `10/9(금) 14:00` 으로 그린다. 초·밀리초는 항상 `0` 이다 (입력 단위가 분).

            **`null` 인 경우가 셋이다** — ① 아직 예약확정이 아닌 건 ② 확정됐다가 취소·연락중으로
            돌아간 건(나갈 때 지운다) ③ **계약 확장 이전에 `booked` 가 된 건**. ③ 은 소급해 채우지
            않았으므로 `status: booked` + `visitAt: null` 조합이 실제로 존재한다 —
            화면은 `일시 미입력` 으로 보여주고 담당자가 채우게 한다.

            `status: visited` 인데 `null` 인 것도 정상이다 (걸어 들어온 환자를 `신규` 에서 바로
            `내원완료` 로 넘긴 경우). "언제 왔는가" 는 그 이력 행의 `changedAt` 이 답한다.

            쓰는 쪽 규칙은 `PATCH /consult-requests/{id}/status` 의 `visitAt` 설명에 있다.
          example: '2026-10-09T05:00:00.000Z'
        cancelReason:
          oneOf:
            - $ref: '#/components/schemas/ConsultCancelReason'
            - type: 'null'
          description: |
            **현재 취소 사유** (2026-10-13 신규). `status` 가 `cancelled` 일 때 **가장 최근 취소
            이벤트 행의 사유**이고, 그 밖에는 항상 `null` 이다.

            **저장된 컬럼이 아니라 `statusHistory` 에서 파생되는 값이다.** 현재 행에 두면
            "상태는 `contacted` 인데 사유가 남아 있는" 어긋남이 가능해지고, 재오픈할 때 그것을 지우는
            절차를 앱이 또 지켜야 한다. 응답이 이미 이력을 싣고 있어 추가 질의도 없다.
            (뒤집히는 조건: 이력을 싣지 않는 가벼운 목록 투영이 생기는 순간)
        statusHistory:
          type: array
          description: |
            처리 이력. 최신순으로 표시되지만 저장·응답은 시간순이다. 정렬은 클라이언트 표현.
            **상태 변경과 일시 변경이 한 배열에 시간순으로 섞인다** — 화면이 요구하는 것이
            "누가 · 언제 · 무엇으로 · 알림 발송" 한 줄짜리 이력이라 종류별로 나누지 않았다.
          items:
            $ref: '#/components/schemas/ConsultStatusChange'
        thirdPartyConsent:
          oneOf:
            - $ref: '#/components/schemas/ConsultThirdPartyConsent'
            - type: 'null'
          description: |
            이 건에 기록된 개인정보 제3자 제공 동의. **`null` 이면 동의 절차 도입 이전에 접수된 건이다** —
            동의를 거절한 건이 아니라 동의를 받는 절차 자체가 없던 때의 데이터이고, 소급해 채울 방법이 없다.
            **아직 이 값을 그리는 화면은 없다** (관리자 목록·상세 모두 미표시). 표시하게 되면 `null` 은
            `동의 기록 없음 (절차 도입 전 접수)` 로 쓴다.

            `procedureId` 와 같이 **키는 항상 있고 값만 `null` 일 수 있게** 두었다 (`required` 에 포함).
            키가 없는 것과 `null` 인 것이 섞이면 "기록이 없다" 와 "서버가 아직 안 내려준다" 를 구분할 수 없다.

            **`operator` 에게도 마스킹 없이 그대로 내려간다.** 시각과 버전 문자열뿐이라 개인정보가 없고,
            운영자가 분쟁·CS 에서 확인해야 하는 것이 정확히 "동의를 받았는가, 어떤 문구로 받았는가" 다.
        memos:
          type: array
          description: |
            내부 공유용. **신청자 응답(`MyConsultRequest`)에는 절대 포함되지 않는다.**
            `operator` 는 읽을 수 있다 (분쟁 시 처리 경과 확인). 마스킹 대상 필드가 없는 자유 텍스트라
            담당자가 여기에 고객 연락처를 적으면 마스킹을 우회하게 된다 — 화면 안내가 필요하다 (미결 사항).
          items:
            $ref: '#/components/schemas/ConsultMemo'

    MyConsultRequest:
      type: object
      description: |
        **신청자 시야.** 같은 저장 구조에서 나오는 다른 투영이다.
        `memos`(내부 메모)와 `statusHistory[].changedByName`(처리자 이름)을 담지 않는다.

        **2026-10-13 에 `visitAt` 이 더해졌다** — 마이페이지 `내 상담 내역` 이 `10/9(금) 14:00` 을
        보여준다. 같이 생긴 세 값은 **내려가지 않는다:**

        | | 신청자 | 왜 |
        |---|---|---|
        | `cancelReason` | 없음 | 병원의 **내부 처리 분류**다. `연락이 안 됨` 은 환자에게 비난으로 읽히고, 어느 화면도 환자에게 사유를 보여주지 않는다 |
        | `statusHistory` 의 `reschedule` 행 | 없음 (`status_change` 행만) | 신청자 이력은 "상태가 이렇게 흘렀다" 를 보여주는 자리라 일시 변경 행이 `예약확정` 중복으로 보인다. 변경 사실은 **알림으로 이미 전달됐고** 결과는 `visitAt` 이 들고 있다 |
        | `notified` | 없음 | 자기가 받은 알림이다 |
      required:
        - id
        - hospitalId
        - hospitalName
        - procedureId
        - name
        - phone
        - preferredTime
        - message
        - createdAt
        - status
        - visitAt
        - statusHistory
        - thirdPartyConsent
      properties:
        id:
          type: string
        hospitalId:
          type: string
        hospitalName:
          type: string
        hospitalThumbnail:
          type: string
          format: uri
          description: 내역 카드에 병원 사진을 쓸 수 있게 함께 준다. 병원을 다시 조회하지 않아도 된다.
        doctorId:
          type: [string, 'null']
        doctorName:
          type: [string, 'null']
        procedureId:
          oneOf:
            - $ref: '#/components/schemas/ProcedureId'
            - type: 'null'
        procedureName:
          type: [string, 'null']
        name:
          type: string
        phone:
          type: string
        preferredTime:
          $ref: '#/components/schemas/ConsultPreferredTime'
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ConsultStatus'
        visitAt:
          type: [string, 'null']
          format: date-time
          description: |
            병원이 확정한 내원 일시 (2026-10-13 신규). UTC 시각이고 화면이 `Asia/Seoul` 로 변환한다.
            `null` 이면 아직 확정 전이거나 확정이 취소된 것이다 — `status` 와 함께 읽는다.
            (`cancelled` 로 가면 서버가 지우므로, 취소된 건에 지난 약속이 `예정` 으로 남지 않는다)
          example: '2026-10-09T05:00:00.000Z'
        statusHistory:
          type: array
          description: |
            **상태가 흘러온 길.** `status_change` 이벤트만 담는다 — `reschedule`(일시 변경) 행은
            내려가지 않는다 (위 표). 관리자 이력(`ConsultStatusChange`)과 달리 `event`·`changedByName`·
            `cancelReason`·`notified` 가 없다.
          items:
            type: object
            required: [status, changedAt, visitAt]
            properties:
              status:
                $ref: '#/components/schemas/ConsultStatus'
              changedAt:
                type: string
                format: date-time
              visitAt:
                type: [string, 'null']
                format: date-time
                description: |
                  그 변경 **직후**의 확정 일시 (2026-10-13 신규). 현재 값은 위 `visitAt` 이다.
                  취소된 건에서도 "그때 무슨 약속이 있었는지" 는 이력 행에 남는다.
        thirdPartyConsent:
          oneOf:
            - $ref: '#/components/schemas/ConsultThirdPartyConsent'
            - type: 'null'
          description: |
            내가 남긴 동의 기록. 신청자에게도 보여주는 이유는 "내 이름·연락처를 언제 어떤 문구로
            병원에 넘기기로 했는지" 를 본인이 다시 확인할 수 있어야 하기 때문이다.
            **`null` 이면 동의 절차 도입 이전에 접수된 건이다** (거절한 것이 아니다).
            `ConsultRequest.thirdPartyConsent` 와 같은 값이며, 관리자 전용으로 가리는 부분이 없다.

    ConsultRequestCreateRequest:
      type: object
      required: [hospitalId, name, phone, preferredTime, thirdPartyConsent]
      properties:
        hospitalId:
          type: string
        doctorId:
          type: [string, 'null']
          description: |
            `전문의 상담신청` 으로 들어온 경우 그 전문의 id. 병원 소속이 아니면 `422 DOCTOR_NOT_AT_HOSPITAL`.
        procedureId:
          oneOf:
            - $ref: '#/components/schemas/ProcedureId'
            - type: 'null'
          description: |
            그 병원이 취급하는 시술이어야 한다 (`422 PROCEDURE_NOT_OFFERED`).

            **`null` 은 화면의 기본 선택지인 `잘 모르겠어요` 다.** 예전에는 "항상 하나가 선택되어 있고
            병원에 등록된 시술이 없을 때만 null" 이었지만, 지금은 시술을 고르지 않은 채 신청하는 것이
            정상 경로이고 기본값이다. 그래서 `null` 을 받은 서버는 검증을 건너뛰고 그대로 저장하며,
            관리자 화면에는 `시술 미지정` 으로 보인다 — 병원이 상담하면서 정할 몫이다.
            (병원에 등록된 시술이 하나도 없는 경우도 여전히 `null` 로 들어온다)
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 앞뒤 공백을 제거한 뒤 1자 이상.
        phone:
          type: string
          pattern: '^01[016789]-?\d{3,4}-?\d{4}$'
          description: |
            **클라이언트와 서버가 같은 패턴으로 검사한다.** 화면은 제출 전에 이 패턴으로 검사해
            맞지 않으면 `상담 신청하기` 버튼을 잠그고 안내 문구를 보여주고, 서버는 받은 값을 다시 검사해
            어긋나면 `422 VALIDATION_FAILED`(`details[].code: INVALID_PHONE_FORMAT`) 로 거절한다.

            **판정의 주체는 서버다.** 화면 검사는 되돌아오기 전에 알려주는 UX 이고, 규칙은 서버에 있다 —
            다른 클라이언트나 직접 호출은 화면을 거치지 않는다. 두 곳이 같은 패턴을 쓰는 것이 전제이며,
            패턴을 바꾸면 이 계약을 먼저 고친다.

            하이픈은 있어도 없어도 되고, 서버가 `010-1234-5678` 형태로 **정규화해 저장한다** —
            목록 검색·중복 대조가 표기 차이로 어긋나지 않게 하기 위해서다.
          example: 010-1234-5678
        preferredTime:
          $ref: '#/components/schemas/ConsultPreferredTime'
        message:
          type: string
          maxLength: 2000
          default: ''
        thirdPartyConsent:
          $ref: '#/components/schemas/ConsultThirdPartyConsentInput'
          description: |
            **[필수] 개인정보 제3자 제공 동의.** 없거나 `agreed` 가 `true` 가 아니면
            `422 THIRD_PARTY_CONSENT_REQUIRED` — 접수 자체가 성립하지 않는다.
            동의 시각은 보내지 않는다 (서버가 찍는다. `ConsultThirdPartyConsent.agreedAt` 참고).

    ConsultStatusCounts:
      type: object
      description: |
        목록 상단 **상태 탭의 건수** (2026-10-13 신규) —
        `전체 42 · 신규 5 · 연락중 7 · 예약확정 12 · 내원완료 16 · 취소 2`.

        **모집단은 "지금 걸린 필터에서 `status` 만 뺀 범위" 다.** 병원·기간·시술·검색은 그대로
        적용하고 상태만 풀어서 센다 — 그래야 탭을 눌러도 다른 탭의 숫자가 흔들리지 않는다.
        페이지네이션과는 무관하다 (`meta.totalItems` 는 **지금 탭**의 건수, 이 숫자들은 전 탭의 건수).

        항상 성립하는 등식 둘:

        - `total === new + contacted + booked + visited + cancelled`
        - `status` 를 **정확히 한 값**으로 보낸 요청에서는 `meta.totalItems === statusCounts[그 상태]`.
          `status` 는 2026-10-13 부터 **반복 허용**이라 이 등식을 값이 하나일 때로 좁혀 적는다 —
          여러 값을 보내면 `meta.totalItems === 보낸 값들의 statusCounts 합` 이다
          (`?status=new&status=contacted` → `new + contacted`). 보내지 않으면 `total` 과 같다.

        그래서 **목록과 같은 질의·같은 트랜잭션에서 센다.** 두 숫자가 다른 시점에서 나오면
        사용자가 먼저 알아챈다. `total` 을 따로 내려주는 이유는 화면이 `전체 N` 을 직접 표시하고,
        클라이언트가 다섯 수를 더하는 순간 그 덧셈이 **또 하나의 판정 지점**이 되기 때문이다
        (`HospitalInquirySummary.total` 과 같은 이유).

        **관리자 홈의 숫자 카드(`ConsultSummary`)와 모집단이 다르다.** 그쪽은 담당 병원 전체이고
        화면 필터와 무관하다 — 같은 숫자처럼 보이지만 재사용하면 어긋난다.

        `지연`(신규 24시간 경과)은 여기 없다. 탭이 아니라 배지이고, 클라이언트가 판정한다.
      required: [new, contacted, booked, visited, cancelled, total]
      properties:
        new:
          type: integer
          description: '`신규`'
          example: 5
        contacted:
          type: integer
          description: '`연락중`'
          example: 7
        booked:
          type: integer
          description: '`예약확정`'
          example: 12
        visited:
          type: integer
          description: '`내원완료`'
          example: 16
        cancelled:
          type: integer
          description: '`취소`'
          example: 2
        total:
          type: integer
          description: '`전체` — 다섯 값의 합이다.'
          example: 42

    ConsultSummary:
      type: object
      description: |
        관리자 홈 숫자 카드. 요청자가 관리하는 병원 범위로 계산된다.

        **목록의 상태 탭 숫자(`ConsultStatusCounts`)와 모집단이 다르다** — 이쪽은 담당 병원 **전체**이고
        상담 관리 화면의 필터(기간·시술·검색)와 무관하다. 상태가 5개가 되어도 이 스키마는 바뀌지 않는다:
        `pending` 은 여전히 `new` 건수이고, `내원완료` 를 보여주는 홈 카드는 아직 없다
        (상담 → 내원 전환율 집계는 🚧 — 모집단 정의부터 제품 결정이 필요하다).

        **병원 관리자 대시보드(`AdminDashboardNumbers`)는 이 스키마를 쓰지 않는다** (2026-10-13).
        이쪽은 **담당 병원 전체 합산**이고 `pending` 이 **`new` 하나**인데, 대시보드는
        **선택한 병원 한 곳**이고 `pending` 이 **`new + contacted`** 다.
        **이름이 같고 모집단도 뜻도 다르다 — 재사용 관계가 아니다.**
        (`ConsultStatusCounts` 와 이 스키마 사이에 이미 적어 둔 것과 같은 종류의 경고다)
      required: [newThisMonth, pending, timezone, calculatedAt]
      properties:
        newThisMonth:
          type: integer
          description: |
            이번 달에 접수된 상담 건수. **`Asia/Seoul` 달력 기준**이며 기기 시계를 쓰지 않는다.
          example: 0
        pending:
          type: integer
          description: '상태가 `new` 인 건수 (`처리 대기 중인 상담`).'
          example: 3
        timezone:
          type: string
          description: 달 경계 계산에 쓴 시간대. 화면이 기준을 표시할 수 있게 명시한다.
          example: Asia/Seoul
        calculatedAt:
          type: string
          format: date-time

    # ---------------------------------------------------------------- 병원 문의
    InquiryTopic:
      type: string
      enum: [price, hours, parking, procedure, etc]
      description: |
        문의 주제. **하나를 반드시 고른다 — 기본값이 없다** (§14).

        | 코드 | 화면 라벨 |
        |---|---|
        | `price` | `가격` |
        | `hours` | `진료시간` |
        | `parking` | `주차·위치` |
        | `procedure` | `시술 방법` |
        | `etc` | `기타` |

        **라벨이 아니라 코드를 값으로 쓴 이유.** `ConsultPreferredTime` 은 한국어 문자열을 값으로 쓰는데,
        그것은 **이미 저장된 데이터와 도메인 타입을 보존하려는 것**이고 그 스키마 설명 자체가
        "코드 기반 enum 으로 바꾸는 것은 미결 사항" 이라고 적고 있다. 문의는 보존할 과거 데이터가 없는
        새 도메인이라 **그 미결을 물려받을 이유가 없다.** 덧붙여 `주차·위치` 는 가운뎃점이 들어가 있어
        쿼리 파라미터(`?topic=`)로 오갈 때 인코딩 사고가 나기 쉽고, 라벨을 값으로 쓰면
        **문구를 다듬는 순간 저장된 값이 깨진다.**

        라벨 매핑은 클라이언트가 들고 있는다 (칩 순서도 위 표 순서다). 값이 늘어날 수 있으므로
        클라이언트는 **모르는 코드를 만나면 `기타` 로 떨어뜨린다** (§15 의 enum 방어 규칙).

    InquiryStatus:
      type: string
      enum: [unanswered, answered]
      description: |
        화면 표기는 `미답변` / `답변완료`.

        **저장된 컬럼이 아니라 파생값이다** (§14): `answeredAt === null ? unanswered : answered`.
        같은 판정이 목록·상세·카운트·공개 노출 네 곳에 필요하므로 순수 함수 하나
        (`inquiryStatus`)를 공유한다. 한쪽만 틀리면 **비공개 문의가 공개 목록에 뜬다.**

    HospitalInquiryAnswer:
      type: object
      description: |
        등록된 답변. 답변은 **문의 1건에 1건이고 수정이 없다** (§14) — 그래서 배열이 아니라 객체이고,
        `id` 도 `updatedAt` 도 없다.

        **답변자 이름(`answeredByName`)을 내려주지 않는다.** 저장은 된다
        (`hospital_inquiries.answered_by_user_id`) — 감사 질의가 원본 테이블 그 자리에서 답을 찾을 수
        있어야 하기 때문이다. 다만 **그 값을 그리는 화면이 아직 없다.** 환자에게는 병원이 답한 것이고,
        관리자 화면도 담당자별 구분을 요구하지 않는다. 필요해지면 필드 추가는 additive 변경이다 (§15).
      required: [content, isPublic, answeredAt]
      properties:
        content:
          type: string
          description: 5~1000자 (trim 후).
          example: 임플란트는 재료에 따라 90만원부터 150만원 사이입니다.
        isPublic:
          type: boolean
          description: |
            **병원이 답변 시점에 고른 공개 허용 여부** (DB `answer_public`).
            환자의 `isPublic` 과 **둘 다 `true` 여야** 공개 Q/A 에 노출된다.
            미답변 행에서는 이 값이 존재하지 않는다 — `answer` 자체가 `null` 이므로
            "아직 안 물어봤다" 와 "비공개를 골랐다" 가 섞일 자리가 없다.
          example: true
        answeredAt:
          type: string
          format: date-time
          description: 답변 등록 시각. **상태 판정의 유일한 근거**이기도 하다 (§14).
          example: '2026-10-12T06:10:00.000Z'

    HospitalInquiry:
      type: object
      description: |
        **관리자 시야** (`hospital_admin` / `operator` 공용). `Cache-Control: no-store`.
        목록과 상세가 같은 스키마를 쓴다.

        ### `piiMasked` 가 없는 것이 상담과의 차이다

        `ConsultRequest` 는 역할에 따라 `name`·`phone` 값이 갈려서 `piiMasked` 플래그가 필요했다.
        문의는 **분기가 없다** (§4):

        | 보는 사람 | 문의자 이름 | 연락처 |
        |---|---|---|
        | `hospital_admin` (담당 병원) | `김*준` | **컬럼 자체가 없다** |
        | `operator` | `김*준` | 〃 |

        플래그가 가리킬 차이가 없으므로 두지 않는다 (`Review.authorName` 과 같은 경우).
        마스킹 함수는 상담과 **같은 함수**다 — 같은 판정을 두 곳에 두지 않는다.

        ### `title` 이 없는 이유

        작성 화면에 제목 입력칸이 없다. 목록 카드의 제목은 클라이언트가 `content` 의 **첫 줄**을 잘라
        만든다. 저장하지 않는 값을 응답에만 넣으면 두 값이 어긋날 자리가 생긴다 (§14).
      required: [id, hospitalId, hospitalName, askerName, topic, content, isPublic, status, answer, createdAt]
      properties:
        id:
          type: string
          example: hi1
        hospitalId:
          type: string
          example: h1
        hospitalName:
          type: string
          description: |
            `operator` 는 전 병원을 한 목록에서 보고, `hospital_admin` 도 담당 병원이 여럿일 수 있어
            (M:N) 항목마다 병원명이 필요하다.
          example: 강남 스마일 치과
        askerName:
          type: string
          description: |
            문의자 이름. **역할과 무관하게 항상 마스킹된다** — 가운데 글자를 `*` 로 (`김민준` → `김*준`),
            두 글자면 `박*`, 네 글자 이상은 첫·끝만 남겨 `남**수`.
            `users.name` 을 조인해 마스킹하며 **스냅샷 컬럼을 두지 않는다** — 문의 화면에 이름 입력칸이
            없으므로 계정 이름이 바뀌면 바뀐 이름의 마스킹이 보이는 것이 맞다 (§4).
          example: 김*준
        topic:
          $ref: '#/components/schemas/InquiryTopic'
        content:
          type: string
          description: 문의 본문 전문. 목록에서도 자르지 않고 그대로 준다 (카드가 두 줄로 자르는 것은 표현).
        isPublic:
          type: boolean
          description: |
            **환자가 작성 시점에 고른 공개 여부** (DB `is_public_by_user`, 기본 `true`).
            답변 화면이 "환자가 공개를 원한 문의" 임을 표시해야 공개 여부를 고를 때 판단이 선다.
          example: true
        status:
          $ref: '#/components/schemas/InquiryStatus'
        answer:
          oneOf:
            - $ref: '#/components/schemas/HospitalInquiryAnswer'
            - type: 'null'
          description: |
            미답변이면 `null`. **키는 항상 있고 값만 `null` 일 수 있다** (`required` 에 포함) —
            키가 없는 것과 `null` 인 것이 섞이면 "아직 답이 없다" 와 "서버가 안 내려준다" 를 구분할 수 없다
            (`ConsultRequest.thirdPartyConsent` 와 같은 규약).
        createdAt:
          type: string
          format: date-time
          description: 접수 시각. 목록의 상대 시간 표시(`3시간 전`)가 이 값을 쓴다.
          example: '2026-10-12T04:21:00.000Z'

    MyHospitalInquiry:
      type: object
      description: |
        **문의자 시야.** 같은 저장 구조에서 나오는 다른 투영이다 (`MyConsultRequest` 와 같은 기준 —
        구조가 다를 때만 투영을 나눈다).

        `askerName` 이 **없다** (자기 이름이라 쓸모가 없고, 마스킹된 자기 이름을 돌려주면 혼란스럽다).
        대신 병원 이름·사진이 있다 — 문의자는 병원 id 를 모르고, 내역 카드가 병원을 보여줘야 한다.

        `answer.isPublic`(병원의 공개 선택)을 **담는다** (2026-10-12 리뷰에서 추가). 처음에는 문의자 화면이
        묻지 않는 값이라고 보고 뺐지만, 그러면 "공개로 물었는데 병원이 비공개로 답한" 건을 화면이 `공개` 로
        잘못 말하고, `병원 상세 보기` 가 그 글이 없는 공개 Q/A 로 데려간다. 문의자가 실제 노출 여부를
        알려면 클라이언트도 같은 순수 함수(`isPubliclyVisible`, §14)로 판정해야 하고 그 입력이 이 값이다.
        문의자 본인의 Q/A 에 대한 병원의 선택이라 새는 정보가 없다.
      required: [id, hospitalId, hospitalName, topic, content, isPublic, status, answer, createdAt]
      properties:
        id:
          type: string
        hospitalId:
          type: string
          description: '`문의한 병원 보기` 링크가 쓴다.'
        hospitalName:
          type: string
          example: 강남 스마일 치과
        hospitalThumbnail:
          type: string
          format: uri
          description: 내역 카드의 병원 사진. 병원을 다시 조회하지 않아도 되게 함께 준다.
        topic:
          $ref: '#/components/schemas/InquiryTopic'
        content:
          type: string
          description: 내가 남긴 본문 전문. 목록 카드의 제목은 이 값의 첫 줄이다.
        isPublic:
          type: boolean
          description: |
            **내가 고른 공개 여부.** 화면의 `공개`/`비공개` 배지가 이 값을 그린다.
            실제 공개 Q/A 노출은 병원의 허용과 답변 완료가 함께 있어야 한다는 점을
            화면 안내 문구가 설명해야 한다 (§14 `isPubliclyVisible`).
        status:
          $ref: '#/components/schemas/InquiryStatus'
        answer:
          type: [object, 'null']
          required: [content, answeredAt, isPublic]
          description: |
            받은 답변. 미답변이면 `null`. **비공개로 물은 문의의 답변을 본인이 읽는 유일한 경로가
            이 필드다** — 공개 Q/A 목록에는 그 건이 없다.
          properties:
            content:
              type: string
            answeredAt:
              type: string
              format: date-time
            isPublic:
              type: boolean
              description: |
                병원이 답변하며 고른 공개 허용 여부(`HospitalInquiryAnswer.isPublic` 과 같은 값).
                실제 공개 Q/A 노출은 이 값과 문의자의 `isPublic` 이 **둘 다** 참일 때다 (§14 `isPubliclyVisible`).
        createdAt:
          type: string
          format: date-time

    PublicHospitalInquiry:
      type: object
      description: |
        **공개 Q/A 시야** (비로그인 포함). 병원 상세 `문의` 탭의 한 항목.

        **작성자 필드가 아예 없다** (§4). 빈 문자열이나 `익명` 을 채우면 언젠가 채워질 자리가 되고,
        그 자리에 무엇이 들어가도 "공개 Q/A 에 작성자 표기 없음" 이라는 결정이 조용히 풀린다.

        `answer` 가 **필수이며 `null` 이 아니다** — 목록에 들어온 시점에 이미 답변완료이기 때문이다
        (`isPubliclyVisible`). 답변 공개 여부(`answer.isPublic`)도 내려주지 않는다. 여기 있다는 것이
        곧 `true` 라서 값이 정보를 더하지 않는다.
      required: [id, topic, content, createdAt, answer]
      properties:
        id:
          type: string
          description: |
            공개 Q/A 항목의 id. 이 id 로 열 수 있는 상세 경로는 **없다** —
            `GET /hospital-inquiries/{id}` 는 관리자 전용이고 범위 밖이면 `404` 다.
            클라이언트의 목록 키·앵커로만 쓴다.
          example: hi3
        topic:
          $ref: '#/components/schemas/InquiryTopic'
        content:
          type: string
          description: 질문 본문.
        createdAt:
          type: string
          format: date-time
          description: 질문이 올라온 시각. 정렬 기준은 `answer.answeredAt` 이고 이 값이 아니다.
        answer:
          type: object
          required: [content, answeredAt]
          properties:
            content:
              type: string
            answeredAt:
              type: string
              format: date-time

    HospitalInquirySummary:
      type: object
      description: |
        관리자 문의 화면의 상태 탭 숫자와 사이드 메뉴 배지. 요청자의 담당 병원 범위로 계산된다
        (`operator` 는 전체).

        `total === unanswered + answered` 가 항상 성립한다 — 상태가 `answeredAt` 하나에서 파생되는
        2값이라 그 사이가 벌어질 수 없다. 그래도 `total` 을 내려주는 이유는 화면이 `전체 N` 을 직접
        표시하고, 클라이언트가 두 수를 더하는 순간 그 덧셈이 **세 번째 판정 지점**이 되기 때문이다.

        `ConsultSummary` 와 달리 `timezone` 이 없다. 달력 경계로 갈리는 값이 하나도 없다.
      required: [unanswered, answered, total, scope]
      properties:
        unanswered:
          type: integer
          description: '`미답변 N`. 사이드 메뉴 배지도 이 값이다 (`안 읽은 수` 가 아니라 미답변 수 — §14).'
          example: 2
        answered:
          type: integer
          description: '`답변완료 N`.'
          example: 7
        total:
          type: integer
          description: '`전체 N`. 공개 여부와 무관한 담당 병원의 모든 문의 수다.'
          example: 9
        scope:
          type: string
          enum: [managed, all]
          description: '`managed` = 담당 병원 합산, `all` = 전체 (`operator`). 목록 응답의 `scope` 와 같은 값이다.'

    HospitalInquiryCreateRequest:
      type: object
      description: |
        문의 작성 폼의 제출 본문. **이름·연락처·동의 항목이 없다** — 문의는 연락처 없이 앱 안에서
        답을 받는 창구이고, 병원에 넘길 개인정보가 없으므로 제3자 제공 동의도 필요 없다 (§4).
      required: [hospitalId, topic, content]
      properties:
        hospitalId:
          type: string
          description: 문의 대상 병원. 없으면 `404 HOSPITAL_NOT_FOUND`.
          example: h1
        topic:
          $ref: '#/components/schemas/InquiryTopic'
        content:
          type: string
          minLength: 5
          maxLength: 1000
          description: |
            **앞뒤 공백을 제거한 뒤** 5~1000자. 서버는 trim 한 값을 저장한다.
            길이 위반은 `422 VALIDATION_FAILED` (`CONTENT_TOO_SHORT` / `CONTENT_TOO_LONG`).
          example: 임플란트 1개 비용이 대략 얼마인가요?
        isPublic:
          type: boolean
          default: true
          description: |
            작성 화면의 `다른 사람도 볼 수 있게 공개` 체크 (**기본 켜짐**). 보내지 않으면 `true` 다.

            **켜도 바로 공개되지 않는다.** 병원이 답변하면서 공개를 허용하고 답변이 완료되어야
            공개 Q/A 에 올라간다 (§14 `isPubliclyVisible`). 화면 안내 문구가 그 조건을 말해야 한다.

            ⚠️ 요청서의 안내 문구 `공개해도 닉네임만 보임` 은 결정과 다르다 —
            **공개 Q/A 에는 작성자 표기가 아예 없고**, `users` 에 닉네임 컬럼도 없다 (§4).
            화면 문구를 결정에 맞춰 고쳐야 한다.

    HospitalInquiryAnswerRequest:
      type: object
      description: 관리자 문의 화면의 `답변 등록` 본문.
      required: [content, isPublic]
      properties:
        content:
          type: string
          minLength: 5
          maxLength: 1000
          description: |
            앞뒤 공백 제거 후 5~1000자. `자주 쓰는 답변` 버튼 3개(진료시간 안내 / 비용 안내 /
            상담 예약 권유)는 **클라이언트가 이 칸을 채우는 장치**일 뿐이고, 서버는 그 문구를 모른다 —
            템플릿 id 를 받지 않는다. 담당자가 그대로 보낼 수도 고쳐 보낼 수도 있어서
            서버가 "어느 템플릿인지" 를 맞다/틀리다 판정할 근거가 없다.
          example: 평일은 오전 10시부터 오후 7시까지 진료합니다.
        isPublic:
          type: boolean
          description: |
            **[필수, 기본값 없음]** 이 답변을 공개 Q/A 에 노출해도 되는지 (DB `answer_public`).
            누락이면 `422 VALIDATION_FAILED` (`details[].code: ANSWER_PUBLIC_REQUIRED`).
            기본값을 두면 서버가 공개 여부를 대신 고르는 셈이 되고,
            "아직 안 물어봤다" 와 "병원이 비공개를 골랐다" 가 같은 값이 된다 (§14).

            환자의 `isPublic` 이 `false` 인 문의에 `true` 를 보내도 **오류가 아니다** —
            노출 판정은 두 값의 AND 라서 그대로 비공개로 남는다. 한쪽 값만으로 거절하면
            화면이 상대방의 선택을 추론해야 하고, 그 추론이 §14 의 판정을 복제하게 된다.
          example: true

    # ------------------------------------------------- 관리자 대시보드 (요청 05)
    AdminDashboard:
      type: object
      description: |
        `GET /admin/dashboard` 의 응답. **선택한 병원 한 곳**의 한 시점 집계다 (2026-10-13 신규).

        `scope` 필드가 없는 것이 이 스키마의 표시다 — 다른 관리자 목록 셋(`/consult-requests`,
        `/hospital-inquiries`, `/admin/hospitals`)은 "담당 병원 전부 / 전 병원" 을 `scope` 로
        구분하지만, 대시보드는 **언제나 병원 하나**이고 그 축은 `hospitalId` 다 (§3).

        **블록을 넷으로 나눈 기준은 "화면의 어느 영역이 읽는가" 다** — `numbers`(숫자 카드 4개와
        사이드 배지 2개), `funnel`(이번 달 상담 흐름), `todo`(오늘 할 일), `completeness`(완성도 바).
        같은 값을 두 블록에 복사하지 않는다: `오늘 할 일` 2·3번 줄은 `numbers.statusNew` 와
        `numbers.unansweredInquiries` 를 그대로 읽는다.
      required:
        - hospitalId
        - hospitalName
        - numbers
        - funnel
        - todo
        - recentConsults
        - todayVisits
        - completeness
        - timezone
        - calculatedAt
      properties:
        hospitalId:
          type: string
          description: |
            **실제로 집계한 병원.** 요청에서 `hospitalId` 를 생략했을 때(담당 병원 1곳) 화면이
            어느 병원을 받았는지 알 수 있어야 한다 — 각 카드의 링크(`/consult-requests?hospitalId=`)가
            이 값을 그대로 쓴다.
          example: h1
        hospitalName:
          type: string
          description: 사이드 메뉴 하단과 드롭다운의 표시용. 병원을 한 번 더 조회하지 않게 함께 내려준다.
          example: 강남 스마일 치과
        numbers:
          $ref: '#/components/schemas/AdminDashboardNumbers'
        funnel:
          $ref: '#/components/schemas/AdminDashboardFunnel'
        todo:
          $ref: '#/components/schemas/AdminDashboardTodo'
        recentConsults:
          type: array
          maxItems: 5
          description: |
            `최근 상담 예약` 표. **`createdAt` 내림차순 5건, 상태 무관**이다.
            `전체 보기` 는 `/consult-requests?hospitalId=` (같은 정렬의 1페이지).

            항목은 상담 **목록과 같은 `ConsultRequest` 투영**이다 — 이름은 전체,
            **연락처는 마스킹**(`010-****-4411`), `piiMasked: true`. 대시보드는 감사 기록을
            남기지 않는 자리라 전체 번호가 실릴 수 없다 (§4).
          items:
            $ref: '#/components/schemas/ConsultRequest'
        todayVisits:
          type: array
          description: |
            `오늘 내원 예정`. **`status === 'booked'` 이고 `visitAt ∈ 오늘(KST)` 인 건, `visitAt`
            오름차순**이다. 상한을 두지 않는다 — 하루치가 전부다.

            | 질문 | 답 |
            |---|---|
            | `visited` 도 넣나 | **아니다, `booked` 만.** `예정` 이므로 내원 처리를 하면 줄이 사라지는 것이 맞다 |
            | `visitAt` 이 이미 지난 오늘 건 | **포함한다.** 오늘 10시 예약을 11시에 보는 것이 정상이다 — 하루 단위 목록이지 미래 필터가 아니다 |

            **이 목록을 재현하는 목록 파라미터는 만들지 않았다** (`visitDate`/`visitPeriod`).
            `전체 보기` 가 없고 각 행은 상담 상세로 간다.
          items:
            $ref: '#/components/schemas/AdminDashboardVisit'
        completeness:
          $ref: '#/components/schemas/HospitalCompleteness'
        timezone:
          type: string
          description: |
            달력 경계(`오늘`·`이번 달`) 계산에 쓴 시간대. 기기 시계를 쓰지 않는다는 것을 화면이
            표시할 수 있게 명시한다 (`ConsultSummary` 와 같은 선례). 항상 `Asia/Seoul` 이다.
          example: Asia/Seoul
        calculatedAt:
          type: string
          format: date-time
          description: |
            이 집계의 시점. **모든 숫자와 목록이 이 한 시점의 값**이다.
            `delayed` 와 목록 화면의 `지연` 배지가 다른 숫자를 보일 수 있는 이유가 이 값의 차이이고
            (규칙이 아니라 시점의 차이다), 화면이 `방금 기준` 같은 문구를 쓸 수 있다.
          example: '2026-10-13T02:30:00.000Z'

    AdminDashboardNumbers:
      type: object
      description: |
        숫자 카드 4개(+보조 줄)와 사이드 메뉴 배지 2개가 읽는 숫자 전부.
        **전부 선택한 병원 한 곳**, 달력 경계는 `Asia/Seoul`, 반열린 구간 `[from, to)` 다.

        **클라이언트가 더하거나 다시 세는 값은 하나도 없다.** 각 설명에 **그 숫자를 재현하는 목록
        질의**를 함께 적었다 — 카드를 눌러 열리는 화면의 `meta.totalItems` 와 같아야 한다는 것이
        이 스키마의 불변식이다.
      required:
        - todayNew
        - statusNew
        - pending
        - delayed
        - unansweredInquiries
        - oldestUnansweredAt
        - newThisMonth
        - bookedThisMonth
      properties:
        todayNew:
          type: integer
          minimum: 0
          description: |
            **① 오늘 들어온 상담.** `createdAt ∈ 오늘(KST)` 인 상담 수, **상태 무관**(취소 포함).

            재현: `GET /consult-requests?hospitalId={id}&period=today` → `meta.totalItems`
            (= `statusCounts.total`).

            **상태를 가리지 않는 이유**: 눌러서 열리는 목록이 `period=today` 하나뿐이라 전 상태가
            보인다. `status='new'` 로 좁히면 카드 숫자와 목록 건수가 다르고, 오늘 들어와 오늘 예약까지
            잡힌 건을 `오늘 들어온 상담` 에서 빼는 것도 말이 되지 않는다.
          example: 3
        statusNew:
          type: integer
          minimum: 0
          description: |
            **① 보조 줄 `신규 전체 N건` · 사이드 배지 `상담 예약` · `오늘 할 일` 2번** — 세 자리가
            읽는 **한 필드**다. `status === 'new'` 인 상담 수, **기간 무관**.

            재현: `GET /consult-requests?hospitalId={id}&status=new` → `meta.totalItems`
            (= `statusCounts.new`).
          example: 8
        pending:
          type: integer
          minimum: 0
          description: |
            **② 처리 대기.** `status ∈ {new, contacted}` 인 상담 수, **기간 무관**.
            요청자가 정한 정의다 (`처리 대기 = 신규 + 연락중`).

            재현: `GET /consult-requests?hospitalId={id}&status=new&status=contacted` →
            `meta.totalItems`. **이 카드 때문에 `status` 반복 허용이 들어왔다** — 단일 값이었을 때는
            이 카드를 여는 링크가 카드와 다른 숫자를 열었다.

            **서버가 센 값이지 `statusCounts.new + statusCounts.contacted` 가 아니다.**
            클라이언트가 더하면 그 덧셈이 또 하나의 판정 지점이 되고, 같은 덧셈을 배지에서 한 번 더 한다.
          example: 15
        delayed:
          type: integer
          minimum: 0
          description: |
            **② 보조 줄 `24시간 지연 N건`.** `status === 'new'` 이고 접수 후 **24시간 이상** 경과한 건의 수.

            상담 목록의 `지연` 배지를 클라이언트가 판정하는 순수 함수(`isDelayed`,
            `docs/database/README.md` §12.7)와 **같은 부등식**이며, 서버는 그것을 이항해 질의한다:
            `now − createdAt ≥ 24h` ⟺ `createdAt ≤ now − 24h`.
            **경계는 포함이다** — 정확히 24시간 경과한 건은 지연이다.
            24시간은 **경과 시간**이라 `Asia/Seoul` 이 개입하지 않는다 (`today`·`thisMonth` 와 다른 점).
            클라이언트는 **이 숫자를 다시 계산하지 않는다.** 목록의 배지만 같은 함수로 칠하므로,
            두 값은 **다른 시점**을 가리킬 수는 있어도 **다른 규칙**을 가리키지 않는다.

            **재현하는 목록 질의가 없다 — 보조 줄에 링크를 걸지 않는다.** 재현용 파라미터를 만들면
            상태도 기간도 아닌 세 번째 필터 축이 탭 UI 옆에 생긴다. 지연 건은
            `todo.delayedConsults` 에 개별 줄로 나열되고 거기서 상세로 간다.

            **`statusNew` 의 부분집합이다** (지연 건도 `new` 다). `지연 3건` + `신규 8건` 은 11건이
            아니라 8건이고 그중 3건이 지연이다 — 화면 문구가 그것을 드러내야 한다.
          example: 3
        unansweredInquiries:
          type: integer
          minimum: 0
          description: |
            **③ 답변 안 한 문의 · 사이드 배지 `문의` · `오늘 할 일` 3번** — 세 자리가 읽는 **한 필드**다.
            그 병원의 문의 중 `answeredAt === null` 인 수 (`inquiryStatus === 'unanswered'`,
            공개·비공개 전부).

            재현: `GET /hospital-inquiries?hospitalId={id}&status=unanswered` → `meta.totalItems`,
            그리고 `GET /hospital-inquiries/summary?hospitalId={id}` 의 `unanswered`.
            **같은 순수 함수(`inquiryStatus`)로 계산하므로 세 값은 시점 차이로만 어긋난다.**
            그래도 대시보드는 자기 응답의 값을 쓴다 — 한쪽만 재사용하면 "어느 것이 기준인가" 가
            다시 결정 사항이 된다.
          example: 2
        oldestUnansweredAt:
          type: [string, 'null']
          format: date-time
          description: |
            **③ 보조 줄 `가장 오래된 것 {언제}`.** 위 모집단(`answeredAt === null`)의
            `min(createdAt)` 이고, **미답변이 0건이면 `null`** 이다 (화면은 보조 줄을 숨긴다).

            재현: 같은 목록(`…&status=unanswered`)을 `createdAt` 오름차순으로 보면 첫 행의 접수 시각이다.
            "며칠 지났는지" 는 화면이 `calculatedAt` 과의 차이로 그린다 — 서버가 일수를 세지 않는다
            (받는 순간부터 낡기 시작하는 값이다).
          example: '2026-10-09T01:12:00.000Z'
        newThisMonth:
          type: integer
          minimum: 0
          description: |
            **④ `이번 달 신청 M건 중 N건 예약` 의 M.** `createdAt ∈ 이번 달(KST)` 인 상담 수,
            **상태 무관**. `funnel.requested` 와 **같은 값**이다 (깔때기의 코호트가 이것이다).

            재현: `GET /consult-requests?hospitalId={id}&period=thisMonth` → `meta.totalItems`.
            **카드의 링크는 이쪽(M)이다.**

            ⚠️ `ConsultSummary.newThisMonth` 와 **이름이 같고 모집단이 다르다** — 그쪽은
            `hospitalId` 파라미터가 없어 **담당 병원 전체 합산**이다. 재사용 관계가 아니다.
          example: 42
        bookedThisMonth:
          type: integer
          minimum: 0
          description: |
            **④ 의 N.** M 의 코호트(이번 달 접수) 중 **현재 상태**가 `booked` 또는 `visited` 인 건수.
            `funnel.booked` 와 **같은 값**이다.

            재현: `GET /consult-requests?hospitalId={id}&period=thisMonth&status=booked&status=visited`
            → `meta.totalItems` (반복 허용 `status` 가 이 링크를 살린다).

            **`visited` 를 포함하는 것이 이 정의의 전부다.** 빼면 내원 처리를 하는 순간 숫자가 줄어
            일을 잘할수록 지표가 내려간다. `booked ∪ visited` 로 묶으면 "예약까지 간 건" 이 월중에
            단조 증가한다.

            쓰지 않은 후보 둘: **이번 달에 `booked` 이벤트가 난 건**(분모와 모집단이 달라 비율이
            100%를 넘을 수 있다 — 지난달 접수 건이 이번 달에 확정되는 경우), **이력상 `booked` 에
            도달한 적 있는 건**(취소까지 세고, 무엇보다 상태 탭으로 **재현할 수 없어** 카드와 목록이
            영영 갈린다).

            **현재 상태로 정의한 대가**: 예약했다가 취소된 건은 N 에서 빠진다(취소 시점에 숫자가
            내려간다). 카드 문구가 `예약` 이지 `예약했었음` 이 아니므로 그것이 맞다.

            **비율(%)은 내려주지 않는다** — 카드 문구가 `이번 달 신청 42건 중 18건 예약` 이고
            퍼센트를 그리는 자리가 없다. 필요해지면 화면이 `newThisMonth`/`bookedThisMonth` 로
            계산하거나, 그날 필드를 더한다.
          example: 18

    AdminDashboardFunnel:
      type: object
      description: |
        `이번 달 상담 흐름` — `상담 신청 → 연락 완료 → 예약확정 → 내원완료` 네 막대와, 단계가 아닌
        `취소` 하나.

        **모집단은 카드 ④의 M 과 같은 한 코호트**다 (`createdAt ∈ 이번 달(KST)`).
        네 막대가 같은 집합의 부분집합이라야 깔때기가 깔때기다 — "이번 달에 일어난 이벤트" 로 세면
        분모 없는 네 수가 나란히 서고, 지난달 접수 건이 섞여 **아래 막대가 위 막대보다 길어질 수 있다.**

        **각 단계는 `현재 상태`(와 거기서 파생되는 현재 취소 사유)로 판정한다. 이력을 거슬러 세지
        않는다.** 상담 목록의 **상태 탭과 같은 축**이어야 담당자가 막대를 보고 탭을 눌러 숫자를
        대조할 수 있기 때문이다. "도달한 적 있는가" 기준은 재현할 필터가 없어 영영 대조되지 않고,
        **숫자가 맞는지 눈으로 확인할 수 없는 지표는 틀려도 아무도 모른다.**

        단조 감소가 **구조적으로** 보장된다:
        `visited ⊆ {booked, visited} ⊆ 연락 완료 ⊆ 코호트`.

        판정은 순수 함수 하나다 (`funnelOf`, `docs/database/README.md` §13.6).
      required: [requested, contacted, booked, visited, cancelled]
      properties:
        requested:
          type: integer
          minimum: 0
          description: |
            `상담 신청` — 코호트 전체. **`numbers.newThisMonth` 와 같은 값**이다.
            재현: `?hospitalId={id}&period=thisMonth`.
          example: 42
        contacted:
          type: integer
          minimum: 0
          description: |
            `연락 완료` — `status !== 'new'` **그리고** `(status === 'cancelled' && cancelReason === 'no_answer')`
            가 **아닌** 건.

            **`연락이 안 됨` 취소를 빼는 이유**: 그 사유는 **연락이 닿지 않았다는 병원 자신의 기록**이다.
            세면 막대가 "연락을 **시도**한 건" 이 되어 쓸모가 없어진다. 나머지 네 사유
            (`patient_request`·`procedure_unavailable`·`duplicate`·`etc`)는 연락이 닿은 뒤에 나오는
            사유라 센다. `cancelReason` 은 이력에서 파생한 현재 값이고, **과거 취소 건은 사유가 `null`
            이라 여기 포함된다** — 소급해 추측하지 않는다.

            ⚠️ **라벨과 규칙이 1:1이 아닌 자리다.** 정확히는 "신규를 벗어났고, 연락 불발로 닫히지
            않은 건" 이다. 요청서의 문구가 `연락 완료` 이고 담당자에게는 "손을 댄 건" 으로 읽힌다.

            **이 막대만 상태 탭으로 재현되지 않는다** (취소 사유가 걸린 조건이다). 재현용 필터를
            만들지 않았고, 화면은 그 한 막대를 정확히 열 수 없다는 것을 받아들인다.
          example: 31
        booked:
          type: integer
          minimum: 0
          description: |
            `예약확정` — `status ∈ {booked, visited}`. **`numbers.bookedThisMonth` 와 같은 값**이다.
            재현: `?hospitalId={id}&period=thisMonth&status=booked&status=visited`.
          example: 18
        visited:
          type: integer
          minimum: 0
          description: |
            `내원완료` — `status === 'visited'`.
            재현: `?hospitalId={id}&period=thisMonth&status=visited`.
          example: 7
        cancelled:
          type: integer
          minimum: 0
          description: |
            `취소` — `status === 'cancelled'`. **단계가 아니라 옆에 적는 숫자**이고, 막대 사이에
            끼우지 않는다 (취소는 어느 단계에서든 일어나 단조 감소를 설명하지 못한다).
            재현: `?hospitalId={id}&period=thisMonth&status=cancelled`.
          example: 6

    AdminDashboardTodo:
      type: object
      description: |
        `오늘 할 일` 네 줄 중 **`numbers` 에 없는 것만** 담는다.

        | 줄 | 어디서 읽나 |
        |---|---|
        | 1. 지연 상담 (**건별**) | `delayedConsults` + `delayedRemaining` |
        | 2. `신규 상담 N건 연락하기` | **`numbers.statusNew`** (여기 다시 담지 않는다) |
        | 3. `답변 안 한 문의 N건` | **`numbers.unansweredInquiries`** (〃) |
        | 4. `자격증 반려 — 다시 올리기` | `rejectedDoctors` |

        **2·3번을 복사하지 않는 이유**: 같은 숫자를 두 필드로 내리면 그 둘이 어긋날 자리가 생긴다.
        같은 값은 **같은 필드**다 (`GET /admin/dashboard` 설명).

        **1번은 2번의 부분집합이다** — 지연 건도 `new` 다. 두 줄을 더하게 만드는 UI 는 거짓을
        보여준다 (`신규 상담 8건 연락하기 — 그중 3건은 24시간이 지났어요` 같은 형태가 맞다).

        **네 줄이 모두 비면** 화면이 `오늘 처리할 일이 없어요` 를 그린다. 서버는 빈 값을 그대로
        내려주고 "할 일 없음" 을 판정하지 않는다 — 네 값이 모두 0인지는 화면이 보면 된다.
      required: [delayedConsults, delayedRemaining, rejectedDoctors]
      properties:
        delayedConsults:
          type: array
          maxItems: 5
          description: |
            지연 상담 **개별 행, 최대 5행**. 모집단은 `numbers.delayed` 와 같고
            (`status === 'new'` ∧ `createdAt ≤ calculatedAt − 24h`),
            정렬은 **`createdAt` 오름차순 — 오래된 것 먼저**다. 각 행은 상담 상세로 간다.

            **각 행을 클라이언트가 `isDelayed` 로 다시 판정해도 같은 답이 나온다** — 그것이 규칙이
            하나라는 뜻이다. 목록 전체를 받아 세지 않는 이유는 모집단이 그 병원의 `new` 전체라
            세려면 전 건을 메모리로 올려야 하기 때문이다.
          items:
            $ref: '#/components/schemas/AdminDashboardTodoConsult'
        delayedRemaining:
          type: integer
          minimum: 0
          description: |
            `외 N건` — `numbers.delayed − delayedConsults.length` 이고 5건 이하면 `0` 이다.
            **서버가 내려주는 이유**: 화면이 빼기를 하면 그 뺄셈이 판정 지점이 되고,
            상한(5)이 바뀌는 날 두 곳을 고쳐야 한다.
          example: 1
        rejectedDoctors:
          type: array
          description: |
            `자격증 반려 — 다시 올리기`. 그 병원 소속 전문의 중
            `verificationStatus === 'rejected'` 인 **전부**다 (상한 없음 — 보통 0~1명이다).
            줄의 숫자는 **배열 길이**이고 별도 카운트 필드를 두지 않는다.
            누르면 의료진 영역(= 병원 정보 수정 화면의 의료진 영역, 07 이후 별도 라우트)으로 간다.

            **반려 사유(`rejectionReason`)는 담지 않는다** — `DoctorAdminView` 에만 있는 값이고
            병원 소속 전문의를 관리자 시야로 읽는 GET 이 아직 없다
            (`GET /hospitals/{hospitalId}/doctors?view=admin` 후보). **이름을 붙이는 것은 지금 된다** —
            공개 `Doctor` 에 `name` 과 `verificationStatus` 가 있다. 사유 표시는 그 GET 이 생기는 날이다.
          items:
            $ref: '#/components/schemas/AdminDashboardRejectedDoctor'

    AdminDashboardTodoConsult:
      type: object
      description: |
        `오늘 할 일` 의 지연 상담 한 줄. **상담 목록(`ConsultRequest`)보다 좁은 투영**이다 —
        `이름 · 시술 · 접수 시각` 만 있고 **연락처 필드가 아예 없다.**

        좁힌 이유: 이 줄은 상담 상세로 가는 링크이고, 목록처럼 작업하는 자리가 아니다.
        전체 `ConsultRequest` 를 실으면 **감사 기록을 남기지 않는 응답**에 `memos`(담당자가 고객
        연락처를 적을 수 있는 자유 텍스트)와 이력까지 따라 들어온다. 가려진 필드가 하나도 없으므로
        `piiMasked` 플래그도 두지 않는다 (§4 — 플래그는 갈리는 값이 있을 때만 둔다).
      required: [id, name, procedureId, createdAt]
      properties:
        id:
          type: string
          description: 상담 id. 행을 누르면 `/admin/consultations/{id}` (= `GET /consult-requests/{id}`).
          example: cr12
        name:
          type: string
          description: |
            신청자 이름. **마스킹하지 않는다** — 이 오퍼레이션은 담당 `hospital_admin` 전용이고,
            담당자에게 이름 전체가 가는 것은 상담 목록과 같다 (§4). 전화 거는 일은 상세에서 한다.
          example: 박서영
        procedureId:
          oneOf:
            - $ref: '#/components/schemas/ProcedureId'
            - type: 'null'
          description: |
            `null` 이면 화면에 `시술 미지정`. **시술명을 함께 내리지 않는 이유**: 화면이
            `GET /procedures` 를 이미 들고 있고(시술 칩·필터), 같은 이름을 두 경로로 내리면
            마스터가 바뀔 때 둘이 갈린다. (`ConsultRequest` 는 상담 관리 화면이 시술 마스터 없이도
            목록을 그릴 수 있어야 해서 `procedureName` 을 함께 싣는다 — 그쪽 판단을 바꾸지 않는다)
        createdAt:
          type: string
          format: date-time
          description: |
            접수 시각. **정렬 키**이고(오름차순), 화면의 `3일 지남` 같은 경과 문구도 이 값과
            `calculatedAt` 의 차이로 그린다 — 서버가 경과 일수를 세지 않는다.
          example: '2026-10-11T23:40:00.000Z'

    AdminDashboardVisit:
      type: object
      description: |
        `오늘 내원 예정` 한 줄. `AdminDashboardTodoConsult` 와 같은 이유로 좁힌 투영이고,
        정렬·표시의 기준이 `createdAt` 이 아니라 **`visitAt`** 인 것만 다르다.

        두 스키마를 합치지 않은 이유: 한쪽은 `createdAt`(접수가 얼마나 밀렸나)을, 다른 쪽은
        `visitAt`(몇 시에 오나)을 보여준다. 둘 다 nullable 아닌 필수인데 한 스키마로 묶으면
        **두 시각 중 하나는 늘 `null`** 인 자리가 생긴다.
      required: [id, name, procedureId, visitAt]
      properties:
        id:
          type: string
          example: cr3
        name:
          type: string
          description: 신청자 이름. 마스킹하지 않는다 (위와 같은 이유).
          example: 김민준
        procedureId:
          oneOf:
            - $ref: '#/components/schemas/ProcedureId'
            - type: 'null'
          description: '`null` 이면 `시술 미지정`.'
        visitAt:
          type: string
          format: date-time
          description: |
            확정 내원 일시. **이 목록의 모집단 조건이자 정렬 키**라 `null` 일 수 없다
            (`status === 'booked'` + `visitAt ∈ 오늘` 으로 걸렀으므로 `visitAt: null` 인 `booked` 건은
            애초에 들어오지 않는다 — 그런 건이 실재한다는 것은 `ConsultRequest.visitAt` 설명 참고).
            UTC 시각이며 화면이 `Asia/Seoul` 로 `14:00` 으로 그린다. 초·밀리초는 항상 `0` 이다.
          example: '2026-10-13T05:00:00.000Z'

    AdminDashboardRejectedDoctor:
      type: object
      description: |
        자격증이 반려된 소속 전문의 한 명. **id 와 이름뿐이다** — 반려 사유는 담지 않는다
        (`AdminDashboardTodo.rejectedDoctors` 설명).
      required: [id, name]
      properties:
        id:
          type: string
          description: 전문의 id. 의료진 영역에서 그 전문의의 자격증 재업로드로 간다.
          example: d4
        name:
          type: string
          description: 전문의 이름. 공개 `Doctor` 에도 있는 값이라 마스킹 대상이 아니다.
          example: 이수진

    HospitalCompleteness:
      type: object
      description: |
        `병원 정보 70% 입력됨 · 남은 항목: …` 바. **서버가 계산한다** (`completenessOf`,
        `docs/database/README.md` §13.7).

        **서버가 계산하는 이유 넷**: ① 같은 판정이 대시보드 바와 (07 이후) 병원 정보 화면의 섹션별
        체크 두 곳에서 필요하다 ② 항목이 07 에서 둘 늘어난다 — 앱 배포 없이 바뀌어야 하는 종류다
        ③ `doctors ≥ 1` 은 **다른 리소스**라 병원 응답만으로 판정할 수 없다
        ④ `images`/`thumbnail` 은 수정 화면이 보내지 않거나 서버가 기본값을 채우는 자리라
        **클라이언트가 든 값과 저장된 값이 갈린다** — 완성도는 **저장된 것** 기준이어야 한다.

        **항목 선정 기준 하나: 담당자가 지금 이 화면에서 입력할 수 있는가.** 채울 수단이 없는 항목을
        넣으면 `남은 항목` 을 눌러도 갈 곳이 없고, **영원히 100%가 되지 않는 바**가 된다 —
        그 바는 아무도 보지 않게 된다.
      required: [percent, items, noProcedures]
      properties:
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            `round(충족 항목 수 / 전체 항목 수 × 100)`, **동일 가중치**. 가중치를 두는 순간
            "왜 사진이 소개보다 2배인가" 를 설명할 근거가 필요한데 화면에 없다.

            **전부 충족이 아니면 `99` 를 넘기지 않는다.** 항목이 07 에서 늘어나면 반올림이 `100%` 를
            만들어 `남은 항목: 시술 가격` 과 `100%` 가 나란히 보이는 날이 온다.
            `100` 은 **`items` 가 전부 `done: true` 일 때만** 나온다.
          example: 86
        items:
          type: array
          description: |
            **충족한 것까지 전부**, **고정된 순서**로 내려간다. **배열 순서가 계약이다** —
            `남은 항목` 은 `items.filter(item => !item.done)` 이고 화면이 다시 정렬하지 않는다.
            순서는 환자 화면에서 비는 자리가 큰 것부터다(기본 정보·진료시간·시술은 병원 카드와 상세
            상단, 의료진은 그다음). 07 이후의 섹션별 체크 표시(`✓ 진료시간`)도 같은 배열을 쓴다.
          items:
            $ref: '#/components/schemas/HospitalCompletenessItem'
        noProcedures:
          type: boolean
          description: |
            **등록된 시술이 0개인가** (`procedureIds.length === 0`). `percent` 와 **별개 경고**다 —
            7분의 1만 비어 `86%` 로 보이지만 실제로는 **환자가 시술로 병원을 찾을 수 없는 상태**다.
            화면은 바 아래에 별도 경고 줄을 그린다.

            **문구는 `앱에 노출되지 않아요` 로 적지 않는다 — 사실이 아니다.**
            시술 0개 병원은 **시술로 찾는 모든 경로**에서 빠지지만(홈 `시술로 찾기` 격자, 탐색의
            시술 칩·세부 시술 `?procedureId=`, 가격 비교표의 시술 열, 클라이언트 대분류 전개)
            **이름 검색·찜 목록·꿀팁 관련 병원·병원 상세 직접 링크·탐색 `추천` 칩에서는 그대로 보이고
            상담도 받는다.** 정확한 문구는 **`시술을 등록하지 않으면 환자가 시술로 검색할 때 병원이
            나오지 않아요`** 쪽이다. 문구는 디자이너·프런트가 정하되 **"앱에 아예 안 보인다" 로
            적지 않는다** — 찜·검색·직접 링크로 들어온 환자에게는 그대로 보인다.

            **계약상 시술 0개 병원은 만들어질 수 없다** (`procedureIds` 에 `minItems: 1`).
            이 값이 `true` 가 되는 경우는 **계약 이전에 들어온 데이터**(시드·이관)뿐이다.
            그래도 경고를 두는 이유가 그것이다 — **막혀 있어야 할 상태가 실제로 존재한다.**
          example: false

    HospitalCompletenessItem:
      type: object
      description: 완성도 항목 한 줄. 충족 여부와 **못 채웠을 때 갈 입력 칸**을 함께 준다.
      required: [key, label, done, target]
      properties:
        key:
          $ref: '#/components/schemas/HospitalCompletenessItemKey'
        label:
          type: string
          description: |
            `남은 항목: 진료시간, 병원 소개` 에 그대로 쓰는 한국어 라벨.
            **서버가 내려주는 이유**: 항목이 07 에서 늘어날 때 앱 배포 없이 바뀌어야 한다.
            클라이언트는 모르는 `key` 를 만나면 **이 라벨을 그대로 보여주고 죽지 않는다**
            (§15 의 enum 방어 규칙).
          example: 진료시간
        done:
          type: boolean
          description: |
            충족 여부. 조건은 `key` 별로 고정이다 (`HospitalCompletenessItemKey` 의 표).
          example: true
        target:
          type: string
          enum: [name, businessHours, procedureIds, thumbnail, introduction, directions, doctors]
          description: |
            **못 채웠을 때 포커스를 옮길 입력 칸.** `frontend/src/features/hospital/lib/hospitalFieldErrors.ts`
            의 `HOSPITAL_FIELD_KEYS` 와 같은 어휘이고, **서버 `422` 의 `details[].field` 가 쓰는 바로
            그 키**다. 완성도 항목과 검증 오류가 같은 키로 같은 칸을 가리키므로 화면은 포커스 이동
            코드를 하나만 들고 있으면 된다.

            **`doctors` 만 `HOSPITAL_FIELD_KEYS` 에 없다** — 병원 필드가 아니라 수정 화면의
            **의료진 영역**이다. 요청 07 이 화면을 분리하면 그 라우트가 된다.

            🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)** — 요청 07 (§21): 합의되면 이 enum 에
            **`procedures`·`images`·`tagline`** 이 더해지고, 항목 3(`procedures`)의 `target` 이
            `procedureIds` → **`procedures`** 로 옮겨간다 (요청 필드 이름이 그것이고, 서버 오류
            경로도 `procedures[2].priceMin` 이다 — 폼 앵커 이름이 같아야 접두 매칭이 그 칸을 찾는다).
            같은 섹션이라 **포커스 지점은 그대로**다.
          example: businessHours

    HospitalCompletenessItemKey:
      type: string
      enum: [basicInfo, businessHours, procedures, thumbnail, introduction, directions, doctors]
      description: |
        완성도 항목 7개. **이 순서가 `items` 배열의 순서이고 그 순서가 계약이다.**

        | `key` | 라벨 | 충족 조건 | `target` |
        |---|---|---|---|
        | `basicInfo` | 기본 정보 | `name`·`region`·`address` 가 trim 후 비어 있지 않고, `latitude`·`longitude` 가 **둘 다 0이 아니며**, `specialty` 가 trim 후 비어 있지 않음 | `name` |
        | `businessHours` | 진료시간 | 7요일 행이 모두 있고, `isClosed === false` 인 요일의 `hours` 가 trim 후 공백이 아님 | `businessHours` |
        | `procedures` | 진료 시술 | `procedureIds.length >= 1` | `procedureIds` |
        | `thumbnail` | 대표 이미지 | 비어 있지 않고 **서버 기본 이미지가 아님** | `thumbnail` |
        | `introduction` | 병원 소개 | trim 후 **30자 이상** | `introduction` |
        | `directions` | 찾아오시는 길 | trim 후 **10자 이상** | `directions` |
        | `doctors` | 의료진 | 소속 전문의 **1명 이상** (검수 상태 무관) | `doctors` |

        **"비어 있지 않음" 이 아니라 최소 길이**인 항목이 둘인 이유(`introduction` 30자 ·
        `directions` 10자): 둘 다 서버 기본값이 빈 문자열이고 한 글자만 넣어도 채워진다.
        글자 수는 임의값이지만 상수가 순수 함수 한 곳에 있어 바꾸는 비용이 한 줄이다.

        **항목에서 뺀 것:** 가격대(`priceRange`)는 등록 필수라 계약을 지나온 병원은 전부 참이고
        — 항상 참인 항목은 완성도를 **공짜로 한 칸 올릴 뿐**이다 —, 병원 특징(`features`)은
        **0개가 정상 상태**라 "안 채웠다" 고 말하면 거짓말을 체크하게 만들며, 태그(`tags`)는
        태그 필터 화면이 없어 비어 있어도 환자 화면에 빈자리가 생기지 않는다.

        > 🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안). 확정 계약이 아니다** — 요청 07
        > (`docs/api/README.md` §21, DB §16.9). **항목이 7 → 9 가 된다.** 비워 두었던 두 자리가
        > **입력 수단을 얻었다**(가격 칸 · 파일 업로드) — 선정 기준("담당자가 지금 이 화면에서
        > 입력할 수 있는가")을 둘 다 만족한다.
        >
        > **합의되면 위 enum 에 `procedurePrices`·`photos` 두 값이 더해지고 `items` 배열이
        > 이 순서로 9개가 된다** (지금 enum 을 넓히지 않은 것은 "서버가 이미 이 값을 내려줄 수
        > 있다" 고 말하지 않기 위해서다):
        >
        > | # | `key` | 라벨 | 충족 조건 | `target` |
        > |---|---|---|---|---|
        > | 1 | `basicInfo` | 기본 정보 | (그대로) | `name` |
        > | 2 | `businessHours` | 진료시간 | (그대로) | `businessHours` |
        > | 3 | `procedures` | 진료 시술 | `procedures.length >= 1` | **`procedures`** ← `procedureIds` 에서 바뀐다 |
        > | **4** | **`procedurePrices`** | **시술별 가격** | 시술 ≥ 1 **이고 모든 시술이 ① 또는 ②** (`HospitalProcedurePrice` 의 표) | **`procedures`** |
        > | 5 | `thumbnail` | 대표 이미지 | (그대로) | `thumbnail` |
        > | **6** | **`photos`** | **병원 사진 3장 이상** | `images.length >= 3` | **`images`** |
        > | 7 | `introduction` | 병원 소개 | (그대로) | `introduction` |
        > | 8 | `directions` | 찾아오시는 길 | (그대로) | `directions` |
        > | 9 | `doctors` | 의료진 | (그대로) | `doctors` |
        >
        > **`procedurePrices` 를 "하나라도 적었으면 충족" 으로 하지 않은 이유**: 시술 13개 중 1개만
        > 적고 100% 가 되면 그 항목은 "환자가 비교할 수 있다" 는 **거짓 신호**가 된다. 반대로
        > "전부" 가 가혹하지 않은 이유는 **`상담 후 안내` 가 클릭 한 번**이기 때문이다 —
        > 가격을 공개하지 않기로 한 병원도 100% 에 도달한다.
        >
        > **`thumbnail`(5)과 `photos`(6)를 둘 다 둔다.** 3장이면 대표도 참이라 포함 관계처럼
        > 보이지만 **1~2장 상태에서 갈린다**(대표는 있고 3장은 아님). 다른 질문이다.
        >
        > ⚠️ **분모가 7 → 9 로 바뀌므로 같은 병원의 완성도가 그날 내려간다** (7/7 → 7/9 = 78%).
        > **의도된 것이다** — 채울 수 있는 칸이 둘 늘었고 완성도는 그 칸이 비었다는 사실을 말해야
        > 한다. 다만 담당자에게는 "아무것도 안 했는데 점수가 깎였다" 로 보이므로
        > **릴리스 노트에 적어야 한다.** `percent` 의 **"전부 충족이 아니면 99 상한"** 은
        > 고칠 것이 없다 — 바로 이 날을 위한 장치다.
        >
        > `target` enum 에도 **`procedures`·`images`·`tagline` 세 값**이 함께 더해진다
        > (= 프런트 `HOSPITAL_FIELD_KEYS` 와 서버 `422 details[].field` 의 묶음 키).

    # ---------------------------------------------------------------- 찜
    FavoriteList:
      type: object
      required: [hospitalIds]
      properties:
        hospitalIds:
          type: array
          description: 최근에 찜한 것이 먼저.
          items:
            type: string
          example: [h6, h1]
        hospitals:
          type: array
          description: '`expand=hospital` 일 때만. `hospitalIds` 와 같은 순서.'
          items:
            $ref: '#/components/schemas/Hospital'

    # ---------------------------------------------------------------- 알림
    NotificationAudience:
      type: string
      enum: [user, admin]
      description: |
        사용자 알림함(`/notifications`) / 관리자 알림함(`/admin/notifications`) 구분.
        **역할이 아니라 알림함 이름이다.** 역할은 셋이지만 알림함은 둘이다.
        `audience=admin` 조회는 `hospital_admin` 또는 `operator` 가 필요하다 (`user` 는 `403`).
        `audience=user` 는 세 역할 모두 조회할 수 있다 — 병원 담당자도 개인으로서 상담을 신청한다.

    NotificationType:
      type: string
      enum: [consult-status, inquiry-answer, event, system]
      description: |
        `inquiry-answer` 는 **병원 문의 답변 알림**으로 2026-10-12 에 추가된 값이다
        (`POST /hospital-inquiries/{id}/answer` 의 부수효과, §9).
        `consult-status` 와 묶지 않은 이유: 알림함 항목의 아이콘·이동 경로가 다르고,
        `consult-status` 라는 이름이 가리키는 사실(상담의 상태가 바뀌었다)이 문의 답변에는 없다.

        **클라이언트는 모르는 `type` 을 만나도 죽지 않아야 한다** (§15) —
        기본 아이콘으로 떨어뜨리고 `relatedResource` 로 이동 대상을 판단한다.

    AppNotification:
      type: object
      required: [id, audience, type, consultStatus, title, message, isRead, createdAt, relatedId]
      properties:
        id:
          type: string
        audience:
          $ref: '#/components/schemas/NotificationAudience'
        type:
          $ref: '#/components/schemas/NotificationType'
        consultStatus:
          oneOf:
            - $ref: '#/components/schemas/ConsultStatus'
            - type: 'null'
          description: |
            **그 알림을 낳은 이벤트 직후의 상담 상태** (2026-10-13 추가,
            `docs/database/README.md` §15). `ConsultStatus` 를 그대로 재사용한다 —
            새 값 집합을 만들지 않았다.

            **키는 항상 있고 값은 nullable 이다.** `type='consult-status'` 가 아닌 알림
            (`inquiry-answer`·`event`·`system`)은 `null` 이고, **계약 확장 이전에 만들어진
            `consult-status` 행도 `null`** 이다 (백필하지 않는다 — DB §15.8).

            | 알림을 만든 이벤트 | 값 |
            |---|---|
            | 상담 접수 (`audience=admin`) | `new` |
            | 상태 변경 (`PATCH /consult-requests/{id}/status`) | **변경 후 상태** = 요청의 `status` |
            | 예약 일시 변경 (같은 엔드포인트, `event='reschedule'`) | **`booked`** (상태는 그대로다) |
            | 문의 답변 | `null` |

            **소비자는 알림함의 종류 아이콘 하나다.** 판정은 한 줄이고 클라이언트에 있다 —
            `type='consult-status' && consultStatus='booked'` 면 **예약**(달력), 그 밖의
            `consult-status` 는 **상담**, 나머지는 `type` 그대로. `null` 이 변경 전 동작
            (상담 아이콘)으로 떨어지므로 과거 행에서도 화면이 깨지지 않는다.

            **서버는 아이콘을 모른다.** 내려보내는 것은 상태라는 사실이고, 그림으로 바꾸는 것은
            표시 규칙이다. 같은 이유로 `icon`·`visitAt`·`cancelReason` 을 알림에 싣지 않는다 —
            **취소 사유는 알림 행에 저장되지 않고 `message` 문장 안에만 녹아 있다** (DB §15.5).

            `consultStatus` 로 문구를 **다시 조립하지 않는다.** 문구는 발송 시점에 확정된
            `title`/`message` 문자열이다 (아래).
          example: booked
        title:
          type: string
          description: |
            **발송 시점에 확정되어 저장된 문자열이다** — 소급 수정되지 않는다.
            상담 알림의 제목은 `consultStatus` 와 이벤트가 정한다 (2026-10-13, 요청 08):

            | 이벤트 / 상태 | `consultStatus` | 제목 |
            |---|---|---|
            | 예약확정 | `booked` | `상담 예약이 확정됐어요` |
            | 예약 일시 변경 (`reschedule`) | `booked` | `예약 일시가 바뀌었어요` |
            | 연락중 | `contacted` | `병원이 연락 중이에요` |
            | 취소 | `cancelled` | `상담이 취소됐어요` |
            | 내원완료 · 되돌림(`new` 등) | `visited` · `new` 등 | `상담 상태 변경` (**기존 문구 유지**) |
            | 상담 접수 (`audience=admin`) | `new` | `새로운 상담 신청` |
            | 문의 답변 | `null` | `문의에 답변이 왔어요` |

            `내원완료`·되돌림의 문구를 바꾸지 않은 이유: **요청서가 그 두 경우의 문장을 적지 않았다.**
            지어내면 요청자가 검수하지 않은 문장이 환자에게 나간다 (DB §15.3).
          example: 상담 예약이 확정됐어요
        message:
          type: string
          description: |
            **발송 시점에 확정되어 저장된 문자열이다.** 렌더 시점에 조립하지 않는다 —
            병원 이름이 바뀌어도 과거 알림의 문장은 그대로인 것이 맞다 (DB §15.4).

            `{H}` = 병원 이름 (없거나 빈 문자열이면 `병원`),
            `{V}` = 확정 일시를 `Asia/Seoul` 로 **`10/9(금) 14:00`** 로 적은 것.

            | 이벤트 / 상태 | 본문 |
            |---|---|
            | 예약확정 | `{H} · {V} 방문. 변경이 필요하면 병원에 전화해 주세요` |
            | 예약확정인데 일시를 읽을 수 없음 (방어) | `{H} · 방문 일시는 병원에서 다시 알려드려요` |
            | 예약 일시 변경 | `{H} · {V} 방문. 변경이 필요하면 병원에 전화해 주세요` |
            | 연락중 | `{H}{이\|가} 상담 신청을 확인했어요. 곧 전화가 올 거예요` |
            | 취소 · `no_answer` | `{H} · 연락이 닿지 않아 취소됐어요` |
            | 취소 · `patient_request` | `{H} · 요청하신 대로 취소했어요` |
            | 취소 · `procedure_unavailable` | `{H} · 이 병원에서 진료하지 않는 시술이에요` |
            | 취소 · `duplicate` | `{H} · 같은 신청이 있어 하나로 정리했어요` |
            | 취소 · `etc` **또는 사유 없음/모르는 코드** | `{H} · 자세한 사유는 병원에 문의해 주세요` |
            | 내원완료 · 되돌림 | `상담 상태가 '{라벨}'(으)로 변경되었어요` (**기존 문구 유지**) |
            | 상담 접수 (`audience=admin`) | `{이름}님이 상담을 신청했어요` |
            | 문의 답변 | `{H} · {답변 앞 60자}` (60자를 넘으면 `…`) |

            **일시 표기는 `10/9(금) 14:00` 하나다** (2026-10-13 결정, DB §15.11-4).
            계약이 이전에 쓰던 `10월 9일(금) 14:00` 표기는 **교체됐다** — 같은 알림함에서
            예약확정 알림과 일시 변경 알림이 서로 다른 날짜 표기를 쓰면 안 되고,
            마이페이지 상담 내역의 `10/9(금) 14:00 방문` 과도 같은 기준이어야 한다.
            **이미 나간 알림의 옛 표기는 소급 수정하지 않는다.**

            **연락중의 조사는 받침 판정 순수 함수가 정한다.** 병원 이름 끝 글자에 받침이 없으면
            `가`(`강남 스마일 치과가`), 있으면 `이`(`○○치과의원이`, 폴백 `병원이`),
            끝 글자가 한글이 아니면(영문·숫자) `이(가)`. `이(가)` 로 고정하지 않은 이유:
            대부분의 이름에서 어색한 문장이 나오고, 판정 자체는 이름 하나로 끝나는 순수 함수다.

            **환자 문구에 관리자 용어를 쓰지 않는다** — 취소 사유 코드와 그 관리자 라벨
            (`연락이 안 됨`·`중복 신청`)은 환자에게 보내지 않는다. 같은 코드의 두 독자용 문장이라,
            한쪽을 다듬어도 다른 쪽이 흔들리지 않아야 한다 (DB §15.5).
          example: 강남 스마일 치과 · 10/9(금) 14:00 방문. 변경이 필요하면 병원에 전화해 주세요
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
          description: 'UTC ISO 8601 로 내려간다. 화면은 `Asia/Seoul` 고정으로 표시한다 (기기 시간대를 따르지 않는다).'
        relatedId:
          type: [string, 'null']
          description: |
            관련 리소스 id. 일반 공지는 null.
            **`relatedResource` 와 함께 보아야 한다** — 지금 관리자 알림함은 `relatedId` 만 보고
            무조건 상담 상세로 보내서, 전문의 검수 알림이 생기면 잘못된 곳으로 이동한다.
        relatedResource:
          type: [string, 'null']
          enum: [consultRequest, hospital, doctor, promotion, hospitalInquiry, null]
          description: |
            `relatedId` 가 어떤 종류의 리소스인지. 알림을 눌렀을 때 어디로 갈지 결정하는 근거다.
            새로 추가한 필드다.

            `hospitalInquiry` 는 2026-10-12 에 추가된 값이다 (§9). 누르면 마이페이지 `내 문의` 에서
            `relatedId` 의 문의가 펼쳐진 채 열린다 (공개·비공개 답변을 모두 읽을 수 있는 유일한 자리).

            **`consultRequest` + `audience=user` 는 마이페이지 상담 내역으로 간다** (2026-10-13, 요청 08).
            `relatedId` 가 **상담 id** 이고 그 한 값이면 충분하다 — 화면이 병원 id 를 먼저 조회할 필요가
            없다. 이전에는 상담 알림이 병원 상세로 갔는데, 알림이 말하는 사실(내 상담이 어떻게 됐는가)은
            병원 상세에 없다. `audience=admin` 의 접수 알림은 그대로 관리자 상담 상세로 간다.
          example: consultRequest

    # ---------------------------------------------------------------- 커뮤니티
    QAAnswer:
      type: object
      required: [id, authorName, isDentist, content, createdAt]
      properties:
        id:
          type: string
        authorName:
          type: string
        isDentist:
          type: boolean
          description: |
            `치과의사 답변` 배지. **서버가 작성자의 인증 상태에서 유도한다.**
            지금은 샘플 데이터의 플래그일 뿐 실제 인증과 연결되어 있지 않다.
        content:
          type: string
        createdAt:
          type: string
          format: date
          description: 날짜만. 기존 도메인 타입 보존.

    QAPostSummary:
      type: object
      description: 목록용. `answers` 배열 대신 `answerCount` 만 담는다.
      required: [id, title, content, procedureId, authorName, createdAt, viewCount, answerCount]
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
          description: 목록 카드가 두 줄 미리보기로 자른다. 서버는 전문을 준다.
        procedureId:
          $ref: '#/components/schemas/ProcedureId'
        authorName:
          type: string
          example: 익명
        createdAt:
          type: string
          format: date
        viewCount:
          type: integer
        answerCount:
          type: integer

    QAPost:
      allOf:
        - $ref: '#/components/schemas/QAPostSummary'
        - type: object
          required: [answers]
          properties:
            answers:
              type: array
              items:
                $ref: '#/components/schemas/QAAnswer'
            isMine:
              type: boolean
              description: |
                로그인 요청에서만. 본인이 쓴 글인지. 수정·삭제 기능(🚧)의 전제가 된다.
                지금은 작성자가 전부 `익명` 이라 본인 글을 골라낼 방법이 없다.

    QAPostCreateRequest:
      type: object
      required: [title, content, procedureId]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: 앞뒤 공백 제거 후 1자 이상.
        content:
          type: string
          minLength: 1
          maxLength: 10000
          description: |
            앞뒤 공백 제거 후 1자 이상. **최대 길이를 서버가 정한다** — 지금은 글자 수 상한이 없다.
        procedureId:
          $ref: '#/components/schemas/ProcedureId'
        isAnonymous:
          type: boolean
          default: true
          description: |
            true 면 `authorName` 이 `익명` 으로 저장된다 (현재 동작과 동일).
            `authorName` 을 요청으로 받지 않는 이유는 위조를 막기 위해서다.

    # ---------------------------------------------------------------- 검색
    SearchTarget:
      oneOf:
        - type: object
          required: [kind, procedureId, label]
          properties:
            kind:
              type: string
              const: procedure
            procedureId:
              $ref: '#/components/schemas/ProcedureId'
            label:
              type: string
        - type: object
          required: [kind, hospitalId, label]
          properties:
            kind:
              type: string
              const: hospital
            hospitalId:
              type: string
            label:
              type: string
        - type: object
          required: [kind, doctorId, hospitalId, label]
          properties:
            kind:
              type: string
              const: doctor
            doctorId:
              type: string
            hospitalId:
              type: string
              description: |
                소속 병원. 전문의 상세 대신 병원 상세로 보내는 현재 동작을 유지할 수 있게 함께 준다.
            label:
              type: string
      description: |
        `kind` 로 분기한다. 인라인 스키마라 OpenAPI `discriminator` 를 붙이지 않았다 —
        `discriminator` 는 named schema 를 가리키는 `mapping` 이 필요하고, 그러려면 세 변형을
        각각 컴포넌트로 쪼개야 한다. 세 변형이 여기 밖에서 재사용되지 않으므로 인라인으로 두었다.
        클라이언트는 `kind` 를 판별자로 쓰면 된다 (`frontend/.../trendingSearches.ts` 의
        `SearchTarget` 유니온과 같은 형태다).

    SearchResults:
      type: object
      required: [query, procedures, hospitals, doctors]
      properties:
        query:
          type: string
        procedures:
          type: array
          items:
            $ref: '#/components/schemas/Procedure'
        hospitals:
          type: array
          items:
            $ref: '#/components/schemas/Hospital'
        doctors:
          type: array
          items:
            $ref: '#/components/schemas/Doctor'

    SearchTrend:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [up, down, same, new]
          description: '화면 표기: `▲ N`(빨강) / `▼ N`(파랑) / `－` / `NEW`(파랑).'
        delta:
          type: integer
          minimum: 1
          description: '`up`/`down` 일 때만.'

    TrendingSearchTerm:
      type: object
      required: [rank, term, trend, target]
      properties:
        rank:
          type: integer
          minimum: 1
        term:
          type: string
          example: 임플란트
        trend:
          $ref: '#/components/schemas/SearchTrend'
        target:
          $ref: '#/components/schemas/SearchTarget'

    SearchSuggestion:
      type: object
      description: 추천(광고) 검색어 알약 하나.
      required: [id, term, target]
      properties:
        id:
          type: string
        term:
          type: string
          example: 몰라몰라 PICK 인기 임플란트
        target:
          oneOf:
            - $ref: '#/components/schemas/SearchTarget'
            - type: 'null'
          description: |
            null 이면 검색창에 문구만 채운다 (현재 동작). 값이 있으면 곧바로 그 화면으로 이동한다 —
            문구가 이름과 안 맞아 결과가 안 나오는 지금 문제의 해결책이다.

    # ---------------------------------------------------------------- geo
    GeocodeResult:
      type: object
      required: [id, addressName, latitude, longitude]
      properties:
        id:
          type: string
        addressName:
          type: string
          description: 지번 주소.
          example: 서울 강남구 역삼동 736-3
        roadAddressName:
          type: string
          description: 도로명 주소. 카카오가 주지 않는 경우 생략된다.
          example: 서울 강남구 테헤란로 152
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        region:
          type: [string, 'null']
          description: |
            🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안).** 시·군·구
            (카카오 로컬 응답의 `address.region_2depth_name`).

            **왜 필요한가**: `hospitals.region` 은 NOT NULL 인데 **직접 가입 폼에 지역 칸이 없다**
            (DB §14.2). 서버가 주소에서 파생해야 하고, 가장 정확한 출처는 주소 검색을 중계하는
            이 응답이다. 지금은 서버가 카카오 응답에서 이 값을 버리고 있다.

            ⚠️ **열린 질문 (DB §14.17-7)** — 카카오 로컬의 주소 검색 응답에 이 값이 실제로
            실리는지 확인해야 한다. 실리지 않거나 비어 있으면 `null` 이고, 그때 서버는
            주소 문자열에서 뽑는다(`regionOf`). **이 값이 비면 탐색의 지역 표시가 깨진다.**

            `region_1depth_name`(`서울`)을 함께 내리지 않은 이유: 기존 `hospitals.region` 이
            `서울 강남구` 한 덩어리이고, 두 조각으로 내리면 합치는 규칙이 또 생긴다.
            합칠 일이 생기면 그때 필드를 나눈다.
          example: 강남구

    # ---------------------------------------------------------------- 업로드 (🚧 제안)
    FilePurpose:
      type: string
      enum: [business_registration, hospital_photo]
      description: |
        🚧 **제안 — 요청자 답 반영 대기 → 요청서 18·19 (2026-10-13 제안).** 파일의 용도.
        **접근 통제와 보관 기간이 전부 이 값에서 파생된다** (`canReadFile(purpose, role)` ·
        `retentionOf(purpose, state)` — DB §14.7). 그래서 권한 컬럼을 따로 두지 않는다.

        **값 둘은 서로 다른 제안에 속하고 따로 합의될 수 있다:**

        | 값 | 제안 | 인증 | 읽는 법 |
        |---|---|---|---|
        | `business_registration` | 요청 06 (§20) | **없음** — 가입 전이라 토큰이 없다 | `GET /uploads/{id}/content` (운영자 전용 · 감사 대상) |
        | `hospital_photo` | **요청 07 (§21)** | **필수** — 로그인한 담당자 | **공개 URL** (`UploadedFileRef.publicUrl` → `Hospital.images[]`) |

        > `hospital_photo` 는 **이 제안이 더한 값이다** (06 은 "소비자가 없는 enum 값은 '이미 된다'
        > 는 오해를 만든다" 며 미뤘고, 요청 07 이 그 소비자다). **`FilePurpose` 스키마 자체가
        > 제안이므로 확정 계약의 enum 을 넓힌 것이 아니다** — 합의가 갈리면 값 하나만 빠진다.

        **규칙이 정반대인 값 둘을 한 enum·한 오퍼레이션에 둔 이유**: 판정이
        `canReadFile(purpose, role)` **한 함수** 안에 남기 때문이다. 오퍼레이션을 나누면
        "이 바이트를 누가 읽을 수 있는가" 의 답이 두 곳이 된다. 그 함수는 이미
        `business_registration` 이 아니면 공개를 돌려주므로 **고칠 것이 없다** (DB §16.5).

    UploadedFileRef:
      type: object
      description: |
        🚧 **제안 — 요청자 답 반영 대기 → 요청서 18·19 (2026-10-13 제안).** 업로드된 파일의 **참조**.
        사업자등록증(06)에는 **바이트도 URL 도 여기 없다** — 읽기는
        `GET /uploads/{id}/content` 하나뿐이다.

        🚧 **요청 07(§21)**: 병원 사진(`purpose=hospital_photo`)에만 `publicUrl` 이 채워진다.
        **서류와 사진의 차이가 이 필드 하나로 드러난다.**
      required: [fileId, originalName, byteSize]
      properties:
        fileId:
          type: string
          description: 가입 요청의 `businessRegistrationFileId` 에 그대로 넣는 값.
          example: up_01J9X8V0Q3
        originalName:
          type: string
          description: |
            사용자가 올린 원본 파일명. 관리자 화면이 `사업자등록증.pdf 제출 완료` 로 보여준다.
            **그대로 화면에 그리므로 이스케이프는 클라이언트의 몫이다** (서버는 저장한 값을 돌려준다).
          example: 사업자등록증.pdf
        byteSize:
          type: integer
          description: 바이트. 화면이 `2.1MB` 로 환산해 보여준다.
          example: 2201440
        publicUrl:
          type: [string, 'null']
          format: uri
          x-proposal: 제안 — 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안)
          description: |
            🚧 **[제안] 요청 07 (§21, DB §16.5).** `purpose=hospital_photo` 일 때만 채워지는
            **공개 URL**, 그 밖에는 `null` 이다 — 사업자등록증에는 **영원히 `null`** 이다
            (URL 을 한 번이라도 발급하면 그것을 아는 사람 전부가 열람자가 되고 §20.3 의 보장이 무너진다).

            **이 문자열을 그대로 `HospitalUpdateRequest.images[]` 에 넣어 저장한다.** 서버는 저장
            시점에 **자기가 발급한 값 그대로 역조회**해 그 파일을 claim 한다 — **URL 을 파싱하지
            않는다.** 그래야 URL 형태(공개 라우트 / 저장소 URL / 정적 경로)가 어느 쪽으로 정해져도
            저장 경로가 바뀌지 않는다 (열린 질문 7·11).

            **사진의 쓰기 입력을 `fileId` 가 아니라 이 URL 로 받는 이유**: 응답
            `Hospital.images: string[]` 를 그대로 두기 위해서다. 두 모양(쓰기는 id, 읽기는 URL)을
            섞으면 폼이 기존 외부 URL 사진과 새로 올린 사진을 **다른 배열**로 들어야 하고,
            순서(= 대표 사진)가 두 배열에 걸친다.
          example: https://cdn.molamola.kr/hospital-photos/up_01J9X8V0Q3.jpg

    # ---------------------------------------------------------------- auth
    UserRole:
      type: string
      enum: [user, hospital_admin, operator]
      description: |
        `docs/decisions/0001-roles-and-pii.md` 결정 1.

        - `user` — 일반 사용자. 병원 탐색, 상담 신청, 찜, 커뮤니티
        - `hospital_admin` — 병원 담당자. **담당 병원**(`managedHospitalIds`)의 정보·전문의·상담만 다룬다
        - `operator` — 플랫폼 운영자. 전문의 인증 검수, 병원 생성, 담당자 지정, 입점 문의 심사.
          상담은 **조회만** 하고 이름·연락처는 마스킹된다

        `admin` 이라는 값은 존재하지 않는다. 알림의 `audience=admin` 은 역할이 아니라 **알림함** 이름이며
        `hospital_admin` 과 `operator` 가 함께 쓴다 — 혼동하지 않도록 주의한다.

    AuthProvider:
      type: string
      enum: [email, google, kakao]

    User:
      type: object
      required: [id, email, name, provider, role, managedHospitalIds]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
          description: 소문자로 정규화된 값.
        name:
          type: string
        provider:
          $ref: '#/components/schemas/AuthProvider'
        role:
          $ref: '#/components/schemas/UserRole'
        managedHospitalIds:
          type: array
          description: |
            `role=hospital_admin` 일 때 담당 병원 (`hospital_admins` M:N). **여러 개일 수 있다.**
            `role=user` 면 빈 배열이다.

            `role=operator` 도 **빈 배열**이다 — 운영자는 전 병원에 접근하지만 특정 병원의 "담당자" 는 아니다.
            클라이언트는 `role` 로 전체 권한을 판단하고, `managedHospitalIds` 는 담당자 화면의 범위 표시에만 쓴다.
            (운영자를 담당자로 지정하는 것은 `422 CANNOT_ASSIGN_OPERATOR` 로 막는다 — 자기 병원 전문의를
            스스로 검수할 수 있게 되어 역할 분리가 무너지기 때문이다)
          items:
            type: string
          example: [h1]

    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: 액세스 토큰 유효 시간(초).
          example: 900
        refreshExpiresIn:
          type: integer
          description: 리프레시 토큰 유효 시간(초).
          example: 2592000

    AuthSession:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/TokenPair'

    SignUpRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 앞뒤 공백을 제거해 저장한다.
        email:
          type: string
          format: email
          maxLength: 254
          description: |
            **형식을 검사한다.** 지금은 `@` 없이도 가입된다. 앞뒤 공백 제거 + 소문자 변환 후 저장.
        password:
          type: string
          minLength: 6
          maxLength: 128
          description: |
            6자 이상 (현재 규칙 유지). 서버는 bcrypt/argon2 로 해시해 저장한다 —
            지금은 브라우저에 평문으로 저장된다.
        agreedTermsVersions:
          type: array
          description: |
            동의한 약관 버전. **회원가입에 약관 동의 절차가 지금 없다.** 미결 사항이며,
            도입되면 이 필드가 필수가 된다.
          items:
            type: object
            required: [slug, version]
            properties:
              slug:
                type: string
                enum: [terms, privacy, location]
                description: |
                  🚧 **`partner-terms` 는 여기에 들어오지 않는다** (제안, 2026-10-13).
                  일반 가입이 그 slug 를 보내면 `422` 다 — 동의할 이유가 없는 약관에
                  동의한 기록을 만들지 않는다 (DB §14.8). 병원 관리자 가입은
                  `POST /auth/signup/hospital-admin` 의 **다른 enum** 을 쓴다.
              version:
                type: string

    HospitalAdminSignUpRequest:
      type: object
      description: |
        🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안).**
        `POST /auth/signup/hospital-admin` 의 본문. 회원가입 화면에서 `치과 관계자이신가요?`
        토글을 켠 상태의 폼 전체다.

        `SignUpRequest` 를 `allOf` 로 상속하지 않았다 — 상속하면 `agreedTermsVersions` 의
        **`slug` enum 이 달라야 하는 것**을 표현할 수 없고(하위 스키마가 상위의 enum 을
        좁히지 못한다), 그 enum 차이가 이 두 경로를 가르는 규칙 그 자체다.
      required: [name, email, password, hospital, position, businessRegistrationFileId, agreedTermsVersions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 담당자 본인 이름. 앞뒤 공백을 제거해 저장한다 (일반 가입과 같다).
        email:
          type: string
          format: email
          maxLength: 254
          description: 앞뒤 공백 제거 + 소문자 변환 후 저장 (일반 가입과 같다).
        password:
          type: string
          minLength: 6
          maxLength: 128
        hospital:
          type: object
          description: |
            등록할 병원. **`region` 은 받지 않는다** — 폼에 지역 칸이 없고 서버가 주소에서
            파생한다 (`GET /geo/address-search` 의 `region`). ⚠️ 열린 질문 (§20).
          required: [name, phone, address, latitude, longitude]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
              example: 강남 스마일 치과
            phone:
              type: string
              maxLength: 20
              description: |
                치과 대표번호. **휴대폰 패턴이 아니다** — `02-1234-5678` 같은 지역번호를 받는다.
                `consult_requests.phone` 과 같은 완화 패턴을 쓰고, 숫자만 남긴 값을 서버가
                함께 저장한다(중복 가입 **검출용**이지 차단용이 아니다 — DB §14.9).
              example: 02-1234-5678
            address:
              type: string
              minLength: 1
              maxLength: 200
              description: |
                `GET /geo/address-search` 결과에서 **고른 값**이어야 한다
                (`HospitalCreateRequest.address` 와 같은 규약). 직접 타이핑한 주소는 좌표가 없어
                지도에 찍히지 않는다. 요청서도 "직접 입력칸 없음" 을 확인 항목으로 적는다.
            addressDetail:
              type: [string, 'null']
              maxLength: 100
              description: |
                선택. `3층 301호`. `address` 와 합치지 않고 따로 받는 이유는
                `Hospital.addressDetail` 의 설명과 같다 (재검색 시 `address` 가 통째로 교체된다).
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
        position:
          $ref: '#/components/schemas/AdminPosition'
        businessRegistrationFileId:
          type: string
          description: |
            `POST /uploads` (`purpose=business_registration`) 가 돌려준 `fileId`.
            가입 트랜잭션이 **조건부 UPDATE 로 claim** 한다 — 이미 주인이 있거나, 용도가 다르거나,
            파기된 파일이면 `422 UPLOAD_NOT_FOUND` 이고 **가입 전체가 롤백된다**.

            남의 업로드 id 를 추측해 넣어도 같은 `422` 다 (실패 이유를 구분해 주지 않는다 —
            구분하면 id 대입으로 "그 자리에 서류가 있다" 가 샌다).
          example: up_01J9X8V0Q3
        agreedTermsVersions:
          type: array
          minItems: 4
          description: |
            **필수 4종 전부**: `terms` · `privacy` · `location` · `partner-terms`
            (`requiredAgreementSlugs('hospital_admin')`, DB §14.8). 하나라도 빠지면
            `422 AGREEMENT_REQUIRED`, 서버가 모르는 버전이면 `422 AGREEMENT_VERSION_NOT_FOUND`.

            동의 기록은 **가입과 같은 트랜잭션**이다 — 동의 없이 만들어진 계정이 남지 않는다.
          items:
            type: object
            required: [slug, version]
            properties:
              slug:
                type: string
                enum: [terms, privacy, location, partner-terms]
              version:
                type: string
                example: '1.0'

    HospitalAdminAuthSession:
      description: |
        🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안).**
        기존 `AuthSession`(토큰 + 사용자) + 방금 만들어진 병원 한 조각.
      allOf:
        - $ref: '#/components/schemas/AuthSession'
        - type: object
          required: [hospital]
          properties:
            hospital:
              type: object
              required: [id, approvalStatus]
              description: |
                완료 화면이 **추가 조회 없이** `병원 정보 입력하기`(id 로 이동)와 상태 안내를
                그리는 데 필요한 최소값이다. 병원 전체를 돌려보내지 않는 이유: 그 값은 방금
                보낸 입력이고, 화면이 쓰는 것은 둘뿐이다.
              properties:
                id:
                  type: string
                  example: h12
                approvalStatus:
                  $ref: '#/components/schemas/HospitalApprovalStatus'

    LogInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
          description: 앞뒤 공백 제거 + 소문자 변환 후 비교.
        password:
          type: string
          maxLength: 128
          description: 입력한 그대로 비교 (대소문자·공백 구분).

    # ---------------------------------------------------------------- 기타
    LegalDocument:
      type: object
      required: [slug, title, version, effectiveAt, content, contentFormat]
      properties:
        slug:
          type: string
          enum: [terms, privacy, location, about, partner-terms]
          description: |
            🚧 `partner-terms`(`[필수] 병원 파트너 이용약관`)는
            **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안)** 으로 추가된 값이다 (DB §14.8).

            **`legal_documents` 에 "누구에게 필수인가" 를 적지 않는다** — 필수성은 문서의
            성질이 아니라 **가입 경로의 성질**이다. 같은 약관이 나중에 일반 사용자에게도
            필수가 될 수 있고, 그때 문서 행을 고치면 "그때 무엇에 동의했는가" 의 불변성이 깨진다.
            판정은 순수 함수 하나다 — `requiredAgreementSlugs(kind)`.
        title:
          type: string
          example: 서비스 이용약관
        version:
          type: string
          description: 개정 버전. 회원가입 동의 기록이 이 값을 가리킨다.
          example: '1.0'
        effectiveAt:
          type: string
          format: date-time
          description: 시행일.
        content:
          type: string
        contentFormat:
          type: string
          const: markdown

    PartnerInquiryCreateRequest:
      type: object
      required: [hospitalName, contactName, phone]
      properties:
        hospitalName:
          type: string
          minLength: 1
          maxLength: 100
        contactName:
          type: string
          minLength: 1
          maxLength: 50
        phone:
          type: string
          pattern: '^0\d{1,2}-?\d{3,4}-?\d{4}$'
          description: 병원 대표번호도 올 수 있어 상담 신청보다 완화된 패턴이다.
        email:
          type: string
          format: email
          maxLength: 254
        region:
          type: string
          maxLength: 50
        message:
          type: string
          maxLength: 2000

    PartnerInquiryStatus:
      type: string
      enum: [received, reviewing, approved, rejected]
      description: |
        `received → reviewing → approved | rejected`. 종결 상태(`approved`/`rejected`)에서 되돌아갈 수 없다.

    PartnerInquiry:
      type: object
      description: |
        **`operator` 전용 응답.** 병원명·담당자 실명·연락처를 담으므로 상담 신청자 PII 와 같은 급으로 다룬다
        (`Cache-Control: no-store`, 상세 열람은 감사 로그 대상).

        **마스킹하지 않는다.** 운영자가 심사를 위해 직접 연락해야 하는 정보이고, 상담 신청자와 달리
        "연락하지 않아도 되는 역할" 이 존재하지 않는다. 마스킹은 열람자 중 일부에게만 연락 필요가 있을 때
        성립하는 장치다.
      required: [id, hospitalName, contactName, phone, status, receivedAt]
      properties:
        id:
          type: string
        hospitalName:
          type: string
        contactName:
          type: string
        phone:
          type: string
        email:
          type: [string, 'null']
          format: email
        region:
          type: [string, 'null']
        message:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/PartnerInquiryStatus'
        reviewNote:
          type: [string, 'null']
          description: 운영자 심사 메모. `rejected` 면 반려 사유가 반드시 있다.
        reviewedByName:
          type: [string, 'null']
          description: 심사한 운영자.
        reviewedAt:
          type: [string, 'null']
          format: date-time
        linkedHospitalId:
          type: [string, 'null']
          description: |
            이 문의로 만들어진 병원 id. 승인이 곧 병원 생성은 아니므로(문의 항목만으로는 병원 등록
            필수 항목을 채울 수 없다) 생성 후 연결한다.
        receivedAt:
          type: string
          format: date-time

    HospitalAdminAssignment:
      type: object
      description: |
        `hospital_admins` 한 행. 병원과 담당자 계정의 연결이다.
      required: [hospitalId, userId, email, name, role, assignedAt]
      properties:
        hospitalId:
          type: string
        userId:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
          description: 지정 직후에는 항상 `hospital_admin` 이다 (필요하면 승격된 결과).
        position:
          oneOf:
            - $ref: '#/components/schemas/AdminPosition'
            - type: 'null'
          description: |
            🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안).** 이 사람의 **이 병원에서의** 직책.

            **운영자가 지정한 담당자는 `null` 이다** — `POST /hospitals/{id}/admins` 에 직책
            입력이 없고, 앞으로도 더하지 않는다(운영자가 남의 직함을 대신 고르는 모양이 된다).
            직책은 **직접 가입한 사람이 스스로 고른 값**일 때만 있다.
            화면은 `null` 이면 직책 줄을 생략한다 (지어내지 않는다).
        assignedAt:
          type: string
          format: date-time
        assignedByName:
          type: [string, 'null']
          description: 지정한 운영자. 감사 목적.
        managedHospitalCount:
          type: integer
          description: |
            이 계정이 담당하는 병원 총 개수. 해제 화면에서 "해제하면 담당 병원이 없어져 일반 사용자로
            돌아갑니다" 를 안내하는 근거다.
          example: 1
