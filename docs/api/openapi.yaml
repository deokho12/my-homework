  /doctors/verification-queue:
    get:
      operationId: listVerificationQueue
      tags: [doctors]
      summary: 전문의 인증 검수 목록
      description: |
        > **구현 주의:** 이 경로는 `GET /doctors/{doctorId}` 와 충돌한다. NestJS 는 선언 순서로 매칭하므로
        > 컨트롤러에서 `@Get('verification-queue')` 를 `@Get(':doctorId')` **앞에** 선언해야 한다.
        > 뒤에 두면 `verification-queue` 가 `doctorId` 로 잡혀 `404 DOCTOR_NOT_FOUND` 가 난다.
        > `GET /consult-requests/summary` vs `GET /consult-requests/{consultRequestId}` 도 같은 문제다.

        **`operator` 전용이다.** `/admin/specialists` 는 **모든 병원**의 전문의를 심사하는 화면이다.
        `hospital_admin` 에게 열면 남의 병원 전문의를 심사하게 되고, 자기 병원 전문의를 스스로 승인할 수도
        있다. 역할 분리로 이 구조적 문제가 해소됐다 (`docs/decisions/0001-roles-and-pii.md` 결정 1).
        `hospital_admin` 요청은 `403 FORBIDDEN` 이고, 클라이언트는 `role=operator` 가 아니면
        이 화면 진입 자체를 숨긴다.

        `GET /doctors` 와 분리한 이유 세 가지:

        1. **정렬 규칙이 다르다.** 항상 `대기 → 반려 → 승인`, 같은 상태 안에서는 등록 순. 공개 목록의 평점 정렬과 무관하다.
        2. **응답 필드가 다르다.** `certificateUrl`·`rejectionReason`·`hospitalName` 이 필요하고, 이건 공개 응답에 실려서는 안 된다.
        3. **검수 전 전공을 그대로 보여줘야 한다.** 공개 응답은 미승인 전공을 가리는데(`visibleSpecialty: null`),
           검수 화면은 바로 그 값을 판단해야 한다.

        현재 화면은 `일반의` 도 이 목록에 넣고 승인/반려 버튼을 함께 보여준다. `일반의` 는 검수할 자격증이 없고
        승인/반려가 사용자 화면 표시를 바꾸지도 않는다. 기본값으로 제외하고 `includeGeneralPractitioners=true`
        일 때만 넣는다.
      x-screens: [admin-specialists.md]
      x-screen-status: "✅"
      x-role: operator
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: 상태별 필터. 현재 화면에는 없다 (🚧 대비).
          schema:
            $ref: '#/components/schemas/VerificationStatus'
        - name: includeGeneralPractitioners
          in: query
          description: '`일반의` 를 목록에 포함할지. 기본 false.'
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 검수 대상 목록. `대기 → 반려 → 승인` 순.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VerificationQueueItem'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /doctors/{doctorId}/verification:
    parameters:
      - $ref: '#/components/parameters/DoctorId'
    put:
      operationId: decideDoctorVerification
      tags: [doctors]
      summary: 전문의 인증 승인·반려
      description: |
        **`operator` 전용이다.** 플랫폼이 자격증을 검증하는 행위이며, 병원 담당자는 신청(전문의 등록)만 하고
        판정에는 관여하지 않는다. 이전 초안에 있던 임시 방편(`403 SELF_VERIFICATION_FORBIDDEN` —
        자기 병원 전문의는 검수 금지)은 **제거했다.** 그 규칙은 역할이 둘뿐일 때의 우회였고, 결과적으로
        "다른 병원 담당자가 남의 병원 전문의를 심사하는" 이상한 구조를 남겼다. `operator` 가 생겨 불필요해졌다.

        **부수효과가 이 엔드포인트의 책임이다.** 결정을 저장하면서 같은 트랜잭션에서 처리한다:

        1. `verificationStatus` 를 `approved` / `rejected` 로 바꾼다
        2. `approved` → `rejectionReason` 을 `null` 로 지운다. `rejected` → `rejectionReason` 을 저장한다 (필수, 1자 이상)
        3. **그 전문의 소속 병원의 담당자 전원에게 `audience=admin` 알림을 만든다**
           (`type=system`, `relatedResource=doctor`, `relatedId=doctorId`).
           지금은 어떤 알림도 생기지 않아 병원이 검수 결과를 알 방법이 없다. 이것이 그 결함의 해결책이다.
           수신자는 `hospital_admins` 에 걸린 계정들이다 — 병원에 담당자가 아직 지정되지 않았다면
           알림은 만들어지지만 수신자가 0명이 된다 (승인 자체는 성공한다).
        4. **검수 기록을 남긴다** — 누가(`operator` 계정), 언제, 어떤 결정을, 어떤 사유로.
           현재는 반려 사유만 남고 승인 시 그것도 지워진다.

        `certificateUrl` 이 없는(미제출) 전문의도 승인할 수 있다 — 현재 동작을 유지한다.
        되돌리기(승인↔반려 재변경)도 허용한다.
      x-screens: [admin-specialists.md]
      x-screen-status: "✅"
      x-role: operator
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
            examples:
              approve:
                summary: 승인
                value:
                  status: approved
              reject:
                summary: 반려
                value:
                  status: rejected
                  rejectionReason: 자격증 이미지가 흐려서 발급기관을 확인할 수 없어요
      responses:
        '200':
          description: 결정이 반영된 전문의
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorAdminView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: '`operator` 가 아님. `hospital_admin` 이 호출한 경우 포함'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: FORBIDDEN
                  message: 이 작업을 수행할 권한이 없어요
                  requestId: 01J9X8V0Q3
        '404':
          $ref: '#/components/responses/DoctorNotFound'
        '422':
          description: '`rejected` 인데 `rejectionReason` 이 없음 등'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =========================================================================
  # consult-requests
  #
  # 🚧 서버에 consult 모듈이 아직 없다 — 이 절 전체가 계약이 구현보다 먼저 간 것이다.
  #    2026-10-13 의 **상담 예약 확장**(상태 5개 · 확정 일시 `visitAt` · 취소 사유 ·
  #    일시 변경 이벤트 · 목록 기간/시술 필터와 탭 카운트 · 목록 연락처 마스킹)도 같은 상태이고,
  #    구현 전까지는 프론트엔드의 저장 계층이 같은 모양을 흉내 낸다.
  #    근거: docs/features/requests/2026-10-12-04-관리자-상담예약-개선.md,
  #         docs/api/README.md §4 · §9 · §14, docs/database/README.md §12
  #
  #    2026-10-13 관리자 대시보드(요청 05)가 이 절에 더한 것 둘 — 둘 다 additive 이고
  #    소비자는 `GET /admin/dashboard` 다: `status` 반복 허용, `period` 에 `thisMonth`.
  # =========================================================================
  /consult-requests:
    post:
      operationId: createConsultRequest
      tags: [consult-requests]
      summary: 상담 신청 접수
      description: |
        **서버가 막아야 하는 것 (지금 클라이언트만 막고 있는 것):**

        - `hospital.consultAvailable === false` → `409 CONSULT_CLOSED`.
          병원 상세에서는 버튼이 `상담 마감` 으로 잠기지만 `/consult/:hospitalId` 주소로 직접 들어가면 그대로 접수된다.
        - 로그인 필수. `401` 이면 화면이 로그인으로 보낸다.
        - `phone` 형식 검사. **화면도 제출 전에 같은 패턴(`^01[016789]-?\d{3,4}-?\d{4}$`)으로 검사해
          버튼을 잠그지만, 판정의 주체는 서버다.** 화면 검사는 UX(눌러보기 전에 알려주는 것)이고
          서버 검사가 규칙이다 — 다른 클라이언트나 직접 호출은 화면 검사를 거치지 않는다.
          통과한 값은 서버가 `010-1234-5678` 형태로 정규화해 저장한다 (하이픈은 보낼 때 있어도 없어도 된다).
        - `thirdPartyConsent` 가 없거나 `thirdPartyConsent.agreed !== true` →
          `422 THIRD_PARTY_CONSENT_REQUIRED` (메시지 `개인정보 제3자 제공에 동의해야 상담을 신청할 수 있어요`).
          `error.code` 에 그 값이 오고 필드 단위 `details` 는 쓰지 않는다 — 거절 사유가 하나뿐이라
          화면은 체크박스 한 곳만 가리키면 된다.
        - `procedureId` 가 그 병원이 취급하는 시술인지 (`422 PROCEDURE_NOT_OFFERED`).
          `null` 은 `잘 모르겠어요` 선택이라 허용된다.
        - `doctorId` 가 그 병원 소속인지 (`422 DOCTOR_NOT_AT_HOSPITAL`).

        **개인정보 제3자 제공 동의(`thirdPartyConsent`) 는 접수마다 받는다.** 신청자의 이름·연락처를
        병원에 넘기는 구조라 접수 건마다 동의가 필요하고, 가입 때 한 번 받아두는 방식은 추후 검토다
        (`docs/features/requests/2026-10-12-01-상담신청-화면-개선.md`).
        클라이언트가 보내는 것은 **동의 여부와 어떤 공고문에 동의했는지(`noticeVersion`)** 뿐이고,
        **동의 시각은 서버가 접수를 받아들인 시각으로 찍는다** — 기기 시계는 사용자가 바꿀 수 있어
        증빙이 되지 않기 때문이다. 기록된 동의는 응답의 `thirdPartyConsent`
        (`ConsultRequest` / `MyConsultRequest`) 로 되돌아온다.

        공고문 전문은 지금 프론트엔드 상수에 있다. `GET /legal-documents/{slug}` 로 옮기는 것은 미결 사항이고,
        그래서 **서버는 `noticeVersion` 을 검증하지 않고 받은 문자열을 그대로 저장한다** — 서버가 모르는
        문구의 버전을 맞다/틀리다 판정할 근거가 없다. 옮기고 나면 `LegalDocument.version` 과 대조할 수 있다.

        🚧 **서버에 consult 모듈이 아직 없다 — 이 절은 계약이 구현보다 먼저 간 것이다.**
        위 동의 규칙(필수 검사 · 서버 시계로 찍는 시각 · 저장)은 백엔드 구현 대기 상태이며 미결 사항이다.
        그때까지는 프론트엔드의 저장 계층이 같은 모양을 흉내 낸다.

        **`doctorId` 가 전문의 지정 상담을 해결한다.** 병원 상세·전문의 상세의 `전문의 상담신청` 이
        이 값을 채워 보내면 관리자가 어느 전문의를 지목했는지 알 수 있다. 지금은 `남기고 싶은 말` 칸에
        직접 적어야 한다.

        **부수효과:** 접수와 동시에 **그 병원의 담당자 전원**(`hospital_admins` 에 걸린 계정)에게
        `audience=admin` 알림을 만든다 (제목 `새로운 상담 신청`, 내용 `{name}님이 상담을 신청했어요`,
        `relatedResource=consultRequest`, `relatedId` = 상담 id,
        **`consultStatus: new`** — 접수 직후의 상담 상태다, 2026-10-13).
        알림 생성은 이 엔드포인트의 책임이고, 별도의 알림 생성 API 는 없다.
        문구는 **바뀌지 않는다** — 요청 08 이 정한 환자용 문장은 `audience=user` 알림의 것이다.

        알림 내용에 신청자 이름이 들어가므로 **수신자는 담당자로 한정된다.** `operator` 는 이 알림을 받지 않는다 —
        운영자에게는 이름이 마스킹되어야 하는데 알림 문구에 이름이 박히면 마스킹이 무의미해진다.

        `userId` 는 요청 본문으로 받지 않고 액세스 토큰에서 가져온다. 이것이 사용자 상담 내역 조회와
        계정별 알림이 성립하는 근거다.

        중복 신청은 막지 않는다 (현재 동작 유지). 같은 병원에 여러 번 신청하면 그만큼 따로 접수된다.
      x-screens: [consult-request.md, hospital-detail.md, explore.md, doctor-detail.md]
      x-screen-status: "✅ 🔒"
      x-role: user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultRequestCreateRequest'
            examples:
              hospitalConsult:
                summary: 병원 상담신청
                value:
                  hospitalId: h1
                  procedureId: implant
                  name: 김민준
                  phone: 010-1234-5678
                  preferredTime: 평일 저녁
                  message: ''
                  thirdPartyConsent:
                    agreed: true
                    noticeVersion: '2026-10-12'
              doctorConsult:
                summary: 전문의 지정 상담신청
                value:
                  hospitalId: h1
                  doctorId: d1
                  procedureId: implant
                  name: 김민준
                  phone: 010-1234-5678
                  preferredTime: 주말
                  message: 김민준 원장님께 상담받고 싶어요
                  thirdPartyConsent:
                    agreed: true
                    noticeVersion: '2026-10-12'
              unsureProcedure:
                summary: 시술을 고르지 않음 (`잘 모르겠어요`)
                value:
                  hospitalId: h1
                  procedureId: null
                  name: 김민준
                  phone: 010-1234-5678
                  preferredTime: 평일 오후
                  message: 어떤 시술이 맞는지 상담받고 싶어요
                  thirdPartyConsent:
                    agreed: true
                    noticeVersion: '2026-10-12'
      responses:
        '201':
          description: |
            접수 완료 (신청자 시야). 화면은 이 응답으로 완료 화면(병원·시술·희망 시간·상태 요약)을 그린다 —
            접수 직후 목록을 다시 조회하지 않아도 되도록 전체 투영을 내려준다.
          headers:
            Location:
              schema:
                type: string
                example: /v1/me/consult-requests/cr8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyConsultRequest'
              example:
                id: cr8
                hospitalId: h1
                hospitalName: 강남 스마일 치과
                hospitalThumbnail: https://cdn.molamola.kr/hospitals/h1/thumb.jpg
                doctorId: null
                doctorName: null
                procedureId: implant
                procedureName: 임플란트
                name: 김민준
                phone: 010-1234-5678
                preferredTime: 평일 저녁
                message: ''
                createdAt: '2026-10-12T04:21:00.000Z'
                status: new
                visitAt: null
                statusHistory:
                  - status: new
                    changedAt: '2026-10-12T04:21:00.000Z'
                    visitAt: null
                thirdPartyConsent:
                  agreedAt: '2026-10-12T04:21:00.000Z'
                  noticeVersion: '2026-10-12'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/HospitalNotFound'
        '409':
          description: 그 병원이 지금 상담을 받지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CONSULT_CLOSED
                  message: 지금은 이 병원의 상담 신청을 받지 않아요
                  requestId: 01J9X8V0Q3
        '422':
          description: |
            입력값 또는 접수 조건 위반. **`error.code` 로 갈린다** — 화면이 어느 칸을 가리킬지 결정해야 해서
            전부 `VALIDATION_FAILED` 로 뭉뚱그리지 않는다.
            형식 오류만 `VALIDATION_FAILED` + `details[]` 이고, 나머지는 "값은 형식에 맞는데 조건에 안 맞는 것" 이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                consentRequired:
                  summary: 제3자 제공 동의 없음
                  value:
                    error:
                      code: THIRD_PARTY_CONSENT_REQUIRED
                      message: 개인정보 제3자 제공에 동의해야 상담을 신청할 수 있어요
                      requestId: 01J9X8V0Q3
                invalidPhone:
                  summary: 연락처 형식 위반
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: 입력값을 확인해주세요
                      details:
                        - field: phone
                          code: INVALID_PHONE_FORMAT
                          message: 휴대폰 번호 형식이 아니에요. 010-1234-5678 처럼 입력해주세요
                      requestId: 01J9X8V0Q3
                procedureNotOffered:
                  summary: 그 병원이 하지 않는 시술
                  value:
                    error:
                      code: PROCEDURE_NOT_OFFERED
                      message: 이 병원에서 진행하지 않는 시술이에요
                      requestId: 01J9X8V0Q3
                doctorNotAtHospital:
                  summary: 그 병원 소속이 아닌 전문의
                  value:
                    error:
                      code: DOCTOR_NOT_AT_HOSPITAL
                      message: 이 병원에 소속된 전문의가 아니에요
                      requestId: 01J9X8V0Q3
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: listConsultRequests
      tags: [consult-requests]
      summary: 상담 목록 (관리자)
      description: |
        `/admin/consultations` — 화면 이름은 **상담 예약**이다 (사이드 메뉴 포함). 신청일시 최신순.

        **범위는 역할이 가르고, 연락처는 투영이 가른다** (2026-10-13, `docs/api/README.md` §4):

        | 역할 | 보이는 상담 | 이름 | 연락처 | `piiMasked` |
        |---|---|---|---|---|
        | `hospital_admin` | 담당 병원에 들어온 것만 | `박서영` | `010-****-4411` | `true` |
        | `operator` | 전체 | `박*영` | `010-****-4411` | `true` |

        지금은 모든 병원의 상담이 한 목록에 섞여 나오고, 로그인 검사조차 없어 고객 실명·전화번호가
        주소만 알면 노출된다. 스코프와 마스킹이 이 엔드포인트의 핵심이다.

        **목록은 담당자에게도 번호 가운데를 가린다.** 전체 번호는 상세
        (`GET /consult-requests/{consultRequestId}`, **감사 기록 대상**)에만 있다. 목록은 건별 열람
        기록을 남기지 않는 자원이라(아래) 전체 번호가 실리면 `pageSize` 넘김으로 **무기록 대량 반출**이
        성립한다 — 1차 방어선이 `pageSize` 상한과 요청 한도뿐이었다. 목록에서 값을 빼면 전체 번호를
        보는 모든 경로가 **기록이 남는 상세 한 곳**으로 모인다. 담당자의 정상 업무(`전화 걸기`)는
        상세에서 하므로 잃는 것이 없다.

        그래서 이 오퍼레이션의 **`piiMasked` 는 두 역할 모두 항상 `true`** 다. 이 플래그의 뜻은
        "이 응답에 마스킹된 개인정보 필드가 있다" 이며, 담당자 응답처럼 **이름은 전체인데 번호만
        가려진 경우도 포함한다** — `false` 를 주면 화면이 `010-****-4411` 을 잘못 저장된 데이터로
        읽는다. 클라이언트 규칙은 한 줄이다: `piiMasked === true` 면 전화 걸기·복사를 잠그고
        `전체 번호는 상세에서 확인할 수 있어요` 를 띄운다.

        운영자에게 목록을 여는 이유: 분쟁·CS 확인을 위해 상담의 **존재와 상태**는 봐야 한다.
        연락처가 필요한 경우는 드물어 마스킹으로 막았다 (`docs/decisions/0001-roles-and-pii.md` 결정 3).

        **상태 탭의 건수는 이 응답의 `statusCounts` 로 함께 내려간다.** 별도 오퍼레이션으로 두면
        같은 필터를 두 번 보내야 하고, 두 응답이 서로 다른 시점을 가리켜 목록과 탭 숫자가 어긋난다.
        모집단은 **지금 걸린 필터에서 `status` 만 뺀 범위**다 (`ConsultStatusCounts` 참고).
        `GET /consult-requests/summary` 를 재사용하지 못하는 이유도 모집단이다 — 그쪽은 담당 병원
        **전체**이고 화면 필터와 무관하다. (문의 쪽이 `GET /hospital-inquiries/summary` 로 갈라져 있는
        것은 거기 탭이 필터와 교차하지 않는 2값이라 모집단이 하나뿐이기 때문이다)

        **`지연`(신규 24시간 경과) 배지는 서버가 계산하지 않는다.** 판정에 필요한 두 값(`status`,
        `createdAt`)이 이미 응답에 있고 기준이 **시간대 없는 경과 시간**이라 기기 시계의 시간대 설정에
        영향받지 않는다. 서버가 `delayed: true` 를 내리면 **받는 순간부터 거짓이 되기 시작하는 값**이
        캐시·화면에 남는다. 클라이언트가 순수 함수 하나로 판정한다.
        (뒤집히는 조건: `지연` 이 탭·필터·카운트가 되는 순간 — 그때는 서버가 세고 파라미터가 하나 는다)

        **`유입`(어느 화면에서 신청했는지)은 수집하지 않는다.** 신청 화면이 보내지 않는 값이라 응답에
        필드가 없고, 만들면 전 건이 `null` 인 자리가 된다. 필요해지면 `POST /consult-requests` 가
        `source` 를 받는 것이 먼저이고, 그때도 **과거 건은 영구히 알 수 없다.**

        `Cache-Control: no-store`. 마스킹된 응답조차 캐시에 남으면 안 된다 —
        같은 URL 에 대해 역할별로 다른 본문이 나오므로 공유 캐시가 섞이면 유출이 된다.
        (같은 이유로 `Vary: Authorization` 을 함께 보낸다)
      x-screens: [admin-consultations.md]
      x-screen-status: "🟡"
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: |
            상태 탭. `전체` 는 **이 파라미터를 보내지 않는 것**이다 (꺼진 조건은 아예 보내지 않는다 — §5).
            값이 5개가 되었다 (`visited` 추가, 2026-10-13).

            **반복 허용** (2026-10-13, `procedureId` 와 같은 모양) —
            `?status=new&status=contacted`. 같은 파라미터끼리는 **OR**, 다른 필터와는 AND 다.
            **값을 하나만 보내던 기존 요청은 그대로 동작한다** (additive 변경이다).

            반복을 허용한 이유는 소비자가 생겼기 때문이다 — 대시보드의 `처리 대기`
            (= `new + contacted`)와 `이번 달 예약확정`(= `booked + visited`) 카드를 **목록에서
            정확히 재현**할 방법이 이것뿐이다 (`GET /admin/dashboard`). 재현되지 않으면 카드를 눌러
            열린 목록의 건수가 카드 숫자와 다르다. 클라이언트가 `statusCounts` 의 두 값을 더하게
            두지 않는 이유는 그 덧셈이 **또 하나의 판정 지점**이 되기 때문이다.

            이 필터를 걸어도 `statusCounts` 는 **전 상태의 건수**를 그대로 내려준다 — 탭을 눌러도
            다른 탭의 숫자가 흔들리면 안 되기 때문이다.

            등식은 **값을 하나만 보냈을 때** `meta.totalItems === statusCounts[그 상태]` 다.
            여러 값을 보내면 `meta.totalItems === 보낸 값들의 statusCounts 합` 이다
            (`ConsultStatusCounts` 참고).
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ConsultStatus'
        - name: hospitalId
          in: query
          description: |
            병원별 필터. 현재 화면에는 없다 (🚧). **`hospital_admins` 가 M:N 이라 한 담당자가 여러 병원을
            담당할 수 있으므로 실질적으로 필요하다.** `hospital_admin` 이 담당 병원 밖의 값을 보내면
            `403 HOSPITAL_NOT_MANAGED` (병원 존재는 공개 정보라 숨기지 않는다).
          schema:
            type: string
        - name: period
          in: query
          description: |
            기간 프리셋 (2026-10-13). 경계는 **`Asia/Seoul` 달력**이고 반열린 구간 `[from, to)` 다 —
            기기 시계로 계산하면 자정 근처에서 목록 건수와 탭 숫자가 어긋난다.

            | 값 | 화면 | 범위 (KST) |
            |---|---|---|
            | `today` | `오늘` | 오늘 00:00 ~ 내일 00:00 |
            | `thisWeek` | `이번 주` | 이번 주 **월요일** 00:00 ~ 다음 주 월요일 00:00 |
            | `thisMonth` | `이번 달` | **이번 달 1일 00:00 ~ 다음 달 1일 00:00** (2026-10-13 추가) |
            | `last30` | `최근 30일` | 오늘 00:00 − 29일 ~ 내일 00:00 (**오늘을 포함한** 30일) |

            주의 시작 요일과 30일의 포함 범위를 여기서 못 박는 이유: 문서마다 다르게 읽히는 값이고,
            화면과 서버가 다르게 구현하면 목록과 탭 카운트가 어긋난다.

            **`thisMonth` 를 더한 이유도 소비자다** — 대시보드의 `이번 달 신청 M건 중 N건 예약`
            카드와 `이번 달 상담 흐름` 깔때기의 모집단이 정확히 이 구간이고, 카드 링크가 M 을
            재현해야 한다 (`GET /admin/dashboard`). enum 값 추가라 breaking 이 아니다.

            기준 컬럼은 **접수 시각(`createdAt`)** 이다. 확정 일시(`visitAt`)로 거르는 화면은 아직 없다 (🚧).

            **`createdFrom`/`createdTo` 와 함께 보내면 `422 PERIOD_FILTER_CONFLICT`** —
            서버가 둘 중 하나를 임의로 고르면 화면이 그린 기간과 결과가 조용히 어긋난다.

            **보내지 않으면 기간 제한이 없다**(접수 전체). 화면이 처음에 어느 탭·어느 기간을 고르는지는
            클라이언트 결정이고, 서버는 받은 것만 적용한다.
          schema:
            type: string
            enum: [today, thisWeek, thisMonth, last30]
        - name: createdFrom
          in: query
          description: |
            기간 필터 시작 (포함). 임의 구간용이며 화면의 기간 칩은 `period` 를 쓴다.
            `period` 와 **함께 보내면 `422 PERIOD_FILTER_CONFLICT`**.
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          description: |
            기간 필터 끝 (포함). `period` 와 함께 보내면 `422 PERIOD_FILTER_CONFLICT`.
          schema:
            type: string
            format: date-time
        - name: procedureId
          in: query
          description: |
            시술 필터 (2026-10-13). **반복 허용** —
            `?procedureId=implant&procedureId=orthodontics`. 같은 파라미터끼리는 **OR**,
            다른 필터와는 AND 다.

            화면의 칩은 **9개 대분류**지만 서버가 아는 것은 **시술 id 13개**뿐이다. 대분류 → id 전개는
            클라이언트(`frontend/src/features/procedure/taxonomy.ts`)의 몫이고 서버는 **풀린 id 목록**을
            받는다. 대분류를 서버로 올리는 것은 그 분류를 **관리하는 화면**이 생길 때의 일이다 —
            지금 올리면 프런트 상수와 서버 데이터가 조용히 어긋날 자리만 생긴다.

            `시술 미지정`(`procedureId` 가 `null` 인 건)만 보는 칩은 **이 파라미터로 표현할 수 없다.**
            지금 화면에 없어서 값을 만들지 않았다 (🚧 생기면 계약에 별도 값이 필요하다).
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ProcedureId'
        - name: q
          in: query
          description: |
            신청자 **이름 또는 연락처 숫자** 검색 (2026-10-13 에 화면이 생겼다).
            서버는 앞뒤 공백을 다듬어 이름 부분일치로 비교하고, 검색어에서 **숫자만 남긴 값이 2자
            이상이면** 번호 검색을 **OR** 로 함께 건다. 번호를 통째로 붙여넣어도 맞는다
            (`010-1234-4411` · `010 1234 4411` 모두 같은 숫자열로 대조한다 — 저장 쪽도 숫자만 남긴
            값을 따로 들고 있다).

            **역할에 따라 숫자 검색의 범위가 다르다** (§4):

            | 역할 | 숫자 검색 |
            |---|---|
            | `hospital_admin` | 번호 부분일치 |
            | `operator` | **뒤 4자리 접미 일치만** (5자리 이상을 넣으면 뒤 4자리만 써서 비교한다) |

            운영자에게 뒤 4자리를 남긴 이유가 "고객 문의를 받았을 때 어떤 상담 건인지 대조" 이고 그
            대조는 4자리로 충분하다. 제한하지 않으면 전체 번호를 넣어 **"이 번호의 상담이 존재한다" 를
            확인하는 오라클**이 되어 마스킹이 우회된다. 자르는 것을 `422` 로 만들지 않은 이유:
            검색은 **결과 없음이 정상 응답**인 자리이고, 에러로 막으면 운영자 화면이 상담과 다른
            검색 규칙을 또 들고 있어야 한다.

            마스킹된 값(`010-****-4411`)을 그대로 넣으면 `*` 가 숫자가 아니므로 **0건이 정상**이다.
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: |
            상담 목록. **이름**은 `hospital_admin` 에게 전체 · `operator` 에게 마스킹이고,
            **연락처는 두 역할 모두 마스킹**이다 (`010-****-4411`). 항목마다 `piiMasked: true` 가 실려
            클라이언트가 전화 걸기·복사를 잠그고 "전체 번호는 상세에서" 안내를 띄울 수 있다.

            항목은 상세와 **같은 `ConsultRequest` 스키마**다 (필드 집합이 같고 `phone` 의 값만 갈린다 —
            마스킹은 값 변환이지 구조 변화가 아니라는 §4 의 기준 그대로다).
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Vary:
              schema:
                type: string
                example: Authorization
          content:
            application/json:
              schema:
                type: object
                required: [items, meta, scope, statusCounts]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsultRequest'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  scope:
                    type: string
                    enum: [managed, all]
                    description: '`managed` = 담당 병원만, `all` = 전체 (`operator`).'
                  statusCounts:
                    $ref: '#/components/schemas/ConsultStatusCounts'
              example:
                items:
                  - id: cr1
                    hospitalId: h1
                    hospitalName: 강남 스마일 치과
                    doctorId: null
                    doctorName: null
                    procedureId: implant
                    procedureName: 임플란트
                    name: 박서영
                    phone: 010-****-4411
                    piiMasked: true
                    preferredTime: 평일 오후
                    message: ''
                    createdAt: '2026-10-12T04:21:00.000Z'
                    status: booked
                    visitAt: '2026-10-09T05:00:00.000Z'
                    cancelReason: null
                    statusHistory:
                      - event: status_change
                        status: new
                        changedAt: '2026-10-12T04:21:00.000Z'
                        changedByName: null
                        visitAt: null
                        cancelReason: null
                        notified: false
                      - event: status_change
                        status: booked
                        changedAt: '2026-10-12T06:02:00.000Z'
                        changedByName: 김실장
                        visitAt: '2026-10-09T05:00:00.000Z'
                        cancelReason: null
                        notified: true
                    thirdPartyConsent:
                      agreedAt: '2026-10-12T04:21:00.000Z'
                      noticeVersion: '2026-10-12'
                    memos: []
                meta:
                  page: 1
                  pageSize: 20
                  totalItems: 42
                  totalPages: 3
                scope: managed
                statusCounts:
                  new: 5
                  contacted: 7
                  booked: 12
                  visited: 16
                  cancelled: 2
                  total: 42
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            기간 조건을 **두 방식으로 함께** 보냄 (`period` + `createdFrom`/`createdTo`).
            화면 버그이지 사용자 입력 오류가 아니라서 필드 단위 `details` 를 쓰지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: PERIOD_FILTER_CONFLICT
                  message: 기간 조건은 한 가지 방식으로만 보낼 수 있어요
                  requestId: 01J9X8V0Q3

  /consult-requests/summary:
    get:
      operationId: getConsultSummary
      tags: [consult-requests]
      summary: 상담 현황 요약 (**현재 소비 화면 없음**)
      description: |
        전 범위 상담 숫자 두 개 (`이번 달 신규 상담`, `처리 대기 중인 상담`).

        > ### ⚠️ 지금 이 오퍼레이션을 읽는 화면은 **하나도 없다** (2026-10-13)
        >
        > - **병원 관리자 홈**은 `GET /admin/dashboard` 하나로 모든 숫자를 받는다 (아래 표).
        > - **운영자 홈**(`OperatorHome`)은 상담 숫자를 **그리지 않는다** — 같은 레이아웃에
        >   병원 목록과 검수 대기만 보여준다. 전에 여기 "운영자 홈이 전 범위 상담 숫자를 볼
        >   유일한 자리" 라고 적혀 있었으나 **그 화면은 그렇게 만들어지지 않았다.** 프런트엔드의
        >   `fetchConsultSummary()` 와 훅은 제거됐다 (2026-10-13).
        > - 따라서 **서버 구현은 필요 없다.** 소비 화면이 생기는 날(예: 운영자 홈이 상담 숫자를
        >   요구하게 되는 날) 구현한다. 계약에서 **지우지는 않는다** — 삭제는 더 큰 결정이고,
        >   아래 "전용 엔드포인트로 둔 이유" 와 모집단 구분은 그날 다시 필요한 근거다.

        전용 엔드포인트로 둘 경우의 이유 (소비 화면이 생기는 날을 위해 남긴다):
        1. 지금은 상담 전체를 받아와 클라이언트가 센다 — 숫자 두 개를 보려고 고객 실명·전화번호를 전부 내려받는 셈이다.
        2. "이번 달" 이 **기기 시계**가 아니라 서버의 `Asia/Seoul` 달력 기준이어야 한다.
           `이번 달 신규 상담` 이 항상 0 인 현재 증상은 데이터 문제지만, 시간대 기준이 클라이언트에 있는 것도 함께 고쳐야 한다.
        3. 목록과 캐시 수명이 다르다 (요약은 짧게 캐시 가능, 목록은 `no-store`).

        스코프는 `GET /consult-requests` 와 동일하다 (`hospital_admin` = 담당 병원, `operator` = 전체).
        **개인정보를 담지 않으므로 마스킹 대상이 아니다** — 숫자 두 개뿐이다.

        ### 병원 관리자 대시보드는 이 오퍼레이션을 쓰지 않는다 (2026-10-13)

        `GET /admin/dashboard` 와 **이름이 같은 숫자가 둘 있는데 모집단도 뜻도 다르다.**
        재사용 관계가 아니므로 둘을 섞지 않는다:

        | | `ConsultSummary` (이 오퍼레이션) | 대시보드 (`GET /admin/dashboard`) |
        |---|---|---|
        | 범위 | **담당 병원 전체 합산** (`hospitalId` 파라미터가 **없다**) | **선택한 병원 한 곳** |
        | `pending` | `status = 'new'` **하나** | `status ∈ {new, contacted}` |
        | `newThisMonth` | 담당 병원 전부의 이번 달 접수 | 그 병원 한 곳의 이번 달 접수 |

        **계약에 남겨 두는 이유**: `operator` 는 대시보드를 쓰지 않으므로(§3), 전 범위 상담 숫자가
        필요해지는 날 들어갈 모양이 이것이다. 지금 그 숫자를 요구하는 화면이 없을 뿐이다 —
        **"운영자 홈이 쓴다" 는 더 이상 사실이 아니다.**
        **`hospitalId` 를 지금 더하지 않는 이유**: 더해도 쓰는 화면이 없고, 소비자 없는 파라미터는
        "이 숫자를 병원별로 봐도 된다" 는 잘못된 신호가 된다. 운영자 홈이 병원별 숫자를 요구하는 날 더한다.
      # x-screens 가 비어 있다: admin-home.md 는 병원 관리자 시야에서는 GET /admin/dashboard 를,
      # 운영자 시야에서는 병원 목록·검수 대기만 쓴다 — 이 오퍼레이션을 읽는 화면이 없다.
      x-screens: []
      x-screen-status: "—"   # 화면이 없으므로 ✅/🟡/🚧 중 어느 것도 아니다
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 요약 숫자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /consult-requests/{consultRequestId}:
    parameters:
      - $ref: '#/components/parameters/ConsultRequestId'
    get:
      operationId: getConsultRequest
      tags: [consult-requests]
      summary: 상담 상세 (관리자)
      description: |
        `/admin/consultations/:id`. `statusHistory` 와 `memos` 를 포함한다.

        **전체 연락처가 있는 유일한 자리다** (2026-10-13). 목록은 역할과 무관하게 번호를 가리므로
        (`GET /consult-requests`), `전화 걸기`(`tel:` 링크)와 복사는 이 응답으로만 성립한다.

        | 역할 | 이름 | 연락처 | `piiMasked` | 감사 로그 |
        |---|---|---|---|---|
        | `hospital_admin` (담당 병원) | `박서영` | `010-1234-4411` | `false` | 남김 (`pii_masked=false`) |
        | `operator` | `박*영` | `010-****-4411` | `true` | 남김 (`pii_masked=true`) |

        **넓은 화면의 오른쪽 상세 패널도 이 오퍼레이션이다.** 목록 옆에 붙어 있어도 `GET /{id}` 를
        호출하므로 **열 때마다 감사 행이 하나 남는다.** 부작용이 아니라 의도다 — 전체 번호를 본 횟수가
        곧 감사 행 수다. 좁은 화면에서 상세로 이동하는 것과 기록이 같아야 한다.

        **담당 병원 밖의 상담이면 `404` 다 (`403` 이 아니다).** 병원과 반대 방향의 판단이며 근거가 다르다:
        상담은 공개 리소스가 아니고 **상담 id 는 고객 개인정보와 1:1로 대응**한다.
        `403` 을 주면 id 를 순차 대입해 "이 id 의 상담이 존재한다" 를 알아낼 수 있고, 그것만으로도
        건수·활동량이 새는 열거(enumeration) 경로가 된다. 존재 자체를 숨긴다.

        **감사 로그: 이 오퍼레이션은 열람 기록을 남긴다.** 마스킹으로 운영자 쪽 노출면을 막았으므로
        남는 노출면은 담당자 쪽이고(`docs/decisions/0001-roles-and-pii.md` 결정 3),
        상담 상세는 실명·전화번호·문의 내용·내부 메모가 한 화면에 모이는 자리다.
        기록 항목: 열람자 계정, 역할, 상담 id, 병원 id, 마스킹 여부, 시각, 요청 IP, `requestId`.
        응답 헤더 `X-Audit-Logged: true` 로 기록됐음을 알린다 (클라이언트 동작에 영향은 없고,
        감사 파이프라인 점검용이다).

        목록(`GET /consult-requests`)은 건별 열람 로그를 남기지 않는다 — 상담 관리 화면이 목록을
        반복 조회해서 로그가 의미 없이 불어난다. **목록은 접근 통계로, 상세는 건별 열람 기록으로**
        다루는 실무적 타협이고, 그래서 **목록에서는 전체 번호를 뺐다**(2026-10-13) — 기록이 남지 않는
        자원에 반출할 값이 남아 있으면 안 된다. 엑셀 내려받기가 생기면 그건 명백한 대량 반출이라
        그때는 필수로 기록한다.
      x-screens: [admin-consultation-detail.md, admin-notifications.md]
      x-screen-status: "🟡"
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 상담 상세
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Vary:
              schema:
                type: string
                example: Authorization
            X-Audit-Logged:
              schema:
                type: boolean
              description: 열람 기록이 남았는지. 항상 `true` 다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            상담이 없거나 **담당 병원의 상담이 아님.** 두 경우를 구분하지 않는다 (열거 방지).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CONSULT_REQUEST_NOT_FOUND
                  message: 상담 정보를 찾을 수 없어요
                  requestId: 01J9X8V0Q3

  /consult-requests/{consultRequestId}/status:
    parameters:
      - $ref: '#/components/parameters/ConsultRequestId'
    patch:
      operationId: updateConsultStatus
      tags: [consult-requests]
      summary: 상담 상태 변경 · 예약 일시 변경
      description: |
        상태 변경과 **예약 일시 변경을 한 엔드포인트가 받는다** (2026-10-13).
        `PATCH .../visit-at` 같은 두 번째 쓰기 경로를 만들지 않은 이유: 필수 입력 검사 · 이력 행 ·
        환자 알림이 **한 트랜잭션** 안에 있어야 하고, 둘로 갈리면 같은 판정이 두 곳에 생긴다.

        **전이는 전부 허용한다. 검증하는 것은 "필요한 입력이 왔는가" 뿐이다.**

        | 들어가는 상태 | 필수 입력 | 없으면 |
        |---|---|---|
        | `booked` (예약확정) | `visitAt` — 본문 또는 **현재 행에 이미 있는 값** | `422` · `details[].code: VISIT_AT_REQUIRED` |
        | `cancelled` (취소) | `cancelReason` | `422` · `details[].code: CANCEL_REASON_REQUIRED` |
        | `new` · `contacted` · `visited` | 없음 | — |

        전이표를 두지 않은 것은 제품 결정이다 — **막을 전이를 찾지 못했다.** 걸어 들어온 환자는
        `신규` 에서 바로 `내원완료` 로 가고, 오기입 정정(`내원완료` 를 눌렀는데 안 왔다)은 역방향으로도
        간다. 금지 전이가 없으면 전이표는 "모두 허용" 한 줄이고, 그걸 적으면 읽는 사람이 **있지도 않은
        규칙을 찾게 된다.** `내원완료` 이후의 되돌림을 확인창으로 물을지는 화면의 몫이다.

        **이 요청이 무엇인지는 `(status, visitAt, cancelReason)` 세 값을 현재와 비교해 정한다:**

        | 현재와 다른 곳 | 결과 | 이력 | 환자 알림 | `X-Status-Changed` |
        |---|---|---|---|---|
        | `status` 가 다르다 | 상태 변경 | `event: status_change` 1행 | 상태별 문구 (아래 부수효과 3) · `consultStatus` = **요청의 `status`** | `true` |
        | `status` 는 같고 `booked` 인데 `visitAt` 이 다르다 | **일시 변경** | `event: reschedule` 1행 (`status` 는 `booked` 그대로) | 제목 `예약 일시가 바뀌었어요` · `consultStatus` = **`booked`** | `true` |
        | 세 값이 모두 같다 | **no-op** — 부수효과 없이 `200` + 현재 리소스 | 없음 | 없음 | `false` |
        | `status` 가 같고 위 두 경우가 아니다 (예: `cancelled` 그대로 `cancelReason` 만 다름, `booked` 아닌 상태에 `visitAt` 만 보냄) | **no-op** — 위와 같다. 사유만 고치는 경로는 두지 않는다 (사유는 이력 행의 사실이고, 고칠 일이 생기면 메모로 남긴다) | 없음 | 없음 | `false` |

        `visitAt` 비교는 **분 단위**다 (서버가 초·밀리초를 0 으로 절삭해 저장한다). 같은 시각을 다시
        저장하는 것이 초 자릿수 때문에 변경으로 보이면 오탭 방어가 무너진다.

        **필수 입력 검사가 no-op 판정보다 먼저다.** `예약확정` 인 상담에 `visitAt` 없이 `예약확정` 을
        다시 보내는 것은 "바꿀 것이 없는 요청" 이 아니라 **값을 빠뜨린 요청**이다 — `422` 이고 화면은
        `확정 일시를 입력해주세요` 를 띄운다. (계약 확장 이전에 들어온 `booked` 건에는 `visitAt` 이
        없는 것이 정상이다. 소급해 채우지 않았으므로 화면은 그런 건을 `일시 미입력` 으로 보여주고
        담당자가 채우게 한다 — 필수 입력 규칙은 **쓰기 경로에만** 건다)

        `X-Status-Changed` 는 **이름을 바꾸지 않고 뜻을 넓혔다: "이 요청이 이력 행을 만들었는가".**
        소비자가 묻는 것은 "오탭으로 아무 일도 안 일어났는가" 하나이고, 일시 변경도 그 질문에는 같은
        답이 필요하다. 헤더 이름과 뜻이 반 걸음 어긋나는 대가로 소비자 코드가 갈라지지 않는다.

        오탭 방어가 no-op 의 목적이다 — 목록의 빠른 상태 버튼을 두 번 누르면 이력이 중복으로 쌓이고
        고객에게 알림이 또 간다. 오류(4xx)로 만들지 않은 이유: 요청 후의 상태가 요청자가 원한 상태와
        같으므로 실패로 다룰 이유가 없다.

        **부수효과 (이력 행이 생길 때만, 전부 한 트랜잭션):**

        1. `status` 와 `visitAt` 갱신. `visitAt` 의 결과값은 **상태가 정한다** — `booked` 는
           요청값 ?? 현재값, `visited` 는 현재값 유지, 그 밖은 `null` (아래 `visitAt` 설명)
        2. `statusHistory` 에 `{ event, status, changedAt, changedByName, visitAt, cancelReason, notified }` 한 줄.
           `visitAt` 은 **그 이벤트 직후의 확정 일시 스냅샷**이다
        3. **그 상담을 신청한 사용자에게** `audience=user`·`type=consult-status` 알림 1건
           (`relatedResource=consultRequest`, `relatedId` = 상담 id). 수신자는 상담의 `userId` **한 명**이다 —
           지금은 알림이 계정과 무관하게 쌓여서 관리자가 상태를 바꾸면 **관리자 자신의 알림함에도**
           들어온다. 만들어진 알림이 이력 행에 묶여 `notified: true` 로 내려간다. "모든 변경은 알림을
           보낸다" 는 **규칙으로 파생하지 않는다** — 규칙이 바뀌면 과거 이력의 표시가 소급해 거짓이 된다

           **`consultStatus` 는 상태 변경이면 요청의 `status`, 일시 변경이면 `booked`** 다
           (2026-10-13 추가). 일시 변경에 특례가 없는 것이 이 칸을 "이벤트" 가 아니라
           "**변경 후 상태**" 로 정의해서 얻은 이득이다 — 아이콘이 묻는 것은 "무슨 이벤트였나" 가
           아니라 "지금 예약이 잡힌 건가" 이기 때문이다 (`docs/database/README.md` §15.2).

           **문구는 이 트랜잭션 안에서 완성된 문자열로 저장한다** (`AppNotification.title`/`message`
           의 표). 요청 08 이 `booked`·`contacted`·`cancelled` 세 경우의 문장을 새로 정했고,
           **`visited` 와 되돌림(`new` 등)은 기존 문구 `상담 상태가 '{라벨}'(으)로 변경되었어요` 를
           유지한다** — 요청서가 그 두 경우의 문장을 적지 않았다.

           **취소 사유는 알림 행에 저장하지 않는다** (`notifications.cancelReason` 없음 — DB §15.5).
           `ConsultCancelReason` → 환자용 문장 변환은 알림 행이 만들어지기 **전에** 끝나고,
           결과는 `message` 안에만 남는다. 사유별 집계는 이력 행이 이미 답한다.
           관리자 라벨(`연락이 안 됨`·`중복 신청`)을 환자 문구에 **쓰지 않는다.**
        4. 감사 로그 1행. **`action` 이 갈린다** — 상태 변경은 `consult_request.status_change`,
           일시 변경은 **`consult_request.reschedule`** (`before_value`/`after_value` 에 들어가는 것이
           상태가 아니라 일시다)
        5. 관리자 홈 대시보드의 `처리 대기`·깔때기 값이 함께 달라진다 (`GET /admin/dashboard` 재조회.
           `GET /consult-requests/summary` 가 아니다 — 그쪽을 읽는 화면이 없다)

        **인가: `hospital_admin` 의 담당 병원 상담만이다. `operator` 는 상태를 바꿀 수 없다 (`403`).**
        상담 처리는 병원이 고객에게 연락하는 일이고, 운영자는 그 진행을 볼 뿐 대신 처리하지 않는다.
        운영자가 상태를 바꾸면 고객에게 "예약확정" 알림이 가는데 실제로 예약한 병원은 모르는 상태가 된다.
        조회(`GET`)와 변경(`PATCH`)의 역할 범위가 다른 것은 의도된 비대칭이다.
        (상태가 5개가 되면서 "병원이 방치한 건을 운영자가 취소" 요구가 더 그럴듯해졌지만, 요청서에
        없어 바꾸지 않았다 — 🚧 미결)

        **취소 사유는 현재 행에 저장하지 않는다.** 취소 이벤트 이력 행에 남고, 응답의 `cancelReason` 은
        "현재 상태가 `cancelled` 일 때 **가장 최근 취소 이벤트**의 사유" 로 파생된다. 그래서 재오픈
        (취소 → 연락중)에 사유를 지우는 절차가 따로 없다 — 상태가 `cancelled` 가 아니면 파생값이
        자동으로 `null` 이다.

        `statusHistory` 에 `changedByName` 으로 처리자를 남긴다. 담당 병원 밖의 상담이면 `404` (상세와 동일).
      x-screens: [admin-consultations.md, admin-consultation-detail.md, notifications.md]
      x-screen-status: "✅"
      x-role: hospital_admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/ConsultStatus'
                visitAt:
                  type: [string, 'null']
                  format: date-time
                  description: |
                    확정 내원 일시 (UTC 시각. 화면은 `Asia/Seoul` 로 변환해 `10/9(금) 14:00` 으로 그린다).

                    **`status: booked` 일 때 필수**다 — 본문에 없으면 **현재 행에 이미 있는 값**을 쓰고,
                    둘 다 없으면 `422` (`VISIT_AT_REQUIRED`). 일시만 바꾸는 "일시 변경" 은 현재 상태와
                    같은 `booked` 를 `status` 에 넣고 새 `visitAt` 을 보내는 것이다.

                    서버가 **초·밀리초를 0 으로 절삭해** 저장한다 (입력 단위가 분이고, 절삭하지 않으면
                    같은 약속이 초 자릿수로 갈려 no-op 비교가 거짓 양성을 낸다).

                    **`booked` 이외의 상태로 갈 때 보낸 값은 무시한다** — 결과값은 상태가 정한다:
                    `visited` 는 현재 값을 **유지**하고(언제 오기로 했던 건인가는 내원 기록의 일부다),
                    `new`·`contacted`·`cancelled` 로 나가면 **`null` 로 지운다**(취소된 건의 목록 카드와
                    환자 마이페이지에 `10/9(금) 14:00 예정` 이 남으면 **환자에게 거짓**이 된다).
                    지워진 약속은 직전 `booked`/`reschedule` 이력 행의 스냅샷에 남는다.

                    **과거 시각도 받는다.** 지난 약속을 뒤늦게 기록하는 정정이 정상 경로다
                    (경고를 띄울지는 화면의 몫이다).

                    `visited` 에 `visitAt` 이 없는 건은 정상이다 — 걸어 들어온 환자를 `신규` 에서 바로
                    `내원완료` 로 넘긴 경우이고, "언제 왔는가" 는 그 이력 행의 `changedAt` 이 답한다.
                  example: '2026-10-09T05:00:00.000Z'
                cancelReason:
                  oneOf:
                    - $ref: '#/components/schemas/ConsultCancelReason'
                    - type: 'null'
                  description: |
                    **`status: cancelled` 일 때 필수**다 — 없으면 `422` (`CANCEL_REASON_REQUIRED`),
                    목록에 없는 코드면 `422` (`VALIDATION_FAILED`).
                    다른 상태로 갈 때 보낸 값은 **무시한다** (취소 이벤트 행에만 저장된다).
            examples:
              book:
                summary: 예약확정 — 확정 일시 필수
                value:
                  status: booked
                  visitAt: '2026-10-09T05:00:00.000Z'
              reschedule:
                summary: 일시 변경 — 상태는 그대로 `booked`, 일시만 다름
                value:
                  status: booked
                  visitAt: '2026-10-12T02:00:00.000Z'
              cancel:
                summary: 취소 — 사유 필수
                value:
                  status: cancelled
                  cancelReason: no_answer
              visit:
                summary: 내원완료 — 추가 입력 없음 (`visitAt` 은 유지된다)
                value:
                  status: visited
      responses:
        '200':
          description: |
            변경된 상담. `X-Status-Changed: false` 면 `(status, visitAt, cancelReason)` 세 값이 모두
            이미 그대로여서 **이력 행도 알림도 만들어지지 않았다**는 뜻이다.
          headers:
            X-Status-Changed:
              schema:
                type: boolean
              description: |
                **이 요청이 이력 행을 만들었는가.** 상태 변경과 일시 변경 모두 `true` 이고,
                no-op 만 `false` 다.
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ConsultRequestNotFound'
        '422':
          description: |
            필수 입력 누락 또는 형식 오류. **no-op 판정보다 먼저 일어난다.**
            화면이 어느 칸을 가리킬지 알아야 해서 `details[].field` 로 자리를 짚어 준다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                visitAtRequired:
                  summary: 예약확정인데 확정 일시가 없음
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: 입력값을 확인해주세요
                      details:
                        - field: visitAt
                          code: VISIT_AT_REQUIRED
                          message: 확정 일시를 입력해주세요
                      requestId: 01J9X8V0Q3
                cancelReasonRequired:
                  summary: 취소인데 사유가 없음
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: 입력값을 확인해주세요
                      details:
                        - field: cancelReason
                          code: CANCEL_REASON_REQUIRED
                          message: 취소 사유를 선택해주세요
                      requestId: 01J9X8V0Q3

  /consult-requests/{consultRequestId}/memos:
    parameters:
      - $ref: '#/components/parameters/ConsultRequestId'
    post:
      operationId: addConsultMemo
      tags: [consult-requests]
      summary: 내부 공유용 메모 추가
      description: |
        메모는 **신청자에게 절대 내려가지 않는다.** `MyConsultRequest` 에 `memos` 가 없는 것이 그 보장이다.
        지금은 "내부 공유용" 이라고만 적혀 있고 주소를 아는 누구나 읽을 수 있다.

        수정·삭제 엔드포인트는 만들지 않았다 (화면에 그 기능이 없다). `authorId`/`authorName` 을 함께 저장한다 —
        지금은 누가 남긴 메모인지 알 수 없다.

        **인가: `hospital_admin` 의 담당 병원 상담만. `operator` 는 메모를 쓸 수 없다 (`403`).**
        "내부 공유용" 의 내부는 병원이다. 다만 운영자는 `GET` 으로 메모를 **읽을 수 있다** —
        분쟁 시 처리 경과를 확인해야 하고, 메모에는 마스킹 대상 필드가 없다.
        메모에 고객 연락처를 적으면 마스킹을 우회하게 되므로, 화면에 그 안내가 필요하다 (미결 사항).
      x-screens: [admin-consultation-detail.md]
