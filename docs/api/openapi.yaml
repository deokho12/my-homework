      - $ref: '#/components/parameters/HospitalId'
    patch:
      operationId: decideHospitalApproval
      tags: [operator]
      summary: '🚧 [제안] 병원 승인 · 반려 (운영자)'
      x-proposal: 제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안). **자리 예약이다** — 검수 화면이 범위 밖이라 모양이 바뀔 수 있다
      description: |
        > 🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안).** 확정 계약이 아니다.
        > **운영자 검수 화면은 이번 범위 밖이다** (요청서 06 · DB §14.3 이 "전이 경로 없음" 으로 적는다).
        > 그런데도 적어 두는 이유는 하나다 — **이것이 이 제안이 만드는 `pending` 상태의 유일한 출구**다.
        > `HOSPITAL_AUTO_APPROVE` 를 끈 환경에서 이 오퍼레이션이 없으면 가입한 병원이 **영원히
        > 환자 앱에 뜨지 않는다.** 모양(본문·응답)은 검수 화면이 생길 때 다시 본다.

        `pending`/`rejected` → `approved`, `pending` → `rejected`. **`operator` 전용.**

        **`PATCH /hospitals/{id}` 에 `approvalStatus` 를 끼우지 않은 이유**: 그 오퍼레이션은
        `hospital_admin` 도 쓴다. 같은 본문에 승인 필드를 두면 **필드 단위 인가**가 하나 더 생기고
        (지금 `isRecommended` 가 `422 FIELD_NOT_WRITABLE` 로 걸러지는 그 자리), 담당자가 자기 병원을
        스스로 승인하는 경로를 **거절로 막는** 모양이 된다. 역할이 다르면 오퍼레이션을 나누는 쪽이
        읽는 사람에게도 명확하다 (`PUT /doctors/{id}/verification` 과 같은 모양이다).

        **`approved → 무엇이든` 전이는 없다.** 승인 취소는 상태 되돌리기가 아니라 삭제
        (`deleted_at`)다 — 노출 판정이 `deletedAt === null && approvalStatus === 'approved'`
        하나이므로 두 수단을 겹쳐 두면 "왜 안 보이는가" 의 답이 둘이 된다 (DB §14.1).

        **부수효과**
        1. `approvalStatus`·`approvalSource='operator'`·`approvalDecidedAt`·`approvalDecidedByUserId` 갱신
        2. 감사 로그 1행 — `hospital.approve` 또는 `hospital.reject`
           (`target_type='hospital'`, §4). **자동 승인은 감사 로그를 남기지 않는다** —
           행위자가 없고, 가짜 시스템 계정을 넣으면 `actor_role` 스냅샷이 거짓이 된다 (DB §14.11)
        3. 그 병원 담당자에게 알림 1건 — `audience=admin`, `type=system`,
           `relatedResource=hospital`, `consultStatus=null`.
           ⚠️ 요청서의 완료 화면은 "알림과 **문자**로 알려드려요" 라고 약속하는데
           **SMS 발송 수단이 없다** (열린 질문, §20)
        4. 승인되는 순간 그 병원이 **공개 목록·검색·지도·전문의 목록에 나타난다.**
           반대로 반려는 아무것도 사라지게 하지 않는다 (애초에 보이지 않았다)
      x-screens: []
      x-screen-status: "🚧"
      x-role: operator
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                  description: |
                    `pending` 으로 되돌리는 값을 **받지 않는다** — 재제출 화면이 없어서
                    되돌려 놓으면 병원이 아무것도 할 수 없는 상태에 갇힌다 (DB §14.17-1).
                note:
                  type: [string, 'null']
                  maxLength: 500
                  description: |
                    **`status: rejected` 일 때 필수**다 — 없으면 `422 VALIDATION_FAILED`
                    (`details[].code: APPROVAL_NOTE_REQUIRED`). 사유 없는 반려는 병원이
                    무엇을 고쳐야 할지 알 수 없다. `partner_inquiries.review_note` 와 같은 성격이다.
                    승인일 때 보낸 값은 저장한다 (검수 메모).
            examples:
              approve:
                summary: 승인
                value:
                  status: approved
              reject:
                summary: 반려 — 사유 필수
                value:
                  status: rejected
                  note: 제출하신 사업자등록증이 치과 의료기관으로 확인되지 않아요.
      responses:
        '200':
          description: 결정이 반영된 병원 (관리 시야)
          headers:
            X-Audit-Logged:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedHospital'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/HospitalNotFound'
        '422':
          description: |
            사유 없는 반려, 또는 허용되지 않는 전이 (`approved` 인 병원에 다시 결정을 보냄 —
            `code: INVALID_APPROVAL_TRANSITION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /hospitals/{hospitalId}/doctors:
    parameters:
      - $ref: '#/components/parameters/HospitalId'
    get:
      operationId: listHospitalDoctors
      tags: [doctors]
      summary: 병원 소속 전문의 목록
      description: |
        병원 상세의 `전문의 소개`, 병원 카드의 `OO전문의 상주` 배지, 상담 신청의 전문의 지정에 쓰인다.

        인증되지 않은 전문의의 전공은 응답에서 **가려서** 내려간다 (`visibleSpecialty: null`,
        `doctor.projection.ts` 의 `visibleSpecialty()`). 예전에는 클라이언트가
        `getVisibleSpecialtyLabel()` 로 숨겼지만, 원본 `specialty` 가 응답에 실려 있으면 검수 전
        전공이 API 응답을 뜯어보는 누구에게나 보였다 — 규칙 자체를 서버로 옮겼다.
        `certificateUrl` / `rejectionReason` 도 관리자 응답(`DoctorAdminView`)에만 포함된다.

        ★ 이 GET 은 **공개** 응답뿐이다 — 관리자가 미승인·반려 전문의의 원본 `specialty` 나
        `certificateUrl` 을 다시 읽을 방법이 지금 없다(가장 큰 계약 격차, 다음 조각 후보:
        `GET /hospitals/{hospitalId}/doctors?view=admin`). 그 값은 방금 자신이 보낸
        `PUT`/`PATCH`/검수 응답에서만 얻을 수 있고, 병원 폼을 다시 열면 사라진다 —
        `PUT` 의 `DoctorUpsert.specialty` 가 필수라서, 미승인 전공을 가진 전문의가 있는 병원은
        새 전문의를 추가하는 저장에서 막힌다(기존 항목 수정·삭제는 `PATCH`/`DELETE` 라 막히지
        않는다). `docs/features/known-issues.md` 참고.
      x-screens: [hospital-detail.md, explore.md, consult-request.md, doctor-detail.md]
      x-screen-status: "✅"
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: 소속 전문의. 등록 순서.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Doctor'
        '404':
          $ref: '#/components/responses/HospitalNotFound'
    put:
      operationId: replaceHospitalDoctors
      tags: [doctors]
      summary: 병원 소속 전문의 일괄 교체
      description: |
        관리자 병원 폼의 저장 동작을 그대로 표현한 것이다 — "화면에 남겨둔 전문의 목록이 그대로 정답이 된다".
        `id` 가 있는 항목은 갱신, 없는 항목은 신규(→ `pending`), 목록에서 빠진 항목은 삭제된다.

        **`name` 이 필수(minLength 1)다.** 이름을 명시적으로 빈 문자열로 보내면 서버가
        `422 VALIDATION_FAILED` 로 거절한다. 다만 관리자 폼은 그 값을 아예 보내지 않고 목록에서
        빼는 방식으로 여전히 같은 결과(삭제)에 이를 수 있다 — 이제는 폼이 **기존** 전문의의 빈
        이름을 감지하면 저장 자체를 막아 그 경로를 차단한다(`docs/features/known-issues.md`).
        신규 추가한 빈 이름 행은 조용히 목록에서 빠지는 것이 의도된 동작이다.

        **재검수 규칙 (현재 없는 것을 서버가 넣는다):** 기존 전문의의 `specialty` 또는 `certificateUrl` 이
        바뀌면 `verificationStatus` 가 `pending` 으로 되돌아가고 `rejectionReason` 이 지워진다.
        지금은 승인된 전문의의 전공을 바꿔도 승인이 유지되어, 검수 없이 다른 과의 `전문의` 배지가 노출된다.

        `photo` / `yearsOfExperience` / `career` / `procedureIds` 를 보내지 않으면:
        - 신규 → 서버가 기본값을 채운다 (`procedureIds` 는 전공에서 유도, `일반의` 는 병원 취급 시술 전체)
        - 기존 → 기존 값을 유지한다

        인가: `hospital_admin` 은 담당 병원만 (`403 HOSPITAL_NOT_MANAGED`), `operator` 는 전 병원.
        **`verificationStatus` 는 여기서 바꿀 수 없다** — 검수는 `operator` 전용 오퍼레이션이다.
        담당자가 전문의를 추가·수정하면 `pending` 으로 들어가거나 되돌아갈 뿐이고, 승인은 운영자만 한다.
      x-screens: [admin-hospital-new.md, admin-hospital-edit.md]
      x-screen-status: "✅"
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doctors]
              properties:
                doctors:
                  type: array
                  items:
                    $ref: '#/components/schemas/DoctorUpsert'
      responses:
        '200':
          description: 교체 후의 전문의 목록 (관리자 시야 — `certificateUrl` 포함)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DoctorAdminView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/HospitalNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

