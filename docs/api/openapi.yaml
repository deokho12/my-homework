openapi: 3.1.0

# ---------------------------------------------------------------------------
# 몰라몰라 REST API
#
# 이 문서는 `docs/features/*.md` 27개 화면 문서의 기능 표를 근거로 도출했다.
# 각 오퍼레이션의 `x-screens` 가 그 엔드포인트를 필요로 하는 화면 문서를 가리키고,
# `x-screen-status` 가 그 화면 기능의 현재 상태(✅ 동작 / 🟡 샘플 데이터 / 🚧 껍데기)를 나타낸다.
#
# 설계 판단(왜 이렇게 나눴는지, 서버 필터 vs 클라이언트 필터, 검색 동작 등)은
# `docs/api/README.md` 에 있다. 이 파일은 계약(contract)만 담는다.
#
# 저장 구조와 1:1로 맞추지 않았다. 응답은 화면이 필요한 형태를 기준으로 정했고,
# DB 스키마(`docs/database/`)와의 정렬은 별도로 진행된다.
# ---------------------------------------------------------------------------

info:
  title: 몰라몰라 API
  version: 1.0.0
  summary: 치과 시술 비교·상담 신청 서비스의 백엔드 API
  description: |
    ## 공통 규약

    - **필드명**: 응답·요청 본문 모두 `camelCase`. 프론트엔드 `frontend/src/types/domain.ts` 와 일치한다.
    - **금액**: 정수(원). 소수점·통화기호·쉼표 없음.
    - **시각**: UTC ISO-8601 문자열 (`2026-08-12T09:30:00.000Z`). `format: date-time`.
    - **날짜만**: 일부 필드는 의도적으로 날짜만 담는다 (`format: date`, `2026-08-12`).
      `Review.createdAt`, `QAPost.createdAt`, `QAAnswer.createdAt`, `GuideContent.createdAt`,
      `Hospital.sponsoredStartDate`, `Hospital.sponsoredEndDate`.
      기존 도메인 타입을 보존하기 위한 것이며, 신규 필드는 전부 `date-time` 을 쓴다.
    - **"이번 달" 같은 달력 경계**: 서버가 `Asia/Seoul` 기준으로 계산한다. 응답 시각은 여전히 UTC 다.
    - **인증**: JWT Bearer. 액세스/리프레시 토큰이며 세션 쿠키를 쓰지 않는다 (`mobile/` 의 Flutter 앱이 같은 API 를 쓴다).
    - **인가**: `user` / `hospital_admin` / `operator` 세 역할 (`docs/decisions/0001-roles-and-pii.md` 확정).
      `hospital_admin` 은 **담당 병원**(`managedHospitalIds`)에만 접근한다. `operator` 는 전 병원 + 전문의 인증 검수 + 병원 생성 + 담당자 지정.
    - **개인정보 마스킹**: 상담 신청자의 이름·연락처는 **담당 병원의 `hospital_admin` 에게만 전체 값**으로 내려간다.
      `operator` 에게는 마스킹된 값(`박*영`, `010-****-5678`)이 내려가고 `piiMasked: true` 가 함께 온다.
    - **감사 로그**: 담당 병원 관리자가 상담 상세를 열람하면 서버가 열람 기록을 남긴다 (§감사 로그).
    - **페이지네이션**: offset 방식 (`page`, `pageSize`) + `PageMeta`. 화면이 `총 11곳` 처럼 전체 건수를 표시하므로 총계가 필요하다.
    - **에러 본문**: 모든 4xx/5xx 가 `Error` 스키마 하나를 쓴다. `error.message` 는 사용자에게 그대로 보여줄 수 있는 한국어 문구다.

    ## 이 스펙이 고치는 확인된 결함

    | 결함 | 해결 엔드포인트 |
    |---|---|
    | 관리자 화면에 인가가 전혀 없다 | `hospital_admin` / `operator` 역할 + 담당 병원 검사 (모든 `x-role` 오퍼레이션) |
    | 병원 관리자가 남의 병원 전문의를 심사할 수 있다 | 검수를 `operator` 전용으로 (`GET /doctors/verification-queue`, `PUT /doctors/{id}/verification`) |
    | 아무나 병원을 만들 수 있다 | `POST /hospitals` 를 `operator` 전용으로. 입점 문의 심사가 선행 |
    | 운영자가 고객 실명·전화번호를 볼 필요가 없는데 보인다 | 상담 응답의 PII 마스킹 투영 (`piiMasked`) |
    | 사용자가 자기 상담 신청 내역을 볼 수 없다 | `GET /me/consult-requests` |
    | 전문의 지정 상담이 전달되지 않는다 | `POST /consult-requests` 의 `doctorId` |
    | 찜 목록이 브라우저 전역이라 계정 간 유출 | `GET/PUT/DELETE /me/favorites` |
    | 알림이 계정별로 나뉘지 않는다 | `GET /notifications` (토큰 주체로 스코프) |
    | 커뮤니티 답변을 쓸 수 없다 | `POST /community/posts/{postId}/answers` |
    | 전문의 인증 검수 결과가 병원에 통보되지 않는다 | `PUT /doctors/{doctorId}/verification` 의 부수효과 |
    | 상담 마감 병원에 직접 주소로 접수된다 | `POST /consult-requests` → `409 CONSULT_CLOSED` |
    | 카카오 REST 키가 브라우저에 노출된다 | `GET /geo/address-search` (서버 경유) |
  contact:
    name: 몰라몰라 개발팀
    email: dev@molamola.kr
  license:
    name: UNLICENSED

servers:
  - url: https://api.molamola.kr/api/v1
    description: 운영
  - url: https://api-staging.molamola.kr/api/v1
    description: 스테이징
  - url: http://localhost:3000/api/v1
    description: 로컬 (NestJS). `GET /health` 는 이 base URL **밖**이다 (컨테이너 프로브용)

tags:
  - name: auth
    description: 회원가입·로그인·토큰 재발급·내 정보
  - name: procedures
    description: 시술 마스터 데이터 (13종)
  - name: hospitals
    description: 병원 조회·등록·수정
  - name: doctors
    description: 전문의 조회·수정·인증 검수
  - name: consult-requests
    description: 상담 신청 (사용자 접수 / 관리자 처리)
  - name: favorites
    description: 계정별 찜 목록
  - name: notifications
    description: 알림함 (사용자용 / 관리자용)
  - name: community
    description: 커뮤니티 질문·답변
  - name: content
    description: 시술 꿀팁·이벤트(프로모션)·약관 등 편집 콘텐츠
  - name: search
    description: 검색·인기 검색어·추천(광고) 검색어
  - name: geo
    description: 주소 검색 (카카오 로컬 API 서버 프록시)
  - name: support
    description: 병원 입점 문의 (접수 + 운영자 심사)
  - name: operator
    description: 운영자 전용 — 병원 담당자 지정·해제

security: []

paths:
  # =========================================================================
  # auth
  # =========================================================================
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: 회원가입
      description: |
        가입 성공 시 곧바로 로그인 상태가 된다 (액세스/리프레시 토큰을 함께 내려준다).
        현재 화면 동작을 그대로 유지한 것이다 — `docs/features/signup.md`.

        서버가 다듬는 값:
        - `email` — 앞뒤 공백 제거 + 소문자 변환 후 저장·비교
        - `name` — 앞뒤 공백 제거

        현재 프론트엔드가 검사하지 않는 것을 서버가 검사한다: 이메일 형식(RFC 5322 완화형),
        비밀번호 6자 이상. 형식 위반은 `422 VALIDATION_FAILED`, 중복 이메일은 `409 EMAIL_ALREADY_REGISTERED`.
      x-screens: [signup.md]
      x-screen-status: "✅"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: 가입 완료 + 로그인 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '409':
          description: 이미 가입된 이메일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: EMAIL_ALREADY_REGISTERED
                  message: 이미 가입된 이메일이에요
                  requestId: 01J9X8V0Q3
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: 로그인
      description: |
        이메일·비밀번호 중 무엇이 틀렸는지 구분하지 않는다. 두 경우 모두 `401 INVALID_CREDENTIALS` +
        동일 문구(`이메일 또는 비밀번호가 올바르지 않아요`)를 반환한다. 계정 존재 여부가 새는 것을 막기 위한 것이고,
        현재 화면 문구와도 일치한다 — `docs/features/login.md`.
      x-screens: [login.md, mypage.md]
      x-screen-status: "✅"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: 이메일 또는 비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: 이메일 또는 비밀번호가 올바르지 않아요
                  requestId: 01J9X8V0Q3
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      operationId: refreshTokens
      tags: [auth]
      summary: 액세스 토큰 재발급
      description: |
        리프레시 토큰을 **본문으로** 받는다. 쿠키를 쓰지 않으므로 Flutter 앱도 같은 흐름을 쓴다.

        회전(rotation)한다: 호출마다 새 리프레시 토큰을 발급하고 기존 것을 폐기한다.
        폐기된 토큰이 다시 오면 그 계정의 리프레시 토큰 계열 전체를 무효화하고 `401 REFRESH_TOKEN_REUSED` 를 반환한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 재발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: 리프레시 토큰이 유효하지 않거나 폐기됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      summary: 로그아웃
      description: 전달한 리프레시 토큰을 폐기한다. 액세스 토큰은 만료까지 유효하므로 클라이언트가 즉시 폐기한다.
      x-screens: [mypage.md]
      x-screen-status: "✅"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '204':
          description: 로그아웃 완료
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: 내 정보
      description: |
        앱 부팅 시 세션 복원용. `role` 과 `managedHospitalIds` 가 여기서 온다 —
        관리자 화면 진입 가드가 클라이언트 추측이 아니라 이 응답을 근거로 동작해야 한다.

        화면 분기에 그대로 쓸 수 있다:
        - `role=operator` → `/admin/specialists`, `/admin/hospital/new` 노출, `/admin` 은 전 병원
        - `role=hospital_admin` → 위 두 화면 숨김, `/admin` 은 `managedHospitalIds` 만
        - `role=user` → 마이페이지의 `병원 담당자이신가요? 관리자 페이지` 링크 자체를 숨긴다
          (지금은 로그인 여부와 무관하게 노출되어 우연히 들어가는 것이 가능하다)

        `managedHospitalIds` 를 JWT 클레임에 넣지 않는 이유: 담당 병원이 바뀌었을 때 토큰이 만료될 때까지
        낡은 값이 살아 있게 된다. 토큰에는 `sub` 와 `role` 만 넣고, 담당 검사는 서버가 매 요청
        `hospital_admins` 조회로 판단한다. `role` 자체는 승격·해제 시 리프레시 토큰을 폐기해 즉시 반영한다.
      x-screens: [mypage.md, admin-home.md]
      x-screen-status: "✅"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 현재 로그인한 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/social/{provider}:
    post:
      operationId: logInWithSocialProvider
      tags: [auth]
      summary: 간편 로그인 (구글·카카오)
      description: |
        🚧 **아직 화면이 버튼만 있는 상태다** (`준비중이에요` 알림창). 엔드포인트를 미리 설계해 둔다.

        클라이언트가 provider SDK 로 받은 인가 코드를 넘기고, 서버가 provider 에 교환 요청한 뒤
        이메일 기준으로 기존 계정과 연결하거나 새 계정을 만든다. 같은 이메일이 다른 provider 로
        이미 가입돼 있으면 `409 PROVIDER_MISMATCH` — 계정 탈취 경로를 막기 위해 자동 병합하지 않는다.
      x-screens: [login.md]
      x-screen-status: "🚧"
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, kakao]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorizationCode, redirectUri]
              properties:
                authorizationCode:
                  type: string
                redirectUri:
                  type: string
                  format: uri
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '409':
          description: 같은 이메일이 다른 방식으로 이미 가입됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: provider 응답 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =========================================================================
  # procedures
  # =========================================================================
  /procedures:
    get:
      operationId: listProcedures
      tags: [procedures]
      summary: 시술 목록 (13종)
      description: |
        홈의 `시술로 찾기` 격자, 병원 탐색의 시술 칩, 커뮤니티 질문 작성의 시술 선택,
        상담 신청의 희망 시술이 **모두 이 하나의 목록**을 쓴다 (화면 문서 3곳이 명시적으로 같은 목록이라고 못박고 있다).

        정렬 순서는 서버가 고정한다: `implant → orthodontics → laminate → inlay → crown → whitening →
        wisdom-tooth → cavity → gum-disease → splint → snoring-device → tmj → botox`.
        병원 탐색의 `추천`·`기타` 칩은 시술이 아니라 특수 탭이므로 여기 포함되지 않는다.

        거의 변하지 않는 마스터 데이터라 `Cache-Control: public, max-age=3600` + ETag 를 붙인다.
      x-screens: [home.md, explore.md, community-new.md, consult-request.md, tip-detail.md]
      x-screen-status: "✅"
      responses:
        '200':
          description: 시술 목록
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Procedure'

  # =========================================================================
  # hospitals
  # =========================================================================
  /hospitals:
    get:
      operationId: listHospitals
      tags: [hospitals]
      summary: 병원 목록 (필터·정렬·페이지네이션)
      description: |
        병원 탐색 화면의 **필터·정렬 전체가 이 엔드포인트 하나로 표현된다.**
        `docs/features/explore.md` 의 모드 2 / 시술 칩 15 / 정렬 3 / 조건 칩 5 / 지도 반경 4 대응:

        | 화면 요소 | 파라미터 |
        |---|---|
        | 모드 `병원` | 이 엔드포인트 (모드 `의사` 는 `GET /doctors`) |
        | 시술 칩 `추천` | `recommended=true` |
        | 시술 칩 13개 | `procedureId=implant` |
        | 시술 칩 `기타` (= 전체) | 아무 것도 안 보냄 |
        | 정렬 `인기순` | `sort=rating` (기본값) |
        | 정렬 `후기순` | `sort=reviewCount` |
        | 정렬 `상담많은순` | `sort=consultCount` |
        | 조건 `상담가능` | `consultAvailable=true` |
        | 조건 `원데이` | `oneDay=true` |
        | 조건 `전문의` | `hasVerifiedSpecialist=true` |
        | 조건 `진료시간` (실제로는 야간상담) | `nightConsult=true` |
        | 조건 `경력` | `minDoctorYearsOfExperience=10` |
        | 지도 반경 500m/1km/3km/5km | `latitude` + `longitude` + `radiusKm` |
        | 보기 `리스트`/`지도`/`가격 비교표` | 순수 클라이언트 표현. 파라미터 없음 |

        **스폰서(광고) 노출 순서는 서버가 계산해서 이미 정렬된 배열로 내려준다.** 클라이언트가 다시 정렬하면 안 된다.
        규칙(`frontend/src/utils/sponsorship.ts` 의 현재 규칙을 그대로 옮긴 것):

        1. `procedureId` 지정 시: 광고 기간 중 && `sponsoredCategories` 에 그 시술 포함 && `rating >= 3.5`
        2. `recommended=true` 시: 광고 기간 중 && `rating >= 3.5`
        3. 위 대상들을 `sponsoredRank` 오름차순으로 맨 앞에 배치, 나머지는 `sort` 기준
        4. **필터가 없을 때(`기타`)는 광고 우선 노출을 적용하지 않는다**

        `광고` 배지 조건과 상단 노출 조건은 다르다. 배지는 `sponsorship.isActive`(기간만),
        상단 노출은 `sponsorship.isPlacementEligible`(기간 + 평점 3.5 + 카테고리). 두 값을 각각 내려준다 —
        클라이언트가 오늘 날짜로 기간을 계산하면 기기 시계가 틀린 사용자에게 광고가 잘못 노출된다.

        `sponsoredRank` / `sponsoredStartDate` / `sponsoredEndDate` 원본 필드도 함께 유지한다
        (기존 `Hospital` 타입 보존). 다만 정렬 판단에는 `sponsorship` 계산 필드를 쓴다.
      x-screens: [explore.md, home.md, mypage.md, tip-detail.md, admin-home.md]
      x-screen-status: "✅ 🟡"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: procedureId
          in: query
          description: 이 시술을 취급하는 병원만. 병원 탐색의 시술 칩 13개.
          schema:
            $ref: '#/components/schemas/ProcedureId'
        - name: recommended
          in: query
          description: 운영자가 추천으로 표시한 병원만. 시술 칩 `추천`.
          schema:
            type: boolean
        - name: consultAvailable
          in: query
          description: 조건 칩 `상담가능`.
          schema:
            type: boolean
        - name: oneDay
          in: query
          description: 조건 칩 `원데이` (당일 보철 가능).
          schema:
            type: boolean
        - name: hasVerifiedSpecialist
          in: query
          description: |
            조건 칩 `전문의`. 인증 완료(`approved`)이고 `일반의` 가 아닌 전문의가 1명 이상 있는 병원만.
            병원↔전문의 조인이 필요해 클라이언트에서 처리할 수 없다.
          schema:
            type: boolean
        - name: nightConsult
          in: query
          description: 조건 칩 `진료시간`. 이름과 달리 실제로는 야간상담 가능 여부다 (`features.nightConsult`).
          schema:
            type: boolean
        - name: minDoctorYearsOfExperience
          in: query
          description: 조건 칩 `경력`. 이 연차 이상인 전문의가 1명 이상 있는 병원만. 화면은 항상 `10` 을 보낸다.
          schema:
            type: integer
            minimum: 0
        - name: sort
          in: query
          description: |
            전부 내림차순이다. `rating` 이 화면의 `인기순` — 별도 인기 지표가 없어 평점을 쓴다.
          schema:
            type: string
            enum: [rating, reviewCount, consultCount]
            default: rating
        - name: latitude
          in: query
          description: 지도 보기의 기준 위도. `longitude`·`radiusKm` 와 함께 보내야 한다.
          schema:
            type: number
            format: double
        - name: longitude
          in: query
          schema:
            type: number
            format: double
        - name: radiusKm
          in: query
          description: 지도 반경 버튼 (`500m`=0.5, `1km`, `3km` 기본, `5km`).
          schema:
            type: number
            format: double
            enum: [0.5, 1, 3, 5]
        - name: q
          in: query
          description: |
            병원명 부분 일치. 관리자 홈의 병원 목록 검색(🚧)과 검색 화면이 쓴다.
            대소문자를 구분하지 않고 공백을 정규화한다.
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: |
            조건에 맞는 병원. 스폰서 우선 노출이 이미 적용된 순서다.
            `meta.totalItems` 가 화면의 `총 N곳` 이다.
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Hospital'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      operationId: createHospital
      tags: [hospitals]
      summary: 병원 등록
      description: |
        `/admin/hospital/new` 의 `등록하기`. **`operator` 전용이다.**

        아무나 병원을 만들 수 있으면 안 된다 — 병원 정보는 환자가 시술을 결정하는 근거이므로
        검증 없이 생성되면 안 된다 (`docs/decisions/0001-roles-and-pii.md` 결정 2).
        입점 흐름은 이렇게 된다:

        ```
        POST /partner-inquiries (병원이 문의)
          → GET /partner-inquiries (운영자 심사)
          → POST /hospitals (운영자가 병원 생성)
          → POST /hospitals/{id}/admins (운영자가 담당자 지정)
        ```

        **등록자가 자동으로 담당자가 되는 설계는 폐기했다.** 운영자는 병원을 만들 뿐 담당자가 아니다.
        담당자 지정은 별도 오퍼레이션이며, `adminEmails` 를 함께 보내 한 번에 처리할 수도 있다.

        서버가 정하는 값 (요청으로 넘길 수 없다):
        `id`, `rating=0`, `reviewCount=0`, `consultCount=0`, 광고 관련 필드 전부(`isSponsored=false`,
        `sponsoredCategories=[]`, `sponsoredRank=null`, `sponsoredStartDate=null`, `sponsoredEndDate=null`).

        **`isRecommended`(에디터 추천)는 `operator` 만 설정할 수 있다.** 현재 폼에는 병원 관리자가 직접
        체크할 수 있는 `추천 병원으로 노출 (에디터 추천)` 체크박스가 있는데, 에디터 추천을 병원이
        스스로 켜는 것은 신뢰 문제다. 역할이 셋으로 갈리면서 이 항목의 주인이 명확해졌다 —
        `operator` 요청에서는 받고, `PATCH /hospitals/{id}` 의 `hospital_admin` 요청에서는 거절한다.

        `businessHours` 를 생략하면 서버가 기본 스케줄을 넣는다 (월~금 `09:30 - 18:30`, 토 `09:30 - 14:00`, 일 휴진).
        `thumbnail` 을 생략하면 서버가 기본 이미지 URL 을 넣는다.
      x-screens: [admin-hospital-new.md]
      x-screen-status: "✅"
      x-role: operator
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HospitalCreateRequest'
      responses:
        '201':
          description: 등록된 병원
          headers:
            Location:
              schema:
                type: string
                example: /v1/hospitals/h12
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hospital'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /hospitals/{hospitalId}:
    parameters:
