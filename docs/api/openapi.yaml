  # =========================================================================
  # notifications
  # =========================================================================
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: 알림 목록
      description: |
        `audience` 로 사용자용/관리자용을 나눈다. 화면 문서가 두 알림함을 명확히 분리하고 있고
        (`/notifications` vs `/admin/notifications`), 프론트엔드 캐시 키도
        `queryKeys.notifications.byAudience(audience)` 로 나뉘어 있다. 파라미터로 두면 그 캐시 단위와 그대로 맞는다.

        **`audience` 는 역할이 아니라 알림함(mailbox)이다.** 역할은 셋(`user`/`hospital_admin`/`operator`)이지만
        알림함은 둘이다 — 화면이 `/notifications` 와 `/admin/notifications` 두 개뿐이기 때문이다.

        **수신자 스코프:**
        - `audience=user` → 토큰 주체 **본인에게 발송된** 알림만. **세 역할 모두 호출할 수 있다.**
          병원 담당자도 개인으로서 상담을 신청하므로 본인 알림함이 필요하다.
        - `audience=admin` → **`hospital_admin` 또는 `operator` 필수.** 요청자를 수신자로 지정한 알림만.
          `user` 가 호출하면 `403 FORBIDDEN` (관리자 알림 문구에 고객 이름이 들어 있다).

        `hospital_admin` 의 `audience=admin` 목록은 **담당 병원에 들어온 알림**이다. 담당 병원이 여러 개면
        합쳐서 보인다. `operator` 는 현재 어떤 알림도 운영자를 수신자로 지정하지 않으므로 **빈 목록**이 정상이다
        (새 상담 알림과 검수 결과 알림 둘 다 담당자에게만 간다). 운영자용 알림이 필요해지면
        수신자 지정만 추가하면 되고 이 계약은 바뀌지 않는다.

        지금은 로그인하지 않아도 `/notifications` 주소로 알림 목록이 보인다. 이 엔드포인트는 인증을 요구한다.

        최신순. 알림을 생성하는 공개 엔드포인트는 **없다** — 알림은 상담 접수·상태 변경·인증 검수의
        부수효과로만 생긴다. 프론트엔드의 `notifyUser`/`notifyAdmin` 헬퍼는 서버로 이동해 사라진다.
      x-screens: [notifications.md, admin-notifications.md, mypage.md, admin-home.md]
      x-screen-status: "✅ 🟡"
      security:
        - bearerAuth: []
      parameters:
        - name: audience
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/NotificationAudience'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: isRead
          in: query
          description: 읽음/안읽음 필터. 현재 화면에는 없다 (🚧 대비).
          schema:
            type: boolean
        - name: type
          in: query
          description: 종류별 필터. 현재 화면에는 없다 (🚧 대비).
          schema:
            $ref: '#/components/schemas/NotificationType'
      responses:
        '200':
          description: 알림 목록
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [items, meta, unreadCount]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppNotification'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  unreadCount:
                    type: integer
                    description: 이 `audience` 의 안 읽은 총 개수. 페이지네이션과 무관한 전체 값이다.
                    example: 1
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [notifications]
      summary: 안 읽은 알림 개수
      description: |
        마이페이지 `🔔 알림함` 줄의 빨간 배지, 넓은 화면 상단 `🔔`, 관리자 홈의 종 배지가 이 값을 쓴다.
        세 곳이 같은 숫자를 보여야 한다고 화면 문서가 명시한다.

        목록과 분리한 이유: 배지는 거의 모든 화면에서 필요하고, 그때마다 알림 목록 전체를 받아오는 것은 낭비다.
        관리자 알림 내용에는 고객 이름이 들어 있어서(`김민준님이 상담을 신청했어요`) 배지 하나 때문에
        개인정보를 받아오는 것도 피해야 한다.
      x-screens: [mypage.md, admin-home.md, notifications.md, admin-notifications.md]
      x-screen-status: "✅"
      security:
        - bearerAuth: []
      parameters:
        - name: audience
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/NotificationAudience'
      responses:
        '200':
          description: 안 읽은 개수
          content:
            application/json:
              schema:
                type: object
                required: [audience, unreadCount]
                properties:
                  audience:
                    $ref: '#/components/schemas/NotificationAudience'
                  unreadCount:
                    type: integer
                    example: 2
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: markNotificationAsRead
      tags: [notifications]
      summary: 알림 하나 읽음 처리
      description: |
        멱등이다. 이미 읽은 알림에 다시 호출해도 `200` 이고 상태는 그대로다.
        읽음을 되돌리는(안 읽음으로 바꾸는) 엔드포인트는 없다 — 화면에도 그 기능이 없다.
        본인/본인 관리 병원에게 온 알림이 아니면 `404`.
      x-screens: [notifications.md, admin-notifications.md]
      x-screen-status: "✅"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 읽음 처리된 알림
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppNotification'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: 알림 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /notifications/read-all:
    post:
      operationId: markAllNotificationsAsRead
      tags: [notifications]
      summary: 모두 읽음
      description: |
        `audience` 를 **필수**로 받는다. `모두 읽음` 은 사용자 알림만, 또는 관리자 알림만 처리해야 하고
        반대쪽 알림함의 안 읽은 표시는 그대로 남아야 한다 (화면 문서가 양쪽 모두 명시).
        `audience` 를 생략하면 그 규칙이 우연히 깨질 수 있으므로 필수로 둔다.
      x-screens: [notifications.md, admin-notifications.md]
      x-screen-status: "✅"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience]
              properties:
                audience:
                  $ref: '#/components/schemas/NotificationAudience'
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                type: object
                required: [audience, markedCount, unreadCount]
                properties:
                  audience:
                    $ref: '#/components/schemas/NotificationAudience'
                  markedCount:
                    type: integer
                    description: 이번 호출로 읽음이 된 개수
                    example: 2
                  unreadCount:
                    type: integer
                    description: 처리 후 남은 안 읽은 개수. 항상 0 이다.
                    example: 0
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  # =========================================================================
  # community
  # =========================================================================
  /community/posts:
    get:
      operationId: listCommunityPosts
      tags: [community]
      summary: 커뮤니티 질문 목록
      description: |
        최신순. 목록 카드에 `답변 N`·`조회 N` 이 필요하므로 `answerCount` 와 `viewCount` 를 함께 내려주고,
        `answers` 배열 자체는 목록에서 제외한다 (목록 카드가 답변 본문을 쓰지 않는다).

        `procedureId` 필터·`sort`·`q` 는 현재 화면에 없다 (🚧 — "검색창, 필터 칩, 정렬 버튼이 하나도 없습니다").
        앞으로 만들 것이라 파라미터를 함께 설계해 두었고, 지금 프론트엔드는 보내지 않는다.

        페이지네이션은 처음부터 넣는다. 현재는 "글이 많아지면 한 번에 다 그려집니다" 상태다.
      x-screens: [community.md]
      x-screen-status: "🟡"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: procedureId
          in: query
          description: 시술별 필터 (🚧 대비).
          schema:
            $ref: '#/components/schemas/ProcedureId'
        - name: sort
          in: query
          description: '`createdAt` = 최신순(기본, 현재 동작). 나머지는 🚧 대비.'
          schema:
            type: string
            enum: [createdAt, viewCount, answerCount]
            default: createdAt
        - name: q
          in: query
          description: 제목·본문 부분 일치 (🚧 대비).
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: 질문 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/QAPostSummary'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
    post:
      operationId: createCommunityPost
      tags: [community]
      summary: 질문 등록
      description: |
        **로그인을 요구한다.** 지금은 비로그인으로도 등록되고 작성자가 항상 `익명` 으로 저장되어,
        "내가 쓴 질문" 을 골라낼 방법이 없다.

        `authorName` 을 요청으로 받지 않는다. 서버가 토큰 주체에서 정한다:
        - `isAnonymous: true` (기본값) → `authorName` 을 `익명` 으로 저장하고 `authorId` 는 내부에만 남긴다.
          현재 화면 표시와 동일하되, 본인 글 식별과 신고 대응이 가능해진다.
        - `isAnonymous: false` → 계정 이름을 표시한다.

        기본값을 `true` 로 둔 이유: 지금 올라간 글이 모두 `익명` 이라, 기본을 실명으로 바꾸면
        같은 목록에서 표시 규칙이 갑자기 갈린다. 어느 쪽을 기본으로 할지는 제품 판단이며
        `docs/api/README.md` 의 미결 사항에 올려 두었다.

        `createdAt` 은 날짜만 저장한다 (`YYYY-MM-DD`). 기존 동작·기존 데이터와 맞추기 위한 것이고,
        시각까지 저장해야 한다면 마이그레이션이 필요하다.
      x-screens: [community-new.md, community.md]
      x-screen-status: "✅"
      x-role: user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QAPostCreateRequest'
      responses:
        '201':
          description: 등록된 질문
          headers:
            Location:
              schema:
                type: string
                example: /v1/community/posts/q5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAPost'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /community/posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      operationId: getCommunityPost
      tags: [community]
      summary: 질문 상세 (답변 포함)
      description: |
        답변은 이 응답에 포함된다 (`answers`). 별도 엔드포인트로 나누지 않은 이유:
        답변 수가 한 자릿수이고, 상세 화면이 항상 본문과 함께 그린다. 프론트엔드의
        `queryKeys.communityPosts.detail(id)` 캐시 단위와도 일치한다.

        **조회수는 이 GET 이 올리지 않는다.** `POST /community/posts/{postId}/views` 를 따로 호출해야 한다.
        GET 이 상태를 바꾸면 캐시·프리페치·재시도가 모두 조회수를 부풀린다.
      x-screens: [community-post.md]
      x-screen-status: "🟡"
      responses:
        '200':
          description: 질문 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAPost'
        '404':
          description: 질문 없음 (화면 문구 `질문을 찾을 수 없어요`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: POST_NOT_FOUND
                  message: 질문을 찾을 수 없어요
                  requestId: 01J9X8V0Q3

  /community/posts/{postId}/views:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      operationId: recordPostView
      tags: [community]
      summary: 조회수 집계
      description: |
        인증이 필요하지 않다 (비로그인도 글을 읽는다).

        **중복 집계 방침이 현재 동작과 다르다.** 지금은 상세 화면을 열 때마다 무조건 1 오르고,
        같은 사람이 다시 봐도 계속 증가해서 실제 조회 수와 무관한 값이 된다.
        서버는 (로그인 사용자 id 또는 요청자 지문) × 글 id 조합으로 **24시간 중복을 제거**한다.
        중복이면 `viewCounted: false` 와 현재 값만 반환한다.

        동작 변경이므로 `docs/api/README.md` 의 미결 사항에 올려 두었다.
      x-screens: [community-post.md, community.md]
      x-screen-status: "✅"
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: 집계 결과
          content:
            application/json:
              schema:
                type: object
                required: [postId, viewCount, viewCounted]
                properties:
                  postId:
                    type: string
                  viewCount:
                    type: integer
                    example: 313
                  viewCounted:
                    type: boolean
                    description: 이번 호출로 실제로 1 올랐는지. 24시간 내 중복이면 false.
        '404':
          $ref: '#/components/responses/PostNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /community/posts/{postId}/answers:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      operationId: createCommunityAnswer
      tags: [community]
      summary: 답변 작성
      description: |
        **지금 앱 어디에도 답변을 쓸 화면이 없다.** 답변은 샘플 데이터에만 있고, 새로 쓴 질문은
        영구히 `아직 답변이 없어요` 로 남는다. 이 엔드포인트가 그 결함의 해결책이다.

        **`isDentist` 를 요청으로 받지 않는다.** 서버가 작성자의 인증 상태에서 유도한다 —
        작성자가 어느 병원의 `verificationStatus=approved` 전문의로 연결된 계정이면 `true`.
        `치과의사 답변` 배지는 신뢰 표시라서 클라이언트가 정할 수 있으면 안 된다.
        지금은 배지가 샘플 데이터의 플래그일 뿐 실제 인증과 연결되어 있지 않다.

        `authorName` 도 서버가 정한다. 답변은 익명을 허용하지 않는다 — 의료 정보에 답하는 주체는
        드러나야 한다는 판단이며, 이것도 미결 사항에 올려 두었다.
      x-screens: [community-post.md, community.md]
      x-screen-status: "🚧"
      x-role: user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        '201':
          description: 작성된 답변
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAAnswer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/PostNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  # =========================================================================
  # content
  # =========================================================================
  /guides:
    get:
      operationId: listGuides
      tags: [content]
      summary: 시술 꿀팁 목록
      description: |
        홈의 `이런 꿀팁 어때요?` 영역 (8건, 좌우 스크롤). 이 영역에는 `전체보기` 가 없어서
        현재 화면 기준으로는 전량 조회 하나로 충분하지만, 편집 콘텐츠가 늘어날 것이므로 페이지네이션을 둔다.

        목록에는 본문(`content`)을 담지 않는다. 홈 카드가 쓰지 않는 긴 텍스트다.
      x-screens: [home.md, tip-detail.md]
      x-screen-status: "🟡"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: procedureId
          in: query
          schema:
            $ref: '#/components/schemas/ProcedureId'
      responses:
        '200':
          description: 꿀팁 목록
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/GuideSummary'
                  meta:
                    $ref: '#/components/schemas/PageMeta'

  /guides/{guideId}:
    parameters:
      - name: guideId
        in: path
        required: true
        schema:
          type: string
        example: g1
    get:
      operationId: getGuide
      tags: [content]
      summary: 시술 꿀팁 상세
      description: |
        `content` 는 빈 줄(`\n\n`)로 문단을 나눈 평문이다. 제목·목록·표·이미지 서식은 지원하지 않는다 —
        화면이 문단 단위로만 그린다.

        `relatedHospitalIds` 는 id 배열이고, 카드에 필요한 병원 데이터는 `GET /hospitals/{id}` 로 받는다.
        병원 객체를 여기 임베드하면 병원 정보가 바뀔 때 꿀팁 캐시까지 깨야 한다.
        연결된 병원이 삭제됐으면 그 id 는 응답에서 빠진다 (화면의 "그 카드만 조용히 빠집니다" 와 동일).

        꿀팁을 쓰거나 고치는 엔드포인트는 없다. 화면에도, 관리자 화면에도 그 기능이 없다.
      x-screens: [tip-detail.md]
      x-screen-status: "🟡"
      responses:
        '200':
          description: 꿀팁 상세
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideContent'
        '404':
          description: 꿀팁 없음 (화면 문구 `꿀팁 정보를 찾을 수 없어요`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: GUIDE_NOT_FOUND
                  message: 꿀팁 정보를 찾을 수 없어요
                  requestId: 01J9X8V0Q3

  /promotions:
    get:
      operationId: listPromotions
      tags: [content]
      summary: 이벤트(할인) 목록
      description: |
        네 화면이 같은 데이터를 쓴다: 홈의 `지금 진행중인 이벤트`, 이벤트 목록 화면,
        병원 카드의 `🔥` 배지·할인가(홈·탐색·찜 목록), 병원 상세의 `진행중인 이벤트` 영역.

        `hospitalId` 로 걸러 병원 상세용 단건 조회를 할 수 있고, 파라미터 없이 부르면 전량이 온다
        (카드 배지용으로 한 번 받아 두는 용도).

        **할인율은 서버가 계산해 `discountRate` 로 내려준다.** 지금은 화면마다 원가·할인가로 다시 계산한다.
        네 화면이 같은 숫자를 보여야 하므로 계산을 한 곳에 둔다.

        `startsAt`/`endsAt` 을 `nullable` 로 넣어 두었다. **현재 데이터에는 기간 정보가 아예 없다** —
        이벤트 화면이 `기간 한정 할인 혜택을 확인해보세요` 라고 안내하는데 남은 기간·마감일이 표시되지 않는
        원인이다. 기간이 채워지면 `activeOnly=true` 로 진행중인 것만 받을 수 있다.
      x-screens: [home.md, events.md, hospital-detail.md, explore.md, mypage.md]
      x-screen-status: "🟡"
      parameters:
        - name: hospitalId
          in: query
          schema:
            type: string
        - name: procedureId
          in: query
          schema:
            $ref: '#/components/schemas/ProcedureId'
        - name: activeOnly
          in: query
          description: |
            기간 안에 있는 이벤트만. `startsAt`/`endsAt` 이 둘 다 `null` 인 이벤트는 "기간 무제한" 으로 보아 포함된다.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: |
            이벤트 목록. **한 병원에 이벤트가 여러 개일 수 있다.** 병원 카드는 하나만 붙이는데
            현재 샘플에 겹친 경우가 없어 규칙이 정해지지 않았다 (`docs/features/events.md` 의 "확인 필요").
            서버는 병원별로 `startsAt` 최신순 → `id` 순으로 정렬해 첫 번째가 대표가 되도록 안정적인 순서를 보장한다.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Promotion'

  /legal-documents/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          enum: [terms, privacy, location, about]
    get:
      operationId: getLegalDocument
      tags: [content]
      summary: 약관·정책·소개 문서
      description: |
        🚧 **네 화면 모두 지금 `준비중입니다` 한 줄뿐이고, 약관 전문이 이 저장소 어디에도 없다.**

        서버에서 내려주는 것으로 설계한 이유: 약관은 개정 이력과 시행일이 있어야 하고,
        회원가입 시 "어떤 버전에 동의했는지" 를 기록하려면 버전이 서버에 있어야 한다.
        클라이언트 정적 파일로 두면 앱 배포와 약관 개정이 묶인다 (Flutter 앱이 붙으면 더 심해진다).

        `content` 는 마크다운이다. 회원가입 동의 절차 자체는 아직 없다 — 미결 사항에 올려 두었다.
      x-screens: [legal-terms.md, legal-privacy.md, legal-location.md, about.md, home.md]
      x-screen-status: "🚧"
      responses:
        '200':
          description: 문서
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocument'
        '404':
          description: 아직 등록되지 않은 문서
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /partner-inquiries:
    post:
      operationId: createPartnerInquiry
      tags: [support]
      summary: 병원 입점 문의 접수
      description: |
        🚧 **화면에 입력칸도 제출 버튼도 없다** (`문의 폼은 준비중입니다`). 이 엔드포인트가 그 폼의 상대편이다.

        인증이 필요하지 않다 (아직 계정이 없는 병원이 문의한다). 그래서 스팸에 노출되므로
        IP 당 분당 3회로 제한하고 `429` 를 반환한다.

        **이것이 병원 입점 흐름의 시작점이다** (`docs/decisions/0001-roles-and-pii.md` 결정 2):

        ```
        POST /partner-inquiries        (병원이 문의)
          → GET /partner-inquiries     (운영자가 목록 확인)
          → PATCH /partner-inquiries/{id}  (심사 결과 기록)
          → POST /hospitals            (운영자가 병원 생성)
          → POST /hospitals/{id}/admins  (운영자가 담당자 지정)
        ```

        접수 응답에 `id` 를 주지만 **제출자가 진행 상황을 조회할 경로는 없다.** 문의자는 계정이 없어
        인증할 수단이 없고, `id` 만으로 조회를 열면 남의 문의(병원명·담당자명·연락처)를 열거할 수 있다.
        진행 안내는 운영자가 별도 수단(전화·메일)으로 한다 — 미결 사항이다.
      x-screens: [partner-inquiry.md, home.md]
      x-screen-status: "🚧"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerInquiryCreateRequest'
      responses:
        '202':
          description: 접수됨
          content:
            application/json:
              schema:
                type: object
                required: [id, receivedAt]
                properties:
                  id:
                    type: string
                  receivedAt:
                    type: string
                    format: date-time
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: listPartnerInquiries
      tags: [support]
      summary: 입점 문의 목록 (운영자 심사)
      description: |
        **`operator` 전용.** 초안에서 "제출된 문의를 어디서 볼 것인가" 를 미결로 남겼던 것의 답이다.
        입점 심사가 병원 생성의 전제가 되면서 조회 경로가 필수가 됐다.

        문의에는 병원명·담당자 실명·연락처가 들어 있다. 상담 신청자 PII 와 같은 급으로 다룬다:
        `Cache-Control: no-store`, `operator` 전용, 열람 로그 대상.

        접수 최신순. 대응 화면은 아직 없다 (🚧) — 운영자 콘솔이 필요하다.
      x-screens: [partner-inquiry.md]
      x-screen-status: "🚧"
      x-role: operator
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PartnerInquiryStatus'
      responses:
        '200':
          description: 문의 목록
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartnerInquiry'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /partner-inquiries/{inquiryId}:
    parameters:
      - name: inquiryId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPartnerInquiry
      tags: [support]
      summary: 입점 문의 상세
      description: |
        **`operator` 전용.** 열람 로그 대상 (담당자 실명·연락처를 담는다).
      x-screens: [partner-inquiry.md]
      x-screen-status: "🚧"
      x-role: operator
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 문의 상세
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            X-Audit-Logged:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerInquiry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PartnerInquiryNotFound'
    patch:
      operationId: reviewPartnerInquiry
      tags: [support]
      summary: 입점 문의 심사 결과 기록
      description: |
        **`operator` 전용.** 심사 진행 상태와 메모를 남긴다.

        상태 전이: `received → reviewing → approved | rejected`.
        `approved`/`rejected` 에서 되돌아갈 수 없다 (`422 INVALID_INQUIRY_STATUS_TRANSITION`) —
        심사 결과가 왔다 갔다 하면 감사 기록의 의미가 없어진다.

        **`approved` 로 바꾸는 것이 병원을 만들지는 않는다.** 병원 생성(`POST /hospitals`)은 별도 오퍼레이션이다.
        문의 본문의 항목(병원명·지역만)으로는 병원 등록 필수 항목(주소·좌표·가격대·취급 시술)을 채울 수 없어서,
        승인이 곧 생성이 되게 만들면 반쪽짜리 병원 레코드가 생긴다.
        대신 `linkedHospitalId` 를 기록해 문의와 생성된 병원을 잇는다.

        `rejected` 는 `reviewNote` 가 필수다 (1자 이상). 사유 없는 반려를 남기지 않게 한다 —
        전문의 검수의 `rejectionReason` 과 같은 규칙이다.
      x-screens: [partner-inquiry.md]
      x-screen-status: "🚧"
      x-role: operator
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/PartnerInquiryStatus'
                reviewNote:
                  type: string
                  maxLength: 1000
                  description: '`status=rejected` 일 때 필수.'
                linkedHospitalId:
                  type: string
                  description: 이 문의로 만들어진 병원 id. `approved` 이후 연결용.
      responses:
        '200':
          description: 갱신된 문의
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerInquiry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PartnerInquiryNotFound'
        '422':
          description: 허용되지 않는 상태 전이 또는 `reviewNote` 누락
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_INQUIRY_STATUS_TRANSITION
                  message: 이미 심사가 끝난 문의예요
                  requestId: 01J9X8V0Q3

  # =========================================================================
  # search
  # =========================================================================
  /search:
    get:
      operationId: search
      tags: [search]
      summary: 통합 검색 (결과 목록)
      description: |
        시술·병원·전문의를 한 번에 찾아 **종류별로 묶어** 반환한다.

        현재 검색 화면은 결과 목록을 만들지 않고 일치하는 하나로 이동시킨다. 그 동작은
        `GET /search/resolve` 가 담당한다. 이 엔드포인트는 "여러 결과를 나란히 보여주는 검색 결과 화면이
        필요하면 새로 만들어야 합니다" 라고 화면 문서가 적어 둔 그 화면을 위한 것이다.
        지금 프론트엔드는 이걸 호출하지 않아도 된다.

        매칭 규칙은 `resolve` 와 동일하다 (아래 참고).
      x-screens: [search.md]
      x-screen-status: "🚧"
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: type
          in: query
          description: 특정 종류만 받고 싶을 때. 생략하면 세 종류 모두.
          schema:
            type: string
            enum: [procedure, hospital, doctor]
        - name: limit
          in: query
          description: 종류별 최대 개수.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 종류별 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /search/resolve:
    get:
      operationId: resolveSearch
      tags: [search]
      summary: 검색어를 이동 대상 하나로 해석
      description: |
        **현재 검색 화면의 동작을 그대로 서버로 옮긴 것이다.** 입력한 글자와 맞는 것 하나를 찾아
        어디로 보낼지 알려준다.

        우선순위 (먼저 맞으면 멈춘다):
        1. **시술 이름** — 병원 탐색으로 (`kind=procedure`, 그 시술 탭 선택 상태)
        2. **병원 이름** — 그 병원 상세로 (`kind=hospital`)
        3. **전문의 이름** — `kind=doctor`

        매칭 방식도 현재와 같다: 입력한 글자가 이름 **안에 포함**되어야 한다
        (`임플` → `임플란트` ✅, `임플란트 가격` ❌). 전문의만 예외로, 이름 뒤에 직함이 붙은 경우
        (`김민준 원장`)도 찾는다.

        같은 글자가 여러 곳에 걸리면 시술이 이긴다 — `라미네이트` 는 시술과 병원명
        (`더화이트 라미네이트클리닉`)에 모두 있지만 병원 탐색으로 간다.

        **현재 동작과 다르게 만든 한 가지:** 전문의 매칭 결과가 `kind=doctor` + `doctorId` 다.
        지금 화면은 전문의를 찾고도 소속 병원 상세로 보낸다 — 전문의 상세 화면(`/doctor/:id`)이 있는데도
        쓰지 않는 확인된 결함이다. 서버는 전문의를 가리키고, 어디로 보낼지는 클라이언트가 정한다.
        `hospitalId` 도 함께 주므로 현재 동작(병원으로 보내기)을 유지하는 것도 가능하다.

        일치하는 것이 없으면 `200` + `target: null` 이다. 404 가 아닌 이유: "검색 결과가 없다" 는
        정상적인 검색 결과이고, 화면은 회색 안내 상자를 보여줄 뿐 에러 처리를 하지 않는다.
      x-screens: [search.md, home.md]
      x-screen-status: "✅ 🟡"
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: |
            해석 결과. `target` 이 `null` 이면 화면이
            `"OO"에 대한 검색 결과가 없어요. 아래 인기 검색어를 살펴보세요` 를 보여준다.
          content:
            application/json:
              schema:
                type: object
                required: [query, target]
                properties:
                  query:
                    type: string
                  target:
                    oneOf:
                      - $ref: '#/components/schemas/SearchTarget'
                      - type: 'null'
              examples:
                procedure:
                  summary: 시술이 먼저 맞은 경우
                  value:
                    query: 임플
                    target:
                      kind: procedure
                      procedureId: implant
                      label: 임플란트
                hospital:
                  summary: 병원 이름
                  value:
                    query: 더화이트
                    target:
                      kind: hospital
                      hospitalId: h6
                      label: 더화이트 라미네이트클리닉
                doctor:
                  summary: 전문의 이름 + 직함
                  value:
                    query: 김민준 원장
                    target:
                      kind: doctor
                      doctorId: d1
                      hospitalId: h1
                      label: 김민준
                none:
                  summary: 결과 없음
                  value:
                    query: 존재하지않는이름
                    target: null
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /search/trending:
    get:
      operationId: getTrendingSearches
      tags: [search]
      summary: 인기 검색어
      description: |
        검색 화면의 `전체`/`시술`/`병원`/`의사` 탭 순위 목록, 그리고 홈 화면의 인기 검색어 알약
        (= `전체` 탭 상위 6개. 화면 문서가 같은 목록이라고 명시한다).

        항목마다 `target` 이 붙는다. 검색창을 거치지 않고 곧바로 정해진 화면으로 이동하는
        현재 동작을 유지하기 위한 것이다. `target` 이 없으면 문구로 다시 검색해야 하고,
        문구가 이름과 안 맞으면 결과가 없는 상태가 된다 (지금 추천 검색어 알약에서 실제로 벌어지는 일이다).

        `calculatedAt` 을 함께 내려준다. 지금 화면의 `14:32 기준` 은 **집계 시각이 아니라 화면을 연 시각**이라
        언제 봐도 같은 순위인데도 시각만 계속 바뀐다. 서버가 실제 집계 시각을 주면 그 문구가 정직해진다.

        `trend`(순위 변동)도 서버가 계산한다. 지금은 코드에 적어둔 고정 값이다.
      x-screens: [search.md, home.md]
      x-screen-status: "🟡"
      parameters:
        - name: tab
          in: query
          description: 생략하면 `all`.
          schema:
            type: string
            enum: [all, procedure, hospital, doctor]
            default: all
        - name: limit
          in: query
          description: |
            현재 화면의 탭별 개수는 `전체` 10 · `시술` 10 · `병원` 6 · `의사` 8 이다.
            개수를 클라이언트가 정하게 두어 홈(6개)이 같은 엔드포인트를 쓸 수 있게 한다.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: 순위 목록
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                type: object
                required: [tab, calculatedAt, items]
                properties:
                  tab:
                    type: string
                    enum: [all, procedure, hospital, doctor]
                  calculatedAt:
                    type: string
                    format: date-time
                    description: 실제 집계 시각. 화면의 `OO:OO 기준` 문구가 이 값을 써야 한다.
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrendingSearchTerm'

  /search/suggestions:
    get:
      operationId: getSearchSuggestions
      tags: [search]
      summary: 추천(광고) 검색어 알약
      description: |
        검색창 바로 아래의 `✦` 알약들. **광고 지면이다.**

        **각 항목에 `target` 을 함께 내려주는 것이 핵심이다.** 지금 6개 중 5개는 눌러도 아무 일이 없다:
        문구가 시술·병원 이름보다 길어서(`몰라몰라 PICK 인기 임플란트` 등) 그 문구로 검색하면
        `검색 결과가 없어요` 로 떨어진다. 광고 지면이 실질적으로 죽어 있는 상태다.
        서버가 문구와 이동 대상을 분리해서 주면, 클라이언트는 문구를 검색창에 넣는 대신
        `target` 으로 바로 이동할 수 있다.

        `target` 이 `null` 인 항목은 검색어 채우기만 하는 순수 문구다.
        노출 기간이 지난 항목은 응답에서 빠진다 (`sponsorship` 과 같은 서버 판단).
      x-screens: [search.md]
      x-screen-status: "🟡"
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 6
      responses:
        '200':
          description: 추천 검색어 알약. 노출 순서대로.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchSuggestion'

  # =========================================================================
  # geo
  # =========================================================================
  /geo/address-search:
    get:
      operationId: searchAddress
      tags: [geo]
      summary: 주소 검색 (카카오 로컬 프록시)
      description: |
        **카카오 REST 키를 브라우저에서 없애기 위한 엔드포인트다.**

        지금은 `frontend/src/services/geocoding.ts` 가 `VITE_KAKAO_REST_API_KEY` 를 들고
        `dapi.kakao.com` 을 직접 호출한다. `VITE_` 접두사 변수는 번들에 그대로 인라인되므로
        **키가 브라우저에 노출된다.** 카카오 REST 키는 JS 키와 달리 도메인 제한을 걸 수 없어서,
        누가 꺼내가면 우리 계정의 할당량과 과금으로 아무 곳에서나 쓸 수 있다. Flutter 앱이 붙으면
        같은 키를 앱 바이너리에도 심어야 해서 노출면이 더 넓어진다.

        지도 표시용 **JS 키(`VITE_KAKAO_MAP_JS_KEY`)는 브라우저에 남겨 둔다.** 그쪽은 origin 제한이
        가능하고 애초에 클라이언트용으로 발급되는 키다. 즉 **지도는 클라이언트, 주소 검색은 서버**로 나눈다.

        **인증을 요구하고 `hospital_admin` / `operator` 로 제한한다.** 주소 검색은 병원 등록·수정 폼에서만
        쓰인다 (등록은 `operator`, 수정은 담당 `hospital_admin`). 공개로 두면 우리 서버가 누구나 쓰는
        무료 지오코딩 프록시가 된다.

        추가로 서버가 얻는 것:
        - 같은 질의 캐시 (폼이 0.3초 디바운스로 타이핑마다 호출한다)
        - 계정당 분당 30회 제한
        - 카카오 장애 시 `502` 로 명확히 알려주기. 지금은 실패를 삼키고 빈 배열을 반환해서
          "검색 결과가 없다" 와 "카카오가 죽었다" 가 구분되지 않는다.
        - 키가 없을 때 가짜 결과를 만들어내는 목 폴백을 제거. 지금은 키가 없으면 입력 글자에
          `로 12` 같은 꼬리를 붙인 가짜 주소와 서울시청 근처 임의 좌표가 저장된다.
      x-screens: [admin-hospital-new.md, admin-hospital-edit.md]
      x-screen-status: "🟡"
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          description: 도로명 또는 지번 주소.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: 주소 후보. 빈 배열은 "일치하는 주소 없음" 을 뜻한다.
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=600
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeocodeResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: 카카오 로컬 API 호출 실패. "결과 없음" 과 구분된다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: GEOCODING_UPSTREAM_ERROR
                  message: 주소 검색 서비스가 일시적으로 응답하지 않아요. 잠시 후 다시 시도해주세요
                  requestId: 01J9X8V0Q3

# ===========================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer {accessToken}`.

        액세스 토큰 클레임: `sub`(사용자 id), `role`(`user`|`hospital_admin`|`operator`),
        `iat`, `exp`, `iss`, `aud`, `jti`. 수명 15분.

        **`managedHospitalIds` 는 클레임에 넣지 않는다** — 담당 병원이 바뀌었을 때 토큰이 만료될 때까지
        낡은 권한이 유효해진다. 담당 검사는 서버가 매 요청 `hospital_admins` 조회로 판단한다.

        `role` 은 클레임에 있으므로 승격·해제 시 **그 계정의 리프레시 토큰을 전부 폐기**한다.
        폐기하지 않으면 최대 15분 동안 낡은 역할로 동작한다.

        리프레시 토큰은 수명 30일이며 `POST /auth/refresh` 의 **본문**으로 보낸다.
        쿠키를 쓰지 않는 이유는 `mobile/` 의 Flutter 앱이 같은 API 를 쓰기 때문이다.

  parameters:
    Page:
      name: page
      in: query
      description: 1부터 시작.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 최대 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    HospitalId:
      name: hospitalId
      in: path
      required: true
      schema:
        type: string
      example: h1
    DoctorId:
      name: doctorId
      in: path
      required: true
      schema:
        type: string
      example: d1
    ConsultRequestId:
      name: consultRequestId
      in: path
      required: true
      schema:
        type: string
      example: cr1
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
      example: q1

  responses:
    Unauthenticated:
      description: 액세스 토큰이 없거나 만료됨
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              value:
                error:
                  code: UNAUTHENTICATED
                  message: 로그인이 필요해요
                  requestId: 01J9X8V0Q3
            expired:
              value:
                error:
                  code: ACCESS_TOKEN_EXPIRED
                  message: 로그인이 만료되었어요. 다시 로그인해주세요
                  requestId: 01J9X8V0Q3
    Forbidden:
      description: |
        역할 부족 또는 담당 병원 아님.

        비공개 리소스(상담·입점 문의)의 담당 범위 밖 접근은 `403` 이 아니라 `404` 다 — 열거 방지.
        공개 리소스(병원·전문의)는 존재를 숨겨서 얻는 것이 없으므로 `403` 으로 정확한 원인을 알려준다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            role:
              summary: 역할 부족
              value:
                error:
                  code: FORBIDDEN
                  message: 이 작업을 수행할 권한이 없어요
                  requestId: 01J9X8V0Q3
            ownership:
              summary: 담당 병원 아님 (공개 리소스)
              value:
                error:
                  code: HOSPITAL_NOT_MANAGED
                  message: 담당하지 않는 병원이에요
                  requestId: 01J9X8V0Q3
    ValidationFailed:
      description: 입력값 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_FAILED
              message: 입력값을 확인해주세요
              details:
                - field: phone
                  code: INVALID_PHONE_FORMAT
                  message: 010으로 시작하는 휴대폰 번호를 입력해주세요
                - field: priceRange.min
                  code: NOT_A_NUMBER
                  message: 숫자만 입력해주세요
              requestId: 01J9X8V0Q3
    RateLimited:
      description: 요청 한도 초과
      headers:
        Retry-After:
          schema:
            type: integer
          description: 초 단위.
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
          description: 창이 초기화되는 UNIX epoch(초).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMITED
              message: 요청이 너무 많아요. 잠시 후 다시 시도해주세요
              requestId: 01J9X8V0Q3
    HospitalNotFound:
      description: 병원 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: HOSPITAL_NOT_FOUND
              message: 병원 정보를 찾을 수 없어요
              requestId: 01J9X8V0Q3
    DoctorNotFound:
      description: 전문의 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: DOCTOR_NOT_FOUND
              message: 전문의 정보를 찾을 수 없어요
              requestId: 01J9X8V0Q3
    ConsultRequestNotFound:
      description: 상담 없음 또는 담당 병원의 상담이 아님 (두 경우를 구분하지 않는다)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CONSULT_REQUEST_NOT_FOUND
              message: 상담 정보를 찾을 수 없어요
              requestId: 01J9X8V0Q3
    PartnerInquiryNotFound:
      description: 입점 문의 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: PARTNER_INQUIRY_NOT_FOUND
              message: 입점 문의를 찾을 수 없어요
              requestId: 01J9X8V0Q3
    PostNotFound:
      description: 질문 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: POST_NOT_FOUND
              message: 질문을 찾을 수 없어요
              requestId: 01J9X8V0Q3

  schemas:
    # ---------------------------------------------------------------- 공통
    Error:
      type: object
      description: |
        모든 4xx/5xx 응답의 본문. `message` 는 사용자에게 그대로 보여줄 수 있는 한국어 문구다 —
        프론트엔드가 코드별 문구 사전을 따로 들고 있지 않게 하려는 의도다.
        문구를 바꿀 때는 화면 문서의 문구와 어긋나지 않는지 확인해야 한다.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              description: 기계 판독용 코드. 대문자 SNAKE_CASE.
              example: HOSPITAL_NOT_FOUND
            message:
              type: string
              description: 사용자에게 보여줄 한국어 문구.
              example: 병원 정보를 찾을 수 없어요
            details:
              type: array
              description: 필드 단위 오류. `VALIDATION_FAILED` 에서만 채워진다.
              items:
                $ref: '#/components/schemas/ErrorDetail'
            requestId:
              type: string
              description: 로그 추적용. 응답 헤더 `X-Request-Id` 와 같은 값.
              example: 01J9X8V0Q3

    ErrorDetail:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: 점 표기 경로. 배열은 `doctors[2].name` 형태.
          example: doctors[2].name
        code:
          type: string
          example: REQUIRED
        message:
          type: string
          example: 이름을 입력해주세요

    PageMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalItems:
          type: integer
          description: 필터 적용 후 전체 건수. 화면의 `총 11곳` / `총 14명` 이 이 값이다.
          example: 11
        totalPages:
          type: integer
          example: 1

    # ---------------------------------------------------------------- 시술
    ProcedureId:
      type: string
      description: |
        시술 13종. 병원 탐색의 시술 칩 15개 중 `추천`·`기타` 는 시술이 아니라 특수 탭이라 여기 없다.
      enum:
        - implant
        - orthodontics
        - laminate
        - inlay
        - crown
        - whitening
        - wisdom-tooth
        - cavity
        - gum-disease
        - splint
        - snoring-device
        - tmj
        - botox

    Procedure:
      type: object
      required: [id, name, emoji, shortDescription, description]
      properties:
        id:
          $ref: '#/components/schemas/ProcedureId'
        name:
          type: string
          example: 임플란트
        emoji:
          type: string
          example: 🦷
        shortDescription:
          type: string
          example: 자연치아처럼 튼튼하게
        description:
          type: string

    # ---------------------------------------------------------------- 병원
    PriceRange:
      type: object
      required: [min, max]
      properties:
        min:
          type: integer
          description: 원. 정수.
          example: 900000
        max:
          type: integer
          example: 3500000

    BusinessHourEntry:
      type: object
      required: [day, hours]
      properties:
        day:
          type: string
          example: 월
        hours:
          type: string
          description: 자유 문자열. 점심시간 칸이 따로 없어 필요하면 여기 함께 적는다.
          example: 09:30 - 18:30
        isClosed:
          type: boolean
          default: false

    HospitalFeatures:
      type: object
      description: |
        관리자 폼의 `병원 특징` 체크박스 6개. `⚡ 원데이가능` 배지는 여기가 아니라 `isOneDay` 에서 온다 —
        화면 문서가 출처가 다르다고 명시하는 지점이다.
      required: [coordinator, painlessAnesthesia, digitalCare, parking, nightConsult, cctv]
      properties:
        coordinator:
          type: boolean
          description: 전담코디네이터
        painlessAnesthesia:
          type: boolean
          description: 무통마취
        digitalCare:
          type: boolean
          description: 디지털진료
        parking:
          type: boolean
          description: 주차가능
        nightConsult:
          type: boolean
          description: 야간상담. 병원 탐색의 `진료시간` 조건 칩이 실제로 거르는 값.
        cctv:
          type: boolean
          description: CCTV설치

    Sponsorship:
      type: object
      description: |
        광고 상태를 **서버가 계산한** 결과. 클라이언트가 기기 시계로 기간을 판단하지 않게 하려고 둔다.
        원본 필드(`isSponsored`, `sponsoredRank`, `sponsoredStartDate`, `sponsoredEndDate`)도 함께 유지된다.
      required: [isActive, isPlacementEligible]
      properties:
        isActive:
          type: boolean
          description: |
            광고 계약이 있고 오늘이 기간 안. **`광고` 배지 노출 조건이다.** 평점을 보지 않는다.
        isPlacementEligible:
          type: boolean
          description: |
            `isActive` && `rating >= 3.5` && (요청한 `procedureId` 가 `sponsoredCategories` 에 포함
            또는 `recommended=true` 요청). **목록 상단 노출 조건이다.**
            평점 3.5 미만이면 배지는 붙지만 위로 올라가지 않는다.
        placementRank:
          type: [integer, 'null']
          description: 상단 노출 슬롯 안에서의 순서 (작은 값이 먼저). `isPlacementEligible=false` 면 null.
          example: 1
        activeUntil:
          type: [string, 'null']
          format: date
          description: 노출 종료일. 병원 수정 화면의 `광고 현황` 카드가 쓴다.
          example: '2026-09-30'

    Hospital:
      type: object
      description: |
        `frontend/src/types/domain.ts` 의 `Hospital` 을 그대로 보존하고 계산 필드만 덧붙였다.
        기존 필드를 지우거나 이름을 바꾸지 않았으므로 프론트엔드 타입은 수정 없이 통과한다.

        덧붙인 것: `sponsorship`, `representativeSpecialty`, `distanceKm`.
      required:
        - id
        - name
        - specialty
        - region
        - latitude
        - longitude
        - thumbnail
        - images
        - procedureIds
        - priceRange
        - rating
        - reviewCount
        - consultCount
        - consultAvailable
        - businessHours
        - directions
        - features
        - isOneDay
        - isRecommended
        - isSponsored
        - sponsoredCategories
        - sponsoredRank
        - sponsoredStartDate
        - sponsoredEndDate
        - tags
        - address
        - introduction
        - events
        - sponsorship
      properties:
        id:
          type: string
          example: h1
        name:
          type: string
          example: 강남 스마일 치과
        specialty:
          type: string
          description: '`전문 분야` 자유 문자열. 예: `임플란트 전문의원`. 전문의의 `specialty` 와 다른 개념이다.'
          example: 임플란트 전문의원
        region:
          type: string
          example: 서울 강남구
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        thumbnail:
          type: string
          format: uri
          description: 대표 이미지. 관리자가 비워 두면 서버가 기본 이미지를 넣는다.
        images:
          type: array
          description: |
            병원 상세의 사진 캐러셀. 관리자 폼에는 이 배열을 편집하는 칸이 없다 —
            `대표 이미지 URL` 을 바꿔도 캐러셀이 안 바뀌는 현재 증상의 원인이다.
          items:
            type: string
            format: uri
        procedureIds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProcedureId'
        priceRange:
          $ref: '#/components/schemas/PriceRange'
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
          description: 신규 등록 병원은 0. 후기로부터 집계되지 않는다 (후기 작성 기능이 없다).
          example: 4.8
        reviewCount:
          type: integer
          example: 312
        consultCount:
          type: integer
          example: 90
        consultAvailable:
          type: boolean
          description: |
            false 면 `POST /consult-requests` 가 `409 CONSULT_CLOSED` 를 반환한다.
            화면 버튼도 `상담 마감` 으로 잠긴다.
        businessHours:
          type: array
          items:
            $ref: '#/components/schemas/BusinessHourEntry'
        directions:
          type: string
          description: '`찾아오시는 길` 자유 텍스트. 빈 문자열 가능.'
        features:
          $ref: '#/components/schemas/HospitalFeatures'
        isOneDay:
          type: boolean
          description: 당일 보철 가능 여부. 병원 속성이며 시술 분류가 아니다.
        isRecommended:
          type: boolean
          description: 에디터 추천. 시술 칩 `추천` 과 `🌟 추천` 배지의 출처.
        isSponsored:
          type: boolean
        sponsoredCategories:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureId'
        sponsoredRank:
          type: [integer, 'null']
        sponsoredStartDate:
          type: [string, 'null']
          format: date
        sponsoredEndDate:
          type: [string, 'null']
          format: date
        tags:
          type: array
          items:
            type: string
        address:
          type: string
        introduction:
          type: string
        events:
          type: array
          description: |
            병원 상세의 `진행중인 이벤트` 문구 배열. `Promotion`(할인가 있는 이벤트 카드)과 **다른 것**이다.
            이름이 겹쳐 혼동을 부르는 지점이라 `docs/api/README.md` 에 적어 두었다.
          items:
            type: string
        sponsorship:
          $ref: '#/components/schemas/Sponsorship'
        representativeSpecialty:
          type: [string, 'null']
          description: |
            병원 카드의 `OO전문의 상주` 배지용. 그 병원의 인증된 전문의 중 첫 번째 사람의 전공.
            없으면 null.

            **계산해서 내려주는 이유:** 지금 카드는 이 값을 얻으려고 전문의 전체 목록을 클라이언트에서 뒤진다.
            병원 목록 화면에서 병원마다 전문의를 조회하면 N+1 이 되고, 목록 한 번에 전문의 전량을
            내려받아야 한다.
          example: 치과보철전문의
        distanceKm:
          type: [number, 'null']
          format: double
          description: |
            `latitude`/`longitude`/`radiusKm` 를 함께 보낸 요청(지도 보기)에서만 채워진다.
            그 밖에는 null. 지도 아래 병원 카드의 `시술 · 거리 · 후기 수` 표시가 쓴다.
          example: 1.2

    HospitalCreateRequest:
      type: object
      description: |
        관리자 병원 등록 폼. 필수 항목은 화면 문서의 `필수` 표시와 일치한다.
        `id`·집계 필드·광고 필드·`isRecommended` 는 받지 않는다.
      required: [name, region, address, latitude, longitude, priceRange, procedureIds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        specialty:
          type: string
          maxLength: 100
          default: ''
        region:
          type: string
          minLength: 1
          maxLength: 50
        address:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            `GET /geo/address-search` 결과에서 고른 값이어야 한다. `latitude`/`longitude` 도 그 결과의 값이다.
            직접 타이핑한 주소는 좌표가 없어 지도에 찍히지 않는다.
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        thumbnail:
          type: string
          format: uri
          description: 생략하면 서버가 기본 이미지를 넣는다.
        images:
          type: array
          items:
            type: string
            format: uri
        introduction:
          type: string
          maxLength: 2000
          default: ''
        priceRange:
          $ref: '#/components/schemas/PriceRange'
        tags:
          type: array
          items:
            type: string
            maxLength: 30
        procedureIds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProcedureId'
        consultAvailable:
          type: boolean
          default: true
          description: 폼 기본값이 켜짐이다.
        isOneDay:
          type: boolean
          default: false
        businessHours:
          type: array
          description: 생략하면 서버 기본 스케줄 (월~금 `09:30 - 18:30`, 토 `09:30 - 14:00`, 일 휴진).
          items:
            $ref: '#/components/schemas/BusinessHourEntry'
        directions:
          type: string
          maxLength: 500
          default: ''
        features:
          $ref: '#/components/schemas/HospitalFeatures'
        isRecommended:
          type: boolean
          default: false
          description: |
            에디터 추천. **`operator` 만 설정할 수 있다** (이 오퍼레이션 자체가 `operator` 전용이다).
            `PATCH /hospitals/{id}` 에서 `hospital_admin` 이 보내면 `422 FIELD_NOT_WRITABLE`.
        doctors:
          type: array
          description: |
            등록과 동시에 소속 전문의를 넣을 수 있다. 폼이 병원과 전문의를 한 번에 저장하기 때문에
            두 요청으로 나누면 중간 실패 시 전문의 없는 병원이 남는다. 전부 `pending` 으로 들어간다.
          items:
            $ref: '#/components/schemas/DoctorUpsert'
        adminEmails:
          type: array
          description: |
            담당자로 지정할 **이미 가입된** 계정의 이메일. 생략하면 담당자 없는 병원이 만들어지고
            나중에 `POST /hospitals/{id}/admins` 로 붙인다.

            **운영자 자신은 담당자가 되지 않는다.** 등록자가 자동으로 관리자가 되는 초안 설계는 폐기했다.
            가입되지 않은 이메일이 있으면 병원을 만들지 않고 `404 USER_NOT_FOUND` 로 전체를 되돌린다 —
            "병원은 생겼는데 담당자 지정만 실패" 라는 어중간한 상태를 막는다.
          items:
            type: string
            format: email

    HospitalUpdateRequest:
      type: object
      description: |
        부분 수정. 보낸 필드만 바뀐다. `HospitalCreateRequest` 와 같은 필드에 필수 제약만 없다.

        광고·집계 필드는 누구도 보낼 수 없다 (`422 FIELD_NOT_WRITABLE`).
        `isRecommended` 는 **`operator` 만** 보낼 수 있고 `hospital_admin` 이 보내면 거절된다.
      properties:
        isRecommended:
          type: boolean
          description: '`operator` 전용. `hospital_admin` 요청에 포함되면 `422 FIELD_NOT_WRITABLE`.'
        name:
          type: string
          minLength: 1
          maxLength: 100
        specialty:
          type: string
          maxLength: 100
        region:
          type: string
          minLength: 1
          maxLength: 50
        address:
          type: string
          minLength: 1
          maxLength: 200
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        thumbnail:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        introduction:
          type: string
          maxLength: 2000
        priceRange:
          $ref: '#/components/schemas/PriceRange'
        tags:
          type: array
          items:
            type: string
            maxLength: 30
        procedureIds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProcedureId'
        consultAvailable:
          type: boolean
        isOneDay:
          type: boolean
        businessHours:
          type: array
          items:
            $ref: '#/components/schemas/BusinessHourEntry'
        directions:
          type: string
          maxLength: 500
        features:
          $ref: '#/components/schemas/HospitalFeatures'

    # ---------------------------------------------------------------- 전문의
    DentalSpecialty:
      type: string
      enum:
        - 치과보철전문의
        - 치과교정전문의
        - 구강악안면외과전문의
        - 치주과전문의
        - 소아치과전문의
        - 통합치의학과전문의
        - 구강악안면방사선과전문의
        - 일반의

    VerificationStatus:
      type: string
      enum: [pending, approved, rejected]
      description: '화면 표기: `대기` / `승인` / `반려`.'

    Doctor:
      type: object
      description: |
        **공개 응답.** `certificateUrl` 과 `rejectionReason` 을 담지 않는다 —
        제출된 자격증 이미지와 반려 사유가 공개 API 로 새면 안 된다.
        관리자 응답은 `DoctorAdminView` 다.
      required:
        - id
        - name
        - title
        - hospitalId
        - photo
        - procedureIds
        - reviewCount
        - consultCount
        - verificationStatus
        - isRecommended
        - yearsOfExperience
        - career
        - visibleSpecialty
        - isVerifiedSpecialist
      properties:
        id:
          type: string
          example: d1
        name:
          type: string
          example: 김민준
        title:
          type: string
          example: 대표원장
        hospitalId:
          type: string
          example: h1
        photo:
          type: string
          format: uri
        procedureIds:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureId'
        rating:
          type: [number, 'null']
          format: float
          description: |
            **비로그인 요청에는 `null` 이다.** 전문의 상세의 평점 잠금을 서버에서 구현한 것이다.
            지금은 반투명 막을 덮는 방식이라 숫자가 비쳐 보이고 응답에는 그대로 실려 있다.
          example: 4.9
        reviewCount:
          type: integer
          description: 잠금 대상이 아니다. 비로그인에도 `후기 180` 이 보인다.
          example: 180
        consultCount:
          type: integer
          example: 90
        specialty:
          $ref: '#/components/schemas/DentalSpecialty'
        visibleSpecialty:
          type: [string, 'null']
          description: |
            화면에 표시해도 되는 전공. 규칙:
            `일반의` → 항상 그대로 표시. 그 밖의 전공 → `approved` 일 때만 표시, 아니면 `null`.

            **`specialty` 원본은 승인 전에는 응답에 포함되지 않는다.** 검수 대기·반려 상태의
            전공 주장이 공개되면 검수의 의미가 없어진다.
          example: 치과보철전문의
        isVerifiedSpecialist:
          type: boolean
          description: '`approved` && `specialty !== 일반의`. `전문의` 배지 조건.'
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
        isRecommended:
          type: boolean
        yearsOfExperience:
          type: integer
          example: 15
        career:
          type: array
          description: '`경력 및 활동` 목록. 빈 배열이면 화면이 `등록된 경력 정보가 없어요` 를 보여준다.'
          items:
            type: string

    DoctorAdminView:
      allOf:
        - $ref: '#/components/schemas/Doctor'
        - type: object
          description: '관리자 전용 확장. `Cache-Control: no-store`.'
          required: [certificateUrl, rejectionReason]
          properties:
            specialty:
              $ref: '#/components/schemas/DentalSpecialty'
            certificateUrl:
              type: [string, 'null']
              format: uri
              description: 제출된 자격증/인증서. null 이면 화면에 `미제출`.
            rejectionReason:
              type: [string, 'null']
              description: '`rejected` 일 때만 값이 있다. 승인하면 지워진다.'

    VerificationQueueItem:
      allOf:
        - $ref: '#/components/schemas/DoctorAdminView'
        - type: object
          required: [hospitalName]
          properties:
            hospitalName:
              type: string
              description: |
                검수 화면이 소속 병원 이름을 보여준다. 병원을 찾지 못하면 `알 수 없는 병원`.
                여기서 조인해 주지 않으면 검수 목록이 병원 전체 목록을 함께 받아야 한다.
              example: 강남 스마일 치과
            submittedAt:
              type: [string, 'null']
              format: date-time
              description: |
                자격증이 제출된 시각. 검수 대기 순서 판단에 쓴다.

                **미구현 — 화면 미사용.** 선택 필드이고(`required` 는 `hospitalName` 뿐),
                `docs/features/admin-specialists.md` 의 검수 화면이 제출 시각을 표시하지 않는다
                (정렬은 상태 → 등록 순). 소비자가 생기면 그때 구현한다.

    DoctorUpsert:
      type: object
      description: |
        병원 폼의 전문의 한 명. `id` 가 있으면 갱신, 없으면 신규.
        **`name` 이 필수다** — 이름을 비우고 저장하면 삭제되는 현재 동작을 막기 위한 것이다.
      required: [name, specialty]
      properties:
        id:
          type: string
          description: 기존 전문의를 갱신할 때만.
        name:
          type: string
          minLength: 1
          maxLength: 50
        title:
          type: string
          maxLength: 50
          default: 원장
        specialty:
          $ref: '#/components/schemas/DentalSpecialty'
        certificateUrl:
          type: [string, 'null']
          format: uri
        photo:
          type: string
          format: uri
          description: 폼에 이 칸이 없다. 신규는 서버 기본 이미지, 기존은 기존 값 유지.
        yearsOfExperience:
          type: integer
          minimum: 0
          description: 폼에 이 칸이 없다. 신규는 0, 기존은 기존 값 유지.
        career:
          type: array
          description: 폼에 이 칸이 없다. 신규는 빈 배열, 기존은 기존 값 유지.
          items:
            type: string
        procedureIds:
          type: array
          description: |
            생략하면 서버가 전공에서 유도한다. `일반의` 는 병원이 취급하는 시술 전체가 된다
            (현재 동작과 동일).
          items:
            $ref: '#/components/schemas/ProcedureId'

    DoctorUpdateRequest:
      type: object
      description: 단건 부분 수정. `verificationStatus` 는 여기서 바꿀 수 없다.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        title:
          type: string
          maxLength: 50
        specialty:
          $ref: '#/components/schemas/DentalSpecialty'
        certificateUrl:
          type: [string, 'null']
          format: uri
        photo:
          type: string
          format: uri
        yearsOfExperience:
          type: integer
          minimum: 0
        career:
          type: array
          items:
            type: string
        procedureIds:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureId'
        isRecommended:
          type: boolean
          description: |
            **미구현 — 권한 정의 필요.** 병원의 동명 필드(`Hospital.isRecommended`)와 달리
            여기는 역할 제한 표기가 없다. 어느 화면도 이 값을 쓰지 않고(`DoctorCard` 는 읽기만
            한다), 계약이 침묵하는 권한 문제(허용하면 병원 담당자가 자기 병원 전문의를 스스로
            추천 노출시킬 수 있다)를 추측으로 정할 수 없어 `PATCH /doctors/{doctorId}` 는 이
            키를 받지 않는다. 필드 자체는 지우지 않는다 — 권한이 정해지면 구현한다.

    VerificationDecisionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]
          description: '`pending` 으로 되돌릴 수는 없다. 화면에도 그 버튼이 없다.'
        rejectionReason:
          type: string
          minLength: 1
          maxLength: 500
          description: '`status=rejected` 일 때 필수. `approved` 면 무시되고 기존 사유가 지워진다.'

    # ---------------------------------------------------------------- 후기
    Review:
      type: object
      required: [id, hospitalId, procedureId, authorName, rating, content, createdAt]
      properties:
        id:
          type: string
        hospitalId:
          type: string
        procedureId:
          $ref: '#/components/schemas/ProcedureId'
        authorName:
          type: string
          description: 서버가 마스킹해서 내려준다 (`김**`). 원본 이름을 공개 응답에 담지 않는다.
          example: 김**
        rating:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
        createdAt:
          type: string
          format: date
          description: '날짜만. 기존 도메인 타입 보존 (`2026-06-02`).'
          example: '2026-06-02'
        photos:
          type: array
          items:
            type: string
            format: uri

    # ---------------------------------------------------------------- 이벤트
    Promotion:
      type: object
      required: [id, hospitalId, procedureId, title, originalPrice, salePrice, discountRate, badge]
      properties:
        id:
          type: string
        hospitalId:
          type: string
        procedureId:
          $ref: '#/components/schemas/ProcedureId'
        title:
          type: string
          example: 임플란트 1개 진단+식립 패키지
        originalPrice:
          type: integer
          example: 1800000
        salePrice:
          type: integer
          example: 1290000
        discountRate:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            서버가 계산한 할인율(%). 네 화면이 같은 숫자를 보여야 해서 계산을 서버에 둔다.
            반올림 규칙도 여기서 하나로 고정된다.
          example: 28
        badge:
          type: string
          description: '화면에 `🔥 얼리버드` 처럼 표시된다. 🔥 는 화면이 붙이는 것이고 값에는 없다.'
          example: 얼리버드
        startsAt:
          type: [string, 'null']
          format: date-time
          description: |
            **현재 데이터에 기간 정보가 없어 null 이다.** 이벤트 화면이 `기간 한정` 이라고 안내하는데
            남은 기간·D-day·마감일이 표시되지 않는 원인이다.
        endsAt:
          type: [string, 'null']
          format: date-time

    # ---------------------------------------------------------------- 꿀팁
    GuideSummary:
      type: object
      description: 목록용. 본문(`content`)이 없다.
      required: [id, title, summary, thumbnail, procedureId, author, createdAt]
      properties:
        id:
          type: string
          example: g1
        title:
          type: string
        summary:
          type: string
        thumbnail:
          type: string
          format: uri
        procedureId:
          $ref: '#/components/schemas/ProcedureId'
        author:
          type: string
          example: 몰라몰라 편집팀
        createdAt:
          type: string
          format: date
          description: 날짜만. 기존 도메인 타입 보존.

    GuideContent:
      allOf:
        - $ref: '#/components/schemas/GuideSummary'
        - type: object
          required: [content, relatedHospitalIds]
          properties:
            content:
              type: string
              description: |
                빈 줄(`\n\n`)로 문단을 나눈 평문. 제목·목록·표·이미지 서식은 지원하지 않는다.
            relatedHospitalIds:
              type: array
              description: |
                `관련 병원 보기` 카드용. 삭제된 병원의 id 는 응답에서 빠진다.
                도메인 타입의 `relatedHospitals` 를 이름만 명확히 한 것이다 (id 배열임이 드러나게).
              items:
                type: string

    # ---------------------------------------------------------------- 상담
    ConsultStatus:
      type: string
      enum: [new, contacted, booked, cancelled]
      description: '화면 표기: `신규` / `연락중` / `예약완료` / `취소`.'

    ConsultStatusChange:
      type: object
      required: [status, changedAt]
      properties:
        status:
          $ref: '#/components/schemas/ConsultStatus'
        changedAt:
          type: string
          format: date-time
        changedByName:
          type: [string, 'null']
          description: |
            누가 바꿨는지. 현재 이력에는 상태와 시각만 남아 누가 처리했는지 알 수 없다.
            관리자 응답에서만 채워진다.

    ConsultMemo:
      type: object
      required: [id, content, createdAt]
      properties:
        id:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        authorName:
          type: [string, 'null']
          description: 현재 메모에는 작성자 표시가 없다. 서버가 함께 저장한다.

    ConsultRequest:
      type: object
      description: |
        **관리자 시야** (`hospital_admin` / `operator` 공용). `Cache-Control: no-store`.
        신청자에게 내려가는 형태는 `MyConsultRequest` 이며 `memos` 가 없다.

        ### 개인정보 마스킹을 같은 스키마 안에서 표현한다

        `name` / `phone` 은 **역할에 따라 값이 달라진다:**

        | 역할 | `name` | `phone` | `piiMasked` |
        |---|---|---|---|
        | `hospital_admin` (담당 병원) | `박서영` | `010-1234-5678` | `false` |
        | `operator` | `박*영` | `010-****-5678` | `true` |

        **별도 투영 스키마(`ConsultRequestMaskedView`)를 만들지 않은 이유:**

        1. **필드 집합이 같다.** 마스킹은 값 변환이고 구조 변화가 아니다. 스키마를 둘로 나누면
           `oneOf` 두 갈래를 만들 뿐이고, 클라이언트는 어차피 같은 카드 컴포넌트로 그린다.
           (반대로 `MyConsultRequest` 는 `memos`·`changedByName` 이 **없어서** 별도 스키마다 —
           구조가 다를 때만 투영을 나눈다는 기준을 일관되게 적용했다)
        2. **관리자 화면 하나가 두 역할을 함께 쓴다.** `/admin/consultations` 는 담당자와 운영자가
           같은 화면을 보는 구조다. 스키마가 갈리면 화면이 응답 형태로 분기해야 한다.
        3. **엔드포인트가 같다.** 경로가 같은데 응답 스키마가 다르면 생성되는 클라이언트 타입이
           유니온이 되어 모든 접근에 좁히기(narrowing)가 필요해진다.

        **`piiMasked` 를 명시적으로 내려주는 이유 (클라이언트가 알아야 한다):**

        - 화면이 "연락처는 담당 병원에서만 확인할 수 있어요" 안내를 띄워야 한다. 값만 보고는
          `010-****-5678` 이 마스킹인지 잘못 저장된 데이터인지 구분할 수 없다.
        - 마스킹된 값으로 전화 걸기·복사 버튼을 활성화하면 안 된다.
        - 마스킹된 값을 검색어로 넣어도 결과가 없는 것이 정상임을 화면이 설명할 수 있다.
        - `role` 로 추론하지 않는 이유: 추론은 클라이언트에 인가 규칙을 복제하는 것이다. 마스킹 정책이
          바뀌면(예: 운영자에게 전체 공개) 서버 한 곳만 고치면 되게 둔다.
      required:
        - id
        - hospitalId
        - hospitalName
        - procedureId
        - name
        - phone
        - piiMasked
        - preferredTime
        - message
        - createdAt
        - status
        - statusHistory
        - memos
      properties:
        id:
          type: string
          example: cr1
        hospitalId:
          type: string
        hospitalName:
          type: string
          description: 병원을 찾지 못하면 `알 수 없는 병원`. 관리자 목록 카드가 `병원명 · 시술명` 을 보여준다.
          example: 강남 스마일 치과
        doctorId:
          type: [string, 'null']
          description: |
            지정된 전문의. **지금은 저장되지 않아 관리자가 어느 전문의를 지목했는지 알 수 없다.**
          example: d1
        doctorName:
          type: [string, 'null']
          example: 김민준
        procedureId:
          oneOf:
            - $ref: '#/components/schemas/ProcedureId'
            - type: 'null'
          description: null 이면 화면에 `시술 미지정`.
        procedureName:
          type: [string, 'null']
          example: 임플란트
        name:
          type: string
          description: |
            고객 이름. **`operator` 에게는 마스킹된다** — 가운데 글자를 `*` 로 (`박서영` → `박*영`).
            두 글자 이름은 `박*`, 네 글자 이상은 첫 글자와 마지막 글자만 남긴다 (`남궁민수` → `남**수`).
          example: 김민준
        phone:
          type: string
          description: |
            서버가 `010-1234-5678` 형태로 정규화해 저장한다.
            **`operator` 에게는 가운데 블록이 마스킹된다** (`010-****-5678`).
            뒤 4자리를 남기는 이유: 운영자가 고객 문의를 받았을 때 어떤 상담 건인지 대조할 수 있어야 하고,
            그것만으로 연락은 불가능하다.
          example: 010-1234-5601
        piiMasked:
          type: boolean
          description: |
            `name` / `phone` 이 마스킹된 값인지. `operator` 응답은 `true`,
            담당 병원 `hospital_admin` 응답은 `false`.
            **클라이언트는 이 값으로 전화 걸기·복사 버튼을 잠그고 안내 문구를 띄운다.**
          example: false
        preferredTime:
          type: string
          enum: [평일 오전, 평일 오후, 주말]
          description: |
            현재 화면의 고정 3지선다를 그대로 값으로 쓴다 (기존 데이터·타입 보존).
            코드 기반 enum(`WEEKDAY_MORNING` 등)으로 바꾸는 것은 미결 사항이다.
        message:
          type: string
          description: 빈 문자열 가능. 화면은 비어 있으면 `남긴 메시지가 없어요`.
        createdAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ConsultStatus'
        statusHistory:
          type: array
          description: 최신순으로 표시되지만 저장은 시간순이다. 정렬은 클라이언트 표현.
          items:
            $ref: '#/components/schemas/ConsultStatusChange'
        memos:
          type: array
          description: |
            내부 공유용. **신청자 응답(`MyConsultRequest`)에는 절대 포함되지 않는다.**
            `operator` 는 읽을 수 있다 (분쟁 시 처리 경과 확인). 마스킹 대상 필드가 없는 자유 텍스트라
            담당자가 여기에 고객 연락처를 적으면 마스킹을 우회하게 된다 — 화면 안내가 필요하다 (미결 사항).
          items:
            $ref: '#/components/schemas/ConsultMemo'

    MyConsultRequest:
      type: object
      description: |
        **신청자 시야.** 같은 저장 구조에서 나오는 다른 투영이다.
        `memos`(내부 메모)와 `statusHistory[].changedByName`(처리자 이름)을 담지 않는다.
      required:
        - id
        - hospitalId
        - hospitalName
        - procedureId
        - name
        - phone
        - preferredTime
        - message
        - createdAt
        - status
        - statusHistory
      properties:
        id:
          type: string
        hospitalId:
          type: string
        hospitalName:
          type: string
        hospitalThumbnail:
          type: string
          format: uri
          description: 내역 카드에 병원 사진을 쓸 수 있게 함께 준다. 병원을 다시 조회하지 않아도 된다.
        doctorId:
          type: [string, 'null']
        doctorName:
          type: [string, 'null']
        procedureId:
          oneOf:
            - $ref: '#/components/schemas/ProcedureId'
            - type: 'null'
        procedureName:
          type: [string, 'null']
        name:
          type: string
        phone:
          type: string
        preferredTime:
          type: string
          enum: [평일 오전, 평일 오후, 주말]
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ConsultStatus'
        statusHistory:
          type: array
          items:
            type: object
            required: [status, changedAt]
            properties:
              status:
                $ref: '#/components/schemas/ConsultStatus'
              changedAt:
                type: string
                format: date-time

    ConsultRequestCreateRequest:
      type: object
      required: [hospitalId, name, phone, preferredTime]
      properties:
        hospitalId:
          type: string
        doctorId:
          type: [string, 'null']
          description: |
            `전문의 상담신청` 으로 들어온 경우 그 전문의 id. 병원 소속이 아니면 `422 DOCTOR_NOT_AT_HOSPITAL`.
        procedureId:
          oneOf:
            - $ref: '#/components/schemas/ProcedureId'
            - type: 'null'
          description: |
            그 병원이 취급하는 시술이어야 한다 (`422 PROCEDURE_NOT_OFFERED`).
            화면은 항상 하나를 선택된 상태로 두지만, 병원에 등록된 시술이 없으면 null 이 올 수 있다.
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 앞뒤 공백을 제거한 뒤 1자 이상.
        phone:
          type: string
          pattern: '^01[016789]-?\d{3,4}-?\d{4}$'
          description: |
            **서버가 형식을 검사한다.** 지금은 `1` 한 글자, `abc`, `없음` 도 통과한다.
            하이픈은 있어도 없어도 되고, 저장 시 `010-1234-5678` 형태로 정규화된다.
          example: 010-1234-5678
        preferredTime:
          type: string
          enum: [평일 오전, 평일 오후, 주말]
        message:
          type: string
          maxLength: 2000
          default: ''

    ConsultSummary:
      type: object
      description: 관리자 홈 숫자 카드. 요청자가 관리하는 병원 범위로 계산된다.
      required: [newThisMonth, pending, timezone, calculatedAt]
      properties:
        newThisMonth:
          type: integer
          description: |
            이번 달에 접수된 상담 건수. **`Asia/Seoul` 달력 기준**이며 기기 시계를 쓰지 않는다.
          example: 0
        pending:
          type: integer
          description: '상태가 `new` 인 건수 (`처리 대기 중인 상담`).'
          example: 3
        timezone:
          type: string
          description: 달 경계 계산에 쓴 시간대. 화면이 기준을 표시할 수 있게 명시한다.
          example: Asia/Seoul
        calculatedAt:
          type: string
          format: date-time

    # ---------------------------------------------------------------- 찜
    FavoriteList:
      type: object
      required: [hospitalIds]
      properties:
        hospitalIds:
          type: array
          description: 최근에 찜한 것이 먼저.
          items:
            type: string
          example: [h6, h1]
        hospitals:
          type: array
          description: '`expand=hospital` 일 때만. `hospitalIds` 와 같은 순서.'
          items:
            $ref: '#/components/schemas/Hospital'

    # ---------------------------------------------------------------- 알림
    NotificationAudience:
      type: string
      enum: [user, admin]
      description: |
        사용자 알림함(`/notifications`) / 관리자 알림함(`/admin/notifications`) 구분.
        **역할이 아니라 알림함 이름이다.** 역할은 셋이지만 알림함은 둘이다.
        `audience=admin` 조회는 `hospital_admin` 또는 `operator` 가 필요하다 (`user` 는 `403`).
        `audience=user` 는 세 역할 모두 조회할 수 있다 — 병원 담당자도 개인으로서 상담을 신청한다.

    NotificationType:
      type: string
      enum: [consult-status, event, system]

    AppNotification:
      type: object
      required: [id, audience, type, title, message, isRead, createdAt, relatedId]
      properties:
        id:
          type: string
        audience:
          $ref: '#/components/schemas/NotificationAudience'
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
          example: 상담 상태 변경
        message:
          type: string
          example: 상담 상태가 '예약완료'(으)로 변경되었어요
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
          description: UTC. 화면이 보는 기기의 시간대로 표시한다.
        relatedId:
          type: [string, 'null']
          description: |
            관련 리소스 id. 일반 공지는 null.
            **`relatedResource` 와 함께 보아야 한다** — 지금 관리자 알림함은 `relatedId` 만 보고
            무조건 상담 상세로 보내서, 전문의 검수 알림이 생기면 잘못된 곳으로 이동한다.
        relatedResource:
          type: [string, 'null']
          enum: [consultRequest, hospital, doctor, promotion, null]
          description: |
            `relatedId` 가 어떤 종류의 리소스인지. 알림을 눌렀을 때 어디로 갈지 결정하는 근거다.
            새로 추가한 필드다.
          example: consultRequest

    # ---------------------------------------------------------------- 커뮤니티
    QAAnswer:
      type: object
      required: [id, authorName, isDentist, content, createdAt]
      properties:
        id:
          type: string
        authorName:
          type: string
        isDentist:
          type: boolean
          description: |
            `치과의사 답변` 배지. **서버가 작성자의 인증 상태에서 유도한다.**
            지금은 샘플 데이터의 플래그일 뿐 실제 인증과 연결되어 있지 않다.
        content:
          type: string
        createdAt:
          type: string
          format: date
          description: 날짜만. 기존 도메인 타입 보존.

    QAPostSummary:
      type: object
      description: 목록용. `answers` 배열 대신 `answerCount` 만 담는다.
      required: [id, title, content, procedureId, authorName, createdAt, viewCount, answerCount]
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
          description: 목록 카드가 두 줄 미리보기로 자른다. 서버는 전문을 준다.
        procedureId:
          $ref: '#/components/schemas/ProcedureId'
        authorName:
          type: string
          example: 익명
        createdAt:
          type: string
          format: date
        viewCount:
          type: integer
        answerCount:
          type: integer

    QAPost:
      allOf:
        - $ref: '#/components/schemas/QAPostSummary'
        - type: object
          required: [answers]
          properties:
            answers:
              type: array
              items:
                $ref: '#/components/schemas/QAAnswer'
            isMine:
              type: boolean
              description: |
                로그인 요청에서만. 본인이 쓴 글인지. 수정·삭제 기능(🚧)의 전제가 된다.
                지금은 작성자가 전부 `익명` 이라 본인 글을 골라낼 방법이 없다.

    QAPostCreateRequest:
      type: object
      required: [title, content, procedureId]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: 앞뒤 공백 제거 후 1자 이상.
        content:
          type: string
          minLength: 1
          maxLength: 10000
          description: |
            앞뒤 공백 제거 후 1자 이상. **최대 길이를 서버가 정한다** — 지금은 글자 수 상한이 없다.
        procedureId:
          $ref: '#/components/schemas/ProcedureId'
        isAnonymous:
          type: boolean
          default: true
          description: |
            true 면 `authorName` 이 `익명` 으로 저장된다 (현재 동작과 동일).
            `authorName` 을 요청으로 받지 않는 이유는 위조를 막기 위해서다.

    # ---------------------------------------------------------------- 검색
    SearchTarget:
      oneOf:
        - type: object
          required: [kind, procedureId, label]
          properties:
            kind:
              type: string
              const: procedure
            procedureId:
              $ref: '#/components/schemas/ProcedureId'
            label:
              type: string
        - type: object
          required: [kind, hospitalId, label]
          properties:
            kind:
              type: string
              const: hospital
            hospitalId:
              type: string
            label:
              type: string
        - type: object
          required: [kind, doctorId, hospitalId, label]
          properties:
            kind:
              type: string
              const: doctor
            doctorId:
              type: string
            hospitalId:
              type: string
              description: |
                소속 병원. 전문의 상세 대신 병원 상세로 보내는 현재 동작을 유지할 수 있게 함께 준다.
            label:
              type: string
      description: |
        `kind` 로 분기한다. 인라인 스키마라 OpenAPI `discriminator` 를 붙이지 않았다 —
        `discriminator` 는 named schema 를 가리키는 `mapping` 이 필요하고, 그러려면 세 변형을
        각각 컴포넌트로 쪼개야 한다. 세 변형이 여기 밖에서 재사용되지 않으므로 인라인으로 두었다.
        클라이언트는 `kind` 를 판별자로 쓰면 된다 (`frontend/.../trendingSearches.ts` 의
        `SearchTarget` 유니온과 같은 형태다).

    SearchResults:
      type: object
      required: [query, procedures, hospitals, doctors]
      properties:
        query:
          type: string
        procedures:
          type: array
          items:
            $ref: '#/components/schemas/Procedure'
        hospitals:
          type: array
          items:
            $ref: '#/components/schemas/Hospital'
        doctors:
          type: array
          items:
            $ref: '#/components/schemas/Doctor'

    SearchTrend:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [up, down, same, new]
          description: '화면 표기: `▲ N`(빨강) / `▼ N`(파랑) / `－` / `NEW`(파랑).'
        delta:
          type: integer
          minimum: 1
          description: '`up`/`down` 일 때만.'

    TrendingSearchTerm:
      type: object
      required: [rank, term, trend, target]
      properties:
        rank:
          type: integer
          minimum: 1
        term:
          type: string
          example: 임플란트
        trend:
          $ref: '#/components/schemas/SearchTrend'
        target:
          $ref: '#/components/schemas/SearchTarget'

    SearchSuggestion:
      type: object
      description: 추천(광고) 검색어 알약 하나.
      required: [id, term, target]
      properties:
        id:
          type: string
        term:
          type: string
          example: 몰라몰라 PICK 인기 임플란트
        target:
          oneOf:
            - $ref: '#/components/schemas/SearchTarget'
            - type: 'null'
          description: |
            null 이면 검색창에 문구만 채운다 (현재 동작). 값이 있으면 곧바로 그 화면으로 이동한다 —
            문구가 이름과 안 맞아 결과가 안 나오는 지금 문제의 해결책이다.

    # ---------------------------------------------------------------- geo
    GeocodeResult:
      type: object
      required: [id, addressName, latitude, longitude]
      properties:
        id:
          type: string
        addressName:
          type: string
          description: 지번 주소.
          example: 서울 강남구 역삼동 736-3
        roadAddressName:
          type: string
          description: 도로명 주소. 카카오가 주지 않는 경우 생략된다.
          example: 서울 강남구 테헤란로 152
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    # ---------------------------------------------------------------- auth
    UserRole:
      type: string
      enum: [user, hospital_admin, operator]
      description: |
        `docs/decisions/0001-roles-and-pii.md` 결정 1.

        - `user` — 일반 사용자. 병원 탐색, 상담 신청, 찜, 커뮤니티
        - `hospital_admin` — 병원 담당자. **담당 병원**(`managedHospitalIds`)의 정보·전문의·상담만 다룬다
        - `operator` — 플랫폼 운영자. 전문의 인증 검수, 병원 생성, 담당자 지정, 입점 문의 심사.
          상담은 **조회만** 하고 이름·연락처는 마스킹된다

        `admin` 이라는 값은 존재하지 않는다. 알림의 `audience=admin` 은 역할이 아니라 **알림함** 이름이며
        `hospital_admin` 과 `operator` 가 함께 쓴다 — 혼동하지 않도록 주의한다.

    AuthProvider:
      type: string
      enum: [email, google, kakao]

    User:
      type: object
      required: [id, email, name, provider, role, managedHospitalIds]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
          description: 소문자로 정규화된 값.
        name:
          type: string
        provider:
          $ref: '#/components/schemas/AuthProvider'
        role:
          $ref: '#/components/schemas/UserRole'
        managedHospitalIds:
          type: array
          description: |
            `role=hospital_admin` 일 때 담당 병원 (`hospital_admins` M:N). **여러 개일 수 있다.**
            `role=user` 면 빈 배열이다.

            `role=operator` 도 **빈 배열**이다 — 운영자는 전 병원에 접근하지만 특정 병원의 "담당자" 는 아니다.
            클라이언트는 `role` 로 전체 권한을 판단하고, `managedHospitalIds` 는 담당자 화면의 범위 표시에만 쓴다.
            (운영자를 담당자로 지정하는 것은 `422 CANNOT_ASSIGN_OPERATOR` 로 막는다 — 자기 병원 전문의를
            스스로 검수할 수 있게 되어 역할 분리가 무너지기 때문이다)
          items:
            type: string
          example: [h1]

    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: 액세스 토큰 유효 시간(초).
          example: 900
        refreshExpiresIn:
          type: integer
          description: 리프레시 토큰 유효 시간(초).
          example: 2592000

    AuthSession:
      type: object
      required: [user, tokens]
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/TokenPair'

    SignUpRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 앞뒤 공백을 제거해 저장한다.
        email:
          type: string
          format: email
          maxLength: 254
          description: |
            **형식을 검사한다.** 지금은 `@` 없이도 가입된다. 앞뒤 공백 제거 + 소문자 변환 후 저장.
        password:
          type: string
          minLength: 6
          maxLength: 128
          description: |
            6자 이상 (현재 규칙 유지). 서버는 bcrypt/argon2 로 해시해 저장한다 —
            지금은 브라우저에 평문으로 저장된다.
        agreedTermsVersions:
          type: array
          description: |
            동의한 약관 버전. **회원가입에 약관 동의 절차가 지금 없다.** 미결 사항이며,
            도입되면 이 필드가 필수가 된다.
          items:
            type: object
            required: [slug, version]
            properties:
              slug:
                type: string
                enum: [terms, privacy, location]
              version:
                type: string

    LogInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
          description: 앞뒤 공백 제거 + 소문자 변환 후 비교.
        password:
          type: string
          maxLength: 128
          description: 입력한 그대로 비교 (대소문자·공백 구분).

    # ---------------------------------------------------------------- 기타
    LegalDocument:
      type: object
      required: [slug, title, version, effectiveAt, content, contentFormat]
      properties:
        slug:
          type: string
          enum: [terms, privacy, location, about]
        title:
          type: string
          example: 서비스 이용약관
        version:
          type: string
          description: 개정 버전. 회원가입 동의 기록이 이 값을 가리킨다.
          example: '1.0'
        effectiveAt:
          type: string
          format: date-time
          description: 시행일.
        content:
          type: string
        contentFormat:
          type: string
          const: markdown

    PartnerInquiryCreateRequest:
      type: object
      required: [hospitalName, contactName, phone]
      properties:
        hospitalName:
          type: string
          minLength: 1
          maxLength: 100
        contactName:
          type: string
          minLength: 1
          maxLength: 50
        phone:
          type: string
          pattern: '^0\d{1,2}-?\d{3,4}-?\d{4}$'
          description: 병원 대표번호도 올 수 있어 상담 신청보다 완화된 패턴이다.
        email:
          type: string
          format: email
          maxLength: 254
        region:
          type: string
          maxLength: 50
        message:
          type: string
          maxLength: 2000

    PartnerInquiryStatus:
      type: string
      enum: [received, reviewing, approved, rejected]
      description: |
        `received → reviewing → approved | rejected`. 종결 상태(`approved`/`rejected`)에서 되돌아갈 수 없다.

    PartnerInquiry:
      type: object
      description: |
        **`operator` 전용 응답.** 병원명·담당자 실명·연락처를 담으므로 상담 신청자 PII 와 같은 급으로 다룬다
        (`Cache-Control: no-store`, 상세 열람은 감사 로그 대상).

        **마스킹하지 않는다.** 운영자가 심사를 위해 직접 연락해야 하는 정보이고, 상담 신청자와 달리
        "연락하지 않아도 되는 역할" 이 존재하지 않는다. 마스킹은 열람자 중 일부에게만 연락 필요가 있을 때
        성립하는 장치다.
      required: [id, hospitalName, contactName, phone, status, receivedAt]
      properties:
        id:
          type: string
        hospitalName:
          type: string
        contactName:
          type: string
        phone:
          type: string
        email:
          type: [string, 'null']
          format: email
        region:
          type: [string, 'null']
        message:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/PartnerInquiryStatus'
        reviewNote:
          type: [string, 'null']
          description: 운영자 심사 메모. `rejected` 면 반려 사유가 반드시 있다.
        reviewedByName:
          type: [string, 'null']
          description: 심사한 운영자.
        reviewedAt:
          type: [string, 'null']
          format: date-time
        linkedHospitalId:
          type: [string, 'null']
          description: |
            이 문의로 만들어진 병원 id. 승인이 곧 병원 생성은 아니므로(문의 항목만으로는 병원 등록
            필수 항목을 채울 수 없다) 생성 후 연결한다.
        receivedAt:
          type: string
          format: date-time

    HospitalAdminAssignment:
      type: object
      description: |
        `hospital_admins` 한 행. 병원과 담당자 계정의 연결이다.
      required: [hospitalId, userId, email, name, role, assignedAt]
      properties:
        hospitalId:
          type: string
        userId:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
          description: 지정 직후에는 항상 `hospital_admin` 이다 (필요하면 승격된 결과).
        assignedAt:
          type: string
          format: date-time
        assignedByName:
          type: [string, 'null']
          description: 지정한 운영자. 감사 목적.
        managedHospitalCount:
          type: integer
          description: |
            이 계정이 담당하는 병원 총 개수. 해제 화면에서 "해제하면 담당 병원이 없어져 일반 사용자로
            돌아갑니다" 를 안내하는 근거다.
          example: 1
