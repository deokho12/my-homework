        홈의 `이런 꿀팁 어때요?` 영역 (8건, 좌우 스크롤). 이 영역에는 `전체보기` 가 없어서
        현재 화면 기준으로는 전량 조회 하나로 충분하지만, 편집 콘텐츠가 늘어날 것이므로 페이지네이션을 둔다.

        목록에는 본문(`content`)을 담지 않는다. 홈 카드가 쓰지 않는 긴 텍스트다.
      x-screens: [home.md, tip-detail.md]
      x-screen-status: "🟡"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: procedureId
          in: query
          schema:
            $ref: '#/components/schemas/ProcedureId'
      responses:
        '200':
          description: 꿀팁 목록
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/GuideSummary'
                  meta:
                    $ref: '#/components/schemas/PageMeta'

  /guides/{guideId}:
    parameters:
      - name: guideId
        in: path
        required: true
        schema:
          type: string
        example: g1
    get:
      operationId: getGuide
      tags: [content]
      summary: 시술 꿀팁 상세
      description: |
        `content` 는 빈 줄(`\n\n`)로 문단을 나눈 평문이다. 제목·목록·표·이미지 서식은 지원하지 않는다 —
        화면이 문단 단위로만 그린다.

        `relatedHospitalIds` 는 id 배열이고, 카드에 필요한 병원 데이터는 `GET /hospitals/{id}` 로 받는다.
        병원 객체를 여기 임베드하면 병원 정보가 바뀔 때 꿀팁 캐시까지 깨야 한다.
        연결된 병원이 삭제됐으면 그 id 는 응답에서 빠진다 (화면의 "그 카드만 조용히 빠집니다" 와 동일).

        꿀팁을 쓰거나 고치는 엔드포인트는 없다. 화면에도, 관리자 화면에도 그 기능이 없다.
      x-screens: [tip-detail.md]
      x-screen-status: "🟡"
      responses:
        '200':
          description: 꿀팁 상세
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideContent'
        '404':
          description: 꿀팁 없음 (화면 문구 `꿀팁 정보를 찾을 수 없어요`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: GUIDE_NOT_FOUND
                  message: 꿀팁 정보를 찾을 수 없어요
                  requestId: 01J9X8V0Q3

  /promotions:
    get:
      operationId: listPromotions
      tags: [content]
      summary: 이벤트(할인) 목록
      description: |
        네 화면이 같은 데이터를 쓴다: 홈의 `지금 진행중인 이벤트`, 이벤트 목록 화면,
        병원 카드의 `🔥` 배지·할인가(홈·탐색·찜 목록), 병원 상세의 `진행중인 이벤트` 영역.

        `hospitalId` 로 걸러 병원 상세용 단건 조회를 할 수 있고, 파라미터 없이 부르면 전량이 온다
        (카드 배지용으로 한 번 받아 두는 용도).

        **할인율은 서버가 계산해 `discountRate` 로 내려준다.** 지금은 화면마다 원가·할인가로 다시 계산한다.
        네 화면이 같은 숫자를 보여야 하므로 계산을 한 곳에 둔다.

        `startsAt`/`endsAt` 을 `nullable` 로 넣어 두었다. **현재 데이터에는 기간 정보가 아예 없다** —
        이벤트 화면이 `기간 한정 할인 혜택을 확인해보세요` 라고 안내하는데 남은 기간·마감일이 표시되지 않는
        원인이다. 기간이 채워지면 `activeOnly=true` 로 진행중인 것만 받을 수 있다.
      x-screens: [home.md, events.md, hospital-detail.md, explore.md, mypage.md]
      x-screen-status: "🟡"
      parameters:
        - name: hospitalId
          in: query
          schema:
            type: string
        - name: procedureId
          in: query
          schema:
            $ref: '#/components/schemas/ProcedureId'
        - name: activeOnly
          in: query
          description: |
            기간 안에 있는 이벤트만. `startsAt`/`endsAt` 이 둘 다 `null` 인 이벤트는 "기간 무제한" 으로 보아 포함된다.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: |
            이벤트 목록. **한 병원에 이벤트가 여러 개일 수 있다.** 병원 카드는 하나만 붙이는데
            현재 샘플에 겹친 경우가 없어 규칙이 정해지지 않았다 (`docs/features/events.md` 의 "확인 필요").
            서버는 병원별로 `startsAt` 최신순 → `id` 순으로 정렬해 첫 번째가 대표가 되도록 안정적인 순서를 보장한다.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Promotion'

