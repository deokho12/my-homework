  # =========================================================================
  # doctors
  # =========================================================================
  /doctors:
    get:
      operationId: listDoctors
      tags: [doctors]
      summary: 전문의 목록 (병원 탐색 `의사` 모드)
      description: |
        병원 탐색의 `의사` 모드. **조건 칩과 정렬이 병원 모드와 동일하게 적용되고 대상만 바뀐다** —
        화면 문서가 "선택해둔 시술·정렬·조건 필터는 그대로 유지되고 새 모드에 다시 적용됩니다" 라고 명시한다.

        `의사` 모드에서 조건 칩의 의미 (explore.md 의 표 그대로):
        - `상담가능` → 소속 병원이 상담을 받는 의사 (`consultAvailable`)
        - `원데이` → 소속 병원이 원데이 가능 (`oneDay`)
        - `전문의` → 본인이 인증 완료된 전문의 (`verifiedSpecialist`)
        - `진료시간` → 소속 병원이 야간상담 가능 (`nightConsult`)
        - `경력` → 본인 경력 10년 이상 (`minYearsOfExperience=10`)

        `상담가능`·`원데이`·`진료시간` 은 **소속 병원 속성으로 의사를 거르는** 조건이라 클라이언트에서
        하려면 병원 전체 목록이 필요하다. 서버 필터로 둔다.

        스폰서 우선 노출은 `의사` 모드에 적용되지 않는다 (현재 동작과 동일 — 광고는 병원 단위 상품이다).
      x-screens: [explore.md]
      x-screen-status: "✅"
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: hospitalId
          in: query
          schema:
            type: string
        - name: procedureId
          in: query
          schema:
            $ref: '#/components/schemas/ProcedureId'
        - name: recommended
          in: query
          schema:
            type: boolean
        - name: consultAvailable
          in: query
          description: 소속 병원이 상담을 받는 의사만.
          schema:
            type: boolean
        - name: oneDay
          in: query
          description: 소속 병원이 원데이 가능한 의사만.
          schema:
            type: boolean
        - name: verifiedSpecialist
          in: query
          description: 인증 완료(`approved`)이고 `일반의` 가 아닌 의사만.
          schema:
            type: boolean
        - name: nightConsult
          in: query
          description: 소속 병원이 야간상담 가능한 의사만.
          schema:
            type: boolean
        - name: minYearsOfExperience
          in: query
          schema:
            type: integer
            minimum: 0
        - name: sort
          in: query
          schema:
            type: string
            enum: [rating, reviewCount, consultCount]
            default: rating
        - name: q
          in: query
          description: 전문의 이름 부분 일치.
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: 조건에 맞는 전문의. `meta.totalItems` 가 화면의 `총 N명` 이다.
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Doctor'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /doctors/{doctorId}:
    parameters:
      - $ref: '#/components/parameters/DoctorId'
    get:
      operationId: getDoctor
      tags: [doctors]
      summary: 전문의 상세
      description: |
        전문의 상세 화면. 소속 병원 카드는 `GET /hospitals/{hospitalId}` 로 별도 조회한다
        (`hospitalId` 가 응답에 있다).

        **평점 잠금은 클라이언트 표현이 아니라 서버 응답으로 구현한다.** 비로그인 요청에는
        `rating` 이 `null` 로 내려간다. 현재는 반투명 흰 막을 덮는 방식이라 숫자가 뒤에 비쳐 보이고,
        응답을 직접 보면 그냥 노출된다. `reviewCount` 는 잠금 대상이 아니다 (화면이 비로그인에도 `후기 180` 을 보여준다).

        소속 병원이 삭제됐으면 `hospitalId` 는 유지되고 `GET /hospitals/{id}` 가 404 를 준다 —
        화면의 `소속 병원 정보를 찾을 수 없어요` + 하단 `상담 마감` 상태에 대응한다.
      x-screens: [doctor-detail.md]
      x-screen-status: "✅"
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: 전문의 상세. 비로그인이면 `rating` 이 `null`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
        '404':
          description: 전문의 없음 (화면 문구 `전문의 정보를 찾을 수 없어요`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: DOCTOR_NOT_FOUND
                  message: 전문의 정보를 찾을 수 없어요
                  requestId: 01J9X8V0Q3
    patch:
      operationId: updateDoctor
      tags: [doctors]
      summary: 전문의 단건 수정
      description: |
        `PUT /hospitals/{hospitalId}/doctors` 의 낱개 버전. 병원 폼 밖에서 한 명만 고칠 때 쓴다.
        재검수 규칙(`specialty`/`certificateUrl` 변경 → `pending` 복귀)이 동일하게 적용된다.
        `verificationStatus` 는 이 엔드포인트로 바꿀 수 없다 (`PUT /doctors/{doctorId}/verification` 전용,
        `operator` 만).

        인가: `hospital_admin` 은 그 전문의의 소속 병원이 담당 병원일 때만 (`403 HOSPITAL_NOT_MANAGED`),
        `operator` 는 전체.
      x-screens: [admin-hospital-edit.md]
      x-screen-status: "✅"
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorUpdateRequest'
      responses:
        '200':
          description: 수정된 전문의
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorAdminView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DoctorNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      operationId: deleteDoctor
      tags: [doctors]
      summary: 전문의 삭제
      description: |
        되돌릴 수 없다. `hospital_admin` 은 담당 병원의 전문의만, `operator` 는 전체.
      x-screens: [admin-hospital-edit.md]
      x-screen-status: "✅"
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DoctorNotFound'

  /doctors/verification-queue:
    get:
      operationId: listVerificationQueue
      tags: [doctors]
      summary: 전문의 인증 검수 목록
      description: |
        > **구현 주의:** 이 경로는 `GET /doctors/{doctorId}` 와 충돌한다. NestJS 는 선언 순서로 매칭하므로
        > 컨트롤러에서 `@Get('verification-queue')` 를 `@Get(':doctorId')` **앞에** 선언해야 한다.
        > 뒤에 두면 `verification-queue` 가 `doctorId` 로 잡혀 `404 DOCTOR_NOT_FOUND` 가 난다.
        > `GET /consult-requests/summary` vs `GET /consult-requests/{consultRequestId}` 도 같은 문제다.

        **`operator` 전용이다.** `/admin/specialists` 는 **모든 병원**의 전문의를 심사하는 화면이다.
        `hospital_admin` 에게 열면 남의 병원 전문의를 심사하게 되고, 자기 병원 전문의를 스스로 승인할 수도
        있다. 역할 분리로 이 구조적 문제가 해소됐다 (`docs/decisions/0001-roles-and-pii.md` 결정 1).
        `hospital_admin` 요청은 `403 FORBIDDEN` 이고, 클라이언트는 `role=operator` 가 아니면
        이 화면 진입 자체를 숨긴다.

        `GET /doctors` 와 분리한 이유 세 가지:

        1. **정렬 규칙이 다르다.** 항상 `대기 → 반려 → 승인`, 같은 상태 안에서는 등록 순. 공개 목록의 평점 정렬과 무관하다.
        2. **응답 필드가 다르다.** `certificateUrl`·`rejectionReason`·`hospitalName` 이 필요하고, 이건 공개 응답에 실려서는 안 된다.
        3. **검수 전 전공을 그대로 보여줘야 한다.** 공개 응답은 미승인 전공을 가리는데(`visibleSpecialty: null`),
           검수 화면은 바로 그 값을 판단해야 한다.

        현재 화면은 `일반의` 도 이 목록에 넣고 승인/반려 버튼을 함께 보여준다. `일반의` 는 검수할 자격증이 없고
        승인/반려가 사용자 화면 표시를 바꾸지도 않는다. 기본값으로 제외하고 `includeGeneralPractitioners=true`
        일 때만 넣는다.
      x-screens: [admin-specialists.md]
      x-screen-status: "✅"
      x-role: operator
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: 상태별 필터. 현재 화면에는 없다 (🚧 대비).
          schema:
            $ref: '#/components/schemas/VerificationStatus'
        - name: includeGeneralPractitioners
          in: query
          description: '`일반의` 를 목록에 포함할지. 기본 false.'
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 검수 대상 목록. `대기 → 반려 → 승인` 순.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VerificationQueueItem'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /doctors/{doctorId}/verification:
    parameters:
      - $ref: '#/components/parameters/DoctorId'
    put:
      operationId: decideDoctorVerification
      tags: [doctors]
      summary: 전문의 인증 승인·반려
      description: |
        **`operator` 전용이다.** 플랫폼이 자격증을 검증하는 행위이며, 병원 담당자는 신청(전문의 등록)만 하고
        판정에는 관여하지 않는다. 이전 초안에 있던 임시 방편(`403 SELF_VERIFICATION_FORBIDDEN` —
        자기 병원 전문의는 검수 금지)은 **제거했다.** 그 규칙은 역할이 둘뿐일 때의 우회였고, 결과적으로
        "다른 병원 담당자가 남의 병원 전문의를 심사하는" 이상한 구조를 남겼다. `operator` 가 생겨 불필요해졌다.

        **부수효과가 이 엔드포인트의 책임이다.** 결정을 저장하면서 같은 트랜잭션에서 처리한다:

        1. `verificationStatus` 를 `approved` / `rejected` 로 바꾼다
        2. `approved` → `rejectionReason` 을 `null` 로 지운다. `rejected` → `rejectionReason` 을 저장한다 (필수, 1자 이상)
        3. **그 전문의 소속 병원의 담당자 전원에게 `audience=admin` 알림을 만든다**
           (`type=system`, `relatedResource=doctor`, `relatedId=doctorId`).
           지금은 어떤 알림도 생기지 않아 병원이 검수 결과를 알 방법이 없다. 이것이 그 결함의 해결책이다.
           수신자는 `hospital_admins` 에 걸린 계정들이다 — 병원에 담당자가 아직 지정되지 않았다면
           알림은 만들어지지만 수신자가 0명이 된다 (승인 자체는 성공한다).
        4. **검수 기록을 남긴다** — 누가(`operator` 계정), 언제, 어떤 결정을, 어떤 사유로.
           현재는 반려 사유만 남고 승인 시 그것도 지워진다.

        `certificateUrl` 이 없는(미제출) 전문의도 승인할 수 있다 — 현재 동작을 유지한다.
        되돌리기(승인↔반려 재변경)도 허용한다.
      x-screens: [admin-specialists.md]
      x-screen-status: "✅"
      x-role: operator
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
            examples:
              approve:
                summary: 승인
                value:
                  status: approved
              reject:
                summary: 반려
                value:
                  status: rejected
                  rejectionReason: 자격증 이미지가 흐려서 발급기관을 확인할 수 없어요
      responses:
        '200':
          description: 결정이 반영된 전문의
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorAdminView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: '`operator` 가 아님. `hospital_admin` 이 호출한 경우 포함'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: FORBIDDEN
                  message: 이 작업을 수행할 권한이 없어요
                  requestId: 01J9X8V0Q3
        '404':
          $ref: '#/components/responses/DoctorNotFound'
        '422':
          description: '`rejected` 인데 `rejectionReason` 이 없음 등'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =========================================================================
  # consult-requests
  # =========================================================================
  /consult-requests:
    post:
      operationId: createConsultRequest
      tags: [consult-requests]
      summary: 상담 신청 접수
      description: |
        **서버가 막아야 하는 것 (지금 클라이언트만 막고 있는 것):**

        - `hospital.consultAvailable === false` → `409 CONSULT_CLOSED`.
          병원 상세에서는 버튼이 `상담 마감` 으로 잠기지만 `/consult/:hospitalId` 주소로 직접 들어가면 그대로 접수된다.
        - 로그인 필수. `401` 이면 화면이 로그인으로 보낸다.
        - `phone` 형식 검사. 지금은 `1` 한 글자나 `없음` 도 통과한다.
          `^01[016789]-?\d{3,4}-?\d{4}$` 를 만족해야 하고, 서버가 `010-1234-5678` 형태로 정규화해 저장한다.
        - `procedureId` 가 그 병원이 취급하는 시술인지 (`422 PROCEDURE_NOT_OFFERED`).
        - `doctorId` 가 그 병원 소속인지 (`422 DOCTOR_NOT_AT_HOSPITAL`).

        **`doctorId` 가 전문의 지정 상담을 해결한다.** 병원 상세·전문의 상세의 `전문의 상담신청` 이
        이 값을 채워 보내면 관리자가 어느 전문의를 지목했는지 알 수 있다. 지금은 `남기고 싶은 말` 칸에
        직접 적어야 한다.

        **부수효과:** 접수와 동시에 **그 병원의 담당자 전원**(`hospital_admins` 에 걸린 계정)에게
        `audience=admin` 알림을 만든다 (제목 `새로운 상담 신청`, 내용 `{name}님이 상담을 신청했어요`,
        `relatedResource=consultRequest`, `relatedId` = 상담 id).
        알림 생성은 이 엔드포인트의 책임이고, 별도의 알림 생성 API 는 없다.

        알림 내용에 신청자 이름이 들어가므로 **수신자는 담당자로 한정된다.** `operator` 는 이 알림을 받지 않는다 —
        운영자에게는 이름이 마스킹되어야 하는데 알림 문구에 이름이 박히면 마스킹이 무의미해진다.

        `userId` 는 요청 본문으로 받지 않고 액세스 토큰에서 가져온다. 이것이 사용자 상담 내역 조회와
        계정별 알림이 성립하는 근거다.

        중복 신청은 막지 않는다 (현재 동작 유지). 같은 병원에 여러 번 신청하면 그만큼 따로 접수된다.
      x-screens: [consult-request.md, hospital-detail.md, explore.md, doctor-detail.md]
      x-screen-status: "✅ 🔒"
      x-role: user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultRequestCreateRequest'
            examples:
              hospitalConsult:
                summary: 병원 상담신청
                value:
                  hospitalId: h1
                  procedureId: implant
                  name: 김민준
                  phone: 010-1234-5678
                  preferredTime: 평일 오전
                  message: ''
              doctorConsult:
                summary: 전문의 지정 상담신청
                value:
                  hospitalId: h1
                  doctorId: d1
                  procedureId: implant
                  name: 김민준
                  phone: 010-1234-5678
                  preferredTime: 주말
                  message: 김민준 원장님께 상담받고 싶어요
      responses:
        '201':
          description: 접수 완료 (신청자 시야)
          headers:
            Location:
              schema:
                type: string
                example: /v1/me/consult-requests/cr8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyConsultRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/HospitalNotFound'
        '409':
          description: 그 병원이 지금 상담을 받지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CONSULT_CLOSED
                  message: 지금은 이 병원의 상담 신청을 받지 않아요
                  requestId: 01J9X8V0Q3
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: listConsultRequests
      tags: [consult-requests]
      summary: 상담 목록 (관리자)
      description: |
        `/admin/consultations`. 신청일시 최신순.

        **범위와 개인정보가 역할에 따라 다르다:**

        | 역할 | 보이는 상담 | 이름 | 연락처 | `piiMasked` |
        |---|---|---|---|---|
        | `hospital_admin` | 담당 병원에 들어온 것만 | `박서영` | `010-1234-5678` | `false` |
        | `operator` | 전체 | `박*영` | `010-****-5678` | `true` |

        지금은 모든 병원의 상담이 한 목록에 섞여 나오고, 로그인 검사조차 없어 고객 실명·전화번호가
        주소만 알면 노출된다. 스코프와 마스킹이 이 엔드포인트의 핵심이다.

        운영자에게 목록을 여는 이유: 분쟁·CS 확인을 위해 상담의 **존재와 상태**는 봐야 한다.
        연락처가 필요한 경우는 드물어 마스킹으로 막았다 (`docs/decisions/0001-roles-and-pii.md` 결정 3).

        `Cache-Control: no-store`. 마스킹된 응답조차 캐시에 남으면 안 된다 —
        같은 URL 에 대해 역할별로 다른 본문이 나오므로 공유 캐시가 섞이면 유출이 된다.
        (같은 이유로 `Vary: Authorization` 을 함께 보낸다)
      x-screens: [admin-consultations.md]
      x-screen-status: "🟡"
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: 상태 필터 칩 (`전체` 는 이 파라미터를 보내지 않는 것).
          schema:
            $ref: '#/components/schemas/ConsultStatus'
        - name: hospitalId
          in: query
          description: |
            병원별 필터. 현재 화면에는 없다 (🚧). **`hospital_admins` 가 M:N 이라 한 담당자가 여러 병원을
            담당할 수 있으므로 실질적으로 필요하다.** `hospital_admin` 이 담당 병원 밖의 값을 보내면
            `403 HOSPITAL_NOT_MANAGED` (병원 존재는 공개 정보라 숨기지 않는다).
          schema:
            type: string
        - name: createdFrom
          in: query
          description: 기간 필터 시작 (포함). 현재 화면에는 없다 (🚧).
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          description: 기간 필터 끝 (포함). 현재 화면에는 없다 (🚧).
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          description: 신청자 이름·연락처 부분 일치. 현재 화면에는 없다 (🚧).
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: |
            상담 목록. `hospital_admin` 은 전체 값, `operator` 는 마스킹된 값.
            항목마다 `piiMasked` 가 실려 클라이언트가 "연락처가 가려져 있다" 는 안내를 띄울 수 있다.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Vary:
              schema:
                type: string
                example: Authorization
          content:
            application/json:
              schema:
                type: object
                required: [items, meta, scope]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsultRequest'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  scope:
                    type: string
                    enum: [managed, all]
                    description: '`managed` = 담당 병원만, `all` = 전체 (`operator`).'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /consult-requests/summary:
    get:
      operationId: getConsultSummary
      tags: [consult-requests]
      summary: 상담 현황 요약 (관리자 홈 숫자 카드)
      description: |
        관리자 홈의 숫자 카드 2개 (`이번 달 신규 상담`, `처리 대기 중인 상담`).

        전용 엔드포인트로 둔 이유:
        1. 지금은 상담 전체를 받아와 클라이언트가 센다 — 숫자 두 개를 보려고 고객 실명·전화번호를 전부 내려받는 셈이다.
        2. "이번 달" 이 **기기 시계**가 아니라 서버의 `Asia/Seoul` 달력 기준이어야 한다.
           `이번 달 신규 상담` 이 항상 0 인 현재 증상은 데이터 문제지만, 시간대 기준이 클라이언트에 있는 것도 함께 고쳐야 한다.
        3. 목록과 캐시 수명이 다르다 (요약은 짧게 캐시 가능, 목록은 `no-store`).

        스코프는 `GET /consult-requests` 와 동일하다 (`hospital_admin` = 담당 병원, `operator` = 전체).
        **개인정보를 담지 않으므로 마스킹 대상이 아니다** — 숫자 두 개뿐이다. 운영자 홈에서도 그대로 쓸 수 있다.
      x-screens: [admin-home.md]
      x-screen-status: "🟡"
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 요약 숫자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /consult-requests/{consultRequestId}:
    parameters:
      - $ref: '#/components/parameters/ConsultRequestId'
    get:
      operationId: getConsultRequest
      tags: [consult-requests]
      summary: 상담 상세 (관리자)
      description: |
        `/admin/consultations/:id`. `statusHistory` 와 `memos` 를 포함한다.
        `hospital_admin` 은 전체 PII, `operator` 는 마스킹.

        **담당 병원 밖의 상담이면 `404` 다 (`403` 이 아니다).** 병원과 반대 방향의 판단이며 근거가 다르다:
        상담은 공개 리소스가 아니고 **상담 id 는 고객 개인정보와 1:1로 대응**한다.
        `403` 을 주면 id 를 순차 대입해 "이 id 의 상담이 존재한다" 를 알아낼 수 있고, 그것만으로도
        건수·활동량이 새는 열거(enumeration) 경로가 된다. 존재 자체를 숨긴다.

        **감사 로그: 이 오퍼레이션은 열람 기록을 남긴다.** 마스킹으로 운영자 쪽 노출면을 막았으므로
        남는 노출면은 담당자 쪽이고(`docs/decisions/0001-roles-and-pii.md` 결정 3),
        상담 상세는 실명·전화번호·문의 내용·내부 메모가 한 화면에 모이는 자리다.
        기록 항목: 열람자 계정, 역할, 상담 id, 병원 id, 마스킹 여부, 시각, 요청 IP, `requestId`.
        응답 헤더 `X-Audit-Logged: true` 로 기록됐음을 알린다 (클라이언트 동작에 영향은 없고,
        감사 파이프라인 점검용이다).

        목록(`GET /consult-requests`)에도 실명·전화번호가 실리지만 열람 로그를 남기지 않는다 —
        상담 관리 화면이 목록을 반복 조회해서 로그가 의미 없이 불어난다. **목록은 접근 통계로,
        상세는 건별 열람 기록으로** 다루는 것이 실무적인 타협이다. 목록에서 대량 반출이 우려되면
        `pageSize` 상한(100)과 요청 한도가 1차 방어선이고, 엑셀 내려받기가 생기면 그때는 필수로 남긴다.
      x-screens: [admin-consultation-detail.md, admin-notifications.md]
      x-screen-status: "🟡"
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 상담 상세
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Vary:
              schema:
                type: string
                example: Authorization
            X-Audit-Logged:
              schema:
                type: boolean
              description: 열람 기록이 남았는지. 항상 `true` 다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            상담이 없거나 **담당 병원의 상담이 아님.** 두 경우를 구분하지 않는다 (열거 방지).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CONSULT_REQUEST_NOT_FOUND
                  message: 상담 정보를 찾을 수 없어요
                  requestId: 01J9X8V0Q3

  /consult-requests/{consultRequestId}/status:
    parameters:
      - $ref: '#/components/parameters/ConsultRequestId'
    patch:
      operationId: updateConsultStatus
      tags: [consult-requests]
      summary: 상담 상태 변경
      description: |
        **부수효과가 이 엔드포인트의 책임이다.** 상태가 실제로 바뀔 때만:

        1. `status` 갱신
        2. `statusHistory` 에 `{ status, changedAt }` 추가
        3. **그 상담을 신청한 사용자에게** `audience=user` 알림 생성
           (제목 `상담 상태 변경`, 내용 `상담 상태가 '{라벨}'(으)로 변경되었어요`, `relatedId` = 상담 id).
           수신자는 상담의 `userId` 다. 지금은 알림이 계정과 무관하게 쌓여서, 관리자가 상태를 바꾸면
           **관리자 자신의 알림함에도** 그 알림이 들어온다. `userId` 로 보내는 것이 그 결함의 해결책이다.
        4. 관리자 홈의 `처리 대기 중인 상담` 값이 함께 달라진다 (`GET /consult-requests/summary` 재조회)

        **같은 상태로 다시 요청하면 아무 부수효과 없이 `200` + 현재 리소스를 반환한다 (no-op).**
        지금은 `예약완료` 인 상담에 `예약완료` 를 다시 누르면 이력이 중복으로 쌓이고 사용자 알림도 또 생긴다.
        목록의 빠른 상태 버튼을 오탭하면 쉽게 발생하는데, 오탭으로 고객에게 중복 알림이 가는 것을 서버가 막는다.
        오류(4xx)로 만들지 않은 이유: 결과 상태는 요청자가 원한 상태와 같으므로 실패로 다룰 이유가 없다.

        `X-Status-Changed: true|false` 응답 헤더로 부수효과가 실제로 일어났는지 알려준다.

        **인가: `hospital_admin` 의 담당 병원 상담만이다. `operator` 는 상태를 바꿀 수 없다 (`403`).**
        상담 처리는 병원이 고객에게 연락하는 일이고, 운영자는 그 진행을 볼 뿐 대신 처리하지 않는다.
        운영자가 상태를 바꾸면 고객에게 "예약완료" 알림이 가는데 실제로 예약한 병원은 모르는 상태가 된다.
        조회(`GET`)와 변경(`PATCH`)의 역할 범위가 다른 것은 의도된 비대칭이다.

        `statusHistory` 에 `changedByName` 으로 처리자를 남긴다. 담당 병원 밖의 상담이면 `404` (상세와 동일).
      x-screens: [admin-consultations.md, admin-consultation-detail.md, notifications.md]
      x-screen-status: "✅"
      x-role: hospital_admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/ConsultStatus'
      responses:
        '200':
          description: |
            변경된 상담. `X-Status-Changed: false` 면 이미 그 상태였고 이력·알림이 추가되지 않았다는 뜻이다.
          headers:
            X-Status-Changed:
              schema:
                type: boolean
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ConsultRequestNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /consult-requests/{consultRequestId}/memos:
    parameters:
      - $ref: '#/components/parameters/ConsultRequestId'
    post:
      operationId: addConsultMemo
      tags: [consult-requests]
      summary: 내부 공유용 메모 추가
      description: |
        메모는 **신청자에게 절대 내려가지 않는다.** `MyConsultRequest` 에 `memos` 가 없는 것이 그 보장이다.
        지금은 "내부 공유용" 이라고만 적혀 있고 주소를 아는 누구나 읽을 수 있다.

        수정·삭제 엔드포인트는 만들지 않았다 (화면에 그 기능이 없다). `authorId`/`authorName` 을 함께 저장한다 —
        지금은 누가 남긴 메모인지 알 수 없다.

        **인가: `hospital_admin` 의 담당 병원 상담만. `operator` 는 메모를 쓸 수 없다 (`403`).**
        "내부 공유용" 의 내부는 병원이다. 다만 운영자는 `GET` 으로 메모를 **읽을 수 있다** —
        분쟁 시 처리 경과를 확인해야 하고, 메모에는 마스킹 대상 필드가 없다.
        메모에 고객 연락처를 적으면 마스킹을 우회하게 되므로, 화면에 그 안내가 필요하다 (미결 사항).
      x-screens: [admin-consultation-detail.md]
      x-screen-status: "✅"
      x-role: hospital_admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '201':
          description: 메모가 추가된 상담
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ConsultRequestNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /me/consult-requests:
    get:
      operationId: listMyConsultRequests
      tags: [consult-requests]
      summary: 내 상담 신청 내역
      description: |
        **지금 존재하지 않는 조회 경로다.** 마이페이지와 로그인 화면이
        `상담 신청 내역을 확인할 수 있어요` 라고 안내하는데, 신청 내용은 관리자 화면에만 나타난다.

        응답은 `MyConsultRequest` 로, 관리자용 `ConsultRequest` 와 **다른 투영(projection)** 이다:
        `memos` 를 담지 않고, 병원 이름·전문의 이름을 함께 내려준다 (신청자는 병원 id 를 모른다).
        같은 저장 구조에서 두 개의 응답 형태가 나오는 것이 의도된 설계다.

        최신순.
      x-screens: [mypage.md, login.md, notifications.md]
      x-screen-status: "🚧"
      x-role: user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ConsultStatus'
      responses:
        '200':
          description: 내 상담 신청 목록
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyConsultRequest'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/consult-requests/{consultRequestId}:
    parameters:
      - $ref: '#/components/parameters/ConsultRequestId'
    get:
      operationId: getMyConsultRequest
