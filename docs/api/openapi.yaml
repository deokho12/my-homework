    post:
      operationId: createHospital
      tags: [hospitals]
      summary: 병원 등록
      description: |
        `/admin/hospital/new` 의 `등록하기`. **`operator` 전용이다.**

        아무나 병원을 만들 수 있으면 안 된다 — 병원 정보는 환자가 시술을 결정하는 근거이므로
        검증 없이 생성되면 안 된다 (`docs/decisions/0001-roles-and-pii.md` 결정 2).
        입점 흐름은 이렇게 된다:

        ```
        POST /partner-inquiries (병원이 문의)
          → GET /partner-inquiries (운영자 심사)
          → POST /hospitals (운영자가 병원 생성)
          → POST /hospitals/{id}/admins (운영자가 담당자 지정)
        ```

        **등록자가 자동으로 담당자가 되는 설계는 폐기했다.** 운영자는 병원을 만들 뿐 담당자가 아니다.
        담당자 지정은 별도 오퍼레이션이며, `adminEmails` 를 함께 보내 한 번에 처리할 수도 있다.

        서버가 정하는 값 (요청으로 넘길 수 없다):
        `id`, `rating=0`, `reviewCount=0`, `consultCount=0`, 광고 관련 필드 전부(`isSponsored=false`,
        `sponsoredCategories=[]`, `sponsoredRank=null`, `sponsoredStartDate=null`, `sponsoredEndDate=null`).

        > 🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안): 이 오퍼레이션의 계약은 그대로다.**
        > 직접 가입(`POST /auth/signup/hospital-admin`)이 생겨도 **요청 스키마도 필수 항목도
        > 바뀌지 않는다.** 운영자 경로는 남는다 — 없어지는 것은 "유일한 경로" 라는 말뿐이고,
        > 대량 이관·대행 등록이 여전히 이 경로다 (결정 0001 변경 제안).
        >
        > 서버가 정하는 값에 **`approvalStatus='approved'` 가 더해진다** —
        > `approvalSource='operator'`, `approvalDecidedByUserId` = 요청한 운영자.
        > 기본값(`pending`)에 기대지 않고 **명시해서 쓴다.** 운영자가 만든 병원은 이미 검수를
        > 거친 것이고(결정 2 의 흐름), `pending` 으로 두면 운영자가 자기가 만든 병원을 자기가
        > 다시 승인해야 한다.
        >
        > DB §14.16 이 가입 경로를 위해 `thumbnail`·`priceRange` 의 **DB 기본값**을 제안하지만,
        > **이 계약은 느슨해지지 않는다** — 기본값은 폼이 그 값을 주지 않는 경로를 위한 것이고,
        > 운영자는 지금도 세 값을 다 받는다.

        > 🚧 **제안 — 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안), 요청 07 (§21):** 요청 스키마에
        > `procedures`·`tagline` 이 늘고, 합의되면 **`required` 의 `procedureIds` 가
        > `procedures` 로 바뀐다** (`minItems: 1` 유지 — 시술 0개 병원은 여전히 만들 수 없다).
        > 등록 화면은 `PATCH` 와 **같은 폼**이므로 가격·사진·특징 규칙도 그대로 같다
        > (검증·422 코드는 `HospitalProcedureInput` · `PATCH /hospitals/{id}` 설명 참고).
        > **등록 시점에는 머지와 교체의 차이가 없다** — 기존 행이 없기 때문이다.

        **`isRecommended`(에디터 추천)는 `operator` 만 설정할 수 있다.** 현재 폼에는 병원 관리자가 직접
        체크할 수 있는 `추천 병원으로 노출 (에디터 추천)` 체크박스가 있는데, 에디터 추천을 병원이
        스스로 켜는 것은 신뢰 문제다. 역할이 셋으로 갈리면서 이 항목의 주인이 명확해졌다 —
        `operator` 요청에서는 받고, `PATCH /hospitals/{id}` 의 `hospital_admin` 요청에서는 거절한다.

        `businessHours` 를 생략하면 서버가 기본 스케줄을 넣는다 (월~금 `09:30 - 18:30`, 토 `09:30 - 14:00`, 일 휴진).
        `thumbnail` 을 생략하면 서버가 기본 이미지 URL 을 넣는다.
      x-screens: [admin-hospital-new.md]
      x-screen-status: "✅"
      x-role: operator
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HospitalCreateRequest'
      responses:
        '201':
          description: 등록된 병원
          headers:
            Location:
              schema:
                type: string
                example: /v1/hospitals/h12
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hospital'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /hospitals/{hospitalId}:
    parameters:
      - $ref: '#/components/parameters/HospitalId'
    get:
      operationId: getHospital
      tags: [hospitals]
      summary: 병원 상세
      description: |
        병원 상세 화면의 본체. 의료진·후기·이벤트는 각각 별도 엔드포인트로 나눴다 —
        `frontend/src/lib/queryKeys.ts` 가 `hospitals.detail(id)` 와 `doctors.byHospital(hospitalId)` 를
        서로 다른 캐시 단위로 두고 있어, 하나의 응답에 합치면 전문의 수정이 병원 캐시까지 깨게 된다.

        - 의료진 → `GET /hospitals/{hospitalId}/doctors`
        - 후기 → `GET /hospitals/{hospitalId}/reviews`
        - 진행중인 이벤트 → `GET /promotions?hospitalId={hospitalId}`

        > 🚧 **제안 — 요청자 답 반영 대기 → 요청서 18 (2026-10-13 제안): 이 오퍼레이션에 시야가 둘 생긴다.**
        >
        > | 보는 사람 | 승인 대기·반려 병원 |
        > |---|---|
        > | 비로그인 · `user` · 담당이 아닌 `hospital_admin` | **`404 HOSPITAL_NOT_FOUND`** |
        > | 담당 `hospital_admin` · `operator` | `200` (관리 시야) |
        >
        > **`403` 이 아니라 `404` 인 것이 요점이다.** `docs/api/README.md` §3 의 "병원 존재는
        > 공개 정보라 숨겨서 얻는 것이 없다" 는 **이미 공개된 병원**을 말한다. 승인 전 병원은
        > 아직 공개 자원이 아니고, `403` 을 주면 "이 id 에 심사 중인 병원이 있다" 가 새어
        > id 대입으로 **입점 준비 중인 병원 수를 셀 수 있다.** `deleted_at` 된 병원을 `404` 로
        > 다루는 것과 같은 취급이다. `PATCH /hospitals/{id}` 의 `403 HOSPITAL_NOT_MANAGED` 는
        > 그대로다 — 그쪽은 **공개된 병원**에 대한 담당 범위 문제다.
        >
        > 이 시야 분기는 `GET` 하나에만 생긴다. 목록·검색·지도·전문의 등 **공개 질의 전부**는
        > 분기 없이 `isPubliclyListed` 를 건다 (적용 자리 전체: `docs/database/README.md` §14.4,
        > 요약은 `docs/api/README.md` §20).

        > 🚧 **제안 — 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안), 요청 07 (§21):** 이 응답이 병원 상세의
        > **`시술·가격` 섹션**을 먹여 살린다. 늘어나는 것은 `procedures[]`·`tagline` 과
        > `features` 의 키 4개뿐이고 **기존 필드는 그대로다.**
        > 시술별 가격과 전체 가격대 중 **무엇을 그릴지는 규칙 하나**로 정해진다
        > (`Hospital.priceRange` 설명의 표 — 응답에 둘 다 싣고 화면이 고른다).
        > **이 오퍼레이션만 `procedures` 를 싣는다** — 목록(`GET /hospitals`)은 지금 그대로다
        > (열린 질문 9).
      x-screens: [hospital-detail.md, consult-request.md, doctor-detail.md, events.md, notifications.md]
      x-screen-status: "✅"
      responses:
        '200':
          description: 병원 상세
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hospital'
        '404':
          description: |
            병원 없음 (화면 문구 `병원 정보를 찾을 수 없어요`).
            🚧 제안이 합의되면 **공개 시야에서 본 승인 대기·반려 병원**도 여기로 떨어진다 (위).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: HOSPITAL_NOT_FOUND
                  message: 병원 정보를 찾을 수 없어요
                  requestId: 01J9X8V0Q3
    patch:
      operationId: updateHospital
      tags: [hospitals]
      summary: 병원 정보 수정
      description: |
        부분 수정. 보낸 필드만 바뀐다.

        **인가:**
        - `hospital_admin` → `managedHospitalIds` 에 `hospitalId` 가 없으면 `403 HOSPITAL_NOT_MANAGED`.
          **지금은 병원 id 만 주소에 바꿔 넣으면 남의 병원을 고칠 수 있다.** 그것을 막는 것이 이 검사다.
        - `operator` → 전 병원.

        `404` 가 아니라 `403` 을 쓰는 이유: **병원은 공개 리소스다.** `GET /hospitals/{id}` 로 누구나
        존재를 확인할 수 있으므로 존재를 숨겨서 얻는 것이 없다. 반면 `403 HOSPITAL_NOT_MANAGED` 는
        "담당 병원이 아니다" 라는 정확한 원인을 알려주어, 담당자가 병원 id 를 잘못 넣은 경우를 구분할 수 있다.
        (비공개 리소스인 상담·입점 문의는 반대로 `404` 를 쓴다 — `docs/api/README.md` §3 참고)

        광고 관련 필드(`isSponsored`, `sponsoredCategories`, `sponsoredRank`, `sponsoredStartDate`,
        `sponsoredEndDate`)와 집계 필드(`rating`, `reviewCount`, `consultCount`)는 누구도 이 엔드포인트로
        바꿀 수 없다. `isRecommended` 는 **`operator` 만** 바꿀 수 있고 `hospital_admin` 요청에서는 거절된다.
        보내면 무시하지 않고 `422 FIELD_NOT_WRITABLE` 로 거절한다 — 조용히 무시하면 관리자 화면이
        "저장했는데 안 바뀐다" 는 상태가 된다 (현재 `대표 이미지 URL` 에서 실제로 겪고 있는 증상이다).

        > 🚧 **[제안] 요청자 답 반영 대기 → 요청서 19 (2026-10-13 제안). 확정 계약이 아니다** — 요청 07
        > (`docs/api/README.md` §21, 데이터 설계 `docs/database/README.md` §16).
        > 합의 전까지 구현하지 않는다.
        >
        > ⚠️ **이 오퍼레이션에서 가장 조용한 사고 지점이 하나 있다.** 지금 서버는 `procedureIds`
        > 배열로 `hospital_procedures` 행을 **전체 교체**한다(delete all → insert). 요청 07 이
        > 그 테이블에 가격 컬럼 3개를 올리는데 **교체 방식을 그대로 두면, 담당자가 병원 이름만
        > 고쳐 저장해도 시술별 가격이 전부 사라진다.** 화면에는 오류가 한 줄도 뜨지 않는다.
        >
        > 그래서 요청 본문의 모양과 저장 규칙이 함께 바뀐다:
        >
        > | | 지금 | 제안 |
        > |---|---|---|
        > | 요청 | `"procedureIds": ["implant", "inlay"]` | `"procedures": [{procedureId, priceMin?, priceMax?, priceOnRequest?}, …]` |
        > | 저장 | **전체 교체** | **머지** — upsert + 목록에 없는 행만 delete |
        > | 필드 생략 | 시술 불변 | **시술도 가격도 불변** (부분 수정의 뜻 그대로) |
        > | 둘 다 보냄 | — | **`422`** (우선순위 규칙을 만들지 않는다) |
        >
        > **사진은 반대로 전체 교체**다 (`images`) — 사진 행에는 행마다 붙은 입력값이 없고 순서가
        > 곧 전부라, 교체 + `sort_order` 0..n-1 재부여가 머지보다 단순하다. **첫 장이 대표**이고
        > 같은 트랜잭션이 `thumbnail` 을 그 값으로 동기화한다 (known-issue `대표 이미지를 바꿔도
        > 캐러셀이 그대로` 가 여기서 사라진다).
        >
        > **한 요청 = 한 트랜잭션.** 시술 머지 · 진료시간 · 사진 교체 · `thumbnail` 동기화 ·
        > 업로드 파일 claim 이 함께 커밋되거나 함께 롤백된다. 파일 **바이트**만 그 밖이다.
        > 파일 claim 은 **조건부 UPDATE** 다 (내 병원 것이거나 주인 없는 파일이고, 내가 올렸고,
        > 파기되지 않았을 때만) — 아니면 트랜잭션 전체를 되돌리고 `422 UPLOAD_NOT_FOUND` 다.
        > **id 가 추측하기 어려운 것은 통제가 아니다.**
        >
        > **파생 특징을 보내면 `422 FEATURE_NOT_WRITABLE`**: `features.nightCare`·`features.weekend`
        > 는 `businessHours` 가 정한다. 진료시간을 21:00까지로 바꾸면 **그 저장 하나로** 야간 진료
        > 칩이 켜진다 (요청서 07 의 확인 항목).
        >
        > **`422 details[].field` 는 인덱스 경로다** — `procedures[2].priceMin`, `images[11]`,
        > `tagline`. 폼이 그 줄의 그 칸을 짚어야 하기 때문이고, 묶음 키(`procedures`·`images`·
        > `tagline`)는 완성도 항목의 `target` 과 같은 어휘다.
        >
        > **저장 후 `저장됐어요` 안내와 `앱 화면 미리보기` 는 계약 변경이 0이다** — 전자는 `200`
        > 응답의 화면 표현이고, 후자는 폼이 들고 있는 **저장 전 값**으로 그리는 클라이언트 렌더다.
        > 임시저장(draft) 엔드포인트를 만들지 않는다: 서버에 "저장되지 않은 병원 정보" 라는 두 번째
        > 진실이 생기고, 어느 쪽이 환자에게 보이는지가 다시 결정 사항이 된다 (DB §16.8).
      x-screens: [admin-hospital-edit.md]
      x-screen-status: "✅"
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HospitalUpdateRequest'
      responses:
        '200':
          description: 수정된 병원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hospital'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/HospitalNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /hospitals/{hospitalId}/approval:
