  # =========================================================================
  # community
  # =========================================================================
  /community/posts:
    get:
      operationId: listCommunityPosts
      tags: [community]
      summary: 커뮤니티 질문 목록
      description: |
        최신순. 목록 카드에 `답변 N`·`조회 N` 이 필요하므로 `answerCount` 와 `viewCount` 를 함께 내려주고,
        `answers` 배열 자체는 목록에서 제외한다 (목록 카드가 답변 본문을 쓰지 않는다).

        `procedureId` 필터·`sort`·`q` 는 현재 화면에 없다 (🚧 — "검색창, 필터 칩, 정렬 버튼이 하나도 없습니다").
        앞으로 만들 것이라 파라미터를 함께 설계해 두었고, 지금 프론트엔드는 보내지 않는다.

        페이지네이션은 처음부터 넣는다. 현재는 "글이 많아지면 한 번에 다 그려집니다" 상태다.
      x-screens: [community.md]
      x-screen-status: "🟡"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: procedureId
          in: query
          description: 시술별 필터 (🚧 대비).
          schema:
            $ref: '#/components/schemas/ProcedureId'
        - name: sort
          in: query
          description: '`createdAt` = 최신순(기본, 현재 동작). 나머지는 🚧 대비.'
          schema:
            type: string
            enum: [createdAt, viewCount, answerCount]
            default: createdAt
        - name: q
          in: query
          description: 제목·본문 부분 일치 (🚧 대비).
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: 질문 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/QAPostSummary'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
    post:
      operationId: createCommunityPost
      tags: [community]
      summary: 질문 등록
      description: |
        **로그인을 요구한다.** 지금은 비로그인으로도 등록되고 작성자가 항상 `익명` 으로 저장되어,
        "내가 쓴 질문" 을 골라낼 방법이 없다.

        `authorName` 을 요청으로 받지 않는다. 서버가 토큰 주체에서 정한다:
        - `isAnonymous: true` (기본값) → `authorName` 을 `익명` 으로 저장하고 `authorId` 는 내부에만 남긴다.
          현재 화면 표시와 동일하되, 본인 글 식별과 신고 대응이 가능해진다.
        - `isAnonymous: false` → 계정 이름을 표시한다.

        기본값을 `true` 로 둔 이유: 지금 올라간 글이 모두 `익명` 이라, 기본을 실명으로 바꾸면
        같은 목록에서 표시 규칙이 갑자기 갈린다. 어느 쪽을 기본으로 할지는 제품 판단이며
        `docs/api/README.md` 의 미결 사항에 올려 두었다.

        `createdAt` 은 날짜만 저장한다 (`YYYY-MM-DD`). 기존 동작·기존 데이터와 맞추기 위한 것이고,
        시각까지 저장해야 한다면 마이그레이션이 필요하다.
      x-screens: [community-new.md, community.md]
      x-screen-status: "✅"
      x-role: user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QAPostCreateRequest'
      responses:
        '201':
          description: 등록된 질문
          headers:
            Location:
              schema:
                type: string
                example: /v1/community/posts/q5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAPost'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /community/posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      operationId: getCommunityPost
      tags: [community]
      summary: 질문 상세 (답변 포함)
      description: |
        답변은 이 응답에 포함된다 (`answers`). 별도 엔드포인트로 나누지 않은 이유:
        답변 수가 한 자릿수이고, 상세 화면이 항상 본문과 함께 그린다. 프론트엔드의
        `queryKeys.communityPosts.detail(id)` 캐시 단위와도 일치한다.

        **조회수는 이 GET 이 올리지 않는다.** `POST /community/posts/{postId}/views` 를 따로 호출해야 한다.
        GET 이 상태를 바꾸면 캐시·프리페치·재시도가 모두 조회수를 부풀린다.
      x-screens: [community-post.md]
      x-screen-status: "🟡"
      responses:
        '200':
          description: 질문 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAPost'
        '404':
          description: 질문 없음 (화면 문구 `질문을 찾을 수 없어요`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: POST_NOT_FOUND
                  message: 질문을 찾을 수 없어요
                  requestId: 01J9X8V0Q3

  /community/posts/{postId}/views:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      operationId: recordPostView
      tags: [community]
      summary: 조회수 집계
      description: |
        인증이 필요하지 않다 (비로그인도 글을 읽는다).

        **중복 집계 방침이 현재 동작과 다르다.** 지금은 상세 화면을 열 때마다 무조건 1 오르고,
        같은 사람이 다시 봐도 계속 증가해서 실제 조회 수와 무관한 값이 된다.
        서버는 (로그인 사용자 id 또는 요청자 지문) × 글 id 조합으로 **24시간 중복을 제거**한다.
        중복이면 `viewCounted: false` 와 현재 값만 반환한다.

        동작 변경이므로 `docs/api/README.md` 의 미결 사항에 올려 두었다.
      x-screens: [community-post.md, community.md]
      x-screen-status: "✅"
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: 집계 결과
          content:
            application/json:
              schema:
                type: object
                required: [postId, viewCount, viewCounted]
                properties:
                  postId:
                    type: string
                  viewCount:
                    type: integer
                    example: 313
                  viewCounted:
                    type: boolean
                    description: 이번 호출로 실제로 1 올랐는지. 24시간 내 중복이면 false.
        '404':
          $ref: '#/components/responses/PostNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /community/posts/{postId}/answers:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      operationId: createCommunityAnswer
      tags: [community]
      summary: 답변 작성
      description: |
        **지금 앱 어디에도 답변을 쓸 화면이 없다.** 답변은 샘플 데이터에만 있고, 새로 쓴 질문은
        영구히 `아직 답변이 없어요` 로 남는다. 이 엔드포인트가 그 결함의 해결책이다.

        **`isDentist` 를 요청으로 받지 않는다.** 서버가 작성자의 인증 상태에서 유도한다 —
        작성자가 어느 병원의 `verificationStatus=approved` 전문의로 연결된 계정이면 `true`.
        `치과의사 답변` 배지는 신뢰 표시라서 클라이언트가 정할 수 있으면 안 된다.
        지금은 배지가 샘플 데이터의 플래그일 뿐 실제 인증과 연결되어 있지 않다.

        `authorName` 도 서버가 정한다. 답변은 익명을 허용하지 않는다 — 의료 정보에 답하는 주체는
        드러나야 한다는 판단이며, 이것도 미결 사항에 올려 두었다.
      x-screens: [community-post.md, community.md]
      x-screen-status: "🚧"
      x-role: user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        '201':
          description: 작성된 답변
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAAnswer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/PostNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

