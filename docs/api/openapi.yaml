  # =========================================================================
  # hospital-inquiries (병원 문의)
  #
  # 🚧 서버에 inquiry 모듈이 아직 없다 — 이 절 일곱 오퍼레이션은 전부 계약이 구현보다
  #    먼저 간 것이다 (`POST /consult-requests` 와 같은 상태). 구현 전까지는 프론트엔드의
  #    저장 계층(`frontend/src/lib/localCollection.ts`)이 같은 모양을 흉내 낸다.
  #    근거: docs/features/requests/2026-10-12-03-문의-기능-신규.md,
  #         docs/api/README.md §3 · §4 · §9 · §14 (`hospital_inquiries`)
  #
  # 읽는 화면은 셋이고 저장 구조는 하나다:
  #   - 사용자 `문의하기` + 마이페이지 `내 문의`  → POST /hospital-inquiries, GET /me/inquiries
  #   - 병원 관리자 `문의`                        → GET /hospital-inquiries(+/summary, /{id}, /{id}/answer)
  #   - 병원 상세 `문의` 탭 (공개 Q/A)            → GET /hospitals/{id}/inquiries
  #
  # 화면 문서: `docs/features/inquiry.md`(사용자 문의하기), `docs/features/admin-inquiries.md`(관리자 문의) — 2026-10-12 추가.
  # =========================================================================
  /hospital-inquiries:
    post:
      operationId: createHospitalInquiry
      tags: [hospital-inquiries]
      summary: 병원 문의 접수
      description: |
        병원 상세의 `문의하기` 버튼으로 들어오는 작성 화면(U8)의 상대편이다. **로그인 필수.**

        **상담 신청과 무엇이 다른가.** 문의는 **연락처 없이 앱 안에서 답을 받는 창구**다.
        그래서 이름·전화번호를 받지 않고, 받지 않으므로 **개인정보 제3자 제공 동의(`thirdPartyConsent`)가
        없다** — 병원에 넘길 개인정보가 없다. 문의자 식별은 액세스 토큰의 `sub` 로만 하고,
        관리자 화면에는 `users.name` 을 **항상 마스킹**해서 보여준다 (§4 · `HospitalInquiry.askerName`).

        **경로에 `hospitalId` 를 두지 않은 이유.** `/hospitals/{id}/inquiries` 는 §3 에서
        **"누구나 보는 공개 Q/A 목록"** 이라는 뜻으로 쓰는 경로다 (`/me`·`/admin` 어디에도 속하지 않는 것이
        그 표시다). 같은 경로에 로그인 필수 쓰기를 올리면 그 표시가 흐려진다.
        `POST /consult-requests` 가 `hospitalId` 를 본문으로 받는 것과 같은 모양으로 맞췄다.

        **서버가 막는 것:**

        - 존재하지 않는 병원 → `404 HOSPITAL_NOT_FOUND`.
        - `topic` 누락·미지원 값 → `422 VALIDATION_FAILED` (`details[].code: TOPIC_REQUIRED`).
          **기본값이 없다** — 고르지 않으면 접수되지 않는다 (§14).
        - `content` 가 **앞뒤 공백 제거 후** 5자 미만/1000자 초과 → `422 VALIDATION_FAILED`
          (`CONTENT_TOO_SHORT` / `CONTENT_TOO_LONG`). 화면도 같은 규칙으로 버튼을 잠그지만
          판정의 주체는 서버다. 저장은 **trim 한 값**으로 한다.
        - 도배 방지 규칙은 아직 없다 (§14 "정하지 않은 것"). 1차 방어선은 요청 한도 **계정당 10회/시간**
          이고 초과하면 `429` 다.

        `consultAvailable` 은 보지 않는다. 상담을 받지 않는 병원에도 **질문은 할 수 있다** —
        문의는 예약 창구가 아니다. (`POST /consult-requests` 의 `409 CONSULT_CLOSED` 와 대비된다)

        **부수효과가 없는 것이 이 엔드포인트의 특징이다.** 새 문의가 들어와도 **관리자 알림을 만들지 않는다**
        (§9 · §14). 관리자 사이드 메뉴의 배지는 알림 수가 아니라 **미답변 수**이고,
        그 값은 `GET /hospital-inquiries/summary` 의 `unanswered` 가 준다. 알림을 함께 만들면
        같은 사실이 두 곳에 쌓이고 둘이 어긋난다.
      x-screens: [inquiry.md, hospital-detail.md]
      x-screen-status: "🚧 🔒"
      x-role: user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HospitalInquiryCreateRequest'
            examples:
              publicPrice:
                summary: 가격 문의 (공개, 기본값)
                value:
                  hospitalId: h1
                  topic: price
                  content: 임플란트 1개 비용이 대략 얼마인가요? 뼈이식이 필요하면 추가 비용이 있는지도 궁금해요.
                  isPublic: true
              privateProcedure:
                summary: 시술 방법 문의 (비공개로 전환)
                value:
                  hospitalId: h1
                  topic: procedure
                  content: 교정 중인데 앞니만 따로 치료할 수 있는지 궁금합니다.
                  isPublic: false
      responses:
        '201':
          description: |
            접수 완료 (문의자 시야). 완료 화면과 `내 문의 보기` 가 목록을 다시 조회하지 않아도 되도록
            `MyHospitalInquiry` 전체 투영을 내려준다 (`POST /consult-requests` 와 같은 판단).
          headers:
            Location:
              schema:
                type: string
                example: /v1/me/inquiries
              description: |
                `/me/inquiries` 목록을 가리킨다. **문의 단건 조회 경로는 만들지 않았다** —
                `GET /me/inquiries` 설명 참고.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyHospitalInquiry'
              example:
                id: hi9
                hospitalId: h1
                hospitalName: 강남 스마일 치과
                topic: price
                content: 임플란트 1개 비용이 대략 얼마인가요? 뼈이식이 필요하면 추가 비용이 있는지도 궁금해요.
                isPublic: true
                status: unanswered
                answer: null
                createdAt: '2026-10-12T04:21:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/HospitalNotFound'
        '422':
          description: |
            주제 미선택 또는 내용 길이 위반. 거절 사유가 **입력칸 단위**라 `VALIDATION_FAILED` + `details[]`
            하나로 다룬다 (`POST /consult-requests` 처럼 코드를 갈라야 할 "형식은 맞는데 조건에 안 맞는"
            규칙이 이 폼에는 없다 — 병원·시술 교차 검증이 없기 때문이다).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                topicRequired:
                  summary: 주제를 고르지 않음
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: 입력값을 확인해주세요
                      details:
                        - field: topic
                          code: TOPIC_REQUIRED
                          message: 문의 주제를 선택해주세요
                      requestId: 01J9X8V0Q3
                contentTooShort:
                  summary: 내용이 5자 미만
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: 입력값을 확인해주세요
                      details:
                        - field: content
                          code: CONTENT_TOO_SHORT
                          message: 문의 내용을 5자 이상 입력해주세요
                      requestId: 01J9X8V0Q3
                contentTooLong:
                  summary: 내용이 1000자 초과
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: 입력값을 확인해주세요
                      details:
                        - field: content
                          code: CONTENT_TOO_LONG
                          message: 문의 내용은 1000자까지 쓸 수 있어요
                      requestId: 01J9X8V0Q3
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: listHospitalInquiries
      tags: [hospital-inquiries]
      summary: 문의 목록 (관리자)
      description: |
        병원 관리자 `문의` 화면의 왼쪽 목록. 접수 최신순 (`전체` 탭), `미답변` 탭도 같은 정렬이다.

        **범위가 역할에 따라 다르다 — `GET /consult-requests` · `GET /admin/hospitals` 와 같은 모양이고
        세 번째 사례다** (§3). 그래서 응답에 `scope` 를 넣는다. 목록이 0건일 때
        `담당 병원이 아직 지정되지 않았어요` 와 `아직 들어온 문의가 없어요` 를 화면이 구분해야 한다.

        | 역할 | 보이는 문의 | 답변 |
        |---|---|---|
        | `hospital_admin` | 담당 병원에 들어온 것만 (공개·비공개 전부) | 가능 |
        | `operator` | 전체 | **불가** (`POST .../answer` → `403`) |

        **문의자 이름은 역할과 무관하게 항상 마스킹된다** (`김*준`). 연락처는 컬럼 자체가 없다.
        그래서 `piiMasked` 플래그가 없다 — 역할에 따라 갈리는 값이 하나도 없어서 플래그가 가리킬 차이가 없다
        (§4 · `Review.authorName` 과 같은 경우).

        **감사 로그를 남기지 않는다** (§4). 감사가 답하는 질문은 "누가 마스킹되지 않은 개인정보를 봤는가"
        인데 그 질문에 해당하는 행이 여기서는 한 건도 생기지 않는다.

        `Cache-Control: no-store` + `Vary: Authorization`. 같은 URL 이 역할별로 다른 본문을 돌려주고
        본문에 환자가 적은 증상·예산이 들어 있다.

        **탭의 세 숫자(`미답변 N · 답변완료 N · 전체 N`)는 이 응답의 `meta` 로 만들지 않는다.**
        `meta.totalItems` 는 **지금 건 필터의 건수 하나**뿐이라 세 숫자를 채우려면 요청이 셋 필요하고,
        탭을 옮길 때마다 나머지 둘이 낡은 값으로 남는다. 세 숫자는
        `GET /hospital-inquiries/summary` 한 번으로 받는다. 두 값은 항상 일치해야 한다 —
        `status=unanswered` 목록의 `meta.totalItems` 와 요약의 `unanswered` 는 같은 순수 함수
        (`inquiryStatus`, §14)로 계산한다.
      x-screens: [admin-inquiries.md]
      x-screen-status: "🚧"
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: |
            상태 탭. `전체` 는 이 파라미터를 보내지 않는 것이다
            (불리언 필터와 같은 규약 — 꺼진 조건은 아예 보내지 않는다, §5).
          schema:
            $ref: '#/components/schemas/InquiryStatus'
        - name: hospitalId
          in: query
          description: |
            병원별 필터. **`hospital_admins` 가 M:N 이라 한 담당자가 여러 병원을 담당할 수 있어
            실질적으로 필요하다** (`GET /consult-requests` 와 같은 이유).
            `hospital_admin` 이 담당 병원 밖의 값을 보내면 `403 HOSPITAL_NOT_MANAGED` —
            **병원 존재는 공개 정보라 숨기지 않는다.** 문의 단건(`/{id}`)이 `404` 인 것과 다른 이유다.
          schema:
            type: string
        - name: topic
          in: query
          description: 주제 필터. 현재 화면에는 없다 (🚧). 목록 항목이 주제를 표시하므로 대비해 둔다.
          schema:
            $ref: '#/components/schemas/InquiryTopic'
      responses:
        '200':
          description: 문의 목록 (관리자 시야)
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Vary:
              schema:
                type: string
                example: Authorization
          content:
            application/json:
              schema:
                type: object
                required: [items, meta, scope]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HospitalInquiry'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  scope:
                    type: string
                    enum: [managed, all]
                    description: '`managed` = 담당 병원만, `all` = 전체 (`operator`).'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /hospital-inquiries/summary:
    get:
      operationId: getHospitalInquirySummary
      tags: [hospital-inquiries]
      summary: 문의 현황 요약 (관리자 탭 숫자 · 사이드 메뉴 배지)
      description: |
        숫자 세 개를 한 번에 준다. **두 화면이 같은 응답을 쓴다:**

        - 문의 화면의 상태 탭 — `미답변 N` · `답변완료 N` · `전체 N`
        - 관리자 홈 사이드 메뉴 배지 — `unanswered` 하나

        **배지가 "안 읽은 수" 가 아니라 "미답변 수" 인 이유** (§14): 읽음을 따로 저장하려면
        (관리자 × 문의) 테이블이 필요한데, 담당자가 여럿일 때 누구 기준인지 화면이 정의하지 않았다.
        미답변 수는 담당자가 누구든 같은 숫자다.

        **전용 엔드포인트로 둔 근거는 `GET /consult-requests/summary` 와 같다** — 숫자 세 개를 보려고
        문의 본문(환자가 적은 증상·예산)을 전부 내려받지 않는다. 다만 요약에는 **시간대가 없다.**
        상담 요약의 `이번 달` 과 달리 달력 경계로 갈리는 값이 하나도 없어서 `timezone` 을 둘 이유가 없다.

        스코프는 `GET /hospital-inquiries` 와 같다 (`hospital_admin` = 담당 병원 전부 합산,
        `operator` = 전체). 개인정보가 없는 숫자뿐이라 마스킹 대상이 아니다.
      x-screens: [admin-inquiries.md, admin-home.md]
      x-screen-status: "🚧"
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      parameters:
        - name: hospitalId
          in: query
          description: |
            특정 병원으로 좁힌 요약. 목록의 `hospitalId` 필터와 짝이다 — 병원을 고른 상태의 탭 숫자가
            목록과 어긋나지 않으려면 요약도 같은 범위로 좁혀져야 한다.
            담당 병원 밖이면 `403 HOSPITAL_NOT_MANAGED`.
          schema:
            type: string
      responses:
        '200':
          description: 요약 숫자
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Vary:
              schema:
                type: string
                example: Authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalInquirySummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /hospital-inquiries/{inquiryId}:
    parameters:
      - $ref: '#/components/parameters/HospitalInquiryId'
    get:
      operationId: getHospitalInquiry
      tags: [hospital-inquiries]
      summary: 문의 상세 (관리자)
      description: |
        관리자 문의 화면 오른쪽 상세. 목록 항목과 **같은 스키마**(`HospitalInquiry`)다 —
        본문이 목록에도 전문으로 실리고 답변 외에 더 보여줄 것이 없어서 투영을 나누지 않았다
        (상담은 `memos`·`statusHistory` 때문에 상세가 구조적으로 더 컸다).
        그래도 경로를 둔 이유는 **새로고침·딥링크로 상세만 열리는 경우**와 답변 등록 후의 재조회다.

        **담당 병원 밖이거나 없는 문의면 `404 HOSPITAL_INQUIRY_NOT_FOUND` 다 (`403` 이 아니다).**
        병원·전문의와 반대 방향의 판단이며 근거가 다르다 (§3): 문의 id 는 **공개 Q/A 로 노출되지 않는
        건까지 포함**하므로 공개 자원이 아니다. `403` 을 주면 id 대입으로 "이 병원에 비공개 문의가 몇 건
        있다" 가 새고, 그것이 §14 가 공개 카운트의 모집단을 좁혀서까지 막은 바로 그 정보다.

        **감사 로그를 남기지 않는다.** 상담 상세(`GET /consult-requests/{id}`)와 갈리는 지점이고
        근거는 §4 다 — 응답에 전화번호가 없고 이름은 누구에게나 마스킹된다. 기록해도
        `pii_masked = true` 행만 쌓여 "누가 마스킹되지 않은 개인정보를 봤는가" 라는 질의를 오염시킨다.
        그래서 이 오퍼레이션에는 `X-Audit-Logged` 헤더가 없다.
      x-screens: [admin-inquiries.md]
      x-screen-status: "🚧"
      x-role: [hospital_admin, operator]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 문의 상세 (관리자 시야)
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Vary:
              schema:
                type: string
                example: Authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalInquiry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/HospitalInquiryNotFound'

  /hospital-inquiries/{inquiryId}/answer:
    parameters:
      - $ref: '#/components/parameters/HospitalInquiryId'
    post:
      operationId: answerHospitalInquiry
      tags: [hospital-inquiries]
      summary: 문의 답변 등록
      description: |
        관리자 문의 화면의 `답변 등록`. **담당 `hospital_admin` 전용이다.**

        **`operator` 는 답변할 수 없다 (`403 OPERATOR_CANNOT_ANSWER`).** 조회는 되는데 쓰기는 안 되는
        비대칭이고 근거는 상담 상태 변경과 같다 (§3): 답변은 **그 병원의 진료시간·가격을 말하는 행위**이고,
        등록 즉시 환자에게 알림이 가고 공개 Q/A 로 노출될 수 있다. 운영자가 대신 답하면
        그 병원이 하지 않은 말이 병원 이름으로 남는다.

        **한 번만 등록할 수 있다 — 수정이 없다** (§14). 이미 답변된 문의에 다시 보내면
        `409 INQUIRY_ALREADY_ANSWERED` 다. 공개 Q/A 는 환자가 읽는 의료광고 성격 문구이고,
        `문의에 답변이 왔어요` 알림을 받고 본 내용이 나중에 조용히 바뀌면 그 알림이 거짓이 된다.
        구현은 `answered_at IS NULL` **조건부 쓰기**여야 한다 — 동시 요청 두 개 중 하나만 성공하고
        알림도 한 번만 나간다. (수정이 허용되는 날 `PATCH` 와 답변 이력 테이블, 감사 액션 한 줄이 함께 온다)

        **`isPublic` 은 병원의 선택이고 기본값이 없다.** 환자의 `isPublic` 과 **둘 다 `true` 여야**
        공개 Q/A 에 노출된다 (§14 `isPubliclyVisible`). 기본값을 두면 "아직 안 물어봤다" 와
        "병원이 비공개를 골랐다" 가 같은 값이 되고, 서버가 공개 여부를 대신 고르는 셈이 된다.

        **부수효과 — 문의자에게 알림 1건** (§9). 이 엔드포인트의 책임이며 별도 알림 생성 API 는 없다:

        | 항목 | 값 |
        |---|---|
        | 수신자 | 그 문의의 `userId` **한 명** |
        | `audience` | `user` |
        | `type` | `inquiry-answer` (신규 값) |
        | `consultStatus` | **`null`** — 상담 알림이 아니다 (2026-10-13) |
        | `title` | `문의에 답변이 왔어요` |
        | `message` | `{병원명} · {답변 앞 60자}` (60자를 넘으면 `…`) |
        | `relatedResource` | `hospitalInquiry` (신규 값) |
        | `relatedId` | 문의 id |

        **알림 문구에 문의자 이름을 넣지 않는다.** 새 상담 알림(`김민준님이 상담을 신청했어요`)과 달리
        받는 사람이 본인이라 이름이 쓸모가 없고, 문구에 이름이 박히는 순간 마스킹 경계가 또 하나 생긴다.

        **알림을 누르면 마이페이지 `내 문의` 의 그 문의가 펼쳐진 채 열린다** (`relatedId` = 문의 id 만으로 충분).
        병원 상세의 공개 Q/A 로 보내지 않는 이유: 비공개로 물었거나 병원이 비공개로 답한 건은 그곳에 없고,
        알림만 보고는 공개 여부를 알 수 없다. 내 문의에서는 공개·비공개 답변을 모두 읽을 수 있고,
        거기서 병원 상세로 가는 길도 있다. 그래서 알림에 `hospitalId` 를 따로 싣지 않는다.
      x-screens: [admin-inquiries.md, notifications.md]
      x-screen-status: "🚧"
      x-role: hospital_admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HospitalInquiryAnswerRequest'
            examples:
              publicAnswer:
                summary: 공개 허용 (`자주 쓰는 답변` 으로 채운 문구)
                value:
                  content: 평일은 오전 10시부터 오후 7시까지, 토요일은 오후 2시까지 진료합니다. 점심시간은 오후 1시부터 2시까지예요.
                  isPublic: true
              privateAnswer:
                summary: 이 건만 비공개로
                value:
                  content: 말씀하신 증상은 직접 보고 판단해야 해서, 방문 상담을 권해드려요.
                  isPublic: false
      responses:
        '201':
          description: |
            답변이 등록된 문의 (관리자 시야). 화면이 이 응답만으로 항목을 `답변완료` 탭으로 옮길 수 있게
            전체 투영을 내려준다. 탭 숫자와 배지는 `GET /hospital-inquiries/summary` 를 다시 조회한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalInquiry'
              example:
                id: hi9
                hospitalId: h1
                hospitalName: 강남 스마일 치과
                askerName: 김*준
                topic: price
                content: 임플란트 1개 비용이 대략 얼마인가요? 뼈이식이 필요하면 추가 비용이 있는지도 궁금해요.
                isPublic: true
                status: answered
                answer:
                  content: 임플란트는 재료에 따라 90만원부터 150만원 사이입니다. 뼈이식이 필요하면 별도 비용이 발생해요.
                  isPublic: true
                  answeredAt: '2026-10-12T06:10:00.000Z'
                createdAt: '2026-10-12T04:21:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            역할 부족. **`operator` 가 답변을 시도한 경우가 여기 들어온다** — 조회는 되지만 답변은 안 된다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                operator:
                  summary: 운영자는 병원을 대신해 답할 수 없다
                  value:
                    error:
                      code: OPERATOR_CANNOT_ANSWER
                      message: 운영자는 병원을 대신해 답변할 수 없어요
                      requestId: 01J9X8V0Q3
                role:
                  summary: 그 밖의 역할 부족
                  value:
                    error:
                      code: FORBIDDEN
                      message: 이 작업을 수행할 권한이 없어요
                      requestId: 01J9X8V0Q3
        '404':
          $ref: '#/components/responses/HospitalInquiryNotFound'
        '409':
          description: 이미 답변된 문의 (답변 수정은 이번 버전에 없다)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INQUIRY_ALREADY_ANSWERED
                  message: 이미 답변한 문의예요. 답변 수정은 아직 지원하지 않아요
                  requestId: 01J9X8V0Q3
        '422':
          description: 답변 내용 길이 위반 또는 `isPublic` 누락
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                contentTooShort:
                  summary: 답변이 5자 미만
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: 입력값을 확인해주세요
                      details:
                        - field: content
                          code: CONTENT_TOO_SHORT
                          message: 답변 내용을 5자 이상 입력해주세요
                      requestId: 01J9X8V0Q3
                publicChoiceRequired:
                  summary: 공개 여부를 고르지 않음
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: 입력값을 확인해주세요
                      details:
                        - field: isPublic
                          code: ANSWER_PUBLIC_REQUIRED
                          message: 이 답변을 공개할지 선택해주세요
                      requestId: 01J9X8V0Q3

  /me/inquiries:
    get:
      operationId: listMyInquiries
      tags: [hospital-inquiries]
      summary: 내 문의 내역
      description: |
        마이페이지 `내 문의` 탭. 작성 최신순. **공개·비공개, 미답변·답변완료 전부 보인다** (§3) —
        본인 것이므로 가릴 것이 없다.

        **비공개 문의의 답변을 본인이 읽는 유일한 경로다.** 공개 Q/A(`GET /hospitals/{id}/inquiries`)에는
        `isPubliclyVisible` 인 건만 나오므로, 이 경로가 없으면 비공개로 물은 사람이 자기가 받은 답을
        볼 방법이 없다.

        응답은 `MyHospitalInquiry` 로 관리자용 `HospitalInquiry` 와 **다른 투영**이다:
        `askerName`(마스킹된 자기 이름)이 **없고**, 대신 병원 이름·사진을 함께 준다
        (문의자는 병원 id 를 모른다). `MyConsultRequest` 와 같은 기준이다 — 구조가 다를 때만 투영을 나눈다.

        **제목 입력칸이 없으므로 `title` 필드도 없다** (§14). 목록 카드의 제목은 클라이언트가
        `content` 의 **첫 줄**을 잘라 만든다. 저장하지 않는 값을 응답에만 넣으면 두 값이 어긋날 자리가 생긴다.

        **단건 조회 경로(`GET /me/inquiries/{id}`)를 만들지 않았다.** 문의 답변 알림은 이 목록(마이페이지
        `내 문의`)에서 그 문의를 펼친 채 연다 (§9) — 목록에 본문과 답변이 전문으로 실리므로 더 받을 것이 없다.
      x-screens: [mypage.md, notifications.md]
      x-screen-status: "🚧 🔒"
      x-role: user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: 미답변/답변완료 필터. 현재 화면에는 탭이 없다 (🚧).
          schema:
            $ref: '#/components/schemas/InquiryStatus'
      responses:
        '200':
          description: 내 문의 목록
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Vary:
              schema:
                type: string
                example: Authorization
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyHospitalInquiry'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /hospitals/{hospitalId}/inquiries:
    parameters:
      - $ref: '#/components/parameters/HospitalId'
    get:
      operationId: listPublicHospitalInquiries
      tags: [hospital-inquiries]
      summary: 병원 공개 문의 (Q/A)
      description: |
        병원 상세의 `문의` 탭. **인증이 필요하지 않다** — 경로가 `/me`·`/admin` 어디에도 속하지 않는 것이
        "이것은 누구나 보는 목록" 이라는 표시다 (§3).

        **노출 조건은 순수 함수 하나다** (§14 `isPubliclyVisible`):
        `환자가 공개로 남겼고(isPublicByUser) + 병원이 공개를 허용했고(answerPublic) + 답변완료`.
        셋 중 하나라도 아니면 목록에 없다. 답변 최신순(`answeredAt DESC`)이다 —
        접수순이 아니라 **답이 달린 순**이어야 새 답변이 위로 올라온다.

        **작성자 필드가 아예 없다** (§4). 빈 문자열이나 `익명` 을 채우면 언젠가 채워질 자리가 되고,
        그 자리에 무엇이 들어가도 "공개 Q/A 에 작성자 표기 없음" 이라는 결정이 조용히 풀린다.
        그래서 `PublicHospitalInquiry` 에는 `askerName` 자리 자체가 없다.

        **탭 헤더의 숫자 두 개 — 모집단이 다르다** (§14, 이 설계에서 가장 틀리기 쉬운 곳):

        | 화면 표기 | 응답 값 | 모집단 |
        |---|---|---|
        | `문의 N건` | `publicInquiryCount` | **환자가 공개로 남긴** 문의 수 (미답변 포함) |
        | `답변 N` | `meta.totalItems` | 그중 `isPubliclyVisible` 인 수 = **아래 목록의 길이** |

        `문의 N` 이 그 병원의 전체 문의 수가 아닌 이유: 전체를 세면 비공개 문의 볼륨이 샌다 —
        "문의 40건인데 Q/A 는 3개" 는 비공개 37건을 말해 준다. 모집단을 공개 문의로 좁히면 그 수가
        새지 않으면서도 `문의 N − 답변 N` 이 **"공개로 물었는데 아직 답이 없는 건수"** 라는
        쓸모 있는 응답성 신호로 남는다. 그리고 `답변 N` 은 항상 **아래 목록의 길이**여야 하므로
        별도 필드를 두지 않고 `meta.totalItems` 를 그대로 쓴다 — 두 값이 어긋날 자리를 없앤다.

        `Cache-Control: public, max-age=60`. 병원·전문의 조회와 같은 값이다 (§16) —
        답변이 달리면 비교적 빨리 반영되어야 한다. 역할에 따라 본문이 갈리지 않으므로 공유 캐시가 안전하다.
      x-screens: [hospital-detail.md]
      x-screen-status: "🚧"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: topic
          in: query
          description: 주제 필터. 현재 화면에는 없다 (🚧).
          schema:
            $ref: '#/components/schemas/InquiryTopic'
      responses:
        '200':
          description: 공개 Q/A 목록
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=60
          content:
            application/json:
              schema:
                type: object
                required: [items, meta, publicInquiryCount]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicHospitalInquiry'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                  publicInquiryCount:
                    type: integer
                    description: |
                      탭 헤더의 `문의 N건`. **환자가 공개로 남긴 문의 수**이며 미답변도 포함한다.
                      `meta.totalItems`(= `답변 N`)와 모집단이 다르다 — 위 표 참고.
                      `topic` 필터를 보냈다면 이 값도 같은 필터 범위로 계산한다.
                    example: 12
              example:
                items:
                  - id: hi3
                    topic: hours
                    content: 토요일에도 진료하나요? 몇 시까지 하는지 궁금합니다.
                    createdAt: '2026-10-10T02:00:00.000Z'
                    answer:
                      content: 토요일은 오전 10시부터 오후 2시까지 진료합니다. 점심시간 없이 운영해요.
                      answeredAt: '2026-10-10T05:30:00.000Z'
                meta:
                  page: 1
                  pageSize: 20
                  totalItems: 3
                  totalPages: 1
                publicInquiryCount: 12
        '404':
          $ref: '#/components/responses/HospitalNotFound'

  # =========================================================================
  # admin-dashboard (병원 관리자 대시보드)
  #
  # 🚧 서버에 dashboard 모듈이 없다 — 이 오퍼레이션은 계약이 구현보다 먼저 간 것이다.
  #    세는 대상인 consult 모듈도 inquiry 모듈도 아직 없으므로(위 두 절과 같은 상태)
  #    구현 전까지는 프론트엔드의 저장 계층이 같은 모양을 흉내 낸다.
  #    근거: docs/features/requests/2026-10-12-05-관리자-레이아웃-대시보드.md
  #         (특히 "요청자가 정한 숫자 기준 (2026-10-13)"),
  #         docs/api/README.md §3 · §14(`관리자 대시보드 집계`), docs/database/README.md §13
  #
  # 이 절이 지켜야 할 불변식은 하나다:
  #   숫자 카드 = 사이드 메뉴 배지 = 그 카드를 눌렀을 때 열리는 목록이 보여주는 건수.
  # =========================================================================
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin-dashboard]
      summary: 관리자 대시보드 집계 (선택한 병원 한 곳)
      description: |
        `/admin` 의 대시보드. **숫자 카드 · 오늘 할 일 · 최근 상담 · 오늘 내원 예정 · 이번 달 깔때기 ·
        병원 정보 완성도를 한 응답**으로 준다.

        ### 왜 집계 하나인가

        기존 요약·목록을 조합하면(`/consult-requests/summary` + `/hospital-inquiries/summary` +
        목록 3번 + 병원 1번) **7회 왕복**이고, 더 나쁜 것은 **일곱 응답이 일곱 시점**을 가리킨다는 것이다.
        카드 ①의 보조 줄과 사이드 배지와 `오늘 할 일` 2번이 **같은 숫자여야 하는데** 서로 다른 응답에서
        오면 1분 차이로 `신규 5건` 옆에 배지 `6` 이 붙는다. 한 트랜잭션·한 시점이면 그 어긋남이
        **구조적으로** 불가능하다.

        **새 규칙은 하나도 만들지 않았다.** 목록 항목은 `ConsultRequest` 그대로(마스킹 포함),
        상태 판정은 `inquiryStatus`, 기간 경계는 `periodRange`, 지연은 `isDelayed`,
        깔때기는 `funnelOf`, 완성도는 `completenessOf` 다 — 전부 기존 순수 함수다.

        ### 누가 쓰나 — `hospital_admin` 전용, 병원은 **언제나 한 곳**

        `GET /consult-requests` · `GET /hospital-inquiries` · `GET /admin/hospitals` 는
        "담당 병원 전부" 와 "전 병원" 두 범위를 `scope` 로 구분하지만 **이 오퍼레이션은 그 축을
        쓰지 않는다.** 그래서 응답에 `scope` 가 없고 `hospitalId` 가 대신 있다.

        - **`operator` 는 `403 OPERATOR_CANNOT_USE_DASHBOARD`.** 답할 수도 연락할 수도 없는 역할에게
          `답변 안 한 문의 N건` · `신규 상담 N건 연락하기` 를 보여주지 않는다 —
          `HospitalInquirySummary` 의 배지를 `scope === 'all'` 일 때 화면이 생략하기로 한 것과
          **같은 규칙**이고, `POST /hospital-inquiries/{id}/answer` 가 운영자를 막은 것과 같은 근거다.
          운영자 홈은 `GET /admin/hospitals` 목록 + 전문의 검수 그대로다.
        - **`전체 내 병원` 합산 모드를 두지 않았다.** `병원 정보 완성도` 와 `오늘 내원 예정` 은
          **병원 단위 사실이라 합산할 대상이 아니다**(완성도 70% 와 40% 를 더할 수 없다).
          그 둘만 비워 두면 한 화면에 모집단이 두 종류 섞인다.

        `hospitalId` 규칙 (§3 · `docs/database/README.md` §13.1):

        ```
        hospitalId 생략  +  담당 병원 1곳      → 그 병원 (화면에 드롭다운이 없는 경우)
        hospitalId 생략  +  담당 병원 2곳 이상 → 422 HOSPITAL_ID_REQUIRED
        hospitalId 가 담당 병원 밖            → 403 HOSPITAL_NOT_MANAGED
        ```

        **서버가 "첫 번째 병원" 을 골라 주지 않는다.** 그 순간 화면 드롭다운의 값과 숫자가 갈릴 수 있고,
        고른 적 없는 병원의 할 일이 보인다. 기본 선택(마지막으로 고른 병원 → 없으면 이름 오름차순)은
        화면의 몫이고, 응답은 **실제로 집계한 병원**을 `hospitalId` 로 되돌려 준다.

        ### 개인정보 · 캐시 · 감사

        - `recentConsults[]` 는 상담 **목록과 같은 투영**이다 — 이름은 전체, **연락처는 마스킹**
          (`010-****-4411`), `piiMasked: true` (§4 "목록은 담당자에게도 번호를 가린다").
          대시보드는 **감사 기록을 남기지 않는 자리**라 전체 번호가 실릴 수 없다. 전체 번호는
          `GET /consult-requests/{id}`(감사 기록 대상) 한 곳에만 있다.
        - `todo.delayedConsults[]` 와 `todayVisits[]` 는 **연락처 필드 자체가 없는** 더 좁은 투영이다
          (`이름 · 시술 · 시각` 만). 각 행은 상담 상세로 가므로 목록보다 더 실을 이유가 없고,
          `memos` 처럼 감사 없이 흘러서는 안 되는 값을 담지 않는다. 가려진 필드가 하나도 없으므로
          이 두 투영에는 `piiMasked` 플래그를 두지 않는다 (§4 — 플래그는 갈리는 값이 있을 때만 둔다).
        - `Cache-Control: no-store` + `Vary: Authorization`. 응답에 마스킹된 상담 행이 들어 있고,
          같은 URL 이 계정별로 다른 본문을 돌려준다.
        - **감사 로그를 남기지 않는다** — 전체 번호도 메모도 없다. 목록 조회를 기록하지 않는 것과 같은 판단이다.
        - `timezone`(`Asia/Seoul`)과 `calculatedAt` 을 함께 내려준다 (`ConsultSummary` 의 선례).
          달력 경계(`Asia/Seoul`, 반열린 구간 `[from, to)`)로 갈리는 값이 다섯이다 —
          `todayNew` · `newThisMonth` · `bookedThisMonth` · `funnel` · `todayVisits`.
          `delayed` 는 **경과 시간**이라 여기 들어가지 않는다.

        ### 카드를 누르면 열리는 목록이 같은 숫자를 보여준다

        | 화면 요소 | 필드 | 링크 (= 같은 숫자가 나오는 질의) |
        |---|---|---|
        | ① 오늘 들어온 상담 | `numbers.todayNew` | `/consult-requests?hospitalId=&period=today` → `meta.totalItems` |
        | ① 보조 `신규 전체 N건` | `numbers.statusNew` | `…&status=new` → `meta.totalItems` = `statusCounts.new` |
        | ② 처리 대기 | `numbers.pending` | `…&status=new&status=contacted` → `meta.totalItems` |
        | ② 보조 `24시간 지연 N건` | `numbers.delayed` | **링크 없음** (아래) |
        | ③ 답변 안 한 문의 | `numbers.unansweredInquiries` | `/hospital-inquiries?hospitalId=&status=unanswered` → `meta.totalItems` |
        | ③ 보조 `가장 오래된 것` | `numbers.oldestUnansweredAt` | 〃 |
        | ④ `이번 달 신청 M건 중 N건 예약` | `numbers.newThisMonth` / `numbers.bookedThisMonth` | `…&period=thisMonth` → **M** · `…&period=thisMonth&status=booked&status=visited` → **N** |
        | 최근 상담 예약 `전체 보기` | `recentConsults[]` | `/consult-requests?hospitalId=` |
        | 이번 달 상담 흐름 | `funnel` | 막대 → `…&period=thisMonth&status=…` (`contacted` 막대만 재현 불가 — 아래) |
        | 사이드 배지 `상담 예약` | `numbers.statusNew` | — |
        | 사이드 배지 `문의` | `numbers.unansweredInquiries` | — |

        **같은 숫자는 같은 필드다.** `statusNew` 가 세 자리(카드 ① 보조 줄 · `오늘 할 일` 2번 ·
        사이드 배지), `unansweredInquiries` 가 세 자리(카드 ③ · `오늘 할 일` 3번 · 사이드 배지)에 쓰이는데
        **응답에는 각각 한 번씩만 실린다** — 같은 값을 두 필드로 내리면 그 둘이 어긋날 자리가 생긴다.
        그래서 `todo` 에는 그 두 숫자를 다시 담지 않고 `numbers` 를 가리킨다.
        **클라이언트가 더하거나 다시 세는 자리는 하나도 없다** — `pending` 도 서버가 센 값이지
        `statusCounts.new + statusCounts.contacted` 가 아니다.

        ### `지연` — 서버가 세지만 규칙은 상담 목록과 **같은 함수 하나**다

        > `delayed` 는 **`status === 'new'` 이고 접수 후 24시간 이상 경과한 건의 수**다.
        > 상담 목록의 `지연` 배지를 클라이언트가 판정하는 순수 함수(`isDelayed`,
        > `docs/database/README.md` §12.7)와 **같은 부등식**이며, 서버는 그것을 이항해 질의한다:
        > `now − createdAt ≥ 24h` ⟺ `createdAt ≤ now − 24h`.
        > **경계는 포함이다** — 정확히 24시간 경과한 건은 지연이다.
        > 24시간은 **경과 시간**이라 `Asia/Seoul` 이 개입하지 않는다 (`today`·`thisMonth` 와 다른 점).
        > 클라이언트는 **이 숫자를 다시 계산하지 않는다.** 목록의 배지만 같은 함수로 칠하므로,
        > 두 값은 **다른 시점**을 가리킬 수는 있어도 **다른 규칙**을 가리키지 않는다.

        보조 줄에 **링크를 걸지 않는다.** `지연` 을 재현하는 목록 파라미터를 만들면 상태도 기간도 아닌
        세 번째 필터 축이 탭 UI 옆에 생긴다. 지연 건은 `todo.delayedConsults` 에 **개별 줄로 이미
        나열**되고 거기서 상세로 바로 간다.

        ### 이 오퍼레이션이 요구한 기존 계약 변경 두 개 (둘 다 additive)

        | 변경 | 왜 |
        |---|---|
        | `GET /consult-requests` 의 `status` **반복 허용** | 카드 ②와 ④의 N 을 목록에서 재현할 유일한 방법 |
        | `period` enum 에 **`thisMonth`** | 카드 ④와 깔때기의 모집단이 그것이고 링크가 M 을 재현해야 한다 |

        ### 미룬 것 · 만들지 않은 것

        - **반려 전문의의 반려 사유** — `todo.rejectedDoctors[]` 는 `{id, name}` 만 준다.
          `rejectionReason` 은 `DoctorAdminView` 에만 있고 **병원 소속 전문의를 관리자 시야로 읽는
          GET 이 아직 없다**(계약 격차 — `GET /hospitals/{hospitalId}/doctors?view=admin` 후보).
          **세는 것과 이름을 붙이는 것은 지금 된다** — 공개 `Doctor` 에도 `name` 과
          `verificationStatus` 가 있다. 사유 표시는 그 GET 이 생기는 날이다.
        - **승인 상태(`승인 완료 · 앱 노출 중` / `승인 대기`)와 담당자 직책** — 사이드 메뉴 하단이
          요구하지만 `hospitals` 에 승인 상태가, `hospital_admins` 에 직책이 없다. **요청 06 과 함께** 설계한다.
        - **완성도 항목 둘** (`procedurePrices` · `photos`) — 입력 수단(가격 칸 · 파일 업로드)이
          생기는 **요청 07** 의 일이다. 🚧 **그 제안이 올라왔다** (2026-10-13 제안,
          요청자 답 반영 대기 → 요청서 19 — `docs/api/README.md` §21). 반영되면 이 응답의 `completeness.items` 가 **9개**가 되고
          `percent` 의 분모가 바뀐다 (`HospitalCompletenessItemKey` 의 표).
        - **`visitDate`/`visitPeriod` 목록 파라미터** — `오늘 내원 예정` 에는 `전체 보기` 가 없다.
          날짜별 내원 목록 화면이 생기는 날 `period` 와 같은 모양으로 더한다(경계는 서버 KST).
          인덱스(`consult_requests(hospital_id, visit_at)`)는 먼저 깔린다.
        - **깔때기 `연락 완료` 를 재현하는 필터** — 취소 사유가 걸린 조건이라 상태 탭으로 표현되지
          않는다. 막대는 `status` 탭으로 보내고, 그 막대만 정확히 열 수 없다는 것을 화면이 받아들인다.
        - **알림 종 배지 · 상단 환자 검색** — 기존 `GET /notifications/unread-count?audience=admin` 과
          상담 목록의 `q` 를 그대로 쓴다. 집계에 넣지 않는다.
        - **운영자용 집계 · 대시보드 스냅샷(일별 집계) · `지난달 대비`** — 쓰는 화면이 없다.
      x-screens: [admin-home.md, admin-shell.md]
      x-screen-status: "🚧"
      x-role: [hospital_admin]
      security:
        - bearerAuth: []
      parameters:
        - name: hospitalId
          in: query
          description: |
            어느 병원의 대시보드인가. **이 값 하나가 화면 전체의 축**이다 —
            카드·사이드 배지·`오늘 할 일`·각 카드의 링크가 전부 같은 값을 쓴다.

            **생략하면** 담당 병원이 정확히 1곳일 때만 그 병원으로 응답하고(드롭다운이 없는 화면),
            2곳 이상이면 `422 HOSPITAL_ID_REQUIRED` 다.

            담당 병원 밖이면 `403 HOSPITAL_NOT_MANAGED` — `404` 가 아니다. **병원 존재는 공개
            정보**라 숨겨서 얻는 것이 없고(§3 의 병원 자원 규칙), 담당자가 id 를 잘못 넣은 경우와
            구분된다. **존재하지 않는 id 도 같은 `403`** 이다: 판정은 "담당 목록에 있는가" 하나이고,
            병원이 실제로 있는지는 공개 `GET /hospitals/{id}` 가 답한다.
          schema:
