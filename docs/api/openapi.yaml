      summary: 병원 방문자 후기
      description: |
        병원 상세의 `방문자 후기`. 최신순.

        후기를 **작성하는 엔드포인트는 없다.** 어느 화면에도 후기 작성 기능이 없기 때문이다
        (`docs/features/hospital-detail.md` — "후기를 작성하는 기능은 없습니다. 읽기만 됩니다").
        `rating` / `reviewCount` 가 후기로부터 집계되지 않고 병원 필드에 직접 들어 있는 것도 같은 이유다.
        후기 작성이 생기면 그때 `POST` 와 집계 재계산을 함께 설계해야 한다.
      x-screens: [hospital-detail.md]
      x-screen-status: "✅"
      parameters:
