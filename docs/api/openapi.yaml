        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ConsultStatus'
      responses:
        '200':
          description: 내 상담 신청 목록
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyConsultRequest'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /me/consult-requests/{consultRequestId}:
